<title>Conversation redesign</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#16181c;--mute:#5a616b;--line:#dde1e6;--accent:#2f6fdb;--term:#171717}

*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
main{height:100vh;display:flex;flex-direction:column;padding:14px 18px 12px;max-width:1800px;margin:0 auto}
h1{font-size:21px;margin:0;letter-spacing:-.01em}.lede{color:var(--mute);margin:2px 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.grp{display:flex;gap:4px;align-items:center}.grp b{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin-right:6px}
.grp button{font:inherit;font-size:13px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--mute);cursor:pointer}
.grp button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink);font-weight:600}
.stage{flex:1;min-height:0;display:flex;gap:16px}
.win{flex:none;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25);background:var(--term);min-height:0;max-height:100%}
.tb{flex:none;height:24px;background:#2a2a2a;display:flex;align-items:center;gap:7px;padding:0 10px;color:#bbb;font-size:12px}
.tb i{width:11px;height:11px;border-radius:50%;background:#555}.tb i:nth-child(1){background:#ff5f57}.tb i:nth-child(2){background:#febc2e}.tb i:nth-child(3){background:#28c840}
.tb span{margin-left:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scr{overflow:auto;padding:4px 6px;font:12px/14px ui-monospace,"SF Mono",Menlo,monospace;color:#fff;white-space:pre;scrollbar-width:thin;scrollbar-color:#444 transparent}
.scr div{height:14px}.scr .g{display:inline-block;width:1ch;text-align:center;font-weight:inherit}
.side{flex:1;min-width:280px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.side h2{font-size:16px;margin:0 0 6px}.side p{margin:0 0 10px}.side ul{margin:0 0 12px;padding-left:18px}.side li{margin:3px 0}
.rows{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;margin:6px 0 12px;font-size:13px}
.rows span.b{height:8px;border-radius:4px;background:var(--accent)}.rows .n{font-variant-numeric:tabular-nums;color:var(--mute)}
.real{font-size:12.5px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px}
.pair{display:flex;gap:14px;min-height:0;flex:1}.pair .win{flex:1 1 0;min-width:0}.pair .cap{color:#ddd;font-weight:600}
@media (max-width:1100px){body{overflow:auto}main{height:auto}.stage{flex-direction:column}.win{max-height:none}.scr{max-height:70vh}.pair{flex-direction:column}}
