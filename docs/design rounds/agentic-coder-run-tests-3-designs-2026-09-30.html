<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run tests designs</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1b18;--mute:#5f5b52;--faint:#8c877c;--line:#e3dfd5;--soft:#efece4;--accent:#2f6fdb;--ok:#1d7a46;--bad:#b3261e;--warn:#8a5a00;--run:#2f6fdb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15161a;--card:#1d1f24;--ink:#ecebe6;--mute:#a4a19a;--faint:#8a877f;--line:#2e3037;--soft:#24262c;--accent:#7aa7ff;--ok:#5fd08f;--bad:#ff8a80;--warn:#f0c060;--run:#7aa7ff}}
:root[data-theme="dark"]{--bg:#15161a;--card:#1d1f24;--ink:#ecebe6;--mute:#a4a19a;--faint:#8a877f;--line:#2e3037;--soft:#24262c;--accent:#7aa7ff;--ok:#5fd08f;--bad:#ff8a80;--warn:#f0c060;--run:#7aa7ff}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1260px;margin:0 auto;padding:12px 16px 12px;display:flex;flex-direction:column;min-height:100vh}
@media (min-width:1000px) and (min-height:640px){html,body{height:100%;overflow:hidden}main{height:100vh;min-height:0}}
.preview{flex:none;display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:6px 10px;border:1px dashed var(--faint);border-radius:10px;margin-bottom:10px;font-size:13px;color:var(--mute)}
.preview b{font-weight:600;color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{font:inherit;font-size:13px;padding:4px 11px;border:0;background:none;color:var(--mute);cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
h1{font-size:22px;margin:0;letter-spacing:-.01em}.lede{color:var(--mute);margin:1px 0 8px;font-size:13.5px}
.tabs{display:flex;gap:7px;flex-wrap:wrap;flex:none;margin-bottom:10px}
.tabs span{font-size:13px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--mute)}
.tabs span.on{color:var(--ink);border-color:var(--ink);font-weight:600}.tabs span i{font-style:normal;color:var(--run);margin-right:5px}
.stage{flex:1;min-height:0;display:flex;flex-direction:column}
.bar{flex:none;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.bar .l{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600;margin-right:4px}
.sum{margin-left:auto;font-size:13.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.sum b{color:var(--ink)}
.go{font:inherit;font-weight:650;font-size:14.5px;border:0;border-radius:10px;padding:8px 18px;background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap}
.go.stop{background:var(--bad)}.go:disabled{background:var(--soft);color:var(--mute);cursor:default}
.ghost{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);cursor:pointer}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;min-width:0;min-height:0}
table{border-collapse:collapse;width:100%;table-layout:fixed}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px;height:36px}
thead th{position:sticky;top:0;z-index:1;background:var(--soft);color:var(--mute);font-size:12.5px;font-weight:600;height:32px}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--soft)}tbody tr[aria-selected="true"]{background:var(--soft)}tbody tr[aria-selected="true"] .nm{font-weight:600}
tbody tr.off{cursor:default;color:var(--faint)}tbody tr.off:hover{background:none}
.tg{display:inline-grid;place-items:center;width:18px;height:18px;border:1.5px solid var(--faint);border-radius:5px;font-size:12px;line-height:1;color:transparent;vertical-align:middle}
.tg.on{background:var(--accent);border-color:var(--accent);color:#fff}.tg.dis{border-style:dashed;opacity:.5}
.q{color:var(--mute);font-size:12.5px;margin-left:6px}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.meas{color:var(--mute)}.never{color:var(--faint)}
.st{font-weight:700;margin-right:6px}.st.run{color:var(--run)}.st.done{color:var(--ok)}.st.next{color:var(--faint)}
.detail{padding:14px 16px;overflow:auto}
.detail h3{font-size:17px;margin:2px 0 6px}.detail .k{color:var(--mute);font-size:12.5px}.detail p{margin:0 0 10px}
.detail code{font:12px ui-monospace,Menlo,monospace;color:var(--mute);overflow-wrap:anywhere}
.mini{display:grid;grid-template-columns:auto repeat(2,minmax(0,1fr));gap:4px 10px;font-size:13px;margin:4px 0 12px}.mini .h{color:var(--mute);font-size:12px}
.term{background:#18191d;border-radius:12px;color:#e7e5df;display:flex;flex-direction:column;min-height:0;overflow:hidden;flex:1}
.term .tb{flex:none;display:flex;align-items:center;gap:6px;padding:7px 12px;border-bottom:1px solid #2e3037;color:#8e8b84;font-size:12px}
.term .tb em{font-style:normal;font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:#7fd092;background:rgba(127,208,146,.12);border-radius:6px;padding:2px 7px;margin-left:auto}
.term .o{flex:1;min-height:0;overflow:hidden;padding:8px 12px;display:flex;flex-direction:column;justify-content:flex-end;font:12px/1.45 ui-monospace,"SF Mono",Menlo,monospace}
.term .o div{white-space:pre;overflow:hidden;text-overflow:ellipsis}.term .g{color:#7fd092}.term .d{color:#8e8b84}.term .w{color:#fff}
.prog{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin:6px 0 10px}.prog i{display:block;height:100%;background:var(--run)}
/* Design 1 · List + detail */
.d1{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.d1 .split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:12px}
.d1 .list{overflow:auto}.d1 aside{display:flex;flex-direction:column}
/* Design 1 + control panel */
.d1p{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.d1p .split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 620px;gap:12px}
.d1p .left{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}.d1p .split>*{min-width:0}.d1p .list{overflow:auto;flex:1;min-height:0}
.d1p .about{flex:none;padding:10px 14px;font-size:13.5px}.d1p .about p{margin:2px 0 0;color:var(--mute)}
.panel{display:flex;flex-direction:column;min-height:0;padding:10px 0;font-size:13.5px}
.panel .ph{display:flex;align-items:baseline;gap:8px;padding:0 14px 6px}.panel .ph b{font-size:15px}.panel .ph span{color:var(--mute);font-size:12.5px}
.panel .gh{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding:6px 14px 2px}.panel .gh::after{content:'';flex:1;border-top:1px solid var(--line)}
.pr{display:grid;grid-template-columns:132px 150px minmax(0,1fr);align-items:center;gap:8px;padding:3px 14px;cursor:pointer;min-height:28px}
.pr:hover{background:var(--soft)}.pr[aria-selected="true"]{background:var(--soft)}.pr[aria-selected="true"] .lb{font-weight:600}
.pr .lb{white-space:nowrap}.pr .val{display:flex;align-items:center;gap:4px;min-width:0}
.pr .val button{font:inherit;font-size:12px;border:0;background:none;color:var(--mute);cursor:pointer;padding:0 4px}.pr .val button:disabled{opacity:.3;cursor:default}
.pr .val b{flex:1;min-width:0;text-align:center;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.pr .nt{color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pr .nt i{font-style:normal;font-weight:600;margin-right:6px}.pr .nt i.ch{color:var(--accent)}.pr .nt i.df{color:var(--faint)}
.pr.dim{opacity:.55}.pr .nt.warn{color:var(--warn)}
.panel .full{margin:8px 14px 0;padding:8px 10px;border-radius:9px;background:var(--soft);font-size:12.5px;color:var(--ink)}.panel .full b{font-weight:600}
.panel .pf{margin-top:auto;padding:8px 14px 0;display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12.5px;border-top:1px solid var(--line)}
/* Design 2 · Run line */
.d2{flex:1;min-height:0;display:grid;grid-template-columns:300px minmax(0,1fr) 400px;gap:12px}
.col{display:flex;flex-direction:column;min-height:0}.col>h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:0 0 6px;font-weight:600}
.tl{overflow:auto;padding:4px 0}.tl .grp{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);padding:8px 12px 2px;font-weight:600}
.tl .it{display:flex;align-items:center;gap:8px;padding:6px 12px;cursor:pointer}.tl .it:hover{background:var(--soft)}.tl .it .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .it.off{color:var(--faint);cursor:default}.tl .it.off:hover{background:none}
.add{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--accent);padding:1px 8px;cursor:pointer}
.line{overflow:auto;padding:8px;display:flex;flex-direction:column;gap:8px;flex:1}
.card{border:1px solid var(--line);border-radius:12px;padding:9px 12px;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--card);cursor:pointer}
.card[aria-selected="true"]{border-color:var(--ink)}.card .num{color:var(--faint);font-weight:700}.card .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:7px;background:var(--soft);padding:1px 8px;cursor:pointer;color:var(--ink);margin-right:4px}
.card .acts button{font:inherit;font-size:12px;border:0;background:none;color:var(--mute);cursor:pointer;padding:2px 4px}
.card.done{opacity:.75}.card.run{border-color:var(--run);box-shadow:inset 3px 0 0 var(--run)}
.linefoot{flex:none;display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.empty{color:var(--mute);padding:16px;font-size:13.5px}
/* Design 3 · Matrix */
.d3{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px}
.d3 .mat{overflow:auto;display:flex;flex-direction:column}
.matrix th,.matrix td{text-align:center;height:40px}.matrix th:first-child,.matrix td:first-child{text-align:left}
.matrix thead tr:first-child th{height:28px;font-size:12px}
.cell{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:3px 9px;min-width:88px;max-width:100%;justify-content:center;font-size:12.5px;cursor:pointer;background:var(--card)}
.cell.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}.cell.na{border-style:dashed;cursor:default;color:var(--faint)}
.cell .tg{width:15px;height:15px;font-size:10px}
.colpick{font:inherit;font-size:11.5px;border:0;background:none;color:var(--accent);cursor:pointer;padding:0}
.legend{font-size:12.5px;color:var(--mute);padding:8px 12px;border-top:1px solid var(--line)}
@media (max-width:999px),(max-height:639px){.d1 .split,.d1p .split,.d2,.d3{grid-template-columns:1fr}.pr{grid-template-columns:104px 150px minmax(0,1fr)}.d2>*,.d1>*,.d3>*{min-width:0}.seg{flex-wrap:wrap;max-width:100%}.term .o div{white-space:pre-wrap;word-break:break-all}.bar,.linefoot{flex-wrap:wrap}.sum{white-space:normal}.term{min-height:300px}.d1 .list,.tl,.line,.d3 .mat{max-height:60vh}}
</style>
</head>

// ---------- Design 1 + control panel ----------
// /effort's rows for the run, per model: the values start at the tests' defaults; a changed row is marked.
const P = () => DATA.panel[st.model];
const valOf = (id) => (st.vals[st.model]?.[id] ?? P().defs[id]);
const setVal = (id, v) => { (st.vals[st.model] ??= {})[id] = v; };
const changed = () => P().rows.filter((r) => valOf(r.id) !== r.def);
const panelRows = () => [{ id: '_model' }, { id: '_effort' }, ...P().rows];
function moveRow(i, dir) {
  const r = panelRows()[i];
  if (r.id === '_model') { const k = M.findIndex((m) => m.id === st.model); st.model = M[(k + dir + M.length) % M.length].id; return; }
  if (r.id === '_effort') { const lv = P().levels; const k = lv.findIndex((l) => l.id === st.effort); st.effort = lv[Math.max(0, Math.min(lv.length - 1, k + dir))].id; return; }
  const k = r.steps.findIndex((x) => x.v === valOf(r.id)); setVal(r.id, r.steps[Math.max(0, Math.min(r.steps.length - 1, (k < 0 ? 0 : k) + dir))].v);
}
function panelHtml() {
  const rows = panelRows();
  let group = '';
  const line = (i, label, show, note, tag, canL, canR, dim) => `<div class="pr${dim ? ' dim' : ''}" data-pr="${i}" aria-selected="${st.panelRow === i}"><span class="lb">${esc(label)}</span><span class="val"><button type="button" data-mv="${i}" data-d="-1"${canL ? '' : ' disabled'}>◀</button><b>${esc(show)}</b><button type="button" data-mv="${i}" data-d="1"${canR ? '' : ' disabled'}>▶</button></span><span class="nt">${tag}${esc(note)}</span></div>`;
  return rows.map((r, i) => {
    if (r.id === '_model') { const k = M.findIndex((m) => m.id === st.model); return line(i, 'Model', mName(st.model), `${esc(DATA.freeGB)} GB free for a run`, '', M.length > 1, M.length > 1); }
    if (r.id === '_effort') { const lv = P().levels, k = lv.findIndex((l) => l.id === st.effort); return line(i, 'Effort', lv[k].show, lv[k].note, '', k > 0, k < lv.length - 1); }
    const k = r.steps.findIndex((x) => x.v === valOf(r.id)), stp = r.steps[k] ?? r.steps[0], isDef = valOf(r.id) === r.def;
    const head = r.group !== group ? `<div class="gh">${esc(r.group)}</div>` : '';
    group = r.group;
    const note = r.id === 'context' ? `${isDef ? 'the tests run at 32k · ' : ''}${ctxNote(stp)}` : stp.note;
    return head + line(i, r.label, stp.show, note, `<i class="${isDef ? 'df' : 'ch'}">${isDef ? 'default' : 'changed'}</i>`, k > 0, k < r.steps.length - 1, r.id === 'thinking' && st.effort === 'low');
  }).join('');
}
// Context's note for the Search rows as they are now (they decide the memory it needs beside the model).
const ctxNote = (stp) => stp.bySearch?.[`${valOf('embedder')}|${valOf('reranker')}`] ?? stp.note;
// The picked row's whole note (a row's note is cut to fit; this line is not).

  const stp = r.steps.find((x) => x.v === valOf(r.id)) ?? r.steps[0];
  return `<div class="full"><b>${esc(r.label)}</b> · ${esc(stp.show)}: ${esc(r.id === 'context' ? ctxNote(stp) : stp.note)}${valOf(r.id) === r.def ? ' (the tests\' default)' : ` (the tests run with ${esc(r.steps.find((x) => x.v === r.def)?.show ?? r.def)})`}</div>`;
}
// The run list (after ▶ Run): each picked test has its own button. Nothing starts by itself; only one
// model fits, so a ▶ pressed while another test runs lines it up as next. flow: what has run, what runs, what is next.
const DEMO = () => ({ done: { check: { res: '✓ 9 of 10 checks', secs: 4, ok: true } }, running: 'unit', queue: ['practice28'] });
function flowAct(act, id) {
  const f = st.flow;
  if (act === 'run') { if (!f.running) f.running = id; else if (f.running !== id && !f.queue.includes(id)) f.queue.push(id); }
  else if (act === 'unnext') f.queue = f.queue.filter((x) => x !== id);
  else if (act === 'stop') { f.done[id] = { res: '■ stopped', secs: 0, ok: false, stopped: true }; f.running = f.queue.shift() ?? null; }
  else if (act === 'all') { const left = [...st.picked].filter((x) => usable(byId(x)) && !f.done[x] && x !== f.running); if (!f.running) f.running = left.shift() ?? null; f.queue = [...new Set([...f.queue, ...left])]; }
  st.show = f.running ? 'run' : 'ready';
}
function runListRow(t) {

function d1p() {

         <div class="term" style="min-height:260px"><div class="tb">live output<em style="color:#8e8b84;background:rgba(142,139,132,.12)">waiting</em></div><div class="o"><div><span class="d">Press ▶ Run on a test: what it prints shows here, live.</span></div><div><span class="d">Only one model fits, so one test runs at a time; ▶ on another while one runs makes it next.</span></div></div></div></div>`;

// ---------- Design 3 · Matrix ----------

      if (running) { const r = RUNLINE.find((x) => runKey(x) === k); if (r) return `<td><span class="cell"><span class="st ${r.st}">${r.st === 'done' ? '✓' : r.st === 'run' ? '●' : '·'}</span>${r.st === 'done' ? esc(r.res.replace(' checks', '')) : r.st === 'run' ? 'running' : 'next'}</span></td>`; }
      const on = st.cells.has(k);
      return `<td><span class="cell${on ? ' on' : ''}" data-cell="${k}">${tgl(on)}${c && c !== 'n/a' ? `<span class="${c.ok ? 'ok' : 'bad'}">${esc(c.res)}</span>` : '<span class="never">never</span>'}</span></td>`;
    };
    if (!usable(t)) return `<tr class="off"><td>${esc(t.name)}<span class="q">${t.soon ? 'planned' : 'none made yet'}</span></td>${cols.map(() => '<td></td>').join('')}<td></td></tr>`;
    if (!t.model) return `<tr><td>${esc(t.name)}<span class="q">≈ ${dur(est(t))}</span></td>${cols.map(() => '<td><span class="cell na">·</span></td>').join('')}${cellFor('none')}</tr>`;
    return `<tr><td>${esc(t.name)}<span class="q">${est(t) != null ? `≈ ${dur(est(t))}` : ''}</span></td>${cols.map((c) => cellFor(c.key, c.e === 'high' && !t.think)).join('')}<td><span class="cell na">·</span></td></tr>`;
  }).join('');
  const picks = [...st.cells].filter((k) => usable(byId(k.split('|')[0])));
  const total = picks.reduce((n, k) => n + (est(byId(k.split('|')[0])) ?? 0), 0);
  const order = ['gemma', 'qwen'].map((m) => picks.filter((k) => k.includes(`|${m}/`)).length).map((n, i) => (n ? `${n} on ${short(M[i]?.id)}` : '')).filter(Boolean).join(', then ');
  const side = running ? liveView() : `<div class="k">What runs</div><h3>${picks.length} runs · about ${dur(total)}</h3><p>${order ? `${esc(order)}` : 'Pick cells in the grid.'}${picks.some((k) => k.endsWith('|none')) ? ', and the checks with no model first' : ''}. Runs on one model go together, so the model loads once.</p>
    <div class="k">Reading the grid</div><p>A row is a test, a column one model at one effort. Each cell says the last result there; <span class="never">never</span> is a run that has not happened yet, which is what grading needs. Click a cell to pick it, a column's name to pick its whole column.</p>
    <p class="q" style="margin-left:0">n/a: the Sorting check never thinks, so it has no High column.</p>`;
  return `<div class="d3"><div class="box mat"><div style="overflow:auto;flex:1;min-height:0"><table class="matrix"><colgroup><col style="width:190px">${cols.map(() => '<col>').join('')}<col style="width:128px"></colgroup>
    <thead><tr><th></th>${M.map((m) => `<th colspan="2">${esc(m.name)}</th>`).join('')}<th></th></tr><tr><th>Test</th>${cols.map((c) => `<th><button class="colpick" type="button" data-col="${c.key}">${c.e === 'low' ? 'Low' : 'High'} ▾</button></th>`).join('')}<th>No model</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="legend">${running ? runSummary() : 'Last result in each cell · ✓ picked to run · a column\'s name picks the whole column'}</div></div>
    <aside class="box detail" style="display:flex;flex-direction:column">${side}<div style="margin-top:auto;padding-top:12px;display:flex;gap:8px;justify-content:flex-end">${running ? '' : `<button class="ghost" type="button" data-act="clearcells">Clear</button><button class="go" type="button" data-act="run"${picks.length ? '' : ' disabled'}>▶ Run ${picks.length}</button>`}</div></aside></div>`;
}

function draw() {
  $('pd').innerHTML = seg([['d1p', '1 + panel (new)'], ['d1', '1 · List + detail'], ['d2', '2 · Run line'], ['d3', '3 · Matrix']], st.design);
  $('ps').innerHTML = seg(st.design === 'd1p' ? [['pick', 'Picking tests'], ['ready', 'Ready to run'], ['run', 'Running']] : [['pick', 'Picking tests'], ['run', 'Running']], st.design !== 'd1p' && st.show === 'ready' ? 'pick' : st.show);
  if (st.design !== 'd1p' && st.show === 'ready') st.show = 'pick';
  if (st.design === 'd1p' && st.show === 'run' && !st.flow.running) st.flow = DEMO();
  $('stage').innerHTML = st.design === 'd1p' ? d1p() : st.design === 'd1' ? d1() : st.design === 'd2' ? d2() : d3();
  try { localStorage.setItem('runtab-designs-v2', JSON.stringify({ design: st.design, show: st.show })); } catch {}
}
$('pd').onclick = (e) => { const b = e.target.closest('button'); if (b) { st.design = b.dataset.v; draw(); } };
$('ps').onclick = (e) => { const b = e.target.closest('button'); if (b) { st.show = b.dataset.v; st.flow = b.dataset.v === 'run' ? DEMO() : { done: {}, running: null, queue: [] }; draw(); } };
$('stage').onclick = (e) => {
  const sg = e.target.closest('.seg[data-set] button'); if (sg) { st[sg.parentElement.dataset.set] = sg.dataset.v; draw(); return; }
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'run') { st.show = 'run'; draw(); return; }
  if (act === 'ready') { st.show = 'ready'; st.flow = { done: {}, running: null, queue: [] }; draw(); return; }
  if (act === 'back') { st.show = 'pick'; draw(); return; }
  const fl = e.target.closest('[data-flow]'); if (fl) { if (fl.dataset.flow === 'stopall') { st.flow.running = null; st.flow.queue = []; st.show = 'ready'; } else flowAct(fl.dataset.flow, fl.dataset.id); draw(); return; }
  if (act === 'clear') { st.picked.clear(); draw(); return; }
  if (act === 'reset') { st.vals[st.model] = {}; draw(); return; }
  const pmv = e.target.closest('.panel [data-mv]'); if (pmv && !pmv.disabled) { st.panelRow = +pmv.dataset.mv; moveRow(+pmv.dataset.mv, +pmv.dataset.d); draw(); return; }
  const prow = e.target.closest('[data-pr]'); if (prow) { st.panelRow = +prow.dataset.pr; draw(); return; }
  if (act === 'clearline') { st.line = []; draw(); return; }
  if (act === 'clearcells') { st.cells.clear(); draw(); return; }
  if (st.show === 'run' || st.show === 'ready') { const tr = e.target.closest('tr[data-t]'); if (tr) { st.focus = tr.dataset.t; draw(); } return; }
  const add = e.target.closest('[data-add]'); if (add) { st.line.push({ id: add.dataset.add, model: st.model, effort: st.effort }); st.lineSel = st.line.length - 1; draw(); return; }
  const cyc = e.target.closest('[data-cyc]'); if (cyc) { const l = st.line[+cyc.dataset.i]; if (cyc.dataset.cyc === 'model') { const i = M.findIndex((m) => m.id === l.model); l.model = M[(i + 1) % M.length].id; } else l.effort = l.effort === 'low' ? 'high' : 'low'; draw(); return; }
  const mv = e.target.closest('[data-mv]'); if (mv) { const i = +mv.dataset.i, j = i + +mv.dataset.mv; if (j >= 0 && j < st.line.length) { [st.line[i], st.line[j]] = [st.line[j], st.line[i]]; st.lineSel = j; } draw(); return; }
  const rm = e.target.closest('[data-rm]'); if (rm) { st.line.splice(+rm.dataset.rm, 1); st.lineSel = Math.max(0, st.lineSel - 1); draw(); return; }
  const card = e.target.closest('.card[data-i]'); if (card) { st.lineSel = +card.dataset.i; draw(); return; }
  const col = e.target.closest('[data-col]'); if (col) { const key = col.dataset.col, ks = T.filter((t) => usable(t) && t.model && (key.endsWith('/low') || t.think)).map((t) => `${t.id}|${key}`); const all = ks.every((k) => st.cells.has(k)); ks.forEach((k) => (all ? st.cells.delete(k) : st.cells.add(k))); draw(); return; }
  const cell = e.target.closest('[data-cell]'); if (cell) { const k = cell.dataset.cell; st.cells.has(k) ? st.cells.delete(k) : st.cells.add(k); draw(); return; }
  // Design 1: a click on the first column (the toggle) picks the test; anywhere on the row shows it on the right.
  const tr = e.target.closest('tr[data-t]'); if (tr) { const t = byId(tr.dataset.t); st.focus = t.id; if (usable(t) && e.target.closest('td:first-child')) (st.picked.has(t.id) ? st.picked.delete(t.id) : st.picked.add(t.id)); draw(); return; }
};
document.addEventListener('keydown', (e) => {
  if (st.design === 'd1p' && st.show === 'pick') {
    const n = panelRows().length;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); st.panelRow = Math.max(0, Math.min(n - 1, st.panelRow + (e.key === 'ArrowDown' ? 1 : -1))); draw(); return; }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); moveRow(st.panelRow, e.key === 'ArrowRight' ? 1 : -1); draw(); return; }
  }
  if (st.design !== 'd1' || st.show === 'run' || e.target.closest('select')) return;
  const ids = T.map((t) => t.id), i = ids.indexOf(st.focus);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); st.focus = ids[Math.max(0, Math.min(ids.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))]; draw(); }
  else if (e.key === ' ') { e.preventDefault(); const t = byId(st.focus); if (usable(t)) { st.picked.has(t.id) ? st.picked.delete(t.id) : st.picked.add(t.id); draw(); } }
});
draw();
</script>
</body>
</html>
