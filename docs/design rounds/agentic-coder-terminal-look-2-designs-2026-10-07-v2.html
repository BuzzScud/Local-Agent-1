<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terminal Look Designs</title>
<style>
:root{--bg:#0f0f10;--panel:#18181a;--ink:#ececec;--dim:#9a9a9a;--line:#2c2c2e;--acc:#87d787;--term:#171717}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f4f4f2;--panel:#fff;--ink:#1b1b1b;--dim:#666;--line:#ddd;--acc:#2f8f3a}}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;gap:16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:16px;margin:0;font-weight:650}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel);color:var(--ink);border:0;padding:6px 12px;font:inherit;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}.seg button.on{background:var(--acc);color:#111;font-weight:600}
.tabs{display:flex;gap:4px;padding:8px 16px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);padding:6px 12px;font:inherit;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:0}
#stage{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:12px}
#screen{transform-origin:center center;box-shadow:0 0 0 1px #333,0 8px 30px rgba(0,0,0,.4);border-radius:6px}
.t{white-space:pre;font:13px/1.3 Menlo,monospace;color:#fff;background:var(--term);padding:8px;display:block}
.t div{height:1.3em}b.g{font-weight:inherit;display:inline-block;width:1ch;text-align:center}
aside{border-left:1px solid var(--line);padding:14px 16px;overflow:auto;background:var(--panel)}
aside h2{font-size:15px;margin:0 0 6px}aside p{margin:0 0 10px;color:var(--dim)}aside ul{margin:0;padding-left:18px}aside li{margin:0 0 7px}
.real{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);color:var(--dim);font-size:12.5px}
.same{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:13px}
kbd{font:12px Menlo,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px}
@media (max-width:760px){main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}aside{border-left:0;border-top:1px solid var(--line);max-height:40vh}}
</style></head><body>

ady draws its steps on: the menus and /settings too, with their groups as tabs and the row you are on opened up.","The questions are a step on the rail, not a box: ? Edit file, the change under it, and the answers on one line when they fit."]],"today":["Today","As it draws now."]};
let st = { look: '3', size: '152', tab: 'start' };

const $ = (s) => document.querySelector(s);
function fit() {
  const el = $('#screen'), stage = $('#stage');
  el.style.transform = 'none';
  const k = Math.min((stage.clientWidth - 24) / el.offsetWidth, (stage.clientHeight - 24) / el.offsetHeight, 1.4);
  el.style.transform = 'scale(' + k + ')';
}
function draw() {
  for (const b of document.querySelectorAll('#looks button')) b.classList.toggle('on', b.dataset.look === st.look);
  for (const b of document.querySelectorAll('#sizes button')) b.classList.toggle('on', b.dataset.size === st.size);
  for (const b of document.querySelectorAll('#tabs button')) b.classList.toggle('on', b.dataset.tab === st.tab);
  const cols = st.size === '152' ? 152 : 80, rows = st.size === '152' ? 56 : 24;
  const html = DATA[st.look + '-' + st.size][st.tab];
  $('#screen').innerHTML = '<div class="t" style="width:calc(' + cols + 'ch + 16px);height:calc(' + rows + ' * 1.3em + 16px)">' + html + '</div>';
  const [name, what] = LOOKS[st.look];
  const tab = TABS.find((t) => t[0] === st.tab);
  $('#side').innerHTML = '<h2>' + name + '</h2>' + (Array.isArray(what) ? '<ul>' + what.map((w) => '<li>' + w + '</li>').join('') + '</ul>' : '<p>' + what + '</p>')
    + '<p style="margin-top:12px"><b>' + tab[1] + '</b> · ' + tab[2] + '</p>'
    + (st.look === '3' || st.look === '4' ? '<div class="same"><b>What changed from the first two</b><ul><li>1 and 2 arranged the same blocks (Recent activity, This folder, What’s new): spread out, or boxed in.</li><li>3 and 4 start from a question instead: what will you do next (Launcher), what happened since you were here (Journal).</li><li>The first page is kept as it was: agentic-coder-terminal-look-2-designs-2026-10-07.html.</li></ul></div>' : '')
    + '<div class="same"><b>In every design (your picks)</b><ul><li>The conversation keeps today’s look, with the fixes: short paths, the notes once per session, the end line wrapped neatly under its rail, code that keeps its indent when it wraps.</li><li>The prompt box and footer stay as they are.</li></ul></div>'
    + '<p class="real">Drawn by the real app (its own code, with each design switched on), in a pseudo-terminal at ' + cols + ' × ' + rows + '. Real: your six Agentic Coder conversations and your other folders, this project’s git and What’s new. Not real: the model is a stand-in (Qwen’s name shows), and the Edit and Bash questions are on the demo project.</p>';
  requestAnimationFrame(fit);
  try { localStorage.setItem('look-round-v2', JSON.stringify(st)); } catch {}
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.look) st.look = b.dataset.look; if (b.dataset.size) st.size = b.dataset.size; if (b.dataset.tab) st.tab = b.dataset.tab; draw();
});
document.addEventListener('keydown', (e) => {
  if (['0', '1', '2', '3', '4'].includes(e.key)) st.look = e.key === '0' ? 'today' : e.key;
  else if (e.key === 's') st.size = st.size === '152' ? '80' : '152';
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const i = TABS.findIndex((t) => t[0] === st.tab); st.tab = TABS[(i + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length][0]; }
  else return;
  draw();
});
addEventListener('resize', fit);
