<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#16181c;--mute:#5a616b;--line:#dde1e6;--accent:#2f6fdb;--term:#171717}

:root[data-theme="dark"]{--bg:#101216;--card:#181b20;--ink:#eceef1;--mute:#a1a8b2;--line:#2b3038;--accent:#7aa7ff}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
main{height:100vh;display:flex;flex-direction:column;padding:14px 18px 12px;max-width:1800px;margin:0 auto}
h1{font-size:21px;margin:0;letter-spacing:-.01em}.lede{color:var(--mute);margin:2px 0 10px}
.bar{display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}.grp b{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin-right:6px}
.grp button{font:inherit;font-size:13px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--mute);cursor:pointer}
.grp button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink);font-weight:600}
.stage{flex:1;min-height:0;display:flex;gap:16px}
.win{flex:none;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25);background:var(--term);min-height:0;max-height:100%}
.tb{flex:none;height:24px;background:#2a2a2a;display:flex;align-items:center;gap:7px;padding:0 10px;color:#bbb;font-size:12px}
.tb i{width:11px;height:11px;border-radius:50%;background:#555}.tb i:nth-child(1){background:#ff5f57}.tb i:nth-child(2){background:#febc2e}.tb i:nth-child(3){background:#28c840}
.tb span{margin-left:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tb .cap{color:#eee;font-weight:600}
.scr{overflow:hidden;padding:4px 6px;font:11px/13px ui-monospace,"SF Mono",Menlo,monospace;color:#fff;white-space:pre}
.scr div{height:13px}.scr span{display:inline-block;height:13px;vertical-align:top}
.big .scr{font-size:12px;line-height:14px}.big .scr div,.big .scr span{height:14px}
.side{flex:1;min-width:280px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.side h2{font-size:16px;margin:0 0 2px}.side .q{color:var(--mute);margin:0 0 10px}.side ul{margin:0 0 12px;padding-left:18px}.side li{margin:3px 0}
.rows{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;margin:6px 0 12px;font-size:13px}
.rows span.b{height:8px;border-radius:4px;background:var(--accent)}.rows .n{font-variant-numeric:tabular-nums;color:var(--mute)}.rows .on{font-weight:600}
.cost{margin:0 0 12px}.real{font-size:12.5px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start;overflow:hidden}.grid .win{max-height:none}
@media (max-width:1100px){body{overflow:auto}main{height:auto}.stage{flex-direction:column}.win{max-height:none;max-width:100%}.scr{overflow-x:auto}.grid{grid-template-columns:1fr}}

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const NAMES = { now: 'Now', d1: '1 · Wordmark', d2: '2 · Strip', d3: '3 · Two columns', d4: '4 · On the rail' };
const INFO = {
  now: { q: 'The box you see today.', cost: '', bullets: [
    'A green box: the welcome, /help and /stats, the model, the folder and what it read.',
    'Three tips under it, on every start.',
    'While the model loads, a "Starting…" line under the tips.'] },
  d1: { q: 'Asks: who is this? The name, big.', cost: 'About 2 hours to build.', bullets: [
    'The name in solid block letters, 2 rows tall, fading from dark to light green.',
    'The model and the folder in two plain lines under it.',
    'The same three tips as today. The "Starting…" line stays where it is.',
    'Closest to the start screens of other coding tools.'] },
  d2: { q: 'Asks: does it match the conversation? A grey band, like your messages.', cost: 'About 2 hours to build.', bullets: [
    'A grey band across the window with the name and the model, one shade lighter than the strip under your messages.',
    'The folder and what it read, as two labelled lines.',
    'The tips become one line of keys to try.',
    'The page starts the way each turn starts. At a glance the band could be taken for a message; the green ⠿ and the version tell them apart.'] },
  d3: { q: 'Asks: what can I pick up? Your recent work, beside who and where.', cost: 'About 3 hours to build.', bullets: [
    'Left: the name, the model, the folder and what it read.',
    'Right: your last 3 conversations in this folder with their time; /resume opens one.',
    'Shorter tips under them. A thin grey line splits the two columns.',
    'The only design that shows something new. In ~ the last three are the same notification-card prompt run again, so they look alike.'] },
  d4: { q: 'Asks: what is it doing? The start as steps, on the same rail as a turn.', cost: 'About 5 hours to build: the top stays live until the model is ready.', bullets: [
    'Folder, what it read, then the model loading, on the rail your turns use.',
    'The "Starting…" line moves in here: the model loads in place, then its dot turns green and says ready.',
    'Ends with ╰─ and what to try.',
    'Smallest: 7 rows. Notes that arrive during the start (a warning, a command you type) must wait until it is ready or go under it.'] },
};
const st = { d: 'd1', m: 'ready', f: 'home', w: '107' };
try { Object.assign(st, JSON.parse(localStorage.getItem('start-4designs') || '{}')); } catch {}
const rowsOf = (w) => (w === '107' ? 52 : 24);
function win(key, cap, top) {
  let h = D.frames[st.w][key][st.f][st.m];
  if (top) h = h.split('</div>').slice(0, top).join('</div>') + '</div>';
  const n = top || rowsOf(st.w);
  return '<div class="win' + (st.w === '80' ? ' big' : '') + '"><div class="tb"><i></i><i></i><i></i><span' + (cap ? ' class="cap"' : '') + '>' + (cap || 'coding — ' + st.w + '×' + rowsOf(st.w)) + '</span></div><div class="scr" style="width:calc(' + st.w + 'ch + 12px)">' + h + '</div></div>';
}
function draw() {
  for (const [g, k] of [['gd', 'd'], ['gm', 'm'], ['gf', 'f'], ['gw', 'w']]) for (const b of document.querySelectorAll('#' + g + ' button')) b.setAttribute('aria-pressed', String(b.dataset.v === st[k]));
  const stage = document.getElementById('stage');
  if (st.d === 'all') {
    const top = st.w === '107' ? 14 : 12;
    stage.innerHTML = '<div class="grid">' + Object.keys(NAMES).map((k) => win(k, NAMES[k] + ' — top ' + top + ' rows', top)).join('') + '</div>';
  } else {
    const i = INFO[st.d];
    const tops = Object.keys(NAMES).map((k) => [k, D.top[st.w][k][st.f]]);
    const max = Math.max(...tops.map((t) => t[1]));
    stage.innerHTML = win(st.d) + '<aside class="side"><h2>' + NAMES[st.d] + '</h2><p class="q">' + i.q + '</p><ul>' + i.bullets.map((b) => '<li>' + b + '</li>').join('') + '</ul>'
      + (i.cost ? '<p class="cost"><b>' + i.cost + '</b></p>' : '')
      + '<b>Rows the top takes before the empty space</b> <span style="color:var(--mute)">(Ready; fewer leaves more room for the conversation)</span><div class="rows">' + tops.map(([k, r]) => '<span class="' + (k === st.d ? 'on' : '') + '">' + NAMES[k] + '</span><span class="b" style="width:' + Math.round(r / max * 100) + '%"></span><span class="n">' + r + '</span>').join('') + '</div>'
      + '<div class="real"><b>What is real here.</b> Drawn by the app\'s own drawing code (Ink) at ' + st.w + '×' + rowsOf(st.w) + ' in Apple Terminal\'s colours. Now, and everything under each design\'s top (the "Starting…" line, your first message on its strip, the thinking on the rail, the prompt box, the footer), is the app\'s own code, unchanged. Real: your model and effort, what each folder reads, its git state, your last conversations in each folder with their times, your Mac\'s memory when the page was made, and your notification-card prompt with its first thinking. Picked: 12 s into the start, and 3 s into the first turn.</div></aside>';
  }
  fit();
  try { localStorage.setItem('start-4designs', JSON.stringify(st)); } catch {}
}
// The terminal's text shrinks until all its rows fit the space (a short or narrow browser window).
function fit() {
  if (st.d === 'all' || innerWidth <= 1100) return;
  const scr = document.querySelector('.scr');
  const room = document.getElementById('stage').clientHeight - 24 - 8;
  const lh = Math.max(8, Math.min(st.w === '80' ? 17 : 14, Math.floor(room / rowsOf(st.w))));
  scr.style.fontSize = (lh * 0.85).toFixed(2) + 'px';
  scr.style.lineHeight = lh + 'px';
  for (const el of scr.querySelectorAll('div, span')) el.style.height = lh + 'px';
}
addEventListener('resize', fit);
for (const [g, k] of [['gd', 'd'], ['gm', 'm'], ['gf', 'f'], ['gw', 'w']]) document.getElementById(g).onclick = (e) => { const b = e.target.closest('button'); if (b) { st[k] = b.dataset.v; draw(); } };
document.addEventListener('keydown', (e) => { const order = ['now', 'd1', 'd2', 'd3', 'd4', 'all']; const n = Number(e.key); if (n >= 1 && n <= 6) { st.d = order[n - 1]; draw(); } });
draw();
