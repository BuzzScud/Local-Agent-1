del is the build.</p>"}]}, {"id": "rows", "label": "Design 1 \u00b7 Rows", "steps": [{"label": "Profiles", "aside": "<h2>1 \u00b7 Rows</h2><p>Like /subagents: one column, ruled rows.</p><ul><li>Top: the profiles as a table (model, server, backup, what uses it).</li><li>Below: one group at a time (AIs, Task types, Categories, Skills), each row with its profile between \u25c0 \u25b6. <kbd>tab</kbd> changes group.</li><li>\u2190\u2192 saves at once; every window reads the file.</li></ul><p>Today\u2019s /subagents jobs are already here, so nothing changes on day one: Pictures \u2192 Vision (llava), Code search \u2192 Search (embeddinggemma), Second opinion \u2192 Review (gpt-oss).</p>"}, {"label": "A row", "aside": "<h2>A row picked</h2><p>The line under the rows says which profile and model it uses, and where that comes from.</p>"}, {"label": "\u26a0 Check", "aside": "<h2>A model that cannot do the job</h2><p>Pictures moved to Main: laguna cannot see. The row says so in place, in yellow, and the line under it says \u2190\u2192 gives it another.</p><p>Code search does the same for a model that is not an embedding model.</p>"}, {"label": "Task types", "aside": "<h2>Task types</h2><p>Fix \u2192 Review (gpt-oss:120b). The others have no pick of their own and say where theirs comes from (\u201cfrom Main conversation\u201d).</p><p>Review\u2019s row in the table now lists Fix.</p>"}, {"label": "Categories", "aside": "<h2>Categories</h2><p>Groups of task types and AIs: Coding (Fix, Change, Rename, Other), Reading (Question, Small talk), Design, Checks, Background. Give a category a profile and everything in it without its own pick follows.</p>"}, {"label": "Skills", "aside": "<h2>Skills</h2><p>Your SKILLS.md list (Write a test, Review code, Refactor, Flaky test). A request that brings a skill uses that skill\u2019s profile first: the most specific wins.</p>"}]}, {"id": "board", "label": "Design 2 \u00b7 Board", "steps": [{"label": "Board", "aside": "<h2>2 \u00b7 Board</h2><p>A column per profile: its model, server and backup on top, then everything that uses it. The last column is what has no pick of its own.</p><ul><li>\u2190\u2192 column, \u2191\u2193 row.</li><li><kbd>&lt;</kbd> <kbd>&gt;</kbd> moves the highlighted row to the profile before or after (saved at once).</li><li>A narrow window shows as many columns as fit and scrolls.</li></ul>"}, {"label": "Not set", "aside": "<h2>The \u201cNot set\u201d column</h2><p>Question highlighted: it has no pick of its own, so it uses Main.</p>"}, {"label": "Moved", "aside": "<h2>&lt; pressed: Question \u2192 Claude</h2><p>Questions now go to the Claude API, while the busy service keeps the coding.</p>"}]}, {"id": "menu", "label": "Where it shows", "steps": [{"label": "/ menu", "aside": "<h2>/profiles in the / menu</h2><p>Right under /model (your rule: a new command is in the menu).</p>"}, {"label": "/pro", "aside": "<h2>Typing /pro finds it</h2>"}]}];
const INTRO = `

let tab = 0, step = 0, size = '152';
try { const h = location.hash.slice(1); if (h) { const k = TABS.findIndex((t) => t.id === h); if (k >= 0) tab = k + 1; else if (h === 'intro') tab = 0; } } catch {}
const tabsEl = document.getElementById('tabs');
const mainEl = document.getElementById('main');
function drawTabs() {
  tabsEl.innerHTML = ['1 · How it works', ...TABS.map((t, i) => `${i + 2} · ${t.label}`)].map((l, i) => `<button class="${i === tab ? 'on' : ''}" data-i="${i}">${l}</button>`).join('');
}
function fit() {
  const st = document.getElementById('stage'), sc = document.getElementById('screen');
  if (!st || !sc) return;
  sc.style.transform = 'none';
  const k = Math.min((st.clientWidth - 24) / sc.offsetWidth, (st.clientHeight - 24) / sc.offsetHeight, 1.25);
  sc.style.transform = `scale(${k})`;
}
function draw() {
  drawTabs();
  try { history.replaceState(null, '', `#${tab ? TABS[tab - 1].id : 'intro'}`); } catch {}
  if (tab === 0) { mainEl.className = 'text'; mainEl.innerHTML = INTRO; return; }
  const t = TABS[tab - 1];
  step = Math.min(step, t.steps.length - 1);
  const s = t.steps[step];
  const h = SCREENS[size][`${t.id}-${step}`];
  mainEl.className = '';
  mainEl.innerHTML = `<div class="left"><div class="steps"><span class="seg">${t.steps.map((x, i) => `<button class="${i === step ? 'on' : ''}" data-st="${i}">${x.label}</button>`).join('')}</span></div>
    <div id="stage"><div id="screen">${h ? `<div class="t">${h}</div>` : '<div class="t">Not captured at this size.</div>'}</div></div></div>
    <aside>${s.aside}<div class="real">Keys: <kbd>1</kbd>–<kbd>${TABS.length + 1}</kbd> tabs · <kbd>←</kbd><kbd>→</kbd> steps · <kbd>s</kbd> window size. Drawn at ${size === '152' ? '152 × 56' : '80 × 24'}; the box is the bottom of the window.</div></aside>`;
  requestAnimationFrame(fit);
}
tabsEl.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { tab = Number(b.dataset.i); step = 0; draw(); } });
mainEl.addEventListener('click', (e) => { const b = e.target.closest('button[data-st]'); if (b) { step = Number(b.dataset.st); draw(); } });
document.getElementById('size').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; size = b.dataset.s; for (const x of document.querySelectorAll('#size button')) x.classList.toggle('on', x === b); draw(); });
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[1-9]$/.test(e.key) && Number(e.key) <= TABS.length + 1) { tab = Number(e.key) - 1; step = 0; draw(); }
  else if (e.key === 'ArrowRight' && tab) { step = Math.min(TABS[tab - 1].steps.length - 1, step + 1); draw(); }

  else if (e.key === 's') document.querySelector(`#size button[data-s="${size === '152' ? '80' : '152'}"]`).click();
});
addEventListener('resize', fit);
draw();
