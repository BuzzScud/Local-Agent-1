      + item(T24, what === 'run' ? '<span class="live">Model B running · 0:' + LIVE_AT + '</span>' : '<span class="rs ok">✓</span> done · ' + mode + (what === 'battle' && !S.vote ? ' · <span style="color:var(--accent);font-weight:650">to vote</span>' : ''), true, what === 'run' ? '<button class="btn sm stop">■ Stop</button>' : '<button class="btn sm">▶ Again</button>')
      + item(T26, what === 'run' ? 'next · ' + mode : 'waiting · ' + mode, false, what === 'run' ? '<button class="btn sm">✕ Not next</button>' : '<button class="btn sm pri">▶ Run</button>')
      + item(T02, 'waiting · ' + mode, false, what === 'run' ? '<button class="btn sm">✕ Not next</button>' : '<button class="btn sm">▶ Run</button>')
      + '</div><div class="rf"><button class="btn sm">' + (what === 'run' ? '■ Stop all' : '▶ Run the rest, in order') + '</button><button class="btn sm" data-show="pick">← Change the picks</button></div></div>';
  }
  var scoreBox = function () { var g = S.vote === 'B' ? 1 : 0, q = S.vote === 'A' ? 1 : 0; return '<div class="score"><span class="nm">Gemma</span><b>' + g + '</b><span class="mute">–</span><b>' + q + '</b><span class="nm">Qwen</span><span class="lbl">your votes</span></div>'; };

  // ---------- 1 · Two rooms ----------
  function d1() {
    var room = S.show === 'pick' ? 'setup' : 'results';
    var bar = '<div class="bar1"><div class="seg2"><button data-show="pick" aria-pressed="' + (room === 'setup') + '">1 · Set up</button><button data-show="' + (S.show === 'pick' ? 'battle' : S.show) + '" aria-pressed="' + (room === 'results') + '">2 · Results</button></div><button class="btn sm" data-act="rec">Record</button><span class="fill">'
      + (room === 'setup' ? 'Tick what to run, say who runs it, press the button. Nothing starts by itself.' : 'Each test in this run has its own ▶. The result is the Battle tab’s view; one model shows one column.') + '</span>' + scoreBox() + '</div>';
    if (room === 'setup') return '<div class="d1">' + bar + '<div class="setup">' + list('full') + panel(false) + foot('<button class="btn" data-act="new">＋ New test</button>') + '</div></div>';
    return '<div class="d1">' + bar + '<div class="res1">' + rail(S.show) + result(S.show, 'full') + '</div></div>';
  }
  // ---------- 2 · Workbench ----------
  function d2() {
    var mid = S.show === 'pick' ? result('solo', 'full') : result(S.show, 'full');
    if (S.show === 'pick' && S.sel !== T24.id) { var o = D.tests.filter(function (x) { return x.id === S.sel; })[0], g = last(o, 'gemma'), q = last(o, 'qwen');
      mid = '<div class="box" style="padding:18px 20px;align-self:start"><div class="ttl"><h2><span class="t">' + esc(o.title) + '</span></h2></div><p class="dim" style="margin:8px 0">Last on Gemma: ' + resTxt(g) + ' · last on Qwen: ' + resTxt(q) + '</p><p class="mute" style="margin:0 0 12px">In the real tab this test’s last run opens here with its clock, numbers and tabs. This preview carries the full steps of one test only, Practice 24.</p><button class="btn" data-test="' + esc(T24.id) + '">Show Practice 24</button></div>'; }
    var act = S.show === 'run' ? '<div class="row"><button class="btn stop" style="flex:1">■ Stop</button><button class="btn">✕ Clear the line</button></div><div class="sum"><b>Running 1 of 3</b> · Practice 24, then 26, then 2</div>' : '<div class="sum">' + footSum() + '</div><div class="row"><button class="btn" data-act="clear">Clear</button><button class="go" data-act="go">' + goLabel() + '</button></div>';
    return '<div class="d2"><div class="col left"><div class="box find"><b>Arena</b><span class="in">Find a test…</span><button class="btn sm" data-act="new">＋ New</button><button class="btn sm" data-act="rec">Record</button></div>' + list('mini') + '</div>'
      + '<div class="col" style="grid-template-rows:minmax(0,1fr)">' + mid + '</div>'
      + '<div class="col right">' + panel(true) + '<div class="box foot">' + act + '</div></div></div>';
  }
  // ---------- 3 · Scoreboard ----------
  function d3() {
    var g = setLast('practice', 'gemma'), q = setLast('practice', 'qwen');
    var strip = '<div class="strip"><div class="score"><span class="nm">Gemma</span><b>' + g.passed + '</b><span class="mute">–</span><b>' + q.passed + '</b><span class="nm">Qwen</span><span class="lbl">passes on the ' + g.total + ' both ran</span></div>' + scoreBox()
      + '<span class="fill"></span><span class="setc" data-act="drawer"><span class="k">This run</span>' + (S.effort === 'high' ? 'High' : 'Low') + ' · 32k · ' + (changed() ? changed() + ' changed' : 'the tests’ defaults') + '<i class="car"></i></span><button class="btn sm" data-act="new">＋ New test</button><button class="btn sm" data-act="rec">History</button></div>';
    var detail = S.show === 'pick' ? '' : '<div class="box" style="display:grid;min-height:0">' + result(S.show === 'solo' ? 'solo' : S.show, 'lite', true) + '</div>';
    var f = S.show === 'run' ? '<div class="box foot"><div class="sum"><b>Running</b> · Practice 24: Qwen is done, Gemma is 0:' + LIVE_AT + ' in · then 26 and 2, both models</div><button class="btn stop">■ Stop</button><button class="btn">✕ Clear the line</button></div>' : foot();
    return '<div class="d3">' + strip + '<div class="body' + (detail ? ' split' : '') + '">' + list('grid') + detail + '</div>' + f + (S.drawer ? '<div class="drawer">' + panel(false) + '</div>' : '') + '</div>';
  }
  // ---------- 4 · Run bar + tape ----------
  function d4() {
    var chips = S.ticked.map(function (id) { var t = D.tests.filter(function (x) { return x.id === id; })[0]; return '<span class="tk">' + esc(t ? 'Practice ' + t.n : id.replace('set:', 'All ').replace('check:', '')) + ' ✕</span>'; }).join('');
    var seg = '<div class="seg2">' + [['gemma', 'Gemma'], ['qwen', 'Qwen'], ['both', 'Both']].map(function (w) { return '<button data-who="' + w[0] + '" aria-pressed="' + (S.who === w[0]) + '">' + w[1] + '</button>'; }).join('') + '</div>';
    var comp = '<div class="comp"><div class="sent"><span>Run</span><span class="slot grow" data-act="picker">' + (chips || '<span class="mute">pick a test, a set or a check</span>') + '<span class="c"><i class="car"></i></span></span><span>on</span>' + seg + '<span>at</span><span class="slot" data-step="effort|1">' + (S.effort === 'high' ? 'High' : 'Low') + '<i class="car"></i></span><span>with</span><span class="slot" data-act="drawer">' + (changed() ? changed() + ' changed' : 'the tests’ defaults') + '<i class="car"></i></span>'
      + (S.show === 'run' ? '<button class="btn stop">■ Stop</button>' : '<button class="go" data-act="go">' + goLabel() + '</button>') + '</div>'
      + (S.show === 'pick' ? '<div class="picker" style="display:grid">' + list('full') + '</div>' : '') + (S.drawer ? '<div class="drawer" style="top:56px">' + panel(false) + '</div>' : '') + '</div>';
    var ml = function (lab, r, max) { return '<div class="ml"><span>' + lab + '</span>' + track(r, max, null, true) + '<span>' + mm(r.secs) + '</span></div>'; };
    var pair = function (n, runs, when) { var t = byN(n), a = runs.gemma, b = runs.qwen; return '<div class="box card"><div class="h"><span class="when">' + when + '</span><b title="' + esc(t.title) + '">Practice ' + n + ' · ' + esc(t.title) + '</b><div class="mid">' + ml('Gemma', a, Math.max(a.end, b.end)) + ml('Qwen', b, Math.max(a.end, b.end)) + '</div><div class="r"><span class="rs ' + (a.pass ? 'ok">✓' : 'bad">✗') + '</span><span class="rs ' + (b.pass ? 'ok">✓' : 'bad">✗') + '</span><span class="dim">' + (a.secs < b.secs ? 'Gemma' : 'Qwen') + ' faster by ' + mm(Math.abs(a.secs - b.secs)) + '</span><button class="btn sm">Open</button><button class="btn sm">▶ Again</button></div></div></div>'; };
    var wait = function (t, first) { return '<div class="box card"><div class="h"><span class="when">' + (first ? 'next' : 'waiting') + '</span><b>Practice ' + t.n + ' · ' + esc(t.title) + '</b><div class="mid mute" style="font-size:12.5px">' + (S.who === 'both' ? 'a battle: Gemma then Qwen' : 'on ' + MOD[S.who].short) + ' · High · the tests’ defaults</div><div class="r">' + (S.show === 'run' ? '<button class="btn sm">✕ Not next</button>' : '<button class="btn sm' + (first ? ' pri' : '') + '">▶ Run</button>') + '</div></div></div>'; };
    var chk = function (c) { var r = checkLast(c, 'gemma') || checkLast(c, 'qwen'); if (!r) return ''; return '<div class="box card"><div class="h"><span class="when">' + day(r.at) + '</span><b>' + esc(c.name) + (c.model ? ' · ' + MOD[r.model].short : '') + '</b><div class="mid mute" style="font-size:12.5px">a check: it prints its own lines' + (r.page ? ' · has a results page' : '') + '</div><div class="r"><span class="rs ' + (r.result === 'pass' ? 'ok">✓' : 'bad">✗') + '</span><span class="dim">' + (r.total != null ? r.passed + ' of ' + r.total : r.result) + '</span><button class="btn sm">Open</button><button class="btn sm">▶ Again</button></div></div></div>'; };
    var top = S.show === 'pick' ? '' : '<div class="box card open"><div class="h" style="grid-template-columns:74px minmax(0,1fr) auto"><span class="when">' + (S.show === 'run' ? '<span class="live">now</span>' : 'just now') + '</span><b>Practice 24 · ' + esc(T24.title) + (S.show === 'solo' ? ' · on Qwen' : ' · battle') + '</b><div class="r"><button class="btn sm">Close</button></div></div>' + result(S.show, 'incard') + '</div>' + wait(T26, true) + wait(T02, false);
    var fil = '<div class="tfil"><span>Show</span><span class="chip on">Everything</span><span class="chip">Battles</span><span class="chip">One model</span><span class="chip">Checks</span><span class="chip">To vote</span><span class="fill"></span>' + scoreBox() + '</div>';
    return '<div class="d4">' + comp + '<div class="tape scroll">' + fil + top + pair(24, F, '30 Sep') + pair(26, D.more[26], '30 Sep') + pair(2, D.more[2], '30 Sep') + pair(12, D.more[12], '30 Sep') + pair(17, D.more[17], '30 Sep') + CHECKS.map(chk).join('') + '</div></div>';
  }

  // ---------- the record, as today ----------
  function record() {
    var rows = D.record.slice(0, 40).map(function (r) { return '<div class="rec"><span class="mute">' + day(r.at) + ' ' + new Date(r.at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) + '</span><span>' + esc(r.name) + '</span><span class="dim">' + (r.model ? MOD[r.model] ? MOD[r.model].name : r.model : 'no model') + '</span><span><span class="rs ' + (r.result === 'pass' ? 'ok">✓' : r.result === 'fail' ? 'bad">✗' : '">■') + '</span> ' + (r.total != null ? r.passed + ' of ' + r.total : r.result) + '</span><span class="mute">' + (r.secs != null ? mins(r.secs) : '') + '</span></div>'; }).join('');
    return '<div class="over"><div class="h"><button class="btn sm" data-act="rec">← Back to the Arena</button><b>The test record</b><span>as it is today: Overview · Practice tasks · Other · How it is kept, with the models at the side. It moves here unchanged; battles get their own lines.</span></div><div class="box tl-box" style="grid-template-rows:auto minmax(0,1fr)"><div class="rec hd"><span>When</span><span>Test</span><span>Model</span><span>Result</span><span>Time</span></div><div class="scroll">' + rows + '</div></div></div>';
  }
  function real() {
    return '<div id="real" class="scroll"><h2>What is real on these pages</h2><div class="two"><div><h3>Real, read from this Mac today</h3><ul>'
      + '<li>The tests: the ' + D.tests.length + ' in your arena (New 28, Work 28, Practice 28) and the ' + CHECKS.length + ' checks of the Run tests list, by their own names.</li>'
      + '<li>The panel: every row, default and note comes from the app’s own panel code.</li>'
      + '<li>The results: last night’s run of the practice tasks on both models (30 Sep, thinking at High). The big result is practice test 24, “fix the test”: every step, time, edit and answer is what Qwen and Gemma really did.</li>'
      + '<li>The checks’ last results and the record come from your test record.</li></ul>'
      + '<h3>Not real</h3><ul><li>Those two runs were made one after the other as part of last night’s test, not started as a battle. “Model A” is Qwen and “Model B” is Gemma here.</li>'
      + '<li>“Running” is a replay of Gemma’s real run, paused at 0:' + LIVE_AT + '. Nothing is running.</li><li>The three picked tests and the line of runs are an example. The vote is kept only while this page is open.</li>'
      + '<li>New 28 and Work 28 show “never run” because they have not been run on one model yet; that is true, not a placeholder.</li></ul></div>'
      + '<div><h3>What every design shares</h3><ul><li>One tab, <b>Arena</b>, in place of Tests and Battle.</li><li>One list: sets, single tests and checks together.</li><li><b>Who</b>: Gemma, Qwen, or both. Both is a battle: the same test on each, one model loaded at a time.</li>'
      + '<li>The control panel applies to every run, battles too (today a battle is always Low at the defaults).</li><li>One result view for one model or two: the clock, the five numbers, What it did · Answer · Changes · Checks.</li><li>A one-model result can take the other model’s last run beside it.</li><li>Nothing starts by itself: each run in the line has its own ▶.</li></ul>'
      + '<h3>Things you can click</h3><ul><li>Tick tests, open a set, change Who and Effort and the panel’s rows, the four result tabs, the vote, “Put Gemma’s last run beside it”, Record, and the panel behind “This run ▾” in designs 3 and 4.</li></ul></div></div></div>';
  }

  // ---------- drawing and clicks ----------
  function draw() {
    $$('#pv [data-d]').forEach(function (b) { b.setAttribute('aria-pressed', String(Number(b.dataset.d) === S.design)); });
    $$('#pv [data-s]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.s === S.show)); b.hidden = S.design === 0; });
    $('#showlab').hidden = S.design === 0;
    $('#idea').innerHTML = IDEAS[S.design];
    $('#stage .hub').hidden = S.design === 0;
    var a = $('#arena'), view = S.design + '|' + S.show, same = view === drawn, tops = same ? $$('#arena .scroll').map(function (e) { return e.scrollTop; }) : [];
    a.innerHTML = S.design === 0 ? real() : (S.design === 1 ? d1() : S.design === 2 ? d2() : S.design === 3 ? d3() : d4()) + (S.rec ? record() : '');
    // A click keeps every list where it was; a new view brings the picked test into sight.
    var sc = $$('#arena .scroll');
    if (same && sc.length === tops.length) sc.forEach(function (e, i) { e.scrollTop = tops[i]; });
    else { var sel = $('#arena .lrow.sel'); if (sel && S.show !== 'pick') { var box = sel.closest('.scroll'); box.scrollTop = Math.max(0, sel.offsetTop - box.offsetTop - box.clientHeight / 2); } }
    drawn = view;
    try { history.replaceState(null, '', '#' + S.design + '-' + S.show); } catch (e) {}
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-d],[data-s],[data-show],[data-tick],[data-set],[data-test],[data-tab],[data-vote],[data-act],[data-step],[data-who],[data-prow]');
    if (!t) return;
    var d = t.dataset;
    if (d.d != null) { S.design = Number(d.d); S.rec = false; S.drawer = false; }
    else if (d.s) { S.show = d.s; S.rec = false; S.drawer = false; if (d.s === 'run') S.vote = null; }
    else if (d.show) { S.show = d.show; }
    else if (d.tick) { var i = S.ticked.indexOf(d.tick); if (i >= 0) S.ticked.splice(i, 1); else S.ticked.push(d.tick); }
    else if (d.step) { var p = d.step.split('|'), id = p[0], by = Number(p[1]); S.prow = id;
      if (id === 'who') { var o = ['gemma', 'qwen', 'both']; S.who = o[(o.indexOf(S.who) + by + 3) % 3]; }
      else if (id === 'effort') S.effort = S.effort === 'high' ? 'low' : 'high';
      else { var r = D.panel.gemma.rows.filter(function (x) { return x.id === id; })[0], def = r.steps.findIndex(function (s) { return s.v === r.def; }), cur = S.vals[id] != null ? S.vals[id] : def, nx = Math.max(0, Math.min(r.steps.length - 1, cur + by)); if (nx === def) delete S.vals[id]; else S.vals[id] = nx; } }
    else if (d.who) S.who = d.who;
    else if (d.prow) S.prow = d.prow;
    else if (d.tab) S.tab = d.tab;
    else if (d.vote) S.vote = S.vote === d.vote ? null : d.vote;
    else if (d.act === 'clear') S.ticked = [];
    else if (d.act === 'reset') S.vals = {};
    else if (d.act === 'go') { if (S.ticked.length) { S.show = 'run'; S.vote = null; S.drawer = false; } }
    else if (d.act === 'cmp') S.cmp = !S.cmp;
    else if (d.act === 'rec') S.rec = !S.rec;
    else if (d.act === 'drawer') S.drawer = !S.drawer;
    else if (d.act === 'picker') S.show = S.show === 'pick' ? 'battle' : 'pick';
    else if (d.act === 'new') return;
    else if (d.set) { if (e.target.closest('.tg,.btn,.cellrun')) return; S.open[d.set] = !S.open[d.set]; }
    else if (d.test) { if (e.target.closest('.tg,.btn,.cellrun')) return; S.sel = d.test; }
    draw();
  });
  addEventListener('keydown', function (e) { if (e.metaKey || e.ctrlKey || e.altKey) return; var n = parseInt(e.key, 10); if (n >= 1 && n <= 4) { S.design = n; S.rec = false; draw(); } });
  var h = /^#(\d)-(\w+)$/.exec(location.hash || ''); if (h) { S.design = Number(h[1]); if (['pick', 'run', 'solo', 'battle'].indexOf(h[2]) >= 0) S.show = h[2]; }
  draw();
})();
</script>
</body>
</html>
