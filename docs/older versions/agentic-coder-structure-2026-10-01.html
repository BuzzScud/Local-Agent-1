<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agentic Coder folder structure</title>
<style>
:root{
  --bg:#f9f9f7; --surface:#fcfcfb; --panel:#f3f3f0; --line:#e1e0d9; --line2:#c3c2b7;
  --ink:#0b0b0b; --ink2:#52514e; --ink3:#6b6a64; --faint:#898781;
  --t:#2a78d6; --m:#eb6834; --on-m:#0b0b0b;
  --t-soft:rgba(42,120,214,.07); --m-soft:rgba(235,104,52,.07);
  --t-door:rgba(42,120,214,.17); --m-door:rgba(235,104,52,.20);
  --sel:rgba(42,120,214,.11); --hover:rgba(11,11,11,.045); --chip:#efece4;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --t-strong:#1f63b8; --on-t:#ffffff; --t-text:#1f5fae; --m-text:#b3441a;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121211; --surface:#1a1a19; --panel:#232322; --line:#34342f; --line2:#4a4a44;
    --ink:#f4f4f2; --ink2:#c3c2b7; --ink3:#a3a29a; --faint:#898781;
    --t:#3987e5; --m:#d95926; --t-strong:#3987e5; --on-t:#0b0b0b; --t-text:#6aa6ef; --m-text:#ef7f4f;
    --t-soft:rgba(57,135,229,.11); --m-soft:rgba(217,89,38,.12);
    --t-door:rgba(57,135,229,.26); --m-door:rgba(217,89,38,.30);
    --sel:rgba(57,135,229,.20); --hover:rgba(255,255,255,.06); --chip:#2a2a27;
  }
}
:root[data-theme="dark"]{
  --bg:#121211; --surface:#1a1a19; --panel:#232322; --line:#34342f; --line2:#4a4a44;
  --ink:#f4f4f2; --ink2:#c3c2b7; --ink3:#a3a29a; --faint:#898781;
  --t:#3987e5; --m:#d95926;
  --t-soft:rgba(57,135,229,.11); --m-soft:rgba(217,89,38,.12);
  --t-door:rgba(57,135,229,.26); --m-door:rgba(217,89,38,.30);
  --sel:rgba(57,135,229,.20); --hover:rgba(255,255,255,.06); --chip:#2a2a27;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
code,.mono{font-family:var(--mono)}
code{font-size:.92em;background:var(--chip);padding:1px 5px;border-radius:5px}
:focus-visible{outline:2px solid var(--t);outline-offset:2px}
[hidden]{display:none!important}

/* ---- frame: the page fills the window; below the floor it scrolls */
.app{display:flex;flex-direction:column;min-height:100vh;padding:10px 24px 12px;max-width:1760px;margin:0 auto}
header.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;flex:none}
h1{font-size:21px;line-height:1.2;margin:0;font-weight:680;letter-spacing:-.01em}
.dateline{color:var(--ink3);font-size:13px}
nav.tabs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0 4px;flex:none}
nav.tabs button{font-size:14px;padding:6px 13px;border-radius:999px;border:1px solid var(--line2);background:var(--surface)}
nav.tabs button:hover{background:var(--panel)}
nav.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grow{flex:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sw{width:20px;height:13px;border-radius:4px;border:1.5px solid var(--line2);display:inline-block}
.sw.t{border-color:var(--t);background:var(--t-soft)} .sw.m{border-color:var(--m);background:var(--m-soft)}
.sw.door.t{border-color:var(--t);background:var(--t-door)} .sw.door.m{border-color:var(--m);background:var(--m-door)} .sw.door.t+.sw.door.m{margin-left:-2px} .sw.local{border-style:dashed;border-color:var(--faint);background:transparent}
p.lead{margin:0 0 6px;color:var(--ink2);max-width:1200px;flex:none;min-height:21px}
main{flex:1 0 auto;position:relative}
main>section{height:100%}

/* ---- tab 1: the folder map, and tab 4: the poster */
/* ---------- shared map pieces ---------- */
.ic{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.t-ink{color:var(--t)} .m-ink{color:var(--m)}
.nm{font-family:var(--mono);font-weight:700;font-size:16px;white-space:nowrap}
.ds{color:var(--ink2);font-size:14.5px;line-height:1.3}
.ct{color:var(--ink3);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.flag2{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:0 7px;line-height:17px;white-space:nowrap;border:1px solid var(--line2);background:var(--chip);color:var(--ink)}
.flag2.hot{background:var(--m);border-color:var(--m);color:#0b0b0b}
.badge{position:absolute;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;z-index:3;box-shadow:0 0 0 2px var(--surface)}
.badge.t{background:var(--t-strong);color:var(--on-t)} .badge.m{background:var(--m);color:#0b0b0b}

.rootbar{flex:none;display:flex;align-items:center;gap:14px;border:1px solid var(--line2);border-radius:10px;padding:7px 14px;background:var(--surface);min-width:0}
.rootbar .rn{font-family:var(--mono);font-weight:700;font-size:17px;white-space:nowrap;flex:none}
.rootbar .rs{color:var(--ink2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.split{flex:1 0 330px;max-width:520px;display:flex;flex-direction:column;gap:3px}
.term{background:#1a1a1a;border:1px solid var(--line2);border-radius:8px;overflow:hidden;padding:6px 8px;flex:none}
.term .tin{font-family:Menlo,ui-monospace,monospace;white-space:pre;color:#d7d7d7;line-height:1.3;font-size:9px}
.term .tin b.g{font-weight:inherit}
.split .bar{display:flex;height:12px;border-radius:4px;overflow:hidden;gap:2px}
.split .bar i{display:block;height:100%}
.split .keys{display:flex;gap:10px;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden}
.split .keys b{font-weight:600;color:var(--ink2)}
.rootfiles{margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* ---------- Map B: columns sized by lines ---------- */
.mapB{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px}
.mB-body{flex:1;min-height:0;position:relative}
.col{position:absolute;top:0;bottom:0}
.colhd{position:absolute;left:0;right:0;top:0;height:42px;display:flex;align-items:center;gap:9px;padding:0 12px;border-radius:10px 10px 0 0;border:1.5px solid;border-bottom:none}
.col.t .colhd{border-color:var(--t);background:var(--t-soft)} .col.m .colhd{border-color:var(--m);background:var(--m-soft)}
.colhd .pn{font-family:var(--mono);font-weight:750;font-size:19px}
.colhd .sub{color:var(--ink2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colhd .num{margin-left:auto;color:var(--ink3);font-size:13px;white-space:nowrap}
.colbody{position:absolute;left:0;right:0;top:42px;border:1.5px solid;border-top:none;border-radius:0 0 10px 10px;padding:0 6px}
.col.t .colbody{border-color:var(--t);background:var(--t-soft)} .col.m .colbody{border-color:var(--m);background:var(--m-soft)}
.brow{position:absolute;left:6px;right:6px;border:1px solid var(--line2);border-radius:7px;background:var(--surface);display:flex;gap:10px;padding:0 10px;overflow:hidden}
.brow.door.t{border:1.5px solid var(--t);background:var(--t-door);border-radius:7px;padding:0 10px;font-family:var(--sans);font-size:inherit;font-weight:inherit}
.brow.door.m{border:1.5px solid var(--m);background:var(--m-door);border-radius:7px;padding:0 10px;font-family:var(--sans);font-size:inherit;font-weight:inherit}
.brow .main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px}
.brow .l1{display:flex;align-items:center;gap:8px;min-width:0}
.brow .l1 .ds{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brow .keys{font-family:var(--mono);font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .meas{flex:none;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:3px;width:128px}
.brow .lbar{height:6px;border-radius:3px;background:var(--line);width:120px;overflow:hidden}
.brow .lbar i{display:block;height:100%;border-radius:3px}
.brow.t .lbar i{background:var(--t)} .brow.m .lbar i{background:var(--m)}
.brow .thumb{flex:none;align-self:center;border-radius:6px;border:1px solid var(--line2);object-fit:cover;object-position:top left}
.bgrp{position:absolute;left:6px;right:6px;border:1px solid var(--line2);border-radius:9px;background:color-mix(in srgb,var(--surface) 50%,transparent)}
.bgrp .gh{position:absolute;left:10px;right:10px;top:2px;height:25px;line-height:1.3;display:flex;align-items:center;gap:8px;white-space:nowrap}
.bgrp .gh .ds{overflow:hidden;text-overflow:ellipsis;min-width:0} .bgrp .gh .nm,.bgrp .gh .ct,.bgrp .gh .ic{flex:none}
.bgrp .gh .nm{font-size:15px}.bgrp .gh .ds{font-size:13.5px}.bgrp .gh .ct{margin-left:auto}
.bchips{display:flex;flex-wrap:wrap;gap:3px 6px;align-items:center;min-width:0;overflow:hidden}
.bchips .mchip{padding:2px 8px;flex:none}
.route{position:absolute;inset:0;pointer-events:none;overflow:visible}
.compact .brow .l1 .ds{display:none}
.compact .brow .meas{width:100px} .compact .brow .lbar{width:92px}
.compact .bchips .mchip{padding:0 6px} .compact .bchips .mchip .nm{font-size:12.5px}
.rlab{position:absolute;font-size:13.5px;line-height:1.25;color:var(--ink);background:var(--bg);border-radius:6px;padding:2px 5px;z-index:2}
.rlab small{display:block;color:var(--ink3);font-size:12px;font-family:var(--mono)}
.macbox{position:absolute;border:1.5px dashed var(--line2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:5px}
.macbox h3{margin:0;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.macbox .mr{display:grid;grid-template-columns:minmax(0,1fr) 72px 110px;gap:8px;align-items:center;font-size:13px}
.macbox .mr code{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.macbox .mr span{color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.macbox .sb{height:5px;border-radius:3px;background:var(--line)} .macbox .sb i{display:block;height:100%;border-radius:3px;background:var(--faint)}
.rlab.r{text-align:right}
.scale{position:absolute;font-size:12.5px;color:var(--ink3);line-height:1.35;text-align:center}

/* ---------- Posters ---------- */
.stage{position:absolute;inset:0}
.poster{width:1800px;height:1000px;position:absolute;left:0;top:0;transform-origin:0 0;background:var(--p-bg);color:var(--p-ink);border:1px solid var(--line2);box-shadow:0 2px 14px rgba(0,0,0,.25);position:relative;overflow:hidden;font:19px/1.42 var(--sans);color-scheme:light;
  /* always white paper, in light and dark mode, like a printed poster */
  --p-bg:#ffffff; --p-ink:#141414; --p-ink2:#44433f; --p-ink3:#6d6c66; --p-rule:#dcdad2; --p-panel:#f5f4ef;
  --p-band:#16325c; --p-band-ink:#ffffff; --p-band-ink2:#c9d6ea; --p-head:#16325c; --gem:#0f8a7a; --qw:#7a4fd6;
  --t:#2a78d6; --m:#eb6834; --t-soft:rgba(42,120,214,.07); --m-soft:rgba(235,104,52,.07); --t-cell:rgba(42,120,214,.10); --m-cell:rgba(235,104,52,.11);
  --t-door:rgba(42,120,214,.17); --m-door:rgba(235,104,52,.20); --faint:#898781; --t-strong:#1f63b8; --on-t:#ffffff; --t-text:#1f5fae; --m-text:#b3441a;
  --bg:#ffffff; --surface:#ffffff; --panel:#f5f4ef; --ink:#141414; --ink2:#44433f; --ink3:#6d6c66; --line:#dcdad2; --line2:#c9c7bd; --chip:#f1efe8}
.brow .main{min-width:104px} .brow .thumb{flex:0 1 auto;min-width:0}
.band{height:132px;background:var(--p-band);color:var(--p-band-ink);display:flex;align-items:center;gap:26px;padding:0 40px}
.band img{width:84px;height:84px;border-radius:18px;flex:none}
.band h1{font-family:var(--serif);font-size:42px;line-height:1.4!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;letter-spacing:-.005em;line-height:1.08;margin:0}
.band .by{font-size:20px;color:var(--p-band-ink2);margin-top:6px}
.band .rt{margin-left:auto;text-align:right;font-size:17px;color:var(--p-band-ink2);line-height:1.45;flex:none}
.band .rt b{color:var(--p-band-ink);font-weight:650}
.pcols{position:absolute;top:132px;left:0;right:0;bottom:0;display:grid;gap:30px;padding:22px 36px 26px}
.pcols.A{grid-template-columns:1fr 1.06fr 1fr}
.pcols.B{grid-template-columns:362px minmax(0,1fr) 410px;gap:24px;padding-bottom:90px}
.pcol{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
.poster h2{font-family:var(--serif);font-size:25px;font-weight:700;margin:0;color:var(--p-head);display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--p-head);padding-bottom:3px}
.poster h2 .sn{font-size:20px;opacity:.75}
.poster p{margin:0}
.poster .pbody{font-size:19px;line-height:1.42;color:var(--p-ink)}
.poster ul{margin:0;padding-left:22px}
.poster li{margin:2px 0}
.poster figure{margin:0;display:flex;flex-direction:column;gap:6px}
.poster figcaption{font-size:16px;line-height:1.35;color:var(--p-ink2)}
.poster figcaption b{color:var(--p-ink)}
.poster .fig{border:1px solid var(--p-rule);border-radius:8px;background:var(--p-bg);overflow:hidden;position:relative}
table.res{border-collapse:collapse;width:100%;font-size:17.5px;font-variant-numeric:tabular-nums}
table.res th,table.res td{padding:3px 8px;border-bottom:1px solid var(--p-rule);text-align:right;white-space:nowrap}
table.res th:first-child,table.res td:first-child{text-align:left}
table.res thead th{font-weight:700;border-bottom:2px solid var(--p-ink)}
table.res td small{color:var(--p-ink3);font-size:14px}
table.res td.win{font-weight:750}
table.res td.win::after{content:" ▲";font-size:11px;color:var(--p-ink3)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:0}
.refs{font-size:15.5px;line-height:1.35;color:var(--p-ink2);margin:0;padding-left:30px}
.refs code{font-size:14.5px;color:var(--p-ink)}
.pstats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pstat{border:1px solid var(--p-rule);border-radius:8px;padding:5px 11px 7px;background:var(--p-panel)}
.pstat b{display:block;font-family:var(--serif);font-size:29px;line-height:1.05;color:var(--p-head)}
.pstat span{font-size:15.5px;color:var(--p-ink2);line-height:1.25;display:block}
.pfoot{position:absolute;left:36px;right:36px;bottom:18px;height:62px;border-top:2px solid var(--p-head);padding-top:8px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.pfoot h2{border:none;padding:0;font-size:21px}
.pfoot .refs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 22px;padding:0;list-style:none;counter-reset:r}
.pfoot .refs li{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fig1B{flex:1;min-height:0}


/* ---------- round 2 ---------- */
.rt{fill:none;stroke-width:2.6;stroke-linecap:round} .rt-t{stroke:var(--t)} .rt-m{stroke:var(--m)} .rt-ghost{fill:none;stroke:none}
.rt-arrow{fill:none;stroke-width:2.6}
.rt-bench{fill:none;stroke:var(--ink3);stroke-width:1.8;stroke-dasharray:6 5}
.benchlab{font-size:12.5px;color:var(--ink3);font-style:italic;text-align:center;background:transparent}
.benchlab code{font-style:normal;font-size:12px;background:var(--bg);padding:0 3px;border-radius:4px}
.fdot{position:absolute;left:0;top:0;width:14px;height:14px;border-radius:50%;z-index:2;pointer-events:none;background:var(--t)}
.fdot.t{background:var(--t);box-shadow:0 0 0 4px rgba(57,135,229,.28),0 0 16px 5px rgba(57,135,229,.45)}
.fdot.m{background:var(--m);box-shadow:0 0 0 4px rgba(217,89,38,.28),0 0 16px 5px rgba(217,89,38,.45)}
.badge.fb{z-index:3;border:none;cursor:pointer;padding:0;font:700 12px var(--sans);transition:transform .2s}
.badge.fb.on{transform:scale(1.28)} .badge.fb.on.t{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--t)} .badge.fb.on.m{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--m)}
.slab{font-size:13.5px;color:var(--ink3);transition:color .2s;white-space:normal} .slab.on{color:var(--ink);font-weight:650}
.brow{transition:box-shadow .25s,border-color .25s}
.brow.t.lit{border-color:var(--t);box-shadow:0 0 0 1.5px var(--t),0 0 18px rgba(57,135,229,.35)}
.brow.m.lit{border-color:var(--m);box-shadow:0 0 0 1.5px var(--m),0 0 18px rgba(217,89,38,.35)}
.nar{position:absolute;border:1.5px solid var(--line2);border-radius:12px;background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:6px;z-index:3;transition:border-color .25s}
.nar.t{border-color:var(--t)} .nar.m{border-color:var(--m)}
.nar .nh{display:flex;flex-direction:column;gap:2px} .nar .nn{font-size:11.5px;color:var(--ink3);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.nar .nt{font-size:16px;font-weight:700;line-height:1.25} .nar .nx{margin:0;font-size:14px;color:var(--ink2);line-height:1.38;min-height:3.9em}
.nar .nf{display:flex;align-items:center;gap:8px} .nar .nw{font-size:13px;color:var(--ink)}
.nar .ctl{margin-left:auto;display:flex;gap:4px} .nar .ctl button{border:1px solid var(--line2);background:var(--panel);border-radius:7px;width:32px;height:27px;font-size:12px;line-height:1;padding:0}
.pcols.Q{grid-template-columns:1fr 1.08fr 1fr;padding-bottom:92px}
.poster h2.q{font-size:31px;border-bottom-width:3px}
.pvwrap{display:flex;flex-direction:column;gap:5px}
.pv{display:grid;grid-template-columns:26px 20px 1fr auto;gap:8px;align-items:center;border-radius:8px;padding:5px 10px;font-size:16.5px}
.pv.t{background:var(--t-soft);border:1px solid color-mix(in srgb,var(--t) 45%,transparent)} .pv.m{background:var(--m-soft);border:1px solid color-mix(in srgb,var(--m) 45%,transparent)}
.pv .pt{font-weight:600;line-height:1.2} .pv code{font-size:13.5px;color:var(--p-ink2)}
.badge-i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;flex:none} .badge-i.t{background:var(--t-strong);color:var(--on-t)} .badge-i.m{background:var(--m);color:#0b0b0b}
.pv-door{font-size:13.5px;color:var(--p-ink2);border-top:2.5px dashed;padding:2px 0 0 8px;margin:1px 0} .pv-door.m{border-color:var(--m)} .pv-door.t{border-color:var(--t)}
.pstats.three{grid-template-columns:repeat(3,1fr)}
.methbox{border:1px solid var(--p-rule);border-radius:8px;background:var(--p-panel);padding:8px 12px;font-size:15.5px} .methbox ul{margin-top:4px}
.takehome>b{flex:none;white-space:nowrap}
.takehome{position:absolute;left:36px;right:36px;bottom:18px;height:62px;border-radius:10px;background:var(--p-band);color:#fff;padding:8px 18px;font-size:16.5px;line-height:1.35;display:flex;gap:28px;align-items:center}
.takehome .lim{margin-left:auto;color:var(--p-band-ink2);flex:none;max-width:430px}
.crow1{position:absolute;top:146px;left:36px;right:36px;height:196px;display:grid;grid-template-columns:1.3fr 1fr 1.05fr;gap:28px}
.crow1>div{display:flex;flex-direction:column;gap:8px;min-width:0}

it":1,"w":"the terminal window’s size; redraws on resize","ch":[],"b":3157,"lines":76,"c":"The terminal window as the app sees it. Resizing redraws everything, like Claude Code: while you drag the window edge nothing is drawn; once the size has held still for a moment the window is cleared and the whole conversation is printed again at the new size, with the prompt box on the last lines. (Ink on its own only redraws the live part, and on a narrower window leaves copies of it behind, because Terminal…"},{"id":"terminal/src/app/pick.mjs","n":"pick.mjs","k":"f","p":"t","git":1,"w":"a small pick-one menu, before the screen is up","ch":[],"b":2174,"lines":42,"c":"A small menu for the plain terminal, before the Ink screen is up (the safety check at start, questions under coding -p). It looks like the dialogs inside the app: ❯ marks the row, up/down move it, enter picks it. Typing a number picks that row at once, as in the app. Esc or ctrl+c gives null. Answers the index of the row picked."},{"id":"terminal/src/app/store.mjs","n":"store.mjs","k":"f","p":"t","git":1,"w":"settings, saved conversations and prompt history","ch":[],"b":4168,"lines":89,"c":"Settings, saved sessions and prompt history, all under ~/.agentic-coder."},{"id":"terminal/src/app/trust.mjs","n":"trust.mjs","k":"f","p":"t","git":1,"w":"the first-visit safety check for a folder","ch":[],"b":2660,"lines":65,"c":"Folder trust, like Claude Code's first-visit safety check. Before Agentic Coder reads a folder's notes into the model or runs anything there, the user says once that they trust it. A yes covers the folder and everything inside it, and is kept in ~/.agentic-coder/trust.json. Saying yes to \"Work in \u003cproject>?\" mid-session counts too (src/app/App.jsx)."},{"id":"terminal/src/app/update.mjs","n":"update.mjs","k":"f","p":"t","git":1,"w":"\"Update available\": watches the repo for new commits (/update)","ch":[],"b":12697,"lines":202,"c":"\"Update available\" in the lower right, as in Claude Code: while Agentic Coder runs, it looks at its own repo every 20 s. When a commit lands on main (or is pushed to GitHub's main from this Mac) that changes Agentic Coder's code, a restart would run something new, and the badge says so. /update restarts Agentic Coder on it through the launcher (which builds the new version first) and picks the conversation back up.…"},{"id":"terminal/src/app/autosave.mjs","n":"autosave.mjs","k":"f","p":"t","git":1,"w":"the memory learns after a task, and asks first","ch":[],"b":16778,"lines":296,"c":"The memory learns after a task (src/agent/lessons.mjs). By default it ASKS first (settings.json \"memorySave\": \"ask\"; \"auto\" saves on its own, as below): - a little after a task ends, in the background, on the side slot; the moment you send a message the save stops and waits for the next pause; - when the window closes, a second look: every turn of the conversation is read again, slowly, by a small process of its own…"},{"id":"terminal/src/app/builder-hub.mjs","n":"builder-hub.mjs","k":"f","p":"t","git":1,"w":"the hub’s Test builder: making tests of your own","ch":[],"b":4340,"lines":51,"c":"The hub's Test builder (a window over the Arena tab, a tab of its own until 30 Sep 2026): making tests of your own, in full (models/evals/battle/builder.mjs). A test made here is one of the Battle arena's \"My tests\", with a level (Easy, Medium, Hard), kept on this Mac only in ~/.agentic-coder/battle/tests/. The files are read and written here directly, so the tab works whether or not the arena's runner is up. GET…"},{"id":"terminal/src/app/builder.html","n":"builder.html","k":"f","p":"t","git":1,"w":"the Test builder page","ch":[],"b":43072},{"id":"terminal/src/app/docs-dir.mjs","n":"docs-dir.mjs","k":"f","p":"t","git":1,"w":"where the pages folder is: the repo’s docs/","ch":[],"b":2063,"lines":42,"c":"Where the DOCS folder is: the repo's own docs/ (since 30 Sep 2026; it was `cli docs/` beside it before that). AGENTIC_DOCS names it outright, else AGENTIC_REPO (the launcher passes it), else the repo this source runs from; from a worktree, the main folder's docs/, where the private things are. A leaf module, so the agent can find the folder (the design examples live in its private/ folder) without loading the hub."},{"id":"terminal/src/app/flow-hub.mjs","n":"flow-hub.mjs","k":"f","p":"t","git":1,"w":"the hub’s Flow page: how a request moves, drawn for every model","ch":[],"b":44757,"lines":437,"c":"The hub's Flow tab: how Agentic Coder works, as eight drawings, with every model in /model drawn into them. Nothing on it is typed in by hand any more: each time the tab opens it reads what the Harness tab reads (the model list and each settings card, the limits in use, the newest test the models have in common) and, from that test, which path each task took and one task's real steps on each model. A model added to…"},{"id":"terminal/src/app/harness-hub.mjs","n":"harness-hub.mjs","k":"f","p":"t","git":1,"w":"the hub’s Harness tab: one harness, every model side by side","ch":[],"b":31199,"lines":293,"c":"The hub's Harness tab: one harness, and every model in /model beside the others. Nothing on it is typed in by hand: each time the tab opens it reads the model list and each settings card, the limits in use, the app's own memory sizing, and the newest test the models have in common (the test record). A model added to the list shows up here by itself. /harness the page, drawn here (harness.html holds its styles and…"},{"id":"terminal/src/app/harness.html","n":"harness.html","k":"f","p":"t","git":1,"w":"the Harness page","ch":[],"b":16884},{"id":"terminal/src/app/instructions-hub.mjs","n":"instructions-hub.mjs","k":"f","p":"t","git":1,"w":"the hub’s Instructions tab: what the model receives besides the system prompt","ch":[],"b":19414,"lines":267,"c":"Shared instruction editor. Project files and permission enforcement stay separate."},{"id":"terminal/src/app/instructions.html","n":"instructions.html","k":"f","p":"t","git":1,"w":"the Instructions page","ch":[],"b":61196},{"id":"terminal/src/app/mouse.mjs","n":"mouse.mjs","k":"f","p":"t","git":1,"w":"the mouse in the prompt box (/mouse on): drag to select","ch":[],"b":1815,"lines":35,"c":"The mouse in the prompt box (/mouse on). Terminal keeps the mouse for itself until an app asks for it; asked, it sends every press, drag and release as text on the keyboard's line, with the cell the pointer is on. Plain data and pure functions here; App.jsx turns them into a cursor and a selection."},{"id":"terminal/src/app/perm-store.mjs","n":"perm-store.mjs","k":"f","p":"t","git":1,"w":"the rules you save with /permissions, kept outside the project","ch":[],"b":7196,"lines":139,"c":"The rules you save with /permissions, kept in ~/.agentic-coder/permissions.json: in the app's own folder, not in the project, so a project you download can not arrive with \"allow\" rules of its own. { \"everywhere\": { allow, never, protect, mode }, \"folders\": { \"\u003creal path>\": { allow, never, protect, mode } } } allow: commands that run without asking · never: commands that never run · protect: files that always ask…"},{"id":"terminal/src/app/perms.mjs","n":"perms.mjs","k":"f","p":"t","git":1,"w":"/permissions: what runs without asking, what never runs","ch":[],"b":12395,"lines":203,"c":"/permissions: what runs without asking, what never runs, which files always ask, and the mode Agentic Coder starts in. This file is the command's words and panels; the rules themselves are judged in agent/permissions.mjs and kept by perm-store.mjs. Every function answers plain data for App.jsx: { text, tone } a line to print { panel } { title, pad, rows } as /helpers prints them { open: 'panel' | 'mode' } the picker…"},{"id":"terminal/src/app/rail.jsx","n":"rail.jsx","k":"f","p":"t","git":1,"w":"the conversation drawn as a rail: one thin line per turn","ch":[],"b":14324,"lines":208,"c":"The conversation as a rail (design 2 of 29 Sep 2026, the user's pick): your message on a grey who u = you, h = the harness, m = the model model the step can call the model (the amber dot on the Flow tab) {The model} in a…"},{"id":"terminal/src/app/weights-core.mjs","n":"weights-core.mjs","k":"f","p":"t","git":1,"w":"the Weights tab’s model-file reader, shared with the edit writer and its check","ch":[],"b":924,"lines":12,"c":"The Weights tab's file reader (the \u003cscript id=\"core\"> in weights.html), outside the page: the one place that builds it from the page's text, so the page and everything that reads a model file the same way (the edit writer, gguf-edit.mjs; the weights reader check, models/evals/tools/reader-check.mjs) can never disagree. coreFrom(html) from the page's text (gguf-edit.mjs imports the page as text, which works inside…"},{"id":"terminal/src/app/remote-form.mjs","n":"remote-form.mjs","k":"f","p":"t","git":1,"w":"/remote: the form for a model on another machine","ch":[],"b":21427,"lines":356,"c":"/remote: one form for where the model runs. Its first row, Run on, picks This Mac · Claude API · My other computer · Another service, and only that one's rows show (the ones seldom changed behind More). Each service keeps its own set-up and its own key, so flipping Run on loses nothing. Connect checks the rows as they are (the tunnel, the address, the key, one word back) and only when that works saves them and…"},{"id":"terminal/src/app/review.mjs","n":"review.mjs","k":"f","p":"t","git":1,"w":"`coding memory-review`: the night pass over the day’s conversations","ch":[],"b":10984,"lines":171,"c":"The memory's review at night: `coding memory-review`. While the Mac is idle it reads the day's conversations again, saves what the quick saves after each task missed, and tidies both memories. It is careful about when it runs: - only between 1 and 6 in the morning, on power, after 30 minutes with no key or mouse (it never wakes the Mac: a sleeping Mac runs nothing); - not while an Agentic Coder window is open or a…"},{"id":"terminal/src/app/memory-hub.mjs","n":"memory-hub.mjs","k":"f","p":"t","git":1,"w":"the hub’s Memory tab: what it remembers, read live","ch":[],"b":3608,"lines":47,"c":"The hub's Memory tab: what Agentic Coder remembers, read live from the two memory folders (src/agent/facts.mjs), and the few changes you can make there by hand. Every change goes through the store, so it is in the log and can be undone. GET /memory.json both memories: facts, retired facts, the last changes POST /memory/edit { where, id, text } POST /memory/pin { where, id, pinned } POST /memory/retire { where, id }…"},{"id":"terminal/src/app/helpers.mjs","n":"helpers.mjs","k":"f","p":"t","git":1,"w":"/helpers: turn the four context helpers on or off","ch":[],"b":4606,"lines":64,"c":"/helpers: the context helpers (agent/helpers.mjs), numbered and by codename (Scout, Medic, Oracle, Sentry), each on or off with one line on what it brings and what it brought to the last request. \"/helpers off 3\", \"/helpers off oracle\", \"/helpers on rag\" (its id), \"/helpers off all\" switch them, kept in settings.json (\"helpers\": the ones on) so they last; the next message uses them. AGENTIC_HELPERS, when set…"},{"id":"terminal/src/app/rules.mjs","n":"rules.mjs","k":"f","p":"t","git":1,"w":"/rules: what the model reads at the start, and how to change it","ch":[],"b":4506,"lines":81,"c":"/rules: what the model reads at the start of every conversation, numbered, and short commands to change it (design 1 of the 28 Sep design round, docs/design rounds/rules-command-2-designs-2026-09-28.html). Always facts marked \"always\": read in full at every start Other notes one line each at the start, the whole fact when a request fits Off switched off with /rules off: kept in retired/, /rules on brings one back…"},{"id":"terminal/src/app/limits.mjs","n":"limits.mjs","k":"f","p":"t","git":1,"w":"/effort: the effort, and the limits you can move","ch":[],"b":18314,"lines":353,"c":"/effort (one panel): the effort and Who decides (agent/way.mjs), then the search's three rows (Embedder, Retriever, Reranker: agent/search.mjs), then the limits you can move up and down, in one place. Each row has the steps it moves through (numbers, or named choices for the search's rows), its default, how it reads, and what a value costs (said next to it in the panel). Saved as \"limits\" in settings.json; only the…"},{"id":"terminal/src/app/live.mjs","n":"live.mjs","k":"f","p":"t","git":1,"w":"the token count on the \"Musing…\" line","ch":[],"b":762,"lines":14,"c":"The token count on the \"Musing…\" line. The chat's own stream adds one per token; the focused paths (tests and drafts written in tries) report a running count per try instead, so only what is new since that try's last report is added. Tries may run side by side (tests and drafts on two slots), so each label#try keeps its own count; a try starts at 0."},{"id":"terminal/src/app/mac-memory.mjs","n":"mac-memory.mjs","k":"f","p":"t","git":1,"w":"the Mac’s memory, live in the footer","ch":[],"b":718,"lines":13,"c":"The Mac's memory, live in the footer: \"● Mac 14.6/16 GB\", the dot in Activity Monitor's pressure colours. Units are Activity Monitor's (GB = 2^30 bytes), so a 16 GB Mac says 16. (A panel beside the welcome box, drawn once as the window opened, was taken out on 28 Sep: it went stale.)"},{"id":"terminal/src/app/help.mjs","n":"help.mjs","k":"f","p":"t","git":1,"w":"everything /help shows (also the hub’s Help tab and `coding --help`)","ch":[],"b":15304,"lines":178,"c":"Everything /help shows, in one place: the terminal's /help panel, the Help tab of the hub (help.html reads it as /help.json) and `coding --help` all come from these lists, so they never disagree. Plain data, no screen code."},{"id":"terminal/src/app/gguf-edit.mjs","n":"gguf-edit.mjs","k":"f","p":"t","git":1,"w":"writes weight edits into a copy of the model file, never the original","ch":[],"b":10571,"lines":148,"c":"Writing weight edits into a COPY of the model file (never the original). This is the save-and-restart route's writer: it clones the model (free on APFS), changes whole rows in the copy, checks every changed byte, and only then puts the copy in place. The file format is decoded by the same Core the Weights tab uses (the \u003cscript id=\"core\"> in weights.html), so the writer and the viewer can never disagree about where a…"},{"id":"terminal/src/app/weights.mjs","n":"weights.mjs","k":"f","p":"t","git":1,"w":"the hub: one small local server behind /weights, /docs, /tests, /memory","ch":[],"b":17344,"lines":215,"c":"The Agentic Coder hub: `/weights`, `/docs`, `coding weights` and `coding docs` all start this one small local server (127.0.0.1 only). It hands out / the hub page (hub.html, built in): tabs Weights · Harness · Structure (its two pages: Structure and Flow) · Arena · Memory · Instructions · All docs · Help /weights the weights viewer (weights.html, built in): every model in /model, one alone or side by side…"},{"id":"terminal/src/app/hub.html","n":"hub.html","k":"f","p":"t","git":1,"w":"the hub page: Weights · Harness · Structure · Flow · Tests · Memory · All docs · Help","ch":[],"b":23899},{"id":"terminal/src/app/weights.html","n":"weights.html","k":"f","p":"t","git":1,"w":"the Weights tab: look inside the model file, edit a copy","ch":[],"b":168704},{"id":"terminal/src/app/flow.html","n":"flow.html","k":"f","p":"t","git":1,"w":"the Flow tab: how it works as a diagram (drawn by scripts/flow-page.mjs)","ch":[],"b":11383},{"id":"terminal/src/app/tests.html","n":"tests.html","k":"f","p":"t","git":1,"w":"the Tests tab: every test run and its result","ch":[],"b":51929},{"id":"terminal/src/app/memory.html","n":"memory.html","k":"f","p":"t","git":1,"w":"the Memory tab","ch":[],"b":26887},{"id":"terminal/src/app/help.html","n":"help.html","k":"f","p":"t","git":1,"w":"the Help tab","ch":[],"b":11567},{"id":"terminal/src/app/favicon.mjs","n":"favicon.mjs","k":"f","p":"t","git":1,"w":"the hub’s tab icon: the Visor bot","ch":[],"b":2778,"lines":52,"c":"The hub's tab icon (1 Oct 2026): the Visor bot, ready, as a 48 × 48 PNG. Without one, every page the hub served (the design pages, All docs, each tab) asked for /favicon.ico, got a 404, and the browser logged an error. Drawn from the start page's own pixels, so it is the bot in the terminal."},{"id":"terminal/src/app/prompt-files-hub.mjs","n":"prompt-files-hub.mjs","k":"f","p":"t","git":1,"w":"the hub’s Prompt files: read and save AGENTS.md, TOOLS.md and SKILLS.md","ch":[],"b":9927,"lines":181,"c":"The hub's Prompt files (Instructions → 06 AGENTS.md · 07 TOOLS.md · 08 SKILLS.md, 30 Sep 2026): read and save the three files the model is given. AGENTS.md the chosen folder's own rules file (the page's Folder menu) TOOLS.md terminal/rules/TOOLS.md: the \"Tool use\" part of the instructions SKILLS.md terminal/rules/SKILLS.md: steps a request's words bring A save never overwrites a newer change made elsewhere (another…"},{"id":"terminal/src/app/start-times.mjs","n":"start-times.mjs","k":"f","p":"t","git":1,"w":"how long the model takes to start here, for the start page’s time left","ch":[],"b":2824,"lines":50,"c":"How long the model takes to start on this Mac, kept to say how long the next start will take (the start page's \"about 12 s left\", 1 Oct 2026). A start has two timed parts: loading the model (only when a new server starts, not when one is already loaded), then reading its instructions (the first time) or restoring them from disk (later starts). The last five of each part are kept per model, with the kind the last…"},{"id":"terminal/src/app/web-form.mjs","n":"web-form.mjs","k":"f","p":"t","git":1,"w":"/web: what the model may do on the web, and the search service’s key","ch":[],"b":6660,"lines":111,"c":"/web: one form, like /remote's, for what the model may do on the web. Rows: Search (Off · Brave Search · Tavily), API key (the search service's, kept in the Keychain), Read pages (On · Off), then Test and Save. Editing a text row works as in /remote (remote-form.mjs: startEdit, editField, pasteField, commitEdit). On the Claude API neither setting is used: Claude searches and reads with Anthropic's own web tools…"}],"s":"the screen, keys, the hub","m":"App.jsx starts the model, runs the agent and draws the screen (Ink). The nine .html files are the hub’s pages; weights.mjs serves them on 127.0.0.1 (port 8757 when free) for `/weights`, `/docs` and `coding docs`.","keys":["App.jsx","commands","weights","store","hub.html"],"files":49,"lines":9826,"b":1058828},{"id":"terminal/src/flows","n":"flows/","k":"d","p":"t","git":1,"w":"the focused paths a request can take","ch":[{"id":"terminal/src/flows/index.mjs","n":"index.mjs","k":"f","p":"t","git":1,"w":"sorts a request into a type and runs the path built for it","ch":[],"b":16165,"lines":223,"c":"Sorting a request into a type and running the path built for it: rename → the built-in rename (no model) fix → tries against the failing tests change → test first, then tries question / other → the step-by-step tool loop"},{"id":"terminal/src/flows/sort.mjs","n":"sort.mjs","k":"f","p":"t","git":1,"w":"step 2: greeting, memory, follow-up, then rules, then the model","ch":[],"b":1531,"lines":24,"c":"Step 2 in one place, in the order the agent takes it (agent.mjs send): a greeting, \"update memory\", a line that continues the last turn, the question first, then the kind. Words only: no files are read and no model is called, so it says where a request goes and whether the model is asked before work starts. The sort test runs every real request through it."},{"id":"terminal/src/flows/words.mjs","n":"words.mjs","k":"f","p":"t","git":1,"w":"word rules for sorting that need no model","ch":[],"b":5897,"lines":71,"c":"Word rules for sorting a request that need nothing but the words themselves (no files, no model). Measured on 81 real requests (2026-09-27): the rules before these left thanks and offers of work unseen, sorted a short line that continues the conversation on its own, and asked the model to sort plain commands. index.mjs and clarify.mjs use these; sort.mjs puts them in order."},{"id":"terminal/src/flows/explain.mjs","n":"explain.mjs","k":"f","p":"t","git":1,"w":"\"explain this code\": reads the code first, no search","ch":[],"b":7828,"lines":128,"c":"\"Explain this code\": a question gets the code it is about read before the model's first step, with no model call and no search: files it names read whole, or (long) their parts and the lines that match the question (agent.mjs, prefetch) names it uses `paginate()`, fitContext, \"the test command\" for testCommand: the part of the file that defines each, found in the project map a very small project all of its code…"},{"id":"terminal/src/flows/fix.mjs","n":"fix.mjs","k":"f","p":"t","git":1,"w":"fix: run the tests, find the code, try versions in a scratch copy, show the diff","ch":[],"b":18897,"lines":245,"c":"Fix: run the tests, find the code the failure points at, try corrected versions in the scratch copy until the tests pass, then show the diff."},{"id":"terminal/src/flows/change.mjs","n":"change.mjs","k":"f","p":"t","git":1,"w":"add or change code, test first","ch":[],"b":19160,"lines":270,"c":"Add or change code, test first: find the file, have the model write a test that defines \"done\" (it must fail on today's code), let you approve it, then try versions in the scratch copy until every test passes. A project without tests gets a throwaway check instead, kept out of your project."},{"id":"terminal/src/flows/multi.mjs","n":"multi.mjs","k":"f","p":"t","git":1,"w":"change several files at once","ch":[],"b":15595,"lines":224,"c":"Changing several files at once (an option used in three files, a new argument and its callers): the files are planned, a test that defines \"done\" is written and approved (src/flows/testfirst.mjs), then drafts and tries describe their changes as edit blocks (src/flows/blocks.mjs) across all the files in the scratch copy. Whole files are never rewritten."},{"id":"terminal/src/flows/rename.mjs","n":"rename.mjs","k":"f","p":"t","git":1,"w":"rename everywhere as one diff, with no model","ch":[],"b":8149,"lines":181,"c":"Built-in rename: every use of a name in the project's code, shown as one diff and applied in one go. No model needed. Only code changes: a word inside quotes or a comment is text, not the name (\"rename test to check\" once turned 'node:test' into 'node:check'). A name imported from a package keeps its real name and gets an alias (import { test as check } from 'node:test'). Text files (README, JSON, …) are left alone.…"},{"id":"terminal/src/flows/clarify.mjs","n":"clarify.mjs","k":"f","p":"t","git":1,"w":"asks before starting when a request is vague","ch":[],"b":7657,"lines":120,"c":"Asking before starting. A vague request (\"api\", \"fix the bug\" when nothing fails, \"make it faster\") used to send the model wandering for minutes; now it asks you one question first, and the answer travels with the request. - \"fix the bug / the test / it\" with passing tests (or no tests): a fixed question, no model needed. With failing tests the fix path is the answer. - one to four words that name no file or code…"},{"id":"terminal/src/flows/localize.mjs","n":"localize.mjs","k":"f","p":"t","git":1,"w":"finds the code a request is about","ch":[],"b":8337,"lines":152,"c":"Finding the code a request is about: files named in it, files a failing test run points at (stack frames, the failing tests' imports), and, when neither says, the model choosing from the project's own file list."},{"id":"terminal/src/flows/excerpts.mjs","n":"excerpts.mjs","k":"f","p":"t","git":1,"w":"the parts of a big file that a fix needs","ch":[],"b":4769,"lines":97,"c":"The parts of a file a fix needs, when the whole file cannot be shown: a page or stylesheet (no functions to pick), or code too big to read whole. The model names a few exact strings to look for (a selector, an id, a name); the lines that hold them, with a little around each, are shown, and the fix comes back as edit blocks against those lines."},{"id":"terminal/src/flows/units.mjs","n":"units.mjs","k":"f","p":"t","git":1,"w":"the piece of a file that a try rewrites","ch":[],"b":3731,"lines":75,"c":"The piece of a file a try rewrites. Small files are rewritten whole; in a bigger file, one function (JavaScript or Python) is cut out, rewritten and put back. Bonsai 2 27B writes about 10 tokens a second, so rewriting a whole 150-line file took ~4 minutes a try; one function takes under one."},{"id":"terminal/src/flows/blocks.mjs","n":"blocks.mjs","k":"f","p":"t","git":1,"w":"edit blocks: describe changes to several places without rewriting files","ch":[],"b":4728,"lines":85,"c":"Edit blocks: how a try describes changes to several files, or several places in one file, without rewriting whole files (writing is the slow part: about 10 tokens a second). The model copies the old lines and writes the new ones; the blocks are matched the way the Edit tool matches (exact, then forgiving of indentation and one-character slips)."},{"id":"terminal/src/flows/tries.mjs","n":"tries.mjs","k":"f","p":"t","git":1,"w":"tries until one passes","ch":[],"b":4594,"lines":74,"c":"Tries until one passes: ask the model for a new version, put it in the scratch copy, check it, keep the first that passes (at most `max`). The screen shows each try as it happens: ✗ ✗ ✓."},{"id":"terminal/src/flows/scratch.mjs","n":"scratch.mjs","k":"f","p":"t","git":1,"w":"a scratch copy of the project where tries are tested","ch":[],"b":5546,"lines":99,"c":"A scratch copy of the project where tries are written and tested, so your real files change only after you approve. Uses APFS clones (instant, no extra disk); heavy folders such as node_modules are linked, not copied. .git is not copied: the copy gets a small git of its own that reads your project's history, so tests that ask git which files are tracked or ignored work as they do in your project, and a test that…"},{"id":"terminal/src/flows/apply.mjs","n":"apply.mjs","k":"f","p":"t","git":1,"w":"applies a finished change to your real files after you approve it","ch":[],"b":2693,"lines":47,"c":"Applying a finished change to your real files: show the diff and ask (as in the tool loop: yes / yes for this session / no), unless edits are on auto-accept. A protected file (.env, .git/…, yours from /permissions) asks even then, with no \"allow all edits\"."},{"id":"terminal/src/flows/testfirst.mjs","n":"testfirst.mjs","k":"f","p":"t","git":1,"w":"the test that defines \"done\", shared by change and multi","ch":[],"b":5647,"lines":70,"c":"The test that defines \"done\", shared by the change path (one file) and the multi-file path: the model writes candidate tests; each must fail on today's code for the right reason (the behaviour is missing), not because the test itself is broken."},{"id":"terminal/src/flows/testfile.mjs","n":"testfile.mjs","k":"f","p":"t","git":1,"w":"adds a model-written test to a test file","ch":[],"b":3974,"lines":80,"c":"Adding a model-written test to a test file: its import lines are merged with the file's own, the rest goes at the end."},{"id":"terminal/src/flows/results.mjs","n":"results.mjs","k":"f","p":"t","git":1,"w":"reads test-runner output (node:test, Jest, Vitest, Mocha, pytest, unittest)","ch":[],"b":2331,"lines":34,"c":"Reads test-runner output: how many passed and failed, and which failed. Knows node:test, Jest, Vitest, Mocha, pytest and unittest; otherwise the exit code decides."},{"id":"terminal/src/flows/rescue.mjs","n":"rescue.mjs","k":"f","p":"t","git":1,"w":"when only old tests fail because the new behaviour differs","ch":[],"b":6378,"lines":93,"c":"When every try fails only because EXISTING tests expect the old behaviour (a new field changes an expected value — task 28's class), the flows used to give up to the slower step-by-step way, whose edits may touch tests. Now one more round does it here: the model updates only the stale expected values, in test files only. Guards: the approved new test must survive, no test may disappear (test counts may not drop)…"},{"id":"terminal/src/flows/pagecheck.mjs","n":"pagecheck.mjs","k":"f","p":"t","git":1,"w":"checks first for page bugs the tests cannot see, such as something covered","ch":[],"b":24570,"lines":375,"c":"Check first, for a bug the test suite cannot see on a page (a layout bug: something covered, behind, underneath). Before any fix, Agentic Coder opens the page in the browser the project already has (Playwright), does what the request describes, finds what covers what and why, and writes a small check that fails today. The fix is then tried against that check, and the check stays in the project so the bug cannot come…"},{"id":"terminal/src/flows/pagescripts.mjs","n":"pagescripts.mjs","k":"f","p":"t","git":1,"w":"the two scripts the page check runs","ch":[],"b":22190,"lines":416,"c":"The two scripts the page check runs with node (src/flows/pagecheck.mjs): the probe looks at a page for Agentic Coder (what can be clicked, what covers what, and why); it lives in the scratch copy only the check the small script left in your project: exit 0 = pass, 1 = the bug shows, 2 = the check could not run Both open the page the same way and use the browser the project already has (Playwright). They are kept as…"},{"id":"terminal/src/flows/llm.mjs","n":"llm.mjs","k":"f","p":"t","git":1,"w":"one focused model call: short prompt, no tools, optional JSON shape","ch":[],"b":8159,"lines":125,"c":"One focused model call: a short system prompt, one user message, no tools. Optionally forced into a JSON shape (the server constrains the output). thinking: think first, at the chat's level (Medium/High); used for writing code and tests. Sorting and choosing (JSON answers) never think."},{"id":"terminal/src/flows/layoutcheck.mjs","n":"layoutcheck.mjs","k":"f","p":"t","git":1,"w":"after a page is made or changed, opens it in a real browser and measures it","ch":[],"b":30579,"lines":452,"c":"The layout check: after a request that made or changed a page, the page is opened in a real browser (headless Chrome: the Mac's own, or the one Playwright keeps in its cache; nothing is installed) and measured, because a small model cannot see what it built. What it looks for is breakage anyone would call a bug, never taste: sideways the page scrolls sideways (or text is cut at the right edge), at 1440×900 and on a…"}],"s":"the paths a request can take","m":"sort.mjs decides where a request goes: rules first, and the model only if no rule fits. Rename needs no model; fix and change try new versions in a scratch copy and show a diff. Anything a path cannot finish falls back to the loop in agent/.","keys":["sort","fix","change","multi","rename"],"files":24,"lines":3760,"b":239105},{"id":"terminal/src/tools","n":"tools/","k":"d","p":"t","git":1,"w":"what the model can touch","ch":[{"id":"terminal/src/tools/read.mjs","n":"read.mjs","k":"f","p":"t","git":1,"w":"Read: a file’s text with line numbers","ch":[],"b":536,"lines":11,"c":"Read tool: returns a file's text with line numbers, the way the model sees it."},{"id":"terminal/src/tools/edit.mjs","n":"edit.mjs","k":"f","p":"t","git":1,"w":"Edit: exact find-and-replace; the text must appear exactly once","ch":[],"b":4064,"lines":80,"c":"Edit tool: exact find-and-replace. The text to find must appear exactly once, so a small model can never change the wrong spot. planEdit() makes the diff for the permission prompt; applyEdit() writes it."},{"id":"terminal/src/tools/run.mjs","n":"run.mjs","k":"f","p":"t","git":1,"w":"Run: one shell command in the project, output capped, inside the fence","ch":[],"b":3028,"lines":61,"c":"Run tool: one shell command in the project folder, output capped so it cannot flood a small context window. Commands run inside the macOS sandbox (sandbox.mjs): they cannot read your home folder or write outside `cwd`. Pass sandbox: false for a command you typed yourself (! in the app), or sandbox: { readOnly: [...] } for more folders it may read."},{"id":"terminal/src/tools/sandbox.mjs","n":"sandbox.mjs","k":"f","p":"t","git":1,"w":"the folder fence for commands, enforced by macOS itself","ch":[],"b":7003,"lines":118,"c":"The folder fence for commands, enforced by macOS itself (sandbox-exec): however a command is spelled, it cannot read your home folder or write outside the project. Checking the words of a command (permissions.mjs) catches the plain cases with a clear message; this catches the rest (\"$HOME\"/Desktop, ~user, $(dirname $PWD), a script that lists ~). Inside the home folder a command may read the project, the tool folders…"},{"id":"terminal/src/tools/fs.mjs","n":"fs.mjs","k":"f","p":"t","git":1,"w":"List and Search: walk the project (git grep inside a git repo)","ch":[],"b":5303,"lines":120,"c":"List and Search: walk the project folder without node_modules, .git and other bulky folders; git grep when the folder is a git repo (much faster)."},{"id":"terminal/src/tools/outline.mjs","n":"outline.mjs","k":"f","p":"t","git":1,"w":"a long file’s parts with their line ranges","ch":[],"b":4946,"lines":85,"c":"A long file's parts with their line ranges, so the model reads only the part it needs instead of the whole file (reading is the slow part: ~60 tokens a second, so a 600-line file costs ~2½ minutes every time). JavaScript/TypeScript: functions, classes and their methods, const arrow functions, exported values. Python: def and class. Anything else: blocks of 60 lines."},{"id":"terminal/src/tools/repomap.mjs","n":"repomap.mjs","k":"f","p":"t","git":1,"w":"a short map of the project for the model","ch":[],"b":7788,"lines":151,"c":"A short map of the project for the model: each code file with its line count and top-level names (\"src/tools/fs.mjs (109): walk, listFiles, …\"). Cached per project under ~/.agentic-coder/maps, keyed by each file's size and time, so a big folder costs nothing after the first look. Used when choosing which file a task is about, when deciding whether a request is clear, and as the first thing the step-by-step loop sees…"},{"id":"terminal/src/tools/codeindex.mjs","n":"codeindex.mjs","k":"f","p":"t","git":1,"w":"code found by meaning, using the small bge-m3 model","ch":[],"b":13354,"lines":263,"c":"Code found by meaning: each code file's parts (its functions and classes, from outline.mjs) are turned into numbers by the small model the memory uses (bge-m3), so the parts closest to a request can come along with it and the model reads them instead of searching for them (agent/helpers.mjs). Also ranks the files a focused path chooses from (flows/localize.mjs). Built in the background, never waited for: bge-m3…"},{"id":"terminal/src/tools/web.mjs","n":"web.mjs","k":"f","p":"t","git":1,"w":"WebFetch and WebSearch: a page read as text, a search through Brave or Tavily","ch":[],"b":12662,"lines":190,"c":"The web, for the WebFetch and WebSearch tools (agent/tools.mjs). fetchPage: a page read as text: its words, headings, lists, tables and links; no scripts, styling or menus. A PDF comes back as its text, a picture as a picture. A redirect is followed on the same site only: to another site it says where, so the site you allowed is the one read. searchWeb: a search through a search service with your API key (/web)…"},{"id":"terminal/src/tools/media.mjs","n":"media.mjs","k":"f","p":"t","git":1,"w":"pictures and PDFs, through the media helper built on first use","ch":[],"b":5479,"lines":110,"c":"Pictures and PDFs, with what macOS already has: media-tool.swift, built on first use with the Mac's own Swift compiler (Apple's command line tools, which the installer asks for) and kept in ~/.agentic-coder/tools under the source's hash, so a changed source is built again. No package, nothing downloaded."},{"id":"terminal/src/tools/media-tool.swift","n":"media-tool.swift","k":"f","p":"t","git":1,"w":"the media helper: PDFs, pictures and the clipboard with macOS’s own parts","ch":[],"b":6443}],"s":"what the model can touch","m":"Read, Edit and Run are the model’s hands. run.mjs runs commands inside a macOS sandbox fence, so they cannot read your home folder. repomap, outline and codeindex give the model maps of a project instead of making it search.","keys":["read","edit","run","fs","sandbox"],"files":11,"lines":1189,"b":70606},{"id":"terminal/src/ui","n":"ui/","k":"d","p":"t","git":1,"w":"the screen’s building blocks","ch":[{"id":"terminal/src/ui/theme.mjs","n":"theme.mjs","k":"f","p":"t","git":1,"w":"the 256-colour palette and the spinner looks","ch":[],"b":2700,"lines":52,"c":"256-colour palette: Apple Terminal on macOS 15 has no true colour, so every colour here is an exact xterm-256 entry and looks the same everywhere."},{"id":"terminal/src/ui/parts.jsx","n":"parts.jsx","k":"f","p":"t","git":1,"w":"shared screen parts: rows, tool lines, diffs, the input box","ch":[],"b":7505,"lines":205,"c":"Building blocks shared by the three designs, in Claude Code's visual language."},{"id":"terminal/src/ui/designs.jsx","n":"designs.jsx","k":"f","p":"t","git":1,"w":"the three terminal designs (previews only)","ch":[],"b":14108,"lines":257,"c":"The three terminal designs. Each is a pure view of stateAt(session, t): finished transcript lines go in \u003cStatic> (printed once, so your terminal's own scrollback keeps working), the live area is redrawn below them."},{"id":"terminal/src/ui/state.mjs","n":"state.mjs","k":"f","p":"t","git":1,"w":"what the screen shows at a moment of a recorded session (previews only)","ch":[],"b":4614,"lines":102,"c":"What the screen should show at time t (seconds) of a recorded session. Pure: the live runner and the preview builder both call it."}],"s":"colours, rows, diffs","m":"theme.mjs and parts.jsx are used by the live screen; designs.jsx and state.mjs feed only the design previews in scripts/demo/.","keys":["theme","parts.jsx"],"files":4,"lines":616,"b":28927},{"id":"terminal/src/morning","n":"morning/","k":"d","p":"t","git":1,"w":"the morning brief","ch":[{"id":"terminal/src/morning/index.mjs","n":"index.mjs","k":"f","p":"t","git":1,"w":"the brief, start to finish","ch":[],"b":3139,"lines":50,"c":"The morning brief, start to finish: read the repos, pick what earns a line, have the model write the words (checked against the facts), draw the page with every saved day, and open it. /morning in the app and `coding morning` in a shell both land here; Claude's /repo-morning uses the same pieces through cli.mjs."},{"id":"terminal/src/morning/gather.mjs","n":"gather.mjs","k":"f","p":"t","git":1,"w":"reads the repos, their worktrees, the day’s commits, CI and pull requests","ch":[],"b":14182,"lines":269,"c":"The facts for the morning brief: every project repo under the scan folders, its worktrees, the day's commits, CI on the default branch, open pull requests and issues, what is live, and a repo's own test record. Nothing here writes to a repo except `git fetch` (fetch: false skips it). The GitHub token comes from git's credential helper, stays in memory and is never written anywhere."},{"id":"terminal/src/morning/sort.mjs","n":"sort.mjs","k":"f","p":"t","git":1,"w":"which facts earn a line: needs attention, or resolved","ch":[],"b":5645,"lines":79,"c":"Which facts earn a line on the brief, in plain words. Needs attention: it would cost something to leave until tomorrow. Resolved: it closed in the last day and a half. Everything else is dropped. Each item names its source once, as [[the phrase]] that becomes its link. These plain words are what the page shows when the model's words are not used."},{"id":"terminal/src/morning/words.mjs","n":"words.mjs","k":"f","p":"t","git":1,"w":"the model writes the headline and a sentence for each part of the day","ch":[],"b":9409,"lines":146,"c":"The brief's words: the headline, one sentence for each part of the day, and each picked item said in plain speech. The model writes them in one call, forced into a JSON shape; then every time and number it wrote is checked against the facts it was given, and anything that does not hold (a time that is not in the facts, a lost link phrase, a word the brief never uses) is swapped for the plain wording from code. No…"},{"id":"terminal/src/morning/render.mjs","n":"render.mjs","k":"f","p":"t","git":1,"w":"draws the page: the day’s commits as terrain, three short acts","ch":[],"b":20365,"lines":325,"c":"The morning brief page. One day = the day's commits drawn as terrain, three short acts, then Needs attention and Resolved. The page holds every saved day: it opens on the newest, and the calendar in the top-left corner goes back to any earlier morning. The drawing comes from the facts only, never from the words. Everything gathered is escaped; links must be https."},{"id":"terminal/src/morning/day.mjs","n":"day.mjs","k":"f","p":"t","git":1,"w":"the brief’s day, in its own time zone","ch":[],"b":3169,"lines":65,"c":"The brief's day in its own time zone: its name, its key (YYYY-MM-DD), where a moment falls in it, and how a time reads (\"7:10 PM\", or \"7:10 PM Friday\" when it is not on the brief's day)."},{"id":"terminal/src/morning/config.mjs","n":"config.mjs","k":"f","p":"t","git":1,"w":"the settings; yours live on this Mac","ch":[],"b":1717,"lines":38,"c":"The morning brief's settings. The defaults are here; your own name, emails, deploy check and test records live on the Mac in ~/.repo-morning/config.json (REPO_MORNING_CONFIG points elsewhere), and win over these."},{"id":"terminal/src/morning/cli.mjs","n":"cli.mjs","k":"f","p":"t","git":1,"w":"the brief’s pieces from a shell","ch":[],"b":2458,"lines":39,"c":"The morning brief's pieces from a shell, for Claude's /repo-morning and for checks by hand (`coding morning` is the whole run with the model): bun cli.mjs gather [--day auto|today|yesterday|YYYY-MM-DD] [--no-fetch] [--out facts.json] bun cli.mjs picks --facts facts.json # what earns a line, in plain words bun cli.mjs render --facts facts.json [--words words.json] [--out page.html] [--no-save] bun cli.mjs render…"},{"id":"terminal/src/morning/fraunces-600.woff2.b64.txt","n":"fraunces-600.woff2.b64.txt","k":"f","p":"t","git":1,"w":"the heading font, embedded in the page","ch":[],"b":24128},{"id":"terminal/src/morning/Fraunces-OFL.txt","n":"Fraunces-OFL.txt","k":"f","p":"t","git":1,"w":"that font’s licence","ch":[],"b":4483}],"s":"the morning brief","m":"`coding morning` reads your project repos, picks what deserves a line, has the model write the words (checked against the facts) and draws one HTML page.","keys":["index","gather","render"],"files":10,"lines":1011,"b":88695}],"s":"the program","m":"`bun build` turns cli.jsx and everything it imports into the one-file app that `coding` runs.","files":128,"lines":25067,"b":2043439},{"id":"terminal/test","n":"test/","k":"d","p":"t","git":1,"w":"the terminal’s tests","ch":[{"id":"terminal/test/app-setup.mjs","n":"app-setup.mjs","k":"f","p":"t","git":1,"w":"what the end-to-end app tests share: a throwaway demo project and the quit keys","ch":[],"b":1484,"lines":27,"c":"What the end-to-end app tests share (app.test.mjs, app-*.test.mjs): a throwaway copy of the demo project with its own home folder, and the keys that quit."},{"id":"terminal/test/pty.mjs","n":"pty.mjs","k":"f","p":"t","git":1,"w":"runs the real app in a pseudo-terminal, types keys, reads the screen back","ch":[],"b":6549,"lines":102,"c":"Runs the real Agentic Coder app in a pseudo-terminal, types keys into it, and reads the screen back through a headless terminal emulator — the way you would see it in Terminal."},{"id":"terminal/test/pty-shim.py","n":"pty-shim.py","k":"f","p":"t","git":1,"w":"a resizable pseudo-terminal for the screen tests","ch":[],"b":2313,"lines":68,"c":"A resizable pseudo-terminal for the screen tests: runs a command in a pty, copies its output to stdout, and takes orders on stdin: W \u003clen>\\n\u003cbytes> type these bytes R \u003ccols> \u003crows>\\n resize (after passing on everything printed so far, then a marker, so a replay resizes at the same point)"},{"id":"terminal/test/term.mjs","n":"term.mjs","k":"f","p":"t","git":1,"w":"a resizable terminal window for the screen tests","ch":[],"b":4855,"lines":91,"c":"A terminal window for the screen tests that can be resized while the app runs: the app runs in a real pty (test/pty-shim.py), and its output feeds a headless terminal that is resized at exactly the same point, reflowing what is already on screen the way Terminal does."},{"id":"terminal/test/term-html.mjs","n":"term-html.mjs","k":"f","p":"t","git":1,"w":"turns a terminal screen into HTML with the exact colours","ch":[],"b":3088,"lines":59,"c":"Turns a headless-terminal screen into HTML with the exact cell colours, so a report can show what the app really drew (Apple Terminal \"Basic\" dark)."},{"id":"terminal/test/screen-checks.mjs","n":"screen-checks.mjs","k":"f","p":"t","git":1,"w":"what \"looks right\" means for one screen, as checks","ch":[],"b":2670,"lines":38,"c":"What \"looks right\" means for one screen, as checks a test can run: nothing wider than the window, no leftover copies of the live area, box borders whole, the prompt box on the last lines when Agentic Coder is idle."},{"id":"terminal/test/fake-server.mjs","n":"fake-server.mjs","k":"f","p":"t","git":1,"w":"a stand-in for llama-server that replays scripted replies","ch":[],"b":4615,"lines":58,"c":"A stand-in for llama-server that replays scripted replies over the same streaming API, so the agent and the terminal app can be tested without the real model. Each reply: { reasoning?, text?, tool?: { name, args }, tools?: [{ name, args }, …] }. route(request) may answer a request out of turn (the memory's save, which comes whenever the app finds a pause): its reply is sent and the scripted ones stay in line. key…"},{"id":"terminal/test/fake-llama-server.mjs","n":"fake-llama-server.mjs","k":"f","p":"t","git":1,"w":"a stand-in for the llama-server program, to test start-up","ch":[],"b":4597,"lines":53,"c":"A stand-in for Prism's llama-server binary, for testing Agentic Coder's own ls it runs and tests. The terminal (part 1) imports only this file. What it gets: - the registry: every model's settings (one folder each), where the files live on this Mac, and how to ask a model to think; - the runtime: starting and sharing llama-server, choosing a context size that fits the Mac's memory, the saved warm-up, and coding setup; - the embedder: the small model that…"},{"id":"models/registry.mjs","n":"registry.mjs","k":"f","p":"m","git":1,"w":"the list of models, where their files live, and the engines","ch":[],"s":"the model list, where files live","b":6523,"lines":106,"c":"The models Agentic Coder can run (one folder each), and where their files live on this Mac (~/.agentic-coder)."},{"id":"models/README.md","n":"README.md","k":"f","p":"m","git":1,"w":"the models part in a page: the models, adding one, the bench","ch":[],"b":10438},{"id":"models/runtime","n":"runtime/","k":"d","p":"m","git":1,"w":"what runs a model: server, memory fit, warm-up, setup","ch":[{"id":"models/runtime/server.mjs","n":"server.mjs","k":"f","p":"m","git":1,"w":"starts, shares and stops llama-server","ch":[],"b":19687,"lines":343,"c":"Starts and looks after llama-server for one model (on the model's engine): picks a free port, waits until it is healthy, restarts it once if it crashes, and stops it when Agentic Coder exits."},{"id":"models/runtime/memory.mjs","n":"memory.mjs","k":"f","p":"m","git":1,"w":"how much memory the Mac can give, and which context size fits","ch":[],"b":9836,"lines":158,"c":"How much memory the Mac can give the model right now, and which context size fits: 32k by default, 16k when memory is short (and we say why)."},{"id":"models/runtime/warmup.mjs","n":"warmup.mjs","k":"f","p":"m","git":1,"w":"saves the model’s read-in instructions so the next start is fast","ch":[],"b":6633,"lines":115,"c":"Warming up the model before the first message. The model has to read its instructions and the tool list (~1,500 tokens, ~26 s on the 27B) before it can answer. That part is the same in every project and on every day (the caller's system prompt puts this session's details last, after sessionMark), so after the first read the server saves its state to disk and later starts restore it in a fraction of a second. Then…"},{"id":"models/runtime/rerank.mjs","n":"rerank.mjs","k":"f","p":"m","git":1,"w":"the reranker: a small model that puts the best search finds first","ch":[],"b":3944,"lines":76,"c":"The reranker: a small model that reads a request together with each piece the search found and says how well each answers it (models/qwen3-reranker-0.6b). It runs in the same llama-server as the other models, in its reranking mode, as a server of its own: started at its first use, shared between windows and kept loaded like the embedder (embed.mjs). /effort's Reranker row turns it on; off, nothing here runs."},{"id":"models/runtime/remote.mjs","n":"remote.mjs","k":"f","p":"m","git":1,"w":"a model on another machine: its address, its key, the SSH tunnel, a check that it answers","ch":[],"b":24310,"lines":397,"c":"A model on another machine (/remote): its address, its API key, the SSH tunnel when it is reached that way, and a check that it answers. The terminal keeps the remote in use in settings.json (\"remote\"), one saved set-up per service (\"remotes\": claude, machine, openai), and each one's key in the macOS Keychain under its own name (keyIdOf); every call to a model server asks endpointOf(url) for the key and the kind of…"},{"id":"models/runtime/serve.mjs","n":"serve.mjs","k":"f","p":"m","git":1,"w":"`coding serve`: this Mac’s model for another machine’s /remote, behind a key","ch":[],"b":5597,"lines":95,"c":"`coding serve`: this machine's model for another machine's /remote. It starts llama-server open to the network (or to this machine only, for an SSH tunnel: --local) behind an API key, and prints what to type into /remote over there. It runs until ctrl+c; the model stops with it."},{"id":"models/runtime/setup.mjs","n":"setup.mjs","k":"f","p":"m","git":1,"w":"`coding setup`: builds the engine, downloads the models, checks them","ch":[],"b":4348,"lines":83,"c":"`coding setup`: gets what Agentic Coder needs into ~/.agentic-coder — the model server (llama.cpp built from source on the model's engine, see models/runtime/engine), the model, its guessing helper and the memory's matcher — and checks the files' SHA-256. Safe to run again: finished parts are skipped."},{"id":"models/runtime/embed.mjs","n":"embed.mjs","k":"f","p":"m","git":1,"w":"runs the meaning-matcher (bge-m3) beside the main model","ch":[],"b":3213,"lines":71,"c":"The embedder: a small model that turns texts into numbers, so that meanings can be compared (models/bge-m3). It runs in the same llama-server as the 27B, in its embedding mode, as a server of its own: started at the first use, shared between windows and kept loaded like the 27B's (server.mjs)."},{"id":"models/runtime/edited.mjs","n":"edited.mjs","k":"f","p":"m","git":1,"w":"the one edited copy of a model, made from the Weights tab","ch":[],"b":3970,"lines":87,"c":"The edited copy of a model: ONE slot per model, next to the original in ~/.agentic-coder/models, described by edited-\u003cmodel>.json there. Each save rebuilds the copy from a fresh clone of the original plus the full edit list, so the manifest always says exactly what is in the file. The original and `coding setup`'s fingerprint check are never involved."},{"id":"models/runtime/claude.mjs","n":"claude.mjs","k":"f","p":"m","git":1,"w":"the Claude API as a /remote: the client, its models, the connect check","ch":[],"b":7556,"lines":121,"c":"The Claude API as a /remote (Run on: Claude API): Anthropic's Messages API through its official SDK (@anthropic-ai/sdk), loaded only when a Claude remote is used. Here: the client, what each model takes, and the check the form's Connect and connecting run. The chat itself is terminal/src/agent/claude.mjs."},{"id":"models/runtime/engine","n":"engine/","k":"d","p":"m","git":1,"w":"how llama.cpp is built","ch":[{"id":"models/runtime/engine/build.mjs","n":"build.mjs","k":"f","p":"m","git":1,"w":"builds a llama-server: the official one, or Prism’s plus our patch","ch":[],"b":3335,"lines":62,"c":"Builds a model server Agentic Coder runs (ENGINES in models/registry.mjs): the official llama.cpp, or Prism ML's (branch prism) plus our Metal patch, at the engine's commit, as static llama-server and llama-bench in ~/.agentic-coder/engine/\u003ctag>/. Needs git, cmake and Apple's command line tools; about 3 minutes on the M4. `coding setup` calls it; by hand: node models/runtime/engine/build-now.mjs [official|prism]…"},{"id":"models/runtime/engine/build-now.mjs","n":"build-now.mjs","k":"f","p":"m","git":1,"w":"the same, started by hand","ch":[],"b":555,"lines":9,"c":"Builds an engine by hand (coding setup does the same when it is missing): node models/runtime/engine/build-now.mjs [official|prism] With no name: the default model's engine."},{"id":"models/runtime/engine/patch.mjs","n":"patch.mjs","k":"f","p":"m","git":1,"w":"our Metal patch as text, so the one-file app carries it","ch":[],"b":9876,"lines":206,"c":"The Metal patch as text, so the one-file `agentic-coder` binary carries it: the same bytes as pq2-multicol.patch (a test checks). Made by make-patch.mjs; do not edit by hand."},{"id":"models/runtime/engine/pq2-multicol.patch","n":"pq2-multicol.patch","k":"f","p":"m","git":1,"w":"the patch itself","ch":[],"b":9670},{"id":"models/runtime/engine/make-patch.mjs","n":"make-patch.mjs","k":"f","p":"m","git":1,"w":"regenerates patch.mjs from the patch","ch":[],"b":822,"lines":13,"c":"Regenerates patch.mjs from pq2-multicol.patch (run after changing the patch): node models/runtime/engine/make-patch.mjs The patch itself comes from `git diff` in a checkout of Prism's llama.cpp at ENGINE.commit."},{"id":"models/runtime/engine/README.md","n":"README.md","k":"f","p":"m","git":1,"w":"how the engines are built","ch":[],"b":2853}],"m":"Two engines: the official llama.cpp release, and Prism ML’s fork with our Metal patch (the default).","files":6,"lines":290,"b":27111}],"s":"server · memory fit · warm-up · setup","m":"server.mjs starts, shares and stops llama-server (a free port, one restart after a crash); memory.mjs picks a 32k context, or 16k when memory is short; warmup.mjs saves the model’s read-in instructions so the next start is fast; setup.mjs is `coding setup`.","files":16,"lines":1836,"b":116205},{"id":"models/gemma-4-12b","n":"gemma-4-12b/","k":"d","p":"m","git":1,"w":"Gemma 4 12B: the second model in /model","ch":[{"id":"models/gemma-4-12b/model.mjs","n":"model.mjs","k":"f","p":"m","git":1,"w":"its settings","ch":[],"b":5503,"lines":95,"c":"Gemma 4 12B it QAT (Google, quantization-aware 4-bit): the swap-in candidate measured against the 27B on 2026-09-28. Live-checked on this Mac the same morning: clean OpenAI tool calls through our engine, reads 126-128 tok/s, writes 13.2, 7.69 GB at 16k. The file was downloaded and sha-checked here."},{"id":"models/gemma-4-12b/results","n":"results/","k":"d","p":"m","git":0,"w":"raw test runs of this model","ch":[],"back":["yours","the measurements; running the tests again remakes them"],"sz":4653056}],"s":"Gemma 4 12B, 6.7 GB","m":"Google’s Gemma 4 12B, 4-bit (quantization-aware); the default until 30 Sep 2026. model.mjs holds its settings: the file and checksum, its layout, sampling, and the two effort levels (Low and High).","flag":"second","files":1,"lines":95,"b":5503},{"id":"models/qwen3.5-9b","n":"qwen3.5-9b/","k":"d","p":"m","git":1,"w":"Qwen3.5 9B: the default model","ch":[{"id":"models/qwen3.5-9b/model.mjs","n":"model.mjs","k":"f","p":"m","git":1,"w":"its settings","ch":[],"b":5179,"lines":91,"c":"Qwen3.5 9B (Alibaba's Qwen team, Feb 2026; Apache 2.0), Unsloth's UD-Q5_K_XL: a second model to try beside Gemma, added 29 Sep 2026 (their pick of file: the Q5, a bit smarter than Q4 and about Gemma's size). Since the speed test the same day it is Unsloth's MTP build of that file: the same weights plus Qwen's own MTP layer, its speed helper (see draft below). Same family as the Bonsai 27B's base: mostly Gated…"},{"id":"models/qwen3.5-9b/results","n":"results/","k":"d","p":"m","git":0,"w":"raw test runs of this model","ch":[],"back":["yours","the measurements; running the tests again remakes them"],"sz":8896512}],"s":"Qwen3.5 9B, 6.9 GB","m":"Alibaba’s Qwen3.5 9B (Unsloth’s Q5 build), the default since 30 Sep 2026. Its speed layer (MTP) is inside the model file. Only one model fits in 16 GB at a time.","flag":"default","files":1,"lines":91,"b":5179},{"id":"models/bge-m3","n":"bge-m3/","k":"d","p":"m","git":1,"w":"BGE-M3: the small model that compares meanings","ch":[{"id":"models/bge-m3/model.mjs","n":"model.mjs","k":"f","p":"m","git":1,"w":"its settings","ch":[],"b":1348,"lines":29,"c":"BGE-M3 (BAAI, MIT): the small model that finds the saved facts of Agentic Coder's memory that fit a request. It writes nothing: it turns a text into 1,024 numbers, and two texts that mean the same get numbers that are close, so \"run the suite\" lands next to \"the tests\". It runs in the same engine as the 27B, in its embedding mode, beside it. Measured 2026-09-26 on the M4 with a 27B loaded (20 facts, 30 requests, see…"},{"id":"models/bge-m3/README.md","n":"README.md","k":"f","p":"m","git":1,"w":"what it is and what it does","ch":[],"b":1592}],"s":"the meaning-matcher, 0.6 GB","m":"It writes nothing; it turns a text into numbers so meanings can be compared. That finds the saved facts that fit a request, and ranks files and code parts. runtime/embed.mjs runs it beside the main model.","flag":"helper","files":2,"lines":29,"b":2940},{"id":"models/qwen3-reranker-0.6b","n":"qwen3-reranker-0.6b/","k":"d","p":"m","git":1,"w":"Qwen3-Reranker 0.6B: puts the best search finds first","ch":[{"id":"models/qwen3-reranker-0.6b/model.mjs","n":"model.mjs","k":"f","p":"m","git":1,"w":"its settings","ch":[],"b":1694,"lines":31,"c":"Qwen3-Reranker 0.6B (Qwen, Apache 2.0): the model /effort's Reranker row turns on. It writes nothing: it reads the request together with each piece the search found (a function, a file's card, a saved fact, a note) and says how well that piece answers it, so the best ones can go first. The embedder (BGE-M3) reads the two apart, which is why it is fast and why it can be fooled by a piece that only shares the…"},{"id":"models/qwen3-reranker-0.6b/README.md","n":"README.md","k":"f","p":"m","git":1,"w":"why this reranker: the bake-off and the pick","ch":[],"b":4106}],"s":"the reranker, 0.6B","flag":"helper","files":2,"lines":31,"b":5800},{"id":"models/k2-horizon-7b","n":"k2-horizon-7b/","k":"d","p":"m","git":1,"w":"K2 Horizon 7B: the third model in /model","ch":[{"id":"models/k2-horizon-7b/model.mjs","n":"model.mjs","k":"f","p":"m","git":1,"w":"its settings, tool-call format and thinking tags","ch":[],"b":4157,"lines":73,"c":"K2 Horizon 7B (MBZUAI's Institute of Foundation Models, 3 Sep 2026; Apache 2.0, fully open: weights, data and training code), IFM's own Q5_K_M: a third model to try beside Gemma and Qwen, added 30 Sep 2026. \"7B\" is its core; its own file counts 9.0B with the word table. Artificial Analysis Intelligence Index v4.3.2: 21, against Qwen3.5 9B's 11 and Gemma 4 12B's 14. Text only: it cannot look at pictures (a picture…"},{"id":"models/k2-horizon-7b/results","n":"results/","k":"d","p":"m","git":0,"w":"raw test runs of this model","ch":[],"back":["yours","the measurements; running the tests again remakes them"],"sz":45056}],"s":"K2 Horizon 7B, 6.5 GB","m":"MBZUAI IFM’s K2 Horizon 7B (Q5_K_M), in /model since 30 Sep 2026. It runs only on IFM’s own llama.cpp (the third engine) and cannot look at pictures. model.mjs holds its settings, its tool-call format and its thinking tags.","flag":"third","files":1,"lines":73,"b":4157},{"id":"models/bonsai-2-27b","n":"bonsai-2-27b/","k":"d","p":"m","git":1,"w":"Bonsai 2 27B: the fourth model in /model","ch":[{"id":"models/bonsai-2-27b/model.mjs","
