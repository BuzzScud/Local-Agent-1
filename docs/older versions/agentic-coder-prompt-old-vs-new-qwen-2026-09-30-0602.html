</style>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const VERDICT = "<b>The new prompt holds.</b> It passed 22 of 22 against 21 for the old one, in 5% more time.", CHIPS = "<span class=\"chip ok\">✓ passes: new 22 ≥ old 21</span><span class=\"chip ok\">✓ time: new at most 10% longer (+5%)</span><span class=\"chip ok\">✓ every task run with both (22)</span>";
const CHANGED = ["<b>Work habits</b>: 8 lines after “Tool use”, in the part of the prompt kept on disk (about 200 tokens). This is the one change the practice tasks see.<pre>Work habits\n- Once you know enough to act, act. Do not read a file again or ask again about what is already settled.\n- When there are several ways, pick the best one and say why in one line; do not list them all.\n- Read a file before you overwrite it. Before anything hard to undo, use Ask first.\n- Report what really happened: a failed check is &quot;failed&quot;, with the line that failed; name any step you skipped. When it is done and checked, say so plainly.\n- Look at files with Read, Search and List, not cat, grep or ls in Bash.\n- If the user says no to a tool call, do not send it again: ask, or try another way.\n- When memory fills, the app keeps notes and you keep going. Do not rush to finish.\n- A remembered fact can be out of date: check that a file or name still exists before you rely on it.</pre>","<b>Which notes win</b>: one line above the project notes. Not in the practice tasks: they have no notes files, and they run without the memory.<pre>These are the user&#39;s and this project&#39;s own rules. When they disagree with the working instructions above, they win, except the Rules the app enforces (blocked folders and commands). The user&#39;s words in this conversation win over both.</pre>","<b>Each notes file named by its kind</b>: “From ~/AGENTS.md (the user's own rules, for every folder under the home folder):” where it was “From ~/AGENTS.md:”. Not in the practice tasks.","<b>Room for the notes files</b>: 9,000 characters, was 6,000. Not in the practice tasks.","<b>The date</b>: the Mac’s own calendar day in both runs. The old prompt’s UTC date was a bug, so the old run gets the fix too."], METHOD = ["Model: Qwen3.5 9B, thinking on at High. The practice tasks 15,13,21,24,8,22,10,26,17,14,1,2,9,25,19,27,23,7,18,12,28,11 with each prompt, old first, one after the other on the same Mac.","Each side is <code>bench/run.mjs … --prompt old|new --no-record</code>: the same tasks, checks, helpers and context as a Practice 28 run; only the system prompt differs.","The rule, written before the first run: the new prompt holds when it passes at least as many tasks as the old one and takes at most 10% longer in all (the seconds of the tasks both ran).","A task's seconds run from its first request to its last reply; loading the model is not in them. Thinking tokens are the model's own count where it gives one.","Code: <code>95d4c49</code>. Run Sep 30, 2026, 6:02 AM."], RAW = ["models/qwen3.5-9b/results/prompt-ab-think-2026-09-30"];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TABS = [['result', 'Result'], ['tasks', 'Task by task'], ['changed', 'What changed'], ['how', 'How it was measured']];
let tab = Math.max(0, TABS.findIndex(([id]) => '#' + id === location.hash)), page = 0;
const num = (n) => (n == null ? '—' : Math.round(n).toLocaleString('en-US'));
const pct = (a, b) => (a && b != null ? (b >= a ? '+' : '−') + Math.abs(Math.round(100 * (b - a) / a)) + '%' : '');
// Old and new side by side; the better cell marked (higher or lower is better, said on the row).
function row(name, sub, a, b, better, show = num) {
  const best = a != null && b != null && a !== b && better ? ((better === 'low') === (b < a) ? 'b' : 'a') : null;
  return '<tr><td><b>' + name + '</b><small>' + sub + '</small></td><td class="num' + (best === 'a' ? ' best' : '') + '">' + show(a) + '</td><td class="num' + (best === 'b' ? ' best' : '') + '">' + show(b) + '</td><td class="num dim">' + (better ? pct(a, b) : '') + '</td></tr>';
}
const cell = (x) => x ? '<span class="' + (x.pass ? 'ok' : 'no') + '">' + (x.pass ? 'PASS' : 'FAIL') + '</span> <span class="dim">· ' + num(x.secs) + ' s · ' + num(x.ownSteps ?? x.steps) + ' steps</span>' : '<span class="dim">— not run</span>';
function draw() {
  document.getElementById('tabs').innerHTML = TABS.map(([id, name], i) => '<button type="button" role="tab" aria-selected="' + (i === tab) + '" data-i="' + i + '">' + (i + 1) + ' · ' + name + '</button>').join('');
  const p = document.getElementById('panel'), id = TABS[tab][0], o = D.old, n = D.new, f = D.flips;
  if (id === 'result') {
    const cards = '<div class="card"><div class="k">Old prompt · passed · higher is better</div><div class="v">' + o.passed + ' of ' + o.tasks + '</div><div class="s">' + num(o.secs) + ' s in all</div></div>'
      + '<div class="card"><div class="k">New prompt · passed · higher is better</div><div class="v">' + n.passed + ' of ' + n.tasks + '</div><div class="s">' + num(n.secs) + ' s in all</div></div>'
      + '<div class="card"><div class="k">Time in all · lower is better</div><div class="v">' + (pct(o.secs, n.secs) || '—') + '</div><div class="s">new against old</div></div>'
      + '<div class="card"><div class="k">Tasks that moved</div><div class="v">' + f.fixed.length + ' fixed · ' + f.broke.length + ' broke</div><div class="s">' + (f.fixed.length + f.broke.length ? esc([...f.fixed.map((t) => '+' + t), ...f.broke.map((t) => '−' + t)].join(', ')) : 'none') + '</div></div>';
    p.innerHTML = '<p class="verdict">' + VERDICT + '</p><div class="chips">' + CHIPS + '</div><div class="cards">' + cards + '</div><div class="table-wrap"><table><thead><tr><th>Measure</th><th class="num">Old prompt<small>before 30 Sep</small></th><th class="num">New prompt<small>Work habits and the rest</small></th><th class="num">Change</th></tr></thead><tbody>'
      + row('Tasks passed', 'each task’s own check · higher is better', o.passed, n.passed, 'high')
      + row('Seconds in all', 'the tasks both ran · lower is better', o.secs, n.secs, 'low')
      + row('Seconds a task', 'the median · lower is better', o.median, n.median, 'low')
      + row('Model calls', 'in all · lower is better', o.modelCalls, n.modelCalls, 'low')
      + row('Its own steps', 'tool calls the model made · lower is better', o.ownSteps, n.ownSteps, 'low')
      + row('Tool errors', 'calls that came back as an error · lower is better', o.toolErrors, n.toolErrors, 'low')
      + row('Thinking', 'tokens, about · lower is better when the passes hold', o.thinkTokens, n.thinkTokens, 'low')
      + '</tbody></table></div>';
  } else if (id === 'tasks') {
    p.innerHTML = '<p class="verdict">Each practice task with the old prompt and the new one: its check, its seconds and the model’s own steps. A task that moved is named in the last column.</p><div class="fill" id="fill"><div class="table-wrap"><table><thead><tr><th>Task</th><th>Old prompt</th><th>New prompt</th><th>Moved</th></tr></thead><tbody></tbody></table></div></div><div class="pager"><button type="button" id="prev">‹ Back</button><button type="button" id="next">Next ›</button><span id="at"></span></div>';
    const fill = document.getElementById('fill'), body = p.querySelector('tbody'), list = D.rows;
    const moved = (r) => !r.old || !r.new ? '' : !r.old.pass && r.new.pass ? '<span class="ok">fixed</span>' : r.old.pass && !r.new.pass ? '<span class="no">broke</span>' : '<span class="dim">same</span>';
    const rowHtml = (r) => '<tr><td class="task">' + esc(r.task) + '</td><td>' + cell(r.old) + '</td><td>' + cell(r.new) + '</td><td>' + moved(r) + '</td></tr>';
    body.innerHTML = list.length ? rowHtml(list[0]) : '<tr><td colspan="4" class="dim">No tasks ran.</td></tr>';
    const small = matchMedia('(max-width:760px),(max-height:520px)').matches;
    const rh = body.firstElementChild?.getBoundingClientRect().height || 36, th = p.querySelector('thead').getBoundingClientRect().height;
    const per = small ? list.length || 1 : Math.max(1, Math.floor((fill.clientHeight - th) / rh));
    const pages = Math.max(1, Math.ceil(list.length / per)); page = Math.min(page, pages - 1);
    if (list.length) body.innerHTML = list.slice(page * per, page * per + per).map(rowHtml).join('');
    document.getElementById('at').textContent = list.length ? 'Page ' + (page + 1) + ' of ' + pages + ' · tasks ' + (page * per + 1) + '–' + Math.min(list.length, page * per + per) + ' of ' + list.length : '';
    document.getElementById('prev').disabled = page === 0; document.getElementById('next').disabled = page >= pages - 1;
    document.getElementById('prev').onclick = () => { page--; draw(); }; document.getElementById('next').onclick = () => { page++; draw(); };
  } else if (id === 'changed') {
    p.innerHTML = '<ul class="how">' + CHANGED.map((m) => '<li>' + m + '</li>').join('') + '</ul>';
  } else {
    p.innerHTML = '<ul class="how">' + METHOD.map((m) => '<li>' + m + '</li>').join('') + (RAW.length ? '<li>Raw results, on this Mac: ' + RAW.map((r) => '<code>' + r + '</code>').join(', ') + '</li>' : '') + '<li>Nothing on this page loads from the internet.</li></ul>';
  }
}
document.getElementById('tabs').onclick = (e) => { const b = e.target.closest('button'); if (b) { tab = Number(b.dataset.i); page = 0; try { history.replaceState(null, '', '#' + TABS[tab][0]); } catch {} draw(); } };
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = Number(e.key);
  if (k >= 1 && k <= TABS.length) { tab = k - 1; page = 0; draw(); }
  else if (e.key === 'ArrowRight') { tab = (tab + 1) % TABS.length; page = 0; draw(); }
  else if (e.key === 'ArrowLeft') { tab = (tab + TABS.length - 1) % TABS.length; page = 0; draw(); }
});
addEventListener('resize', () => draw());
draw();
</script>
