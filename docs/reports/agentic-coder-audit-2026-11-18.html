<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic Coder audit</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1f; --dim: #6e6e73; --line: #e3e3e0; --soft: #f0f0ed;
  --hi: #c4291c; --hi-bg: #fdecea; --med: #a15c00; --med-bg: #fff3df; --low: #5a6270; --low-bg: #eef0f3;
  --ok: #1f7a3d; --ok-bg: #e6f4ea; --accent: #2457c5; --accent-bg: #e8eefc;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161618; --panel: #1f1f22; --ink: #ececee; --dim: #9a9aa2; --line: #313136; --soft: #26262a;
    --hi: #ff7a6b; --hi-bg: #3a1f1c; --med: #f0b35a; --med-bg: #36290f; --low: #aab2c0; --low-bg: #2a2d33;
    --ok: #6fd28f; --ok-bg: #173323; --accent: #8fb0ff; --accent-bg: #1f2a44;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; }
header { padding: 14px 24px 0; max-width: 1480px; width: 100%; margin: 0 auto; }
h1 { font-size: 21px; margin: 0; }
.dateline { color: var(--dim); font-size: 13px; margin-top: 2px; }
nav { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 24px 10px; max-width: 1480px; width: 100%; margin: 0 auto; }
nav button { font: inherit; font-size: 13.5px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
nav button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { flex: 1; min-height: 0; max-width: 1480px; width: 100%; margin: 0 auto; padding: 0 24px 16px; }
section { display: none; height: 100%; }
section.on { display: flex; flex-direction: column; gap: 12px; }
.lead { font-size: 15.5px; max-width: 1100px; margin: 0; }
.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.card b { display: block; font-size: 24px; line-height: 1.15; }
.card span { color: var(--dim); font-size: 13px; }
.two { display: grid; grid-template-columns: 1.25fr 1fr; gap: 14px; min-height: 0; flex: 1; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; min-height: 0; overflow: auto; }
.box h2 { font-size: 15px; margin: 0 0 8px; }
ol.tight, ul.tight { margin: 0; padding-left: 20px; }
ol.tight li, ul.tight li { margin: 3px 0; font-size: 14px; }
.pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.H { color: var(--hi); background: var(--hi-bg); }
.M { color: var(--med); background: var(--med-bg); }
.L { color: var(--low); background: var(--low-bg); }
.ok { color: var(--ok); background: var(--ok-bg); }
.pick { color: var(--accent); background: var(--accent-bg); }
.summary { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.summary p { margin: 0; max-width: 1100px; }
.tablewrap { flex: 1; min-height: 0; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { position: sticky; top: 0; background: var(--soft); text-align: left; font-weight: 600; font-size: 12.5px; color: var(--dim); padding: 7px 10px; border-bottom: 1px solid var(--line); z-index: 1; }
td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.t b { display: block; }
td.t span { color: var(--dim); }
td.w { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dim); word-break: break-word; width: 210px; }
td.n { width: 54px; } td.e { width: 46px; text-align: center; } td.p { width: 92px; font-size: 12px; color: var(--dim); }
td.f { width: 30%; }
.tiers td, .tiers th { font-size: 13.5px; }
.note { color: var(--dim); font-size: 13px; margin: 0; }
code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--soft); padding: 0 4px; border-radius: 4px; }
@media (max-width: 900px) {
  body { height: auto; display: block; }
  header, nav, main { padding-left: 16px; padding-right: 16px; }
  section.on { height: auto; }
  .cards { grid-template-columns: repeat(2, 1fr); }
  .two { grid-template-columns: 1fr; }
  .tablewrap, .box { overflow: visible; }
  table, thead, tbody, tr, td { display: block; width: 100% !important; }
  thead tr { display: none; }
  tr { border-bottom: 1px solid var(--line); padding: 6px 0; }
  td { border: 0; padding: 3px 10px; }
}
</style>

{ id: 'engine', name: 'Engine & tools', blurb: 'The loop that talks to the model and runs its tools (read, write, edit, search, commands), the permission modes, the sandbox and the model servers. It explains failures back to the model well, but its “is this safe?” layer leans on word lists and path guessing that are weaker than they look.', rows: [
 ['H','“Read-only” commands that are not','git branch -D main, sort -o file, git diff --output=file and rg --pre rm all count as read-only: they run without asking in Manual mode and are allowed in Plan mode.','Refuse the writing flags; allow git branch only with no arguments.','agent/command-words.mjs:213','S','ran it (me)'],
 ['H','Search misses matches','A pattern with \\w, \\d or \\s says “No matches” in any git project: it is checked as a JavaScript pattern but run by git grep -E, which does not know them.','Use git grep -P, or the app’s own search when git finds nothing.','tools/fs.mjs:93','S','ran it (me)'],
 ['H','No limit on command output','A command that prints a lot (a big log, a long test run) keeps all of it in memory, next to a 7 GB model; characters split between chunks turn into �.','Keep the start and the end (about 5 MB), decode as UTF-8.','tools/run.mjs:107','S','read (me)'],
 ['H','Your edit can be overwritten','The change is worked out before the “allow this edit?” question. Save the file in your editor while it asks, say yes, and your save is gone; /rewind cannot bring it back.','Read the file again on yes; if it changed, refuse and tell the model.','agent/agent-step.mjs:515 → tools.mjs:367','S','read'],
 ['M','Numbers stripped from written files','Writing a table whose first column is numbers drops that column; a file of “1 2 3 4 5” lines comes out empty.','Strip only the exact line numbers Read adds.','agent/tools-edit.mjs:147','S','ran it'],
 ['M','A new file through a linked folder lands outside the project','A folder in the project that links elsewhere lets Write create files outside it with no question.','Check the real place of the nearest folder that exists.','agent/tools-paths.mjs:159','S','ran it'],
 ['M','A wrong path can overwrite a different file','A path that does not exist is moved onto a project file with the same ending: /tmp/README.md becomes the project’s README.md.','Only guess for new files, never onto one that exists; say so.','agent/tools-paths.mjs:124','S','ran it'],
 ['M','Commands can see your API keys','Every command and hook gets the whole environment, Claude and service keys included; echo $ANTHROPIC_API_KEY even counts as read-only.','Remove keys and tokens from what commands get.','tools/run.mjs:45 · user-hooks.mjs:148','S','ran it'],

 ['M','A tool call quoted from a web page can run','Tool-call text anywhere in the answer, or in its thinking, is run as a real call.','Only take a call that ends the answer; never from thinking.','agent-work.mjs:234 · agent-said.mjs:433','S','read'],
 ['M','Odd arguments write wrong content','Content sent as an object is saved as “[object Object]”; a list is saved comma-joined.','Write objects as JSON, join lists with new lines.','agent/tools-args.mjs:199','S','ran it'],
 ['M','Command lists lose their quoting','["rm","-rf","build dir"] runs rm -rf build dir: two folders, neither the right one.','Quote each part.','agent/tools-args.mjs:121','S','ran it'],

{ id: 'install', name: 'Install, servers & tests', blurb: 'Install and the self-update, every server the app opens, the repo check and the test suite. The network code is better than most (keys compared safely, wrong-key lockout, a careful web sign-in), but GitHub’s main runs on every Mac with no signing, and the local page and model servers accept requests from websites.', rows: [

 ['M','The door key is a full shell, printed on every status','Any device on your Tailscale that your rules allow can try it; coding door prints it each time.','Only your own devices; never print it after the first time.','app/door.mjs:275','M','read'],
 ['M','coding serve listens on every network, in plain http','It prints its key at every start; on café Wi-Fi the key and your code can be read.','Tailscale or this Mac only, unless asked.','models/runtime/serve.mjs:46','S','read'],
 ['M','The web sign-in can be flooded','Each try is a slow password check, the limit is per name, and the list of tries never shrinks.','A per-address limit and a cap on checks at once.','web/auth.mjs:51','S','likely'],
 ['M','The web container cannot be built from a fresh copy','It needs bun.lock, which git ignores; the Ink patch is pinned to 7.1.1 while any 7.x may install.','Commit bun.lock; pin Ink.','web-container/Dockerfile:6','S','read (me)'],
 ['M','The model download can crash or hang','No error handler (disk full = crash), no time limit, no resume of an 8 GB download.','The standard stream pipe, a timeout, resume.','models/runtime/setup.mjs:15','S','read'],
 ['M','Each start moves your working folder','Every start fast-forwards the shared folder and runs bun install in it while other sessions work there.','Leave the folder alone; the build already uses a clean copy.','app/agentic-coder-launcher.sh:85','S','read'],
 ['M','The repo check is always red','“The installed app is not what main builds” even when it is the same commit; a gate that is always red gets skipped.','Make it a “look at” line.','models/evals/tools/check.mjs:483','M','ran it (me)'],
 ['M','A failed test that passes alone counts as a pass','Real races hide; the run still exits OK.','Report it as flaky and keep a list.','models/evals/tools/run-suite.mjs:122','S','read'],
 ['M','Every test run edits a tracked 740 KB page','The test record page in docs/ is rewritten by every run (it is modified right now) and was committed 90 times.','Write it outside git, or only in bun run docs.','models/evals/record.mjs:306','S','seen'],
 ['L','~/.agentic-coder is readable by other accounts','Sessions, settings and a log holding an invite link.','Make it private at start.','~/.agentic-coder (0755)','S','seen'],
 ['L','A cut-off install download runs half a script','install.sh is not wrapped in a function.','Wrap it.','install.sh:16','S','read'],
 ['L','A folder name with quotes breaks the launcher','The repo path is pasted into the script unescaped.','Escape it.','package.json:32','S','read'],
 ['L','The window key shows in ps','It is passed on the command line and compared the quick way.','Pass it privately; compare safely.','window/server.mjs:143','S','read'],
 ['L','Unsigned connections can each hold 8 MB','No cap on how many before the key.','4 KB before the key; cap connections.','app/sessions.mjs:55','S','read'],
 ['L','The secret scan misses the app’s own key shapes','acd-, ac-, acw_, acr_ keys would not be caught (none are committed).','Add them.','models/evals/tools/check.mjs:24','S','read'],
 ['L','An old server address is in public history','In old page contents, not only one commit message.','Make sure that service needs a key or is firewalled.','commits 0fe9666 · 415a344','S','read'],
 ['L','The window build is not locked','cargo build without --locked.','Add it.','app/window/build.sh:15','S','read'],
 ['M','Two tests are date time bombs','One hard-codes “Oct”; the other’s sample fact is dated 9 Oct and is now retired by the 30-day rule. 2 of today’s 4 failures.','Pass the date in.','terminal/test/memory-home.test.mjs:99 · :125','S','ran it (me)'],
 ['M','Test results depend on who runs them','The suite keeps any AGENTIC_HOME already set (it could test against a real home); FORCE_COLOR breaks 9 tests; the “another copy” label depends on the shell.','Always set a throwaway home; clear FORCE_COLOR.','terminal/test/test-env.mjs:25','S','read'],

 ['M','Tests wait by the clock, not by the screen','886 fixed waits in the screen tests (329 s); keys 80 ms apart. This is why tests fail under load and pass alone.','Wait for the row or text to change.','app-remote (149) · app-effort (61) · app-menus (40)','L','counted'],
 ['L','Tests that can fail around 7–8 pm','Two read “today” from the clock in UTC.','Pass the date in.','memory-notes.test.mjs:122 · usage.test.mjs:209','S','read'],

const TOP = [
 ['H','One typo in settings.json wipes all your settings, with no copy kept.','app'],
 ['H','“Read-only” commands that are not: git branch -D main runs without asking.','engine'],
 ['H','Facts about you expire after 30 days unused: one of yours is next.','memory'],
 ['H','Your edit made during the “allow?” question is overwritten.','engine'],
 ['H','/resume during a reply mixes two conversations.','app'],
 ['H','Every Terminal open runs GitHub’s main, unsigned.','install'],
 ['H','Search says “No matches” for \\w and \\d patterns.','engine'],
 ['M','Any website can reach the hub and the local model server.','install'],
 ['M','Commands see your API keys; Bypass can read the door key.','engine'],
 ['M','Facts about you go to outside services despite “Memory sent”.','memory'],
 ['M','Fix/change/rename write from stale copies.','memory'],
 ['M','A slip in any slash command closes the window.','app'],
 ['H','The hub’s Instructions tab hides Save on laptop-height windows.','ui'],
];

const TIERS = [
 ['1 · Everything + rebuild','Every finding fixed, plus the big rebuilds: split the 500-line functions and the 930-line App, one busy gate, signed releases + CI, the screen tests made to wait for the screen.','About 5–7 days','Biggest change; touches nearly every file.'],
 ['2 · Fix by theme','Every high and medium finding, fixed through about 8 shared fixes (one safe-write helper, one busy gate, one deadline for model calls, one Host/Origin guard, one any-language matcher…), each with a test that fails before. Low items where they share a fix. No big rebuilds.','About 2–3 days','My pick: most of the value, small reviewable rounds.'],
 ['3 · The top 15','Only the high findings and the proven data-loss and safety ones, each a small patch with a test.','About 1 day','Leaves the slow-session, test-flake and server items.'],
 ['4 · Stop the bleeding','Five small fixes today: settings wipe, read-only list, facts about you, hub origin check, the two test time bombs.','2–3 hours','Everything else waits.'],
];
const ROUNDS = [
 ['Safety','Read-only list, keys out of commands, sandbox blocks secret files and system folders, path guard (links, guesses), quoted tool calls, one Host/Origin check for the hub, a key on the local model server.'],
 ['Lost work','Settings, trust and rewind never written over when unreadable; every file write is “write beside, then swap”; Edit/Write and the fix paths read again before writing.'],
 ['Memory','Facts about you kept; one any-language matcher; undo the right batch; stale locks; Memory sent on every request; coding -p follows Memory save.'],
 ['Hangs & limits','Command output cap, a deadline on every model call, the download, big-folder search.'],
 ['App flow','One busy gate for /resume, !, /update memory; a queue that keeps every message; quit once; errors caught instead of closing the window.'],
 ['Clickable UI','Instructions scrolls, refresh keeps the sub-tab, Profiles says a failed save, the window’s title bar waits for a question, one way to do tabs, pop-ups (Esc) and keyboard reach on every page, phone layouts.'],
 ['Speed','Settings and history read once; long sessions keep their speed.'],
 ['Tests & gate','The 4 failures, a throwaway home always, flaky reported as flaky, the record page out of git, the repo check green when it should be.'],
];

const tabs = [
 { id: 'verdict', name: 'Verdict' },
 { id: 'plan', name: 'Fix plan' },
 ...AREAS.map((a) => ({ id: a.id, name: a.name })),
];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const count = (rows, s) => rows.filter((r) => r[0] === s).length;
const all = AREAS.flatMap((a) => a.rows);
const word = { H: 'High', M: 'Medium', L: 'Low' };

function verdict() {
  const n = all.length, h = count(all, 'H'), m = count(all, 'M'), l = count(all, 'L');
  const small = all.filter((r) => r[5] === 'S').length;
  const ran = all.filter((r) => /ran it|measured|seen|counted/.test(r[6])).length;
  return `<p class="lead"><b>It works day to day, but it can lose your things and it trusts too easily.</b> Today’s full test run passed 2,122 of 2,126; the 4 failures are test mistakes (dates, and a wrong label), not broken features. The real problems are at the edges: a broken settings file wiped, edits overwritten while it waits for your yes, facts about you quietly retired, commands it thinks only read but that write, and local servers any website can reach. Almost all of it is small to fix.</p>
  <div class="cards">
    <div class="card"><b>2,122 / 2,126</b><span>tests pass · 4 fail, all test mistakes · 2 flaky under load</span></div>
    <div class="card"><b>${n} findings</b><span>${h} high · ${m} medium · ${l} low</span></div>
    <div class="card"><b>${ran} proven</b><span>shown by running it, measuring or seeing it; the rest read in the code</span></div>
    <div class="card"><b>${small} of ${n}</b><span>are small fixes (under an hour each)</span></div>
  </div>
  <div class="two">
    <div class="box"><h2>The 13 that matter most</h2><ol class="tight">${[...TOP].sort((x, y) => (x[0] === 'H' ? 0 : 1) - (y[0] === 'H' ? 0 : 1)).map((t) => `<li><span class="pill ${t[0]}">${word[t[0]]}</span> ${esc(t[1])}</li>`).join('')}</ol></div>
    <div class="box"><h2>What is already good</h2><ul class="tight">
      <li>Sessions and settings are saved under a lock, written whole.</li>
      <li>Failures go back to the model as an explanation, not a crash.</li>
      <li>The door compares keys safely and locks out wrong guesses.</li>
      <li>The web copy’s sign-in is strong (slow password hashing, strict cookies, origin checks, folder fence).</li>
      <li>/agents loops are bounded (3 tries, 2 ship fixes).</li>
      <li>Memory has a log, undo and held saves.</li>
      <li>Every code file stays under 1,000 lines.</li>
    </ul>
    <h2 style="margin-top:12px">How it was checked</h2><ul class="tight">
      <li>The full test run (384 s) and the repo’s own check.</li>
      <li>Five helpers, each reading one part: engine & tools, app, memory & helpers, clickable UI, install & servers & tests.</li>
      <li>The worst claims run again by me (marked “(me)”).</li>
      <li>Read only: nothing in the repo or ~/.agentic-coder was changed.</li>
    </ul></div>
  </div>`;
}
function plan() {
  return `<p class="lead">Four ways to go, most complete first. Each fix comes with a test that fails before it and passes after, and the full run at the end.</p>
  <div class="tablewrap" style="flex:0 0 auto"><table class="tiers"><thead><tr><th>Option</th><th>What it covers</th><th>Time</th><th>Note</th></tr></thead><tbody>
  ${TIERS.map((t, i) => `<tr><td><b>${esc(t[0])}</b>${i === 1 ? ' <span class="pill pick">my pick</span>' : ''}</td><td>${esc(t[1])}</td><td>${esc(t[2])}</td><td>${esc(t[3])}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="box" style="flex:1"><h2>Option 2, round by round (each round: fixes → its tests → the full run → one commit)</h2><ol class="tight">${ROUNDS.map((r) => `<li><b>${esc(r[0])}.</b> ${esc(r[1])}</li>`).join('')}</ol>
  <p class="note" style="margin-top:8px">Built in a worktree, so your folder and other sessions are not touched; pushed only when you say.</p></div>`;
}
function area(a) {
  if (!a.rows.length) return `<p class="lead">${esc(a.blurb)}</p>`;
  const order = { H: 0, M: 1, L: 2 };
  const rows = [...a.rows].sort((x, y) => order[x[0]] - order[y[0]]);
  return `<div class="summary"><p>${esc(a.blurb)}</p><span class="pill H">${count(rows, 'H')} high</span><span class="pill M">${count(rows, 'M')} medium</span><span class="pill L">${count(rows, 'L')} low</span></div>
  <div class="tablewrap"><table><thead><tr><th>Level</th><th>What goes wrong</th><th>Fix</th><th>Where</th><th>Size</th><th>Shown by</th></tr></thead><tbody>
  ${rows.map((r) => `<tr><td class="n"><span class="pill ${r[0]}">${word[r[0]]}</span></td><td class="t"><b>${esc(r[1])}</b><span>${esc(r[2])}</span></td><td class="f">${esc(r[3])}</td><td class="w">${esc(r[4])}</td><td class="e">${r[5]}</td><td class="p">${esc(r[6])}</td></tr>`).join('')}
  </tbody></table></div>`;
}

const nav = document.getElementById('tabs');
const main = document.getElementById('main');
tabs.forEach((t, i) => {
  const b = document.createElement('button');
  b.setAttribute('role', 'tab'); b.id = `tab-${t.id}`; b.textContent = `${i + 1} · ${t.name}`;
  b.addEventListener('click', () => show(t.id));
  nav.appendChild(b);
  const s = document.createElement('section');
  s.id = t.id; s.setAttribute('role', 'tabpanel'); s.setAttribute('aria-labelledby', b.id);
  s.innerHTML = t.id === 'verdict' ? verdict() : t.id === 'plan' ? plan() : area(AREAS.find((a) => a.id === t.id));
  main.appendChild(s);
});
function show(id, push = true) {
  if (!tabs.some((t) => t.id === id)) id = 'verdict';
  for (const s of main.children) s.classList.toggle('on', s.id === id);
  for (const b of nav.children) b.setAttribute('aria-selected', String(b.id === `tab-${id}`));
  if (push && location.hash !== `#${id}`) history.replaceState(null, '', `#${id}`);
}
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const i = tabs.findIndex((t) => main.querySelector(`#${t.id}`).classList.contains('on'));
  if (/^[1-9]$/.test(e.key) && tabs[+e.key - 1]) show(tabs[+e.key - 1].id);
  else if (e.key === 'ArrowRight') show(tabs[(i + 1) % tabs.length].id);
  else if (e.key === 'ArrowLeft') show(tabs[(i - 1 + tabs.length) % tabs.length].id);
});
window.addEventListener('hashchange', () => show(location.hash.slice(1), false));
show(location.hash.slice(1) || 'verdict', false);
</script>
