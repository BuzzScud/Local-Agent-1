main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:0}
main.text{display:block;overflow:auto}
.left{display:flex;flex-direction:column;min-height:0;min-width:0}
.steps{padding:10px 16px 0}

.warnp{color:var(--warn)!important}
.real{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);color:var(--dim);font-size:12.5px}
kbd{font:12px Menlo,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px}
/* tab 1 */
.wrap{max-width:1400px;margin:0 auto;padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}

.lead{grid-column:1/-1;font-size:16px}.lead b{color:var(--acc)}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 8px}
.chain span{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px}.chain i{color:var(--dim);font-style:normal}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two h3{font-size:13px;margin:0 0 4px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.yes{color:var(--acc)}.no{color:var(--warn)}
table.res{border-collapse:collapse;width:100%;font-size:13.5px}table.res td,table.res th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}table.res th{color:var(--dim);font-weight:600}table.res td:last-child{white-space:nowrap}.pass{color:var(--acc);font-weight:600}.fail{color:var(--warn);font-weight:600}

  const t = TABS[tab - 1];
  if (t.html) { mainEl.className = 'text'; mainEl.innerHTML = t.html; return; }
  step = Math.min(step, t.steps.length - 1);
  const s = t.steps[step];
  const h = SCREENS[size][`${t.id}-${step}`];
  mainEl.className = '';
  mainEl.innerHTML = `<div class="left"><div class="steps"><span class="seg">${t.steps.map((x, i) => `<button class="${i === step ? 'on' : ''}" data-st="${i}">${x.label}</button>`).join('')}</span></div>
    <div id="stage"><div id="screen">${h ? `<div class="t">${h}</div>` : '<div class="t">Not captured at this size.</div>'}</div></div></div>
    <aside>${s.aside}<div class="real">Keys: <kbd>1</kbd>–<kbd>${TABS.length + 1}</kbd> tabs · <kbd>←</kbd><kbd>→</kbd> steps · <kbd>s</kbd> window size. Drawn at ${size === '152' ? '152 × 56' : '80 × 24'}; the box is the bottom of the window.</div></aside>`;
  requestAnimationFrame(fit);
}
tabsEl.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { tab = Number(b.dataset.i); step = 0; draw(); } });
mainEl.addEventListener('click', (e) => { const b = e.target.closest('button[data-st]'); if (b) { step = Number(b.dataset.st); draw(); } });
document.getElementById('size').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; size = b.dataset.s; for (const x of document.querySelectorAll('#size button')) x.classList.toggle('on', x === b); draw(); });
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[1-9]$/.test(e.key) && Number(e.key) <= TABS.length + 1) { tab = Number(e.key) - 1; step = 0; draw(); }
  else if (e.key === 'ArrowRight' && tab) { step = Math.min(TABS[tab - 1].steps.length - 1, step + 1); draw(); }
  else if (e.key === 'ArrowLeft' && tab) { step = Math.max(0, step - 1); draw(); }
  else if (e.key === 's') document.querySelector(`#size button[data-s="${size === '152' ? '80' : '152'}"]`).click();
});
addEventListener('resize', fit);
draw();
</script>
</body>
</html>
