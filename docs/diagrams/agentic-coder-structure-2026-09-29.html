ns","ch":[],"b":1882,"lines":30,"c":"Renders app/icon.svg to icon-1024.png and icon.icns (all the sizes macOS uses). Needs Playwright (borrowed from MAIN2026's node_modules)."},{"id":"terminal/app/icon.svg","n":"icon.svg","k":"f","p":"t","git":1,"w":"the app icon, as a drawing","ch":[],"b":1529},{"id":"terminal/app/icon.icns","n":"icon.icns","k":"f","p":"t","git":1,"w":"the app icon, as macOS wants it","ch":[],"b":203207},{"id":"terminal/app/icon-1024.png","n":"icon-1024.png","k":"f","p":"t","git":1,"w":"the app icon, as a picture","ch":[],"b":48359}],"s":"the launcher, app icon","m":"agentic-coder-launcher.sh is installed as ~/.local/bin/coding: each start it rebuilds the one-file app if the code changed, then runs it. make-app.sh builds Agentic Coder.app, a double-click launcher.","files":7,"lines":181,"b":261661},{"id":"terminal/demo-project","n":"demo-project/","k":"d","p":"t","git":1,"w":"a small project the tests and demos work on","ch":[{"id":"terminal/demo-project/export.mjs","n":"export.mjs","k":"f","p":"t","git":1,"w":"a tiny exporter","ch":[],"b":609,"lines":19,"c":"Prints a trades file as CSV: node export.mjs [trades.json]"},{"id":"terminal/demo-project/export.test.mjs","n":"export.test.mjs","k":"f","p":"t","git":1,"w":"its test","ch":[],"b":529,"lines":16},{"id":"terminal/demo-project/trades.json","n":"trades.json","k":"f","p":"t","git":1,"w":"its sample data","ch":[],"b":198}],"s":"a sample project to work on","files":3,"lines":35,"b":1336},{"id":"terminal/rules","n":"rules/","k":"d","p":"t","git":1,"w":"the bug-fixing rules","ch":[{"id":"terminal/rules/bug-fixing.md","n":"bug-fixing.md","k":"f","p":"t","git":1,"w":"the rules, written in plain sentences","ch":[],"b":12543}],"s":"bug-fixing rules","m":"The one copy: its \"Every time\" steps go into the system prompt, and a bug’s kind brings its own rules (agent/rules.mjs).","files":1,"lines":0,"b":12543}],"s":"part 1 · the agent you talk to","m":"The screen, the keys, permissions, the tool loop, the focused paths (fix, change, several files, rename) and the questions it asks you. It gets its model from the models part through one file, models/index.mjs, and never reads a model’s settings directly.","files":205,"lines":26112,"b":2192753},{"id":"models","n":"models/","k":"d","p":"m","git":1,"w":"part 2 · the models we use and test","ch":[{"id":"models/index.mjs","n":"index.mjs","k":"f","p":"m","git":1,"w":"the door: the one file the terminal imports","ch":[],"s":"the door: what the terminal imports","door":1,"b":1567,"lines":15,"c":"Part 2 of Agentic Coder: the models it runs and tests. The terminal (part 1) imports only this file. What it gets: - the registry: every model's settings (one folder each), where the files live on this Mac, and how to ask a model to think; - the runtime: starting and sharing llama-server, choosing a context size that fits the Mac's memory, the saved warm-up, and coding setup; - the embedder: the small model that…"},{"id":"models/registry.mjs","n":"registry.mjs","k":"f","p":"m","git":1,"w":"the list of models, where their files live, and the engines","ch":[],"s":"the model list, where files live","b":4832,"lines":82,"c":"The models Agentic Coder can run (one folder each), and where their files live on this Mac (~/.agentic-coder)."},{"id":"models/README.md","n":"README.md","k":"f","p":"m","git":1,"w":"the models part in a page: the models, adding one, the bench","ch":[],"b":4955},{"id":"models/runtime","n":"runtime/","k":"d","p":"m","git":1,"w":"what runs a model: server, memory fit, warm-up, setup","ch":[{"id":"models/runtime/server.mjs","n":"server.mjs","k":"f","p":"m","git":1,"w":"starts, shares and stops llama-server","ch":[],"b":15820,"lines":296,"c":"Starts and looks after llama-server for one model (on the model's engine): picks a free port, waits until it is healthy, restarts it once if it crashes, and stops it when Agentic Coder exits."},{"id":"models/runtime/memory.mjs","n":"memory.mjs","k":"f","p":"m","git":1,"w":"how much memory the Mac can give, and which context size fits","ch":[],"b":7489,"lines":126,"c":"How much memory the Mac can give the model right now, and which context size fits: 32k by default, 16k when memory is short (and we say why)."},{"id":"models/runtime/warmup.mjs","n":"warmup.mjs","k":"f","p":"m","git":1,"w":"saves the model’s read-in instructions so the next start is fast","ch":[],"b":5902,"lines":103,"c":"Warming up the model before the first message. The model has to read its instructions and the tool list (~1,500 tokens, ~26 s on the 27B) before it can answer. That part is the same in every project and on every day (the caller's system prompt puts this session's details last, after sessionMark), so after the first read the server saves its state to disk and later starts restore it in a fraction of a second. Then…"},{"id":"models/runtime/setup.mjs","n":"setup.mjs","k":"f","p":"m","git":1,"w":"`coding setup`: builds the engine, downloads the models, checks them","ch":[],"b":3481,"lines":69,"c":"`coding setup`: gets what Agentic Coder needs into ~/.agentic-coder — the model server (llama.cpp built from source on the model's engine, see models/runtime/engine), the model, its guessing helper and the memory's matcher — and checks the files' SHA-256. Safe to run again: finished parts are skipped."},{"id":"models/runtime/embed.mjs","n":"embed.mjs","k":"f","p":"m","git":1,"w":"runs the meaning-matcher (bge-m3) beside the main model","ch":[],"b":3213,"lines":71,"c":"The embedder: a small model that turns texts into numbers, so that meanings can be compared (models/bge-m3). It runs in the same llama-server as the 27B, in its embedding mode, as a server of its own: started at the first use, shared between windows and kept loaded like the 27B's (server.mjs)."},{"id":"models/runtime/edited.mjs","n":"edited.mjs","k":"f","p":"m","git":1,"w":"the one edited copy of a model, made from the Weights tab","ch":[],"b":2215,"lines":58,"c":"The edited copy of a model: ONE slot, next to the original in ~/.agentic-coder/models, described by edited.json there. Each save rebuilds the copy from a fresh clone of the original plus the full edit list, so the manifest always says exactly what is in the file. The original and `coding setup`'s fingerprint check are never involved."},{"id":"models/runtime/engine","n":"engine/","k":"d","p":"m","git":1,"w":"how llama.cpp is built","ch":[{"id":"models/runtime/engine/build.mjs","n":"build.mjs","k":"f","p":"m","git":1,"w":"builds a llama-server: the official one, or Prism’s plus our patch","ch":[],"b":3335,"lines":62,"c":"Builds a model server Agentic Coder runs (ENGINES in models/registry.mjs): the official llama.cpp, or Prism ML's (branch prism) plus our Metal patch, at the engine's commit, as static llama-server and llama-bench in ~/.agentic-coder/engine/\u003ctag>/. Needs git, cmake and Apple's command line tools; about 3 minutes on the M4. `coding setup` calls it; by hand: node models/runtime/engine/build-now.mjs [official|prism]…"},{"id":"models/runtime/engine/build-now.mjs","n":"build-now.mjs","k":"f","p":"m","git":1,"w":"the same, started by hand","ch":[],"b":555,"lines":9,"c":"Builds an engine by hand (coding setup does the same when it is missing): node models/runtime/engine/build-now.mjs [official|prism] With no name: the default model's engine."},{"id":"models/runtime/engine/patch.mjs","n":"patch.mjs","k":"f","p":"m","git":1,"w":"our Metal patch as text, so the one-file app carries it","ch":[],"b":9876,"lines":206,"c":"The Metal patch as text, so the one-file `agentic-coder` binary carries it: the same bytes as pq2-multicol.patch (a test checks). Made by make-patch.mjs; do not edit by hand."},{"id":"models/runtime/engine/pq2-multicol.patch","n":"pq2-multicol.patch","k":"f","p":"m","git":1,"w":"the patch itself","ch":[],"b":9670},{"id":"models/runtime/engine/make-patch.mjs","n":"make-patch.mjs","k":"f","p":"m","git":1,"w":"regenerates patch.mjs from the patch","ch":[],"b":822,"lines":13,"c":"Regenerates patch.mjs from pq2-multicol.patch (run after changing the patch): node models/runtime/engine/make-patch.mjs The patch itself comes from `git diff` in a checkout of Prism's llama.cpp at ENGINE.commit."},{"id":"models/runtime/engine/README.md","n":"README.md","k":"f","p":"m","git":1,"w":"how the engines are built","ch":[],"b":2853}],"m":"Two engines: the official llama.cpp release, and Prism ML’s fork with our Metal patch (the default).","files":6,"lines":290,"b":27111}],"s":"server · memory fit · warm-up · setup","m":"server.mjs starts, shares and stops llama-server (a free port, one restart after a crash); memory.mjs picks a 32k context, or 16k when memory is short; warmup.mjs saves the model’s read-in instructions so the next start is fast; setup.mjs is `coding setup`.","files":12,"lines":1013,"b":65231},{"id":"models/gemma-4-12b","n":"gemma-4-12b/","k":"d","p":"m","git":1,"w":"Gemma 4 12B: the model in use","ch":[{"id":"models/gemma-4-12b/model.mjs","n":"model.mjs","k":"f","p":"m","git":1,"w":"its settings","ch":[],"b":4640,"lines":79,"c":"Gemma 4 12B it QAT (Google, quantization-aware 4-bit): the swap-in candidate measured against the 27B on 2026-09-28. Live-checked on this Mac the same morning: clean OpenAI tool calls through our engine, reads 126-128 tok/s, writes 13.2, 7.69 GB at 16k. The file was downloaded and sha-checked here."},{"id":"models/gemma-4-12b/results","n":"results/","k":"d","p":"m","git":0,"w":"raw test runs of this model","ch":[],"back":["yours","the measurements; running the tests again remakes them"],"sz":2846720}],"s":"Gemma 4 12B, 6.7 GB","m":"Google’s Gemma 4 12B, 4-bit (quantization-aware). model.mjs holds its settings: the file and checksum, its layout, sampling, and the two effort levels (Low and High).","flag":"in use","files":1,"lines":79,"b":4640},{"id":"models/qwen3.5-9b","n":"qwen3.5-9b/","k":"d","p":"m","git":1,"w":"Qwen3.5 9B: the second model","ch":[{"id":"models/qwen3.5-9b/model.mjs","n":"model.mjs","k":"f","p":"m","git":1,"w":"its settings","ch":[],"b":3830,"lines":69,"c":"Qwen3.5 9B (Alibaba's Qwen team, Feb 2026; Apache 2.0), Unsloth's UD-Q5_K_XL: a second model to try beside Gemma, added 29 Sep 2026 (their pick of file: the Q5, a bit smarter than Q4 and about Gemma's size). Since the speed test the same day it is Unsloth's MTP build of that file: the same weights plus Qwen's own MTP layer, its speed helper (see draft below). Same family as the Bonsai 27B's base: mostly Gated…"},{"id":"models/qwen3.5-9b/results","n":"results/","k":"d","p":"m","git":0,"w":"raw test runs of this model","ch":[],"back":["yours","the measurements; running the tests again remakes them"],"sz":303104}],"s":"Qwen3.5 9B, 6.9 GB","m":"Alibaba’s Qwen3.5 9B (Unsloth’s Q5 build). Pick it in /model. Its speed layer (MTP) is inside the model file. Only one model fits in 16 GB at a time.","flag":"second","files":1,"lines":69,"b":3830},{"id":"models/bge-m3","n":"bge-m3/","k":"d","p":"m","git":1,"w":"BGE-M3: the small model that compares meanings","ch":[{"id":"models/bge-m3/model.mjs","n":"model.mjs","k":"f","p":"m","git":1,"w":"its settings","ch":[],"b":1104,"lines":25,"c":"BGE-M3 (BAAI, MIT): the small model that finds the saved facts of Agentic Coder's memory that fit a request. It writes nothing: it turns a text into 1,024 numbers, and two texts that mean the same get numbers that are close, so \"run the suite\" lands next to \"the tests\". It runs in the same engine as the 27B, in its embedding mode, beside it. Measured 2026-09-26 on the M4 with a 27B loaded (20 facts, 30 requests, see…"},{"id":"models/bge-m3/README.md","n":"README.md","k":"f","p":"m","git":1,"w":"what it is and what it does","ch":[],"b":1592}],"s":"the meaning-matcher, 0.6 GB","m":"It writes nothing; it turns a text into numbers so meanings can be compared. That finds the saved facts that fit a request, and ranks files and code parts. runtime/embed.mjs runs it beside the main model.","flag":"helper","files":2,"lines":25,"b":2696},{"id":"models/bonsai-2-27b","n":"bonsai-2-27b/","k":"d","p":"m","git":1,"w":"Bonsai 2 27B: retired, kept as a recipe","ch":[{"id":"models/bonsai-2-27b/model.mjs","n":"model.mjs","k":"f","p":"m","git":1,"w":"its settings, checksum and layout","ch":[],"b":4626,"lines":76,"c":"Bonsai 2 27B (Prism ML, ternary PQ2_0): the model Bonsai Code runs today. Everything about this model lives in this folder: its settings (below), what was measured (README.md), the report pages (reports/) and the raw test runs (results/, not in git). The terminal never reads this file directly; it asks models/index.mjs for a model by id."},{"id":"models/bonsai-2-27b/README.md","n":"README.md","k":"f","p":"m","git":1,"w":"what was measured, with links to its report pages","ch":[],"b":4622},{"id":"models/bonsai-2-27b/results","n":"results/","k":"d","p":"m","git":0,"w":"raw test runs of this model; the Tests tab links into them","ch":[],"back":["yours","the measurements; the Tests tab holds links into them"],"sz":207536128}],"s":"kept as a recipe, file removed","m":"The file was removed to free the disk. model.mjs and README.md are the recipe to bring it back (import it in registry.mjs, then `coding setup`). Its raw runs are still on this Mac.","flag":"retired","files":2,"lines":76,"b":9248},{"id":"models/evals","n":"evals/","k":"d","p":"m","git":1,"w":"the test bench: run the agent with a model, grade it","ch":[{"id":"models/evals/record.mjs","n":"record.mjs","k":"f","p":"m","git":1,"w":"the test record: one line per test run","ch":[],"b":7333,"lines":113,"c":"The test record: one line per test run, kept on this Mac in ~/.agentic-coder/tests/record.jsonl (AGENTIC_HOME moves it, AGENTIC_TEST_RECORD names the file outright). Every runner adds its result with recordTest(); the hub's Tests tab reads the file live, and a snapshot page goes into the DOCS folder (tests/agentic-coder-test-record.html) so the record reaches GitHub with the other pages. A line: { id, at, kind…"},{"id":"models/evals/bench","n":"bench/","k":"d","p   const t = $('#tree'); const terms = S.q.toLowerCase().split(/\s+/).filter(Boolean);

  const rank = (n) => { const nm = n.n.toLowerCase().replace(/\/$/, ''), id = n.id.toLowerCase(); if (terms.every((x) => nm === x)) return 0; if (terms.every((x) => nm.startsWith(x))) return 1; if (terms.every((x) => nm.includes(x))) return 2; if (terms.every((x) => id.includes(x))) return 3; return 4; };
  for (const id of order) { const n = nodes.get(id); const hay = (n.id + ' ' + n.n + ' ' + plain(n.w) + ' ' + plain(n.m || '') + ' ' + (n.c || '')).toLowerCase(); if (terms.every((x) => hay.includes(x))) hits.push(n); }
  hits.sort((a, b) => rank(a) - rank(b));
  $('#status').textContent = hits.length ? (hits.length > 80 ? 'First 80 of ' + hits.length + ' matches' : hits.length + (hits.length === 1 ? ' match' : ' matches')) : '';
  if (!hits.length) { const e = el('div', 'empty'); e.append(el('b', '', 'Nothing matches “' + S.q.trim() + '”'), document.createTextNode('Try a shorter word, or part of a file name such as “sandbox” or “memory”.')); t.append(e); return; }
  const f = document.createDocumentFragment();
  for (const n of hits.slice(0, 80)) {
    const r = el('div', 'row res p-' + n.p + (!n.git ? ' local' : '')); r.setAttribute('role', 'treeitem'); r.dataset.id = n.id; r.setAttribute('aria-selected', n.id === S.sel ? 'true' : 'false'); r.tabIndex = -1;
    r.append(svgUse(isDir(n) ? 'i-dir' : 'i-file', 'ico ' + (isDir(n) ? 'd' : 'f')));
    const st = el('div', 'stack'); const pth = el('div', 'pth'); pth.append(hl(n.id === D.repo.id ? 'agentic-coder/' : n.id === D.outside.id ? 'outside the repo' : n.id, terms)); const w = el('div', 'w'); w.append(hl(plain(n.w), terms)); st.append(pth, w);
    r.append(st, el('span', 'n', numLine(n))); f.append(r);

}
function select(id, { reveal = true, focus = false } = {}) {

  S.sel = id;
  if (reveal) for (const a of ancestors(id).slice(0, -1)) S.open.add(a);
  if (S.q) { S.q = ''; $('#q').value = ''; }
  renderTree(); renderDetail(id);
  const row = $('#tree [data-id="' + CSS.escape(id) + '"]'); if (row) { row.scrollIntoView({ block: 'nearest' }); if (focus) row.focus({ preventScroll: true }); }
  syncHash();
}
function crumbBtn(id) { const n = nodes.get(id); const b = el('button', '', n.id === D.repo.id ? 'agentic-coder' : n.id === D.outside.id ? 'outside the repo' : n.n.replace(/\/$/, '')); b.type = 'button'; b.dataset.id = id; return b; }
function renderDetail(id) {
  const n = nodes.get(id), box = $('#detail'); box.replaceChildren();
  const cr = el('div', 'crumbs'); ancestors(id).forEach((a, i, all) => { cr.append(crumbBtn(a)); if (i < all.length - 1) cr.append(el('i', '', '/')); });
  const tt = el('div', 'dtitle'); tt.append(el('h2', '', n.n));
  const chip = el('span', 'chip ' + n.p); chip.append(el('i'), document.createTextNode(partName(n.p))); tt.append(chip);
  tt.append(el('span', 'chip' + (n.git ? '' : ' mac'), n.git ? 'in git' : n.virtual ? 'inside each project' : 'only on this Mac'));
  if (n.flag) tt.append(el('span', 'chip', n.flag));
  if (n.door) tt.append(el('span', 'chip', 'a door'));
  box.append(cr, tt, richEl('p', 'dwhat', n.w));
  if (n.m) box.append(richEl('p', 'dmore', n.m));
  const st = el('div', 'tiles'); const stat = (k, v, small) => { const s = el('div', 'stat'); s.append(el('div', 'k', k)); const vv = el('div', 'v', v); if (small) vv.append(el('small', '', small)); s.append(vv); st.append(s); };
  if (n.git) {
    if (isDir(n)) { stat('Files in git', fmtN(n.files)); if (n.lines) stat('Lines of code', fmtN(n.lines)); stat('Size in git', fmtBytes(n.b)); }
    else { if (n.lines != null) stat('Lines', fmtN(n.lines)); stat('Size', fmtBytes(n.b)); }
  } else { if (n.sz != null) stat('Size on disk', fmtBytes(n.sz)); if (n.pages != null) stat('Pages', fmtN(n.pages)); }
  if (st.children.length) box.append(st);
  if (n.back) { const bk = el('div', 'back'); bk.append(el('span', 'dh', 'If it is gone'), tagFor(n.back[0]), richEl('span', '', n.back[1])); box.append(bk); }
  if (isDir(n) && kids(n).length) {
    box.append(el('div', 'dh', 'Inside · ' + kids(n).length + (kids(n).length === 1 ? ' item' : ' items')));
    const ins = el('div', 'inside'); ins.setAttribute('role', 'list');
    for (const c of kids(n)) { const r = rowFor(c, 0); r.removeAttribute('role'); r.removeAttribute('aria-level'); r.removeAttribute('aria-selected'); r.removeAttribute('aria-expanded'); r.tabIndex = -1; r.dataset.pick = c.id; r.querySelector('.caret').textContent = ''; ins.append(r); }
    box.append(ins);
  } else if (n.c) {

}
const TAGS = { auto: 'Comes back by itself', cmd: 'One command remakes it', fetch: 'Fetched again', yours: 'Yours: keep', log: 'Just a log' };
function tagFor(kind) { return el('span', 'tag' + (kind === 'yours' ? ' yours' : ''), TAGS[kind] || kind); }

/* tree interaction */
$('#tree').addEventListener('click', (e) => {
  const row = e.target.closest('.row'); if (!row) return;
  const id = row.dataset.id; const n = nodes.get(id);
  if (e.target.closest('.caret') && e.target.closest('.caret').dataset.caret) { toggle(id); return; }
  if (S.sel === id && isDir(n) && !S.q) { toggle(id); return; }
  if (isDir(n) && !S.open.has(id) && !S.q && kids(n).length) S.open.add(id);
  select(id, { reveal: true, focus: true });
});
function toggle(id) { if (S.open.has(id)) S.open.delete(id); else S.open.add(id); S.sel = id; renderTree(); renderDetail(id); const r = $('#tree [data-id="' + CSS.escape(id) + '"]'); if (r) r.focus({ preventScroll: true }); syncHash(); }
$('#tree').addEventListener('keydown', (e) => {
  const row = e.target.closest('.row'); if (!row || S.q) { if (S.q && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) moveRes(e); return; }
  const list = visible().map(([n]) => n.id); const i = list.indexOf(row.dataset.id); const n = nodes.get(row.dataset.id);
  const go = (id) => { e.preventDefault(); select(id, { reveal: false, focus: true }); };
  if (e.key === 'ArrowDown' && i < list.length - 1) go(list[i + 1]);
  else if (e.key === 'ArrowUp' && i > 0) go(list[i - 1]);
  else if (e.key === 'Home') go(list[0]);
  else if (e.key === 'End') go(list[list.length - 1]);
  else if (e.key === 'ArrowRight') { e.preventDefault(); if (isDir(n) && kids(n).length && !S.open.has(n.id)) toggle(n.id); else if (isDir(n) && kids(n).length) go(kids(n)[0].id); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); if (isDir(n) && S.open.has(n.id)) toggle(n.id); else if (parentOf.has(n.id)) go(parentOf.get(n.id)); }
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (isDir(n) && kids(n).length) toggle(n.id); }
});
function moveRes(e) { const rows = [...$('#tree').querySelectorAll('.row')]; const i = rows.indexOf(e.target.closest('.row')); const nx = rows[i + (e.key === 'ArrowDown' ? 1 : -1)]; if (nx) { e.preventDefault(); nx.focus(); } }
$('#tree').addEventListener('focusin', (e) => { const r = e.target.closest('.row.res'); if (r) r.setAttribute('aria-selected', 'true'); });
$('#tree').addEventListener('keyup', (e) => { if (S.q && (e.key === 'Enter') && e.target.closest('.row')) select(e.target.closest('.row').dataset.id, { focus: true }); });
$('#detail').addEventListener('click', (e) => {
  const c = e.target.closest('.crumbs button'); if (c) { select(c.dataset.id, { focus: false }); return; }
  const r = e.target.closest('[data-pick]'); if (r) select(r.dataset.pick, { focus: false });
});
$('#q').addEventListener('input', () => { S.q = $('#q').value; renderTree(); });
$('#q').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { $('#q').value = ''; S.q = ''; renderTree(); e.stopPropagation(); }
  if (e.key === 'ArrowDown') { const first = $('#tree .row'); if (first) { e.preventDefault(); first.focus(); } }
  if (e.key === 'Enter') { const first = $('#tree .row.res'); if (first) select(first.dataset.id, { focus: true }); }
});
$('#collapse').addEventListener('click', () => { S.open = new Set([D.repo.id, D.outside.id]); S.q = ''; $('#q').value = ''; S.sel = D.repo.id; renderTree(); renderDetail(S.sel); syncHash(); });

/* ---------- tab 3: on this Mac */
function renderMac() {
  const sec = $('#mac'); sec.replaceChildren();
  const M = D.macTable;
  const note = el('p', 'macnote'); const b1 = el('span'); b1.append(el('b', '', '~/.agentic-coder is ' + fmtBytes(M.outTotal)), document.createTextNode(': ' + M.outModelsPct + '% of it is the model files.')); const b2 = el('span'); b2.append(el('b', '', 'The repo folder is ' + fmtBytes(M.repoTotal) + ' on disk'), document.createTextNode('; the files git tracks add up to ' + fmtBytes(D.repo.b) + '.'));
  note.append(b1, b2);
  sec.append(note);
  const section = (title, sub, rows) => {
    const s = el('div', 'sect'); const h = el('h3', '', title); h.append(el('span', '', sub)); s.append(h);
    const hd = el('div', 'mrow head'); for (const t of ['Place', 'What is in it', 'Size, to scale within this table', 'If it is gone']) hd.append(el('span', '', t)); s.append(hd);
    const max = Math.max(...rows.map((r) => r.sz)), total = rows.reduce((a, r) => a + r.sz, 0);
    for (const r of rows) {
      const row = el('div', 'mrow'); row.tabIndex = 0;
      const pl = el('span', 'pl', r.name); pl.title = r.name; const wt = richEl('span', 'wt', r.w); wt.title = plain(r.w); row.append(pl, wt);
      const sz = el('span', 'sz'); const bar = el('span', 'bar'); const fill = el('i'); const wpct = Math.max(0, (r.sz / max) * 78); fill.style.width = wpct + '%'; const val = el('span', 'val', fmtBytes(r.sz)); val.style.left = 'calc(' + wpct + '% + 8px)'; bar.append(fill, val); sz.append(bar); row.append(sz);
      const bk = el('span', 'bk'); bk.title = TAGS[r.back[0]] + ': ' + plain(r.back[1]); bk.append(tagFor(r.back[0]), richEl('span', '', r.back[1])); row.append(bk);
      row.dataset.tipTitle = r.name; row.dataset.tipVal = fmtBytes(r.sz); row.dataset.tipSub = (total ? Math.round((r.sz / total) * 100) : 0) + '% of the ' + fmtBytes(total) + ' listed in this table';
      row.dataset.go = r.go; s.append(row);
    }
    return s;
  };
  sec.append(section('In the repo folder, not in git', 'each row can be opened in “Find a file”', M.repo), section('Outside the repo', '', M.out));
}
const tip = $('#tip');
function showTip(row, x, y) { tip.replaceChildren(); const b = el('b', '', row.dataset.tipVal), s = el('span', '', row.dataset.tipTitle + ' · ' + row.dataset.tipSub); tip.append(b, s); tip.hidden = false; const r = tip.getBoundingClientRect(); tip.style.left = Math.min(innerWidth - r.width - 8, x + 14) + 'px'; tip.style.top = Math.min(innerHeight - r.height - 8, y + 16) + 'px'; }
$('#mac').addEventListener('pointermove', (e) => { const r = e.target.closest('.sz'); if (r) showTip(r.closest('.mrow'), e.clientX, e.clientY); else tip.hidden = true; });
$('#mac').addEventListener('pointerleave', () => { tip.hidden = true; });
$('#mac').addEventListener('focusin', (e) => { const r = e.target.closest('.mrow'); if (r && r.dataset.tipVal) { const b = r.getBoundingClientRect(); showTip(r, b.left + b.width * 0.55, b.top); } });
$('#mac').addEventListener('focusout', () => { tip.hidden = true; });

/* ---------- tabs, keys, hash */
const TABS = ['map', 'explore', 'mac'];
let tab = 'map';
function fit() {
  const m = document.querySelector('main'); const top = m.getBoundingClientRect().top + scrollY; const avail = innerHeight - top - 14;
  const wide = innerWidth > 1000;
  m.style.height = tab !== 'map' && wide ? Math.max(avail, 500) + 'px' : 'auto';
  $('#map').style.minHeight = tab === 'map' ? Math.max(avail, 0) + 'px' : '';
}
addEventListener('resize', fit);
function showTab(t, { focus = false } = {}) {
  tab = t;
  for (const id of TABS) { const on = id === t; $('#' + id).hidden = !on; const b = $('#tab-' + id); b.setAttribute('aria-selected', on ? 'true' : 'false'); b.tabIndex = on ? 0 : -1; }
  $('#lead').textContent = LEADS[t];
  $('#legend').hidden = t === 'mac';
  fit();
  if (t === 'explore') { renderTree(); renderDetail(S.sel); }
  if (focus) $('#tab-' + t).focus();
  syncHash();
}
function syncHash() { try { history.replaceState(null, '', '#' + tab + (tab === 'explore' && S.sel !== D.repo.id ? '/' + encodeURIComponent(S.sel) : '')); } catch (e) { /* a file page may refuse */ } }
document.querySelector('nav.tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b) showTab(b.dataset.tab); });
document.querySelector('nav.tabs').addEventListener('keydown', (e) => {
  const i = TABS.indexOf(tab);
  if (e.key === 'ArrowRight') { e.preventDefault(); showTab(TABS[(i + 1) % 3], { focus: true }); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); showTab(TABS[(i + 2) % 3], { focus: true }); }
});
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (!typing && e.key >= '1' && e.key <= '3') { showTab(TABS[+e.key - 1]); }
  else if (!typing && e.key === '/') { e.preventDefault(); showTab('explore'); $('#q').focus(); }
});
// jump from the map (or a chip) into the explorer
document.addEventListener('click', (e) => {
  const g = e.target.closest('[data-go]'); if (!g) return;
  const id = g.dataset.go; if (!nodes.has(id)) return;
  showTab('explore'); S.sel = id; select(id, { reveal: true });
});
function fromHash() {
  const h = decodeURIComponent(location.hash.slice(1)); const [t, ...rest] = h.split('/'); const id = rest.join('/');
  if (TABS.includes(t)) { if (t === 'explore' && id && nodes.has(id)) { S.sel = id; for (const a of ancestors(id).slice(0, -1)) S.open.add(a); } showTab(t); } else showTab('map');
}
renderMap(); renderMac(); fromHash();
window.__structure = { D, nodes, S, showTab, select };
})();
