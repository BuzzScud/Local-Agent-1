and the bar under the footer (8 Oct 2026, the owner's pick \"1 · Fuel line\" from docs/private/design rounds/agentic-coder-usage-2-designs-2026-10-08.html): what is left of the month's spend cap, today's dollars, and the limits each minute. - The limits come with every reply (the anthropic-ratelimit-* headers; a free call such as a token count carries none).","nw":1},{"id":"terminal/src/agent/claude.mjs","n":"claude.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":324,"b":25079,"w":"the conversation as one Claude API request, when /remote runs on Claude","c":"The chat when the remote is the Claude API (/remote, Run on: Claude API): the agent's conversation (OpenAI format: role system / user / assistant with tool_calls / tool) becomes one Messages API request, and Claude's stream comes back as the same events as every other kind (client.mjs). - Its thinking blocks are kept, by the reply they came with, and sent back unchanged with it, as the API asks. The app trims old…"},{"id":"terminal/src/agent/client.mjs","n":"client.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":382,"b":24601,"w":"streams a reply from llama-server: thinking, text, tool calls","c":"Streams one chat completion from llama-server (OpenAI format) and turns the SSE chunks into simple events: reasoning, text, tool-call pieces, done. A remote (/remote) is asked the same way, with its API key; an OpenAI-compatible one (not llama.cpp) gets only the standard fields, and the Claude API goes through Anthropic's own Messages API (claude.mjs)."},{"id":"terminal/src/agent/command-words.mjs","n":"command-words.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":351,"b":21188,"w":"what a shell command does, as the permissions read it: the commands blocked in every mode, the paths a command names…","c":"What a shell command does, as the permissions read it (permissions.mjs, moved here on 13 Oct 2026 so each file can be read whole): the commands blocked in every mode (BLOCKED, blockedReason), the paths a command names outside the project (outsidePath), its words as the shell sees them (shellWords), its parts (splitCommand), whether it only reads (isReadOnly) or runs tests (runsTests, testRunOf), and the text of it a…","nw":1},{"id":"terminal/src/agent/design.mjs","n":"design.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":578,"b":38467,"w":"the design examples: short cards on how a good page looks, sent along with a page request","c":"The design examples: a folder of short \"design cards\" (the colours, type, spacing and skeleton of a page that looks right, with its do's and don'ts) that go along with a request to make or restyle a page, so a small model builds in a look the user already liked instead of inventing one. The model's weights never change; it is handed the closest card each time, the way a designer is handed a mood board. where…"},{"id":"terminal/src/agent/drift.mjs","n":"drift.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":65,"b":4459,"w":"Stays on task: on a model on another machine, every DRIFT_EVERY steps one short call asks whether the work still…","c":"Stays on task (/hooks, 4 Oct 2026, the owner's picks): on a model on another machine, every DRIFT_EVERY steps one short call asks whether the work still serves the request. Off task, the model gets one line that brings it back and the run goes on (at most DRIFT_NUDGES a message).","nw":1},{"id":"terminal/src/agent/expertise.mjs","n":"expertise.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":260,"b":13838,"w":"your MATH notes folder, indexed so the right notes come along","c":"The user's own mathematics: the MATH folder on their Desktop (~11 MB of notes, far more than the model can read). At start it is indexed into areas (a chapter folder or a top-level folder) with keywords; the system prompt carries a one-line map of the areas; when a request uses an area's words, that section's notes go with the request the way a bug's steps do (src/agent/rules.mjs). The folder is read-only here…"},{"id":"terminal/src/agent/facts.mjs","n":"facts.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":626,"b":35520,"w":"the memory store: one small file per fact, an index, a log","c":"Agentic Coder's memory, as facts: one small file per fact, a short index that is read at every start, a folder for retired facts and a log of every change. <project>/.agentic/memory/ what holds for this project (beside an older .bonsai/notes.md: .bonsai/memory/) ~/.agentic/memory/ what holds for you, in every project index.md one line per fact (rebuilt after every change) facts/*.md the facts retired/*.md facts…"},{"id":"terminal/src/agent/folder.mjs","n":"folder.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":223,"b":12954,"w":"a folder of data, as the model meets it: what kind of folder it is, what it says about itself, and which of its…","c":"A folder of data, as the model meets it (4 Oct 2026): what kind of folder it is, what it says about itself (a README, a manifest), and which of its names a request uses. Why: asked to backtest \"the nq and es data\" in a folder of 44 contract folders and a manifest.json, Qwen3.6 took the micro contracts (MNQ, MES) from the listing.","nw":1},{"id":"terminal/src/agent/helper-models.mjs","n":"helper-models.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":163,"b":11091,"w":"the helper models of /subagents at work: other models on the same Ollama service as the main one, each with a job","c":"The helper models of /subagents at work (2 Oct 2026, the user's picks): other models on the same Ollama service as the main one, each with a job. The panel and the defaults are terminal/src/app/subagents.mjs; this file is what each job does.","nw":1},{"id":"terminal/src/agent/helpers.mjs","n":"helpers.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":183,"b":11769,"w":"context helpers: what comes along with a request (Scout, Medic, Oracle, Sentry)","c":"Context helpers: what comes along with a request so the model needs fewer steps to find it (plan of 28 Sep 2026, in docs/gemma-docs). Gemma reads about 120 tokens a second and writes about 12, so a step it does not have to take (open a file, run the tests) saves far more than reading what it would have found. The helpers share CEILING tokens; one with nothing to add passes its share on, and each brings only what…"},{"id":"terminal/src/agent/images.mjs","n":"images.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":113,"b":6340,"w":"pictures in the conversation, put in the form each server takes","c":"Pictures in the conversation. A message (yours, or a Read's result) can carry `images` beside its text: [{ path, mime, data, w, h }] (data: base64). The code that works on text never sees them: each request puts them in the form its server takes (openAIMessages here for llama.cpp and OpenAI-compatible servers, claude.mjs for the Claude API). Only the latest KEEP_IMAGES go with a request; an older one becomes a line…"},{"id":"terminal/src/agent/instructions.mjs","n":"instructions.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":90,"b":7493,"w":"the instructions you can edit, shared by the conversation and the focused paths","c":"Editable behavior shared by the conversation and focused coding calls."},{"id":"terminal/src/agent/ladder.mjs","n":"ladder.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":127,"b":6870,"w":"the ladder: a folder a model reads from the top down instead of all at once, the same shape for both","c":"The ladder (3 Oct 2026, the owner's picks for the code maps and the pack of Claude's notes): a folder a model reads from the top down instead of all at once, the same shape for both.","nw":1},{"id":"terminal/src/agent/lessons.mjs","n":"lessons.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":372,"b":25082,"w":"decides what is worth keeping after a task","c":"Saving on its own: after a task and when the window closes, what is worth keeping goes into the memory (facts.mjs) without being asked. The model reads what happened in each turn (the agent writes that down itself: what was asked, which files changed, whether the check passed, the tries, where it got stuck, what you corrected) and the conversation, and answers with at most five facts. It runs on the side slot, so…"},{"id":"terminal/src/agent/library.mjs","n":"library.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":796,"b":55981,"w":"the design library","c":"The design library (8 Oct 2026, the owner: \"can we make the agents better at ui design and design in general? can we download the latest ui designs and templates for the agentic coder to use?\").","nw":1},{"id":"terminal/src/agent/look.mjs","n":"look.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":35,"b":2518,"w":"Look first (/effort’s row): a minimum of looking around before the model answers","c":"Look first (/effort's row, 30 Sep 2026): a minimum of looking before the model answers. The owner's ask: \"set a minimum time … so it gathers as much info as it can to answer correctly\". Thinking gathers nothing (it reasons over what is already in front of the model); reading does. So with Look first on, a task that goes step by step starts with a note to look around first, and an answer that comes before the minimum…"},{"id":"terminal/src/agent/made.mjs","n":"made.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":75,"b":4291,"w":"the files a command wrote","c":"The files a command wrote (4 Oct 2026). Write and Edit are counted as they happen; a script that writes a page (with open(path, 'w') in Python) was not, so nothing checked the report page Qwen3.6 made on the Desktop, and the second look never knew of it.","nw":1},{"id":"terminal/src/agent/mcp.mjs","n":"mcp.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":505,"b":35505,"w":"MCP tools as the model and the permissions see them","c":"MCP tools as the model and the permissions see them (3 Oct 2026). The servers themselves, and the calls to them, are in tools/mcp.mjs; this file is the part with no connection in it: - a tool's name here (mcp__<server>__<tool>), and its fingerprint: its description and its arguments, hashed, so a tool that changes after you allowed it is noticed; - the catalog: every tool of every connected server, with your own…","nw":1},{"id":"terminal/src/agent/memory.mjs","n":"memory.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":67,"b":3547,"w":"\"update memory\" and \"remember that …\": saves what matters","c":"What asks for the memory, and where a folder's memory lives. \"update memory\" (or \"remember that …\") saves into the memory's facts (facts.mjs, lessons.mjs). Before the facts there was one notes file per folder, .bonsai/notes.md or .agentic/notes.md, written by \"update memory\"; its lines were carried into the facts at the first start (openMemory). A file that is still there is no longer read as rules (30 Sep 2026…"},{"id":"terminal/src/agent/opening.mjs","n":"opening.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":162,"b":11126,"w":"the opening read: before the first step of a conversation, a model on another machine gets the memory whole and…","c":"The opening read (3 Oct 2026, the owner's ask \"make them read memory like this too\", with a picture of Claude Code's \"Reading all memory files\" step): before the first step of a conversation, a model on another machine (the remote set) gets the memory whole and where the project stands, read by the app in one go.","nw":1},{"id":"terminal/src/agent/page-read.mjs","n":"page-read.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":99,"b":6983,"w":"what a reader sees of a page the message wrote","c":"What a reader sees of a page the message wrote (4 Oct 2026). Asked for \"all of the math, formulas and logic\" in one self-contained page, Qwen3.6 built ~/Desktop/thesis-math-library.html: 8 sections that showed only their headings, the 34 KB of content inside <script>, 385 characters on screen. It said it was done; nothing had looked at the page, and the second look sees only what the app records.","nw":1},{"id":"terminal/src/agent/permissions.mjs","n":"permissions.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":475,"b":34732,"w":"what runs at once, what asks first, and what is never allowed","c":"Which tool calls run straight away, which ask you first, and which are never allowed. Modes: ask (default), edits (file changes go through), plan (read-only: it may look but not change anything)."},{"id":"terminal/src/agent/profile-meters.mjs","n":"profile-meters.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":92,"b":4595,"w":"what each profile's requests did today: how many, the wait before the first word, the writing speed, how many went…","c":"What each profile's requests did today (/profiles, 8 Oct 2026, the owner's pick of the full build): how many, the wait before the first word (mostly the wait in line on a busy service), the writing speed, how many went to the backup, and what they cost.","nw":1},{"id":"terminal/src/agent/profile-spill.mjs","n":"profile-spill.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":3,"b":226,"w":"how long a profile's requests go straight to its backup after a spill: a server busy for one request is mostly busy…","c":"How long a profile's requests go straight to its backup after a spill (client.mjs spilling, app/profile-router.mjs): a server busy for one request is mostly busy for the next ones too.","nw":1},{"id":"terminal/src/agent/projects.mjs","n":"projects.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":76,"b":3789,"w":"goes into the project a request names, when started in the home folder","c":"Started in a folder that is not a project (the home folder, say), Agentic Coder can go into the project a request names: \"fix the chart bug in MAIN2026\"."},{"id":"terminal/src/agent/prompt-files.mjs","n":"prompt-files.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":416,"b":24213,"w":"the prompt files in terminal/rules/: TOOLS.md and SKILLS.md, read at each use","c":"The prompt files in terminal/rules/ (30 Sep 2026, the hub's Instructions → Prompt files): TOOLS.md is the \"Tool use\" part of the instructions, and SKILLS.md holds steps for kinds of task, each brought by its words. Read from disk at each use, so a save in the hub applies on the next message; the copy built into the app is used when the repo is not here."},{"id":"terminal/src/agent/prompt.mjs","n":"prompt.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":287,"b":18805,"w":"the system prompt: short and concrete, written for a small model","c":"The system prompt: short and concrete, written for a small model."},{"id":"terminal/src/agent/questions.mjs","n":"questions.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":226,"b":13986,"w":"Questions in plain words","c":"Questions in plain words (3 Oct 2026). A question to you is one or more questions asked one after another, each with up to four choices; a choice has a short label, a line saying what it means for you (shown under the list for the choice you are on), and may be the one recommended. A question may let you tick several choices.","nw":1},{"id":"terminal/src/agent/qwen-raw.mjs","n":"qwen-raw.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":214,"b":10892,"w":"Qwen 3.5 and 3.6 on an Ollama service, read here instead of by Ollama","c":"Qwen 3.5 and 3.6 on an Ollama service, read here instead of by Ollama (8 Oct 2026, the owner: \"how do we make it more like you in this step?\"). Ollama turns the model's call text into arguments with its own parser, and a part it cannot read is left out without a word: that day Qwen3.6's Writes came with only \"path\" and its Edits without \"old_text\".","nw":1},{"id":"terminal/src/agent/rank.mjs","n":"rank.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":94,"b":5992,"w":"finds which files a request is about, by meaning","c":"Which files a request is about, found by meaning before the model reads anything. The memory's small model (BGE-M3, already running beside Gemma) turns each code file's card (its path, its top-level names and its first lines) and the request into numbers; the closest files come first. Reading was ~84% of a task's time in the bake-off: the step-by-step loop found and read files one step at a time, each step a full…"},{"id":"terminal/src/agent/recall.mjs","n":"recall.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":221,"b":13176,"w":"brings back the saved facts that fit a request","c":"Bringing facts back: the saved facts (facts.mjs) that fit a request come along with it, the way a bug's steps and the math notes do. They are found by meaning, with the small model of the models part (BGE-M3): the request and every fact become numbers, and the facts closest to the request are taken. Without that model the facts are found by the words they share. A fact's numbers are worked out once and kept beside…"},{"id":"terminal/src/agent/room.mjs","n":"room.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":18,"b":1494,"w":"how much of your rules and of the files a question names is read first (/effort’s two rows)","c":"How much of your rules and of the files a question names is read before the first step: /effort's \"Rules room\" and \"Up-front reading\" rows. 0 = auto, a share of the Context, so a bigger Context reads more by itself (30 Sep 2026). Sizes are in characters, about 4 to a token. Measured that day on this repo: your rules (7,892 + 1,438 characters) did not fit the old 9,000, and the old flat 45,000 was about 70% of a 16k…"},{"id":"terminal/src/agent/rules.mjs","n":"rules.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":69,"b":3014,"w":"the bug-fixing rules, read from terminal/rules/ and picked by kind of bug","c":"Agentic Coder's bug-fixing rules. terminal/rules/bug-fixing.md is the only copy: its \"Every time\" steps go into the system prompt, and a bug's kind (sorted by the kind's Words) adds that kind's steps to the request."},{"id":"terminal/src/agent/scripts.mjs","n":"scripts.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":178,"b":11077,"w":"Long scripts as files","c":"Long scripts as files (4 Oct 2026). A script typed into a command as a heredoc (python3 - <<'EOF' … EOF) of SCRIPT_LINES lines or more is also saved as a file, under the app's home (the owner's pick: your folders stay as they were), and the model reaches it as SCRIPTS/<n>-<name>.<ext>: it reads and edits it there like a file of the project, and runs it with python3 SCRIPTS/…, which the app maps to the real folder…","nw":1},{"id":"terminal/src/agent/search.mjs","n":"search.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":106,"b":6246,"w":"the search settings (/effort’s Search rows) and the steps they add to every search","c":"The search settings (/effort's three Search rows) and the two steps they can add to the searches the helpers run (the code search, Read first's file ranking, the saved facts, Claude's notes): embedder 'bge-m3' finds pieces by meaning (models/bge-m3); 'off' leaves every search to its own word matching, and the code search pauses. retriever 'meaning' orders the pieces by meaning alone (as before); 'hybrid' merges that…"},{"id":"terminal/src/agent/second-look.mjs","n":"second-look.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":95,"b":7444,"w":"Second look: when a message ran commands, wrote files or fetched pages, one short call checks the final answer…","c":"Second look (/hooks, on: the owner's pick of 4 Oct 2026, \"On, after real work\"): when a message ran commands, wrote files or fetched pages, one short call checks the final answer against what the app saw happen, and sends it back once when it does not hold.","nw":1},{"id":"terminal/src/agent/seen.mjs","n":"seen.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":157,"b":8110,"w":"the files the model has seen in this conversation, each kept as it was then: read by the model, given by the app…","c":"The files the model has seen in this conversation, each kept as it was then: read by the model, given by the app before its first step, or written by the model itself. Like Claude Code, an existing file is changed only from what is really there now: one that changed on disk since it was seen (a formatter, a command, you in your editor, another session) is not edited from the old copy.","nw":1},{"id":"terminal/src/agent/self.mjs","n":"self.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":58,"b":3036,"w":"Agentic Coder working on itself: Bypass permissions on the Claude API","c":"Agentic Coder working on itself (the owner's pick, 8 Oct 2026): Bypass permissions on the Claude API (permissions.mjs isSelf).","nw":1},{"id":"terminal/src/agent/spend.mjs","n":"spend.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":176,"b":10492,"w":"the cost meter: what this window's requests to a paid service cost, and today's total over every window","c":"The cost meter (/remote): what this window's requests to a paid service cost, and today's total over every window. Each window keeps one small file a day, spend/<day>/<pid>.json, so the total adds up the windows you closed too, and no two windows ever write the same file.","nw":1},{"id":"terminal/src/agent/studio.mjs","n":"studio.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":438,"b":27200,"w":"the design studio: ready-made UI pieces in your look, brought with a page request","c":"The design studio: a folder of ready-made UI pieces (cards, forms, navigation, tables, pop-ups) written with Tailwind classes in the user's own look, the way Preline or Float UI keep theirs. A request to make a page brings the pieces that fit it, as real code, so a small model puts proven parts together instead of inventing a design; after each change Agentic Coder builds the CSS for the page's classes into the page…"},{"id":"terminal/src/agent/tests-first.mjs","n":"tests-first.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":32,"b":1864,"w":"the tests before the first step stop after a minute","c":"The tests before the first step (agent-read.mjs runTestsFirst) stop after a minute. A folder whose run was cut off is remembered, and its next messages skip that run for a week (9 Oct 2026: in Agentic Coder's own repo, whose tests take about 4 minutes, every fix-type message and every loop run spent its first minute, and up to 340 MB, on a run that always ended \"stopped after 60 s\"; the model then ran the tests…","nw":1},{"id":"terminal/src/agent/think-tags.mjs","n":"think-tags.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":78,"b":3415,"w":"a model’s own thinking tags (K2 Horizon’s), split from its answer","c":"A model that writes its thinking between tags of its own (thinkTags in its model.mjs: K2 Horizon's <ifm|think>, <ifm|think_fast>, <ifm|think_faster>). llama.cpp's server learns one pair from the chat template, so depending on the level the thinking arrives one of three ways: split already: thinking in reasoning_content, the answer in content; all in content: \"…thinking<\/ifm|think_fast>the answer\"; all as thinking…"},{"id":"terminal/src/agent/timing.mjs","n":"timing.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":87,"b":5610,"w":"where a request's time goes","c":"Where a request's time goes (5 Oct 2026, the owner: \"CAN WE BUILD #2?\"). In the shootout's runs a model on a service spent about three quarters of its time on its replies, and with thinking off a short reply still took 60-80 s; nothing saved said whether the service was reading the conversation or writing.","nw":1},{"id":"terminal/src/agent/tools-args.mjs","n":"tools-args.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":263,"b":19237,"w":"a tool call's arguments: patches, the other names a model gives a field, what a call needs, and how a call is shown","c":"A tool call's arguments (tools.mjs): patches, the other names a model gives a field, what a call needs, and how a call is shown. Moved from tools.mjs word for word.","nw":1},{"id":"terminal/src/agent/tools-defs.mjs","n":"tools-defs.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":227,"b":22529,"w":"the tools a model is offered: their definitions and schemas, and the names a model may use for them instead","c":"The tools a model is offered (tools.mjs): their definitions and schemas, and the names a model may use for them instead. Moved from tools.mjs word for word.","nw":1},{"id":"terminal/src/agent/tools-edit.mjs","n":"tools-edit.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":232,"b":13676,"w":"Edit matching and the syntax checks after a change","c":"Edit matching and the syntax checks after a change (tools.mjs). Moved from tools.mjs word for word.","nw":1},{"id":"terminal/src/agent/tools-paths.mjs","n":"tools-paths.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":184,"b":11599,"w":"where a path a model typed points: a near name when it is not there, the shelves outside the project, and resolvePath","c":"Where a path a model typed points (tools.mjs): a near name when it is not there, the shelves outside the project, and resolvePath. Moved from tools.mjs word for word.","nw":1},{"id":"terminal/src/agent/tools-web.mjs","n":"tools-web.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":213,"b":17008,"w":"the web tools and the plain commands read as tools: logins and walls, WebSearch, WebFetch, where a new file goes by…","c":"The web tools and the plain commands read as tools (tools.mjs): logins and walls, WebSearch, WebFetch, where a new file goes by default, and a cat or curl taken as Read or WebFetch. Moved from tools.mjs word for word.","nw":1},{"id":"terminal/src/agent/tools.mjs","n":"tools.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":561,"b":46163,"w":"the seven tools the model can call, and the code that runs them","c":"The tools the model can call (eight, and five more when the model decides: MODEL_TOOL_DEFS): definitions it sees, argument checks, what the terminal shows for each, and the code that runs them."},{"id":"terminal/src/agent/tryout.mjs","n":"tryout.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":83,"b":6269,"w":"the try-out: one short real task for a model on an Ollama service, before it is trusted with work","c":"The try-out (2 Oct 2026, the user's pick: \"the first time I pick it\"): one short real task for a model on an Ollama service, before it is trusted with work.","nw":1},{"id":"terminal/src/agent/user-hooks.mjs","n":"user-hooks.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":239,"b":14587,"w":"Your own hooks: commands of yours the app runs at seven moments, in Claude Code's own layout, so a hook can be…","c":"Your own hooks (3 Oct 2026, the owner's pick): commands of yours the app runs at seven moments, in Claude Code's own layout, so a hook can be copied over from there and back. They sit beside the app's own checks (way.mjs HOOKS), which /hooks lists with them.","nw":1},{"id":"terminal/src/agent/way.mjs","n":"way.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":202,"b":17563,"w":"Who decides (/effort’s row): the app, or the model as in Claude Code","c":"Who decides (/effort's row, \"way\" in settings.json, AGENTIC_WAY): the app or the model. The user's ask of 30 Sep 2026 was to bring the six steps of a request as close to Claude Code as they can go (docs/diagrams/agentic-coder-question-walkthrough-2026-09-30.html, tab 2). app (the default, as before) the app sorts the request with word rules, runs a focused path (rename, fix, change), reads for the model before its…"}],"files":79,"lines":20084,"b":1374016,"w":"the loop, its rules, and the memory","m":"agent.mjs sends the conversation to the model, runs the tool it picks (asking you first when needed) and repeats, up to 40 steps. Around it: permissions, the system prompt, and the memory (facts, recall, lessons)."},{"id":"terminal/src/flows","n":"flows/","k":"d","p":"t","git":1,"ch":[{"id":"terminal/src/flows/apply.mjs","n":"apply.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":48,"b":2689,"w":"applies a finished change to your real files after you approve it","c":"Applying a finished change to your real files: show the diff and ask (as in the tool loop: yes / yes for this session / no), unless edits are on auto-accept. A protected file (.env, .git/…, yours from /permissions) asks even then, with no \"allow all edits\"."},{"id":"terminal/src/flows/blocks.mjs","n":"blocks.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":85,"b":4728,"w":"edit blocks: describe changes to several places without rewriting files","c":"Edit blocks: how a try describes changes to several files, or several places in one file, without rewriting whole files (writing is the slow part: about 10 tokens a second). The model copies the old lines and writes the new ones; the blocks are matched the way the Edit tool matches (exact, then forgiving of indentation and one-character slips)."},{"id":"terminal/src/flows/change.mjs","n":"change.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":269,"b":19083,"w":"add or change code, test first","c":"Add or change code, test first: find the file, have the model write a test that defines \"done\" (it must fail on today's code), let you approve it, then try versions in the scratch copy until every test passes. A project without tests gets a throwaway check instead, kept out of your project."},{"id":"terminal/src/flows/clarify.mjs","n":"clarify.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":122,"b":8297,"w":"asks before starting when a request is vague","c":"Asking before starting. A vague request (\"api\", \"fix the bug\" when nothing fails, \"make it faster\") used to send the model wandering for minutes; now it asks you one question first, and the answer travels with the request. - \"fix the bug / the test / it\" with passing tests (or no tests): a fixed question, no model needed. With failing tests the fix path is the answer. - one to four words that name no file or code…"},{"id":"terminal/src/flows/excerpts.mjs","n":"excerpts.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":97,"b":4769,"w":"the parts of a big file that a fix needs","c":"The parts of a file a fix needs, when the whole file cannot be shown: a page or stylesheet (no functions to pick), or code too big to read whole. The model names a few exact strings to look for (a selector, an id, a name); the lines that hold them, with a little around each, are shown, and the fix comes back as edit blocks against those lines."},{"id":"terminal/src/flows/explain.mjs","n":"explain.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":128,"b":7828,"w":"\"explain this code\": reads the code first, no search","c":"\"Explain this code\": a question gets the code it is about read before the model's first step, with no model call and no search: files it names read whole, or (long) their parts and the lines that match the question (agent.mjs, prefetch) names it uses `paginate()`, fitContext, \"the test command\" for testCommand: the part of the file that defines each, found in the project map a very small project all of its code…"},{"id":"terminal/src/flows/fix.mjs","n":"fix.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":245,"b":18861,"w":"fix: run the tests, find the code, try versions in a scratch copy, show the diff","c":"Fix: run the tests, find the code the failure points at, try corrected versions in the scratch copy until the tests pass, then show the diff."},{"id":"terminal/src/flows/index.mjs","n":"index.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":286,"b":21220,"w":"sorts a request into a type and runs the path built for it","c":"Sorting a request into a type and running the path built for it: rename → the built-in rename (no model) fix → tries against the failing tests change → test first, then tries question / other → the step-by-step tool loop"},{"id":"terminal/src/flows/layoutcheck.mjs","n":"layoutcheck.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":637,"b":43474,"w":"after a page is made or changed, opens it in a real browser and measures it","c":"The layout check: after a request that made or changed a page, the page is opened in a real browser (headless Chrome: the Mac's own, or the one Playwright keeps in its cache; nothing is installed) and measured, because a small model cannot see what it built. What it looks for is breakage anyone would call a bug, never taste: sideways the page scrolls sideways (or text is cut at the right edge), at 1440×900 and on a…"},{"id":"terminal/src/flows/llm.mjs","n":"llm.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":137,"b":8922,"w":"one focused model call: short prompt, no tools, optional JSON shape","c":"One focused model call: a short system prompt, one user message, no tools. Optionally forced into a JSON shape (the server constrains the output). thinking: think first, at the chat's level (Medium/High); used for writing code and tests. Sorting and choosing (JSON answers) never think."},{"id":"terminal/src/flows/localize.mjs","n":"localize.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":152,"b":8318,"w":"finds the code a request is about","c":"Finding the code a request is about: files named in it, files a failing test run points at (stack frames, the failing tests' imports), and, when neither says, the model choosing from the project's own file list."},{"id":"terminal/src/flows/multi.mjs","n":"multi.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":224,"b":15595,"w":"change several files at once","c":"Changing several files at once (an option used in three files, a new argument and its callers): the files are planned, a test that defines \"done\" is written and approved (src/flows/testfirst.mjs), then drafts and tries describe their changes as edit blocks (src/flows/blocks.mjs) across all the files in the scratch copy. Whole files are never rewritten."},{"id":"terminal/src/flows/pagecheck.mjs","n":"pagecheck.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":375,"b":24466,"w":"checks first for page bugs the tests cannot see, such as something covered","c":"Check first, for a bug the test suite cannot see on a page (a layout bug: something covered, behind, underneath). Before any fix, Agentic Coder opens the page in the browser the project already has (Playwright), does what the request describes, finds what covers what and why, and writes a small check that fails today. The fix is then tried against that check, and the check stays in the project so the bug cannot come…"},{"id":"terminal/src/flows/pagescripts.mjs","n":"pagescripts.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":416,"b":22190,"w":"the two scripts the page check runs","c":"The two scripts the page check runs with node (src/flows/pagecheck.mjs): the probe looks at a page for Agentic Coder (what can be clicked, what covers what, and why); it lives in the scratch copy only the check the small script left in your project: exit 0 = pass, 1 = the bug shows, 2 = the check could not run Both open the page the same way and use the browser the project already has (Playwright). They are kept as…"},{"id":"terminal/src/flows/rename.mjs","n":"rename.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":181,"b":8149,"w":"rename everywhere as one diff, with no model","c":"Built-in rename: every use of a name in the project's code, shown as one diff and applied in one go. No model needed. Only code changes: a word inside quotes or a comment is text, not the name (\"rename test to check\" once turned 'node:test' into 'node:check'). A name imported from a package keeps its real name and gets an alias (import { test as check } from 'node:test'). Text files (README, JSON, …) are left alone.…"},{"id":"terminal/src/flows/rescue.mjs","n":"rescue.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":93,"b":6378,"w":"when only old tests fail because the new behaviour differs","c":"When every try fails only because EXISTING tests expect the old behaviour (a new field changes an expected value — task 28's class), the flows used to give up to the slower step-by-step way, whose edits may touch tests. Now one more round does it here: the model updates only the stale expected values, in test files only. Guards: the approved new test must survive, no test may disappear (test counts may not drop)…"},{"id":"terminal/src/flows/results.mjs","n":"results.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":51,"b":3658,"w":"reads test-runner output (node:test, Jest, Vitest, Mocha, pytest, unittest)","c":"Reads test-runner output: how many passed and failed, and which failed. Knows node:test, Jest, Vitest, Mocha, pytest and unittest; otherwise the exit code decides."},{"id":"terminal/src/flows/scratch.mjs","n":"scratch.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":172,"b":9671,"w":"a scratch copy of the project where tries are tested","c":"A scratch copy of the project where tries are written and tested, so your real files change only after you approve. Uses APFS clones (instant, no extra disk); heavy folders such as node_modules are linked, not copied. .git is not copied: the copy gets a small git of its own that reads your project's history, so tests that ask git which files are tracked or ignored work as they do in your project, and a test that…"},{"id":"terminal/src/flows/testfile.mjs","n":"testfile.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":80,"b":3974,"w":"adds a model-written test to a test file","c":"Adding a model-written test to a test file: its import lines are merged with the file's own, the rest goes at the end."},{"id":"terminal/src/flows/testfirst.mjs","n":"testfirst.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":70,"b":5647,"w":"the test that defines \"done\", shared by change and multi","c":"The test that defines \"done\", shared by the change path (one file) and the multi-file path: the model writes candidate tests; each must fail on today's code for the right reason (the behaviour is missing), not because the test itself is broken."},{"id":"terminal/src/flows/tries.mjs","n":"tries.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":78,"b":4901,"w":"tries until one passes","c":"Tries until one passes: ask the model for a new version, put it in the scratch copy, check it, keep the first that passes (at most `max`). The screen shows each try as it happens: ✗ ✗ ✓."},{"id":"terminal/src/flows/units.mjs","n":"units.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":75,"b":3731,"w":"the piece of a file that a try rewrites","c":"The piece of a file a try rewrites. Small files are rewritten whole; in a bigger file, one function (JavaScript or Python) is cut out, rewritten and put back. Bonsai 2 27B writes about 10 tokens a second, so rewriting a whole 150-line file took ~4 minutes a try; one function takes under one."},{"id":"terminal/src/flows/words.mjs","n":"words.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":80,"b":6508,"w":"word rules for sorting that need no model","c":"Word rules for sorting a request that need nothing but the words themselves (no files, no model). Measured on 81 real requests (2026-09-27): the rules before these left thanks and offers of work unseen, sorted a short line that continues the conversation on its own, and asked the model to sort plain commands. index.mjs and clarify.mjs use these; sort.mjs puts them in order."}],"files":23,"lines":4101,"b":263057,"w":"the focused paths a request can take","m":"sort.mjs decides where a request goes: rules first, and the model only if no rule fits. Rename needs no model; fix and change try new versions in a scratch copy and show a diff. Anything a path cannot finish falls back to the loop in agent/."},{"id":"terminal/src/tools","n":"tools/","k":"d","p":"t","git":1,"ch":[{"id":"terminal/src/tools/calculator.mjs","n":"calculator.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":149,"b":8879,"w":"the user's calculator as tools for the web backend and, through its /mcp, for Agentic Coder itself","c":"The user's calculator (the Thesis web API, 8 Oct 2026) as tools for the web backend (terminal/src/web/) and, through its /mcp, for Agentic Coder itself. Its address is the user's own and is never written here (the repo is public): the web settings' calc row, or AGENTIC_CALC_URL.","nw":1},{"id":"terminal/src/tools/codeindex.mjs","n":"codeindex.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":267,"b":13740,"w":"code found by meaning, using the small bge-m3 model","c":"Code found by meaning: each code file's parts (its functions and classes, from outline.mjs) are turned into numbers by the small model the memory uses (bge-m3), so the parts closest to a request can come along with it and the model reads them instead of searching for them (agent/helpers.mjs). Also ranks the files a focused path chooses from (flows/localize.mjs). Built in the background, never waited for: bge-m3…"},{"id":"terminal/src/tools/codemap.mjs","n":"codemap.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":282,"b":18281,"w":"the code map of a project: docs/map/ in the project, a ladder a model reads from the top down","c":"The code map of a project (3 Oct 2026, the owner's picks): docs/map/ in the project, a ladder (agent/ladder.mjs) a model reads from the top down.","nw":1},{"id":"terminal/src/tools/edit.mjs","n":"edit.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":80,"b":4064,"w":"Edit: exact find-and-replace; the text must appear exactly once","c":"Edit tool: exact find-and-replace. The text to find must appear exactly once, so a small model can never change the wrong spot. planEdit() makes the diff for the permission prompt; applyEdit() writes it."},{"id":"terminal/src/tools/fs.mjs","n":"fs.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":182,"b":8964,"w":"List and Search: walk the project (git grep inside a git repo)","c":"List and Search: walk the project folder without node_modules, .git and other bulky folders; git grep when the folder is a git repo (much faster)."},{"id":"terminal/src/tools/jobs.mjs","n":"jobs.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":142,"b":6138,"w":"Background commands: a dev server, a watcher or a long test run keeps going while the model works on","c":"Background commands (Bash with background: true; 3 Oct 2026, the owner's pick, as Claude Code has them): a dev server, a watcher or a long test run keeps going while the model works on. Each gets an id (job1, job2…); the Jobs tool reads what it printed since the model last looked, or stops it.","nw":1},{"id":"terminal/src/tools/mcp.mjs","n":"mcp.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":351,"b":23950,"w":"the MCP hub: your MCP servers, connected for as long as this session runs","c":"The MCP hub (3 Oct 2026): your MCP servers, connected for as long as this session runs. MCP (the Model Context Protocol) lets a model use tools that live outside the app: a program on this Mac, or a service at an address. One hub per app process: the conversation and its helpers share each connection, and the servers stop when the app does.","nw":1},{"id":"terminal/src/tools/media-tool.swift","n":"media-tool.swift","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":187,"b":11592,"w":"the media helper: PDFs, pictures and the clipboard with macOS’s own parts"},{"id":"terminal/src/tools/media.mjs","n":"media.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":142,"b":7167,"w":"pictures and PDFs, through the media helper built on first use","c":"Pictures and PDFs, with what macOS already has: media-tool.swift, built on first use with the Mac's own Swift compiler (Apple's command line tools, which the installer asks for) and kept in ~/.agentic-coder/tools under the source's hash, so a changed source is built again. No package, nothing downloaded."},{"id":"terminal/src/tools/office.mjs","n":"office.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":205,"b":11137,"w":"Files that are not pictures or PDFs, read with what macOS already has","c":"Files that are not pictures or PDFs, read with what macOS already has (8 Oct 2026, the owner's pick: any file dropped into the window goes with the message). Word, RTF and saved web pages through textutil; an Excel workbook unzipped and its sheets read as rows; a zip's and a folder's list of what is inside; anything else that is text as text. No package, nothing downloaded.","nw":1},{"id":"terminal/src/tools/outline.mjs","n":"outline.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":264,"b":17579,"w":"a long file’s parts with their line ranges","c":"A long file's parts with their line ranges, so the model reads only the part it needs instead of the whole file (reading is the slow part: ~60 tokens a second, so a 600-line file costs ~2½ minutes every time). JavaScript/TypeScript: functions, classes and their methods, const arrow functions, exported values. Python: def and class. Anything else: blocks of 60 lines."},{"id":"terminal/src/tools/read.mjs","n":"read.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":11,"b":536,"w":"Read: a file’s text with line numbers","c":"Read tool: returns a file's text with line numbers, the way the model sees it."},{"id":"terminal/src/tools/repomap.mjs","n":"repomap.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":198,"b":10664,"w":"a short map of the project for the model","c":"A short map of the project for the model: each code file with its line count and top-level names (\"src/tools/fs.mjs (109): walk, listFiles, …\"). Cached per project under ~/.agentic-coder/maps, keyed by each file's size and time, so a big folder costs nothing after the first look. Used when choosing which file a task is about, when deciding whether a request is clear, and as the first thing the step-by-step loop sees…"},{"id":"terminal/src/tools/run.mjs","n":"run.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":98,"b":5103,"w":"Run: one shell command in the project, output capped, inside the fence","c":"Run tool: one shell command in the project folder, output capped so it cannot flood a small context window. Commands run inside the macOS sandbox (sandbox.mjs): they cannot read your home folder or write outside `cwd`. Pass sandbox: false for a command you typed yourself (! in the app), or sandbox: { readOnly: [...] } for more folders it may read."},{"id":"terminal/src/tools/sandbox.mjs","n":"sandbox.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":157,"b":10738,"w":"the folder fence for commands, enforced by macOS itself","c":"The folder fence for commands, enforced by macOS itself (sandbox-exec): however a command is spelled, it cannot read your home folder or write outside the project. Checking the words of a command (permissions.mjs) catches the plain cases with a clear message; this catches the rest (\"$HOME\"/Desktop, ~user, $(dirname $PWD), a script that lists ~). Inside the home folder a command may read the project, the tool folders…"},{"id":"terminal/src/tools/screen.mjs","n":"screen.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":92,"b":5198,"w":"the Screen tool: a picture of one app's window, or of the whole screen, for a model that can look at pictures","c":"The Screen tool: a picture of one app's window, or of the whole screen, for a model that can look at pictures. It only looks: nothing is clicked or typed. macOS decides whether this terminal may take the picture (Screen Recording, System Settings → Privacy & Security); the media helper asks it (media-tool.swift screen-access / windows) and macOS's own screencapture takes it, so nothing new is installed.","nw":1},{"id":"terminal/src/tools/web.mjs","n":"web.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":188,"b":12431,"w":"WebFetch and WebSearch: a page read as text, a search through Brave or Tavily","c":"The web, for the WebFetch and WebSearch tools (agent/tools.mjs). fetchPage: a page read as text: its words, headings, lists, tables and links; no scripts, styling or menus. A PDF comes back as its text, a picture as a picture. A redirect is followed on the same site only: to another site it says where, so the site you allowed is the one read. searchWeb: a search through a search service with your API key (/web)…"}],"files":17,"lines":2995,"b":176161,"w":"what the model can touch","m":"Read, Edit and Run are the model’s hands. run.mjs runs commands inside a macOS sandbox fence, so they cannot read your home folder. repomap, outline and codeindex give the model maps of a project instead of making it search."},{"id":"terminal/src/web","n":"web/","k":"d","p":"t","git":1,"ch":[{"id":"terminal/src/web/auth.mjs","n":"auth.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":192,"b":11909,"w":"who is asking: accounts made by an admin, a sign-in cookie for the page, API keys for scripts and other apps, and…","c":"Who is asking (Agentic Coder Web, 8 Oct 2026): accounts made by an admin (an invite link), a sign-in cookie for the page, API keys for scripts and other apps, and the one-time tokens of the runs this server starts (their model requests come back through the gateway with it). - Passwords: argon2id (Bun.password), at least 10 characters.","nw":1},{"id":"terminal/src/web/calc-cmd.mjs","n":"calc-cmd.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":123,"b":8939,"w":"coding calc: the calculator link from a terminal, and where it runs. coding calc [status] what it is doing, where it…","c":"coding calc: the calculator link (calc-link.mjs) from a terminal, and where it runs. coding calc [status]       what it is doing, where it runs, today's drops and the reports filed coding calc on             run it as its own background service: starts with this Mac, restarts if it stops coding calc off            the background service off: the link runs inside Agentic Coder Web again coding calc run            the…","nw":1},{"id":"terminal/src/web/calc-link.mjs","n":"calc-link.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":602,"b":37107,"w":"the calculator link","c":"The calculator link (8 Oct 2026, the owner: \"a daemon that connects to this API … detect that the connection dropped and restore it … refresh the token or session whenever necessary … if it's having an issue with the authentication system design, submit a bug or feature request\").","nw":1},{"id":"terminal/src/web/calc-story.mjs","n":"calc-story.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":128,"b":9148,"w":"the calculator link's log told as a story, and its last 24 hours as stretches","c":"The calculator link's log told as a story, and its last 24 hours as stretches (9 Oct 2026, the owner's picks for the hub's Calculator tab: \"one row per outage\", the \"Chain\" design with its lanes). Both read the link's events (calc-link.mjs event(): { at, kind, text }) and nothing else, so the tab, /calc and the tests tell the same story.","nw":1},{"id":"terminal/src/web/chat.mjs","n":"chat.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":77,"b":4893,"w":"the plain chat: one of your AI's models with the calculator as its tools, through the gateway","c":"The plain chat (Agentic Coder Web): one of your AI's models with the calculator as its tools, through the gateway (so it waits its turn, moves to the stand-in, and counts). The AI-server copy has only this; on the Mac copy a message starts an Agentic Coder run instead (runner.mjs), and the API's POST /api/v1/chat is this on either.","nw":1},{"id":"terminal/src/web/config.mjs","n":"config.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":75,"b":4640,"w":"Agentic Coder Web's settings and folders","c":"Agentic Coder Web's settings and folders (8 Oct 2026). Everything lives in the web home: ~/.agentic-coder/web/            (AGENTIC_WEB_HOME names another: the container's /data) settings.json                  the admin page's Settings (mode 0600: it holds the calculator login) web.sqlite                     users, sign-ins, invites, API keys, chats, runs, usage users/<id>/work                a user's own folder (the…","nw":1},{"id":"terminal/src/web/db.mjs","n":"db.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":40,"b":3841,"w":"Agentic Coder Web's database","c":"Agentic Coder Web's database (bun:sqlite, one file in the web home). Secrets are kept only as their sha256: sign-in sessions, invite and reset links, API keys. Passwords are argon2id (Bun.password, auth.mjs).","nw":1},{"id":"terminal/src/web/files.mjs","n":"files.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":118,"b":6491,"w":"a user's own folder: list, read, upload, download one file or all of it as a .zip, delete","c":"A user's own folder (Agentic Coder Web, the Mac copy): list, read, upload (a .zip is unpacked), download one file or all of it as a .zip, delete. Every path is checked to stay inside the folder, links included: nothing here reads or writes outside it.","nw":1},{"id":"terminal/src/web/gateway.mjs","n":"gateway.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":378,"b":23512,"w":"the AI gateway: every model request of the web goes through here, from the page's chat, from a run's coding -p, and…","c":"The AI gateway (Agentic Coder Web, 8 Oct 2026): every model request of the web goes through here, from the page's chat, from a run's coding -p (pointed at this server as its Ollama service, with the run's own token), and from API keys (Ollama's API and the OpenAI shape).","nw":1},{"id":"terminal/src/web/main.mjs","n":"main.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":108,"b":6692,"w":"coding web. coding web [run] [--port N] [--server] [--host ADDR]… start it here coding web on | off | status start…","c":"coding web (and the container's entry: bun terminal/src/web/main.mjs …). coding web [run] [--port N] [--server] [--host ADDR]…   start it here (Ctrl+C stops it) coding web on | off | status                            start it when this Mac starts (a LaunchAgent) coding web invite <name> [--admin]                       a one-time invite link, from the terminal coding web reset <name>                                 …","nw":1},{"id":"terminal/src/web/mcp-http.mjs","n":"mcp-http.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":49,"b":3225,"w":"the tools server: the calculator's tools as an MCP server over HTTP, one JSON-RPC message a POST, answered as JSON.…","c":"The tools server (Agentic Coder Web): the calculator's tools as an MCP server over HTTP, one JSON-RPC message a POST, answered as JSON (MCP's streamable HTTP, with no stream of its own). /mcp            for API keys: Agentic Coder (\"url\" + \"auth\": \"key\"), Claude Code, any MCP app /mcp/run/<tok>  for this server's own runs (their mcp.json names it; loopback only)","nw":1},{"id":"terminal/src/web/models.mjs","n":"models.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":79,"b":5106,"w":"the models the web uses, by job: an admin picks a model for each job from what the services really have, and says…","c":"The models the web uses, by job (Agentic Coder Web, 8 Oct 2026, the owner's pick \"A · control room\"): an admin picks a model for each job from what the services really have, and says who may pick each model.","nw":1},{"id":"terminal/src/web/page.html","n":"page.html","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":0,"b":96852,"w":"Agentic Coder","nw":1},{"id":"terminal/src/web/queue.mjs","n":"queue.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":71,"b":2983,"w":"the line for runs: at most perUser runs of one person at a time and total at once","c":"The line for runs (Agentic Coder Web): at most perUser runs of one person at a time and total at once (the admin's Settings: 1 and 2). Turns go round the people waiting: when a place frees, the next run is the one whose person has the fewest running, then whose last run started longest ago, then the one waiting longest. So nobody's second run starts before everyone else's first.","nw":1},{"id":"terminal/src/web/runner.mjs","n":"runner.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":346,"b":21869,"w":"Chats and runs","c":"Chats and runs (Agentic Coder Web). A chat is a list of events in a file of its own; each message on the Mac copy is an Agentic Coder run (coding -p --loop-events, started as /loop starts its runs: app/loops.mjs startRun) in the user's own folder, with: - its own Agentic Coder home (memory, settings, trust) under the user's folder, never the owner's; - its model requests sent to this server's gateway with a one-time…","nw":1},{"id":"terminal/src/web/server.mjs","n":"server.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":502,"b":35892,"w":"Agentic Coder Web's server","c":"Agentic Coder Web's server (8 Oct 2026, the owner's ask: \"a web interface … a backend and tools server with API access … multi user support … route requests to my AI and calculator\").","nw":1}],"files":16,"lines":2888,"b":283099,"w":"Agentic Coder Web: the page, its backend and the tools server","c":"`coding web`: accounts made by an admin, runs in your folder, the calculator as tools, and a gateway that sends each request to a model.","nw":1},{"id":"terminal/src/ui","n":"ui/","k":"d","p":"t","git":1,"ch":[{"id":"terminal/src/ui/bot-brain.mjs","n":"bot-brain.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":319,"b":17854,"w":"what the Visor bot does, frame by frame","c":"What the Visor bot does, frame by frame (8 Oct 2026, the owner's picks: the living companion, eyes then a short walk after the mouse, calm; then \"timing / speed\": slower, smoother moves, every duration here). One step a frame: what happened (the time, the pointer, the prompt's text and cursor, the model) in, the bot's pose and place out (bot-rig.mjs draws the pose, bot-paint.mjs puts it on the screen).","nw":1},{"id":"terminal/src/ui/bot-paint.mjs","n":"bot-paint.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":42,"b":2337,"w":"the Visor bot put on the screen: a pose at a place becomes the cells it covers, and only those, so whatever is under…","c":"The Visor bot put on the screen: a pose (bot-rig.mjs) at a place (bot-brain.mjs) becomes the cells it covers, and only those, so whatever is under it shows around it. at.x: the screen column of the bot's middle (the left of its middle pair); at.y: the screen's pixel row (two to a line) its feet stand on.","nw":1},{"id":"terminal/src/ui/bot-rig.mjs","n":"bot-rig.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":303,"b":18183,"w":"the Visor bot as a puppet","c":"The Visor bot as a puppet (8 Oct 2026, the owner's ask: \"make it detailed and animate live … natural, animated like pixar\"; their picks: today's Visor bot with more moving parts, then \"smaller by 35%\" and a more detailed look, then \"smaller by 40%\" again, then \"make it more detailed, the look of the agent\").","nw":1},{"id":"terminal/src/ui/designs.jsx","n":"designs.jsx","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":257,"b":14088,"w":"the three terminal designs (previews only)","c":"The three terminal designs. Each is a pure view of stateAt(session, t): finished transcript lines go in <Static> (printed once, so your terminal's own scrollback keeps working), the live area is redrawn below them."},{"id":"terminal/src/ui/parts.jsx","n":"parts.jsx","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":218,"b":8653,"w":"shared screen parts: rows, tool lines, diffs, the input box","c":"Building blocks shared by the three designs, in Claude Code's visual language."},{"id":"terminal/src/ui/state.mjs","n":"state.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":102,"b":4607,"w":"what the screen shows at a moment of a recorded session (previews only)","c":"What the screen should show at time t (seconds) of a recorded session. Pure: the live runner and the preview builder both call it."},{"id":"terminal/src/ui/theme.mjs","n":"theme.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":66,"b":3666,"w":"the 256-colour palette and the spinner looks","c":"256-colour palette: Apple Terminal on macOS 15 has no true colour, so every colour here is an exact xterm-256 entry and looks the same everywhere."}],"files":7,"lines":1307,"b":69388,"w":"the screen’s building blocks","m":"theme.mjs and parts.jsx are used by the live screen; designs.jsx and state.mjs feed only the design previews in scripts/demo/."},{"id":"terminal/src/morning","n":"morning/","k":"d","p":"t","git":1,"ch":[{"id":"terminal/src/morning/cli.mjs","n":"cli.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":39,"b":2458,"w":"the brief’s pieces from a shell","c":"The morning brief's pieces from a shell, for Claude's /repo-morning and for checks by hand (`coding morning` is the whole run with the model): bun cli.mjs gather [--day auto|today|yesterday|YYYY-MM-DD] [--no-fetch] [--out facts.json] bun cli.mjs picks --facts facts.json # what earns a line, in plain words bun cli.mjs render --facts facts.json [--words words.json] [--out page.html] [--no-save] bun cli.mjs render…"},{"id":"terminal/src/morning/config.mjs","n":"config.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":38,"b":1710,"w":"the settings; yours live on this Mac","c":"The morning brief's settings. The defaults are here; your own name, emails, deploy check and test records live on the Mac in ~/.repo-morning/config.json (REPO_MORNING_CONFIG points elsewhere), and win over these."},{"id":"terminal/src/morning/day.mjs","n":"day.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":65,"b":3169,"w":"the brief’s day, in its own time zone","c":"The brief's day in its own time zone: its name, its key (YYYY-MM-DD), where a moment falls in it, and how a time reads (\"7:10 PM\", or \"7:10 PM Friday\" when it is not on the brief's day)."},{"id":"terminal/src/morning/fraunces-600.woff2.b64.txt","n":"fraunces-600.woff2.b64.txt","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":0,"b":24128,"w":"the heading font, embedded in the page"},{"id":"terminal/src/morning/Fraunces-OFL.txt","n":"Fraunces-OFL.txt","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":0,"b":4483,"w":"that font’s licence"},{"id":"terminal/src/morning/gather.mjs","n":"gather.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":269,"b":14175,"w":"reads the repos, their worktrees, the day’s commits, CI and pull requests","c":"The facts for the morning brief: every project repo under the scan folders, its worktrees, the day's commits, CI on the default branch, open pull requests and issues, what is live, and a repo's own test record. Nothing here writes to a repo except `git fetch` (fetch: false skips it). The GitHub token comes from git's credential helper, stays in memory and is never written anywhere."},{"id":"terminal/src/morning/index.mjs","n":"index.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":50,"b":3107,"w":"the brief, start to finish","c":"The morning brief, start to finish: read the repos, pick what earns a line, have the model write the words (checked against the facts), draw the page with every saved day, and open it. /morning in the app and `coding morning` in a shell both land here; Claude's /repo-morning uses the same pieces through cli.mjs."},{"id":"terminal/src/morning/render.mjs","n":"render.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":325,"b":20351,"w":"draws the page: the day’s commits as terrain, three short acts","c":"The morning brief page. One day = the day's commits drawn as terrain, three short acts, then Needs attention and Resolved. The page holds every saved day: it opens on the newest, and the calendar in the top-left corner goes back to any earlier morning. The drawing comes from the facts only, never from the words. Everything gathered is escaped; links must be https."},{"id":"terminal/src/morning/sort.mjs","n":"sort.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":79,"b":5645,"w":"which facts earn a line: needs attention, or resolved","c":"Which facts earn a line on the brief, in plain words. Needs attention: it would cost something to leave until tomorrow. Resolved: it closed in the last day and a half. Everything else is dropped. Each item names its source once, as [[the phrase]] that becomes its link. These plain words are what the page shows when the model's words are not used."},{"id":"terminal/src/morning/words.mjs","n":"words.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":146,"b":9409,"w":"the model writes the headline and a sentence for each part of the day","c":"The brief's words: the headline, one sentence for each part of the day, and each picked item said in plain speech. The model writes them in one call, forced into a JSON shape; then every time and number it wrote is checked against the facts it was given, and anything that does not hold (a time that is not in the facts, a lost link phrase, a word the brief never uses) is swapped for the plain wording from code. No…"}],"files":10,"lines":1011,"b":88635,"w":"the morning brief","m":"`coding morning` reads your project repos, picks what deserves a line, has the model write the words (checked against the facts) and draws one HTML page."},{"id":"terminal/src/window","n":"window/","k":"d","p":"t","git":1,"ch":[{"id":"terminal/src/window/bridge.mjs","n":"bridge.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":196,"b":13409,"w":"the app's side of the window","c":"The app's side of the window (12 Oct 2026: Agentic Coder in its own window). When the window server runs the app (AGENTIC_WINDOW_SOCK names its socket), every redraw of the app's screen also goes to the window as data: the conversation (view.mjs), the turn under way, the prompt as typed, the open menu, a permission question, the mode and the model, and for a panel the window has no view of its own yet, the app's own…","nw":1},{"id":"terminal/src/window/server.mjs","n":"server.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":200,"b":12216,"w":"the window server","c":"The window server (12 Oct 2026, the owner's picks: Agentic Coder in its own Mac window, Tauri, doing everything the terminal does, in the terminal's place).","nw":1},{"id":"terminal/src/window/ui.html","n":"ui.html","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":0,"b":78053,"w":"the window’s page: everything you see in the window","c":"The title bar, the conversation, the prompt, the menus, the side bar and search, drawn from what the bridge sends; keys and clicks go back to the app.","nw":1},{"id":"terminal/src/window/view.mjs","n":"view.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":126,"b":8991,"w":"what the window draws, as plain data","c":"What the window draws, as plain data (12 Oct 2026: Agentic Coder in its own window, design 2). The app's printed conversation (screen.jsx printedOf: rail.jsx's grouping, task-rows.jsx's task rows) becomes view items the window's page draws with HTML; anything it has no view of its own for is sent as the app's own drawing (ANSI lines, ansiRows), so nothing the terminal shows is missing from the window.","nw":1},{"id":"terminal/src/window/vt.mjs","n":"vt.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":175,"b":9828,"w":"a small terminal screen","c":"A small terminal screen (12 Oct 2026, for the window: terminal/src/window/server.mjs runs the app in a pretend terminal and keeps what it drew here). Enough of what Ink and the app write: text and wide characters, the cursor moves, erasing, colours (xterm-256 and true colour), the other screen, scrolling, and the app's question where the cursor is (answered through reply).","nw":1}],"files":5,"lines":697,"b":122497,"w":"its own Mac window: the server, the bridge and the page","c":"`coding` starts the window server, which runs the real app in a pretend terminal; the bridge sends what the app draws as data, and ui.html draws it. Keys and clicks go back the same way.","nw":1},{"id":"terminal/src/headless.mjs","n":"headless.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":214,"b":16957,"w":"runs one prompt with no screen (`coding -p`, and the test bench)","c":"Runs one prompt start to finish without the terminal UI: used by the practice-task runner and by `coding -p \"…\"`."}],"files":297,"lines":59496,"b":4669639,"w":"the program itself","m":"`bun build` turns cli.jsx and everything it imports into the one-file app that `coding` runs."},{"id":"terminal/test","n":"test/","k":"d","p":"t","git":1,"ch":[{"id":"terminal/test/fixture-fix","n":"fixture-fix/","k":"d","p":"t","git":1,"ch":[{"id":"terminal/test/fixture-fix/stats.mjs","n":"stats.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":15,"b":386,"w":"Small statistics helpers for trade prices"},{"id":"terminal/test/fixture-fix/stats.test.mjs","n":"stats.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":8,"b":396}],"files":2,"lines":23,"b":782,"w":"a sample project the tests copy and change"},{"id":"terminal/test/fixture-rename","n":"fixture-rename/","k":"d","p":"t","git":1,"ch":[{"id":"terminal/test/fixture-rename/cart.mjs","n":"cart.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":6,"b":195},{"id":"terminal/test/fixture-rename/cart.test.mjs","n":"cart.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":7,"b":263},{"id":"terminal/test/fixture-rename/price.mjs","n":"price.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":6,"b":208,"w":"Order pricing"}],"files":3,"lines":19,"b":666,"w":"a sample project the tests copy and change"},{"id":"terminal/test/fixture-page","n":"fixture-page/","k":"d","p":"t","git":1,"ch":[{"id":"terminal/test/fixture-page/index.html","n":"index.html","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":0,"b":738,"w":"Shop"},{"id":"terminal/test/fixture-page/package.json","n":"package.json","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":0,"b":62},{"id":"terminal/test/fixture-page/style.css","n":"style.css","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":0,"b":622}],"files":3,"lines":0,"b":1422,"w":"a sample project the tests copy and change"},{"id":"terminal/test/agent-files.test.mjs","n":"agent-files.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":217,"b":16201,"w":"Files you make for the remote set, kept in the app's home: a guide of your own is listed after the shipped ones and…","c":"Files you make for the remote set (2 Oct 2026, the .md maker on the Desktop), kept in the app's home (~/.agentic-coder/rules/remote; here a throwaway AGENTIC_HOME's): a guide of your own is listed after the shipped ones and opens at RULES/<NAME>.md, and a helper agent file in its agents/ folder is a helper the main model can hand work to with the Agent tool, with its own instructions, tools and model.","nw":1},{"id":"terminal/test/agent.test.mjs","n":"agent.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":1190,"b":80109,"w":"tests for agent"},{"id":"terminal/test/agents-guards.test.mjs","n":"agents-guards.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":93,"b":7860,"w":"/agents' stop list: which steps ask first, which are turned away, which run","c":"/agents' stop list (agents-guards.mjs): which steps ask first, which are turned away, which run.","nw":1},{"id":"terminal/test/agents-headless.test.mjs","n":"agents-headless.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":56,"b":4253,"w":"coding -p --agents: /agents' engine on the real agent against a stand-in model server: the interview, SPEC.md and…","c":"coding -p --agents (headless.mjs): /agents' engine on the real agent (agents-driver.mjs) against a stand-in model server: the interview, SPEC.md and the plan from focused calls, then the task in the agent's own loop (a real Write, the real test command run by the app), the reviews, GO.","nw":1},{"id":"terminal/test/agents-md.test.mjs","n":"agents-md.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":32,"b":1953,"w":"This repo's AGENTS.md stays short enough for a small model (30 Sep 2026): Agentic Coder reads it at the start of every…","c":"This repo's AGENTS.md stays short enough for a small model (30 Sep 2026): Agentic Coder reads it at the start of every session here, before the first message, and it had grown one feature note at a time from 5,400 to 8,000 characters in two days. The rules stay in AGENTS.md; how things work and why goes in AGENTS-DETAILS.md, which Claude Code reads through CLAUDE.md and Agentic Coder never does."},{"id":"terminal/test/agents-run.test.mjs","n":"agents-run.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":381,"b":23907,"w":"/agents' run engine: six stages, each a ring of four steps the app runs in order","c":"/agents' run engine (agents-run.mjs): six stages, each a ring of four steps the app runs in order. On the pretend driver of /agents demo, and on a small stand-in driver whose model, commands and files each test sets; the real agent is the app test's (app-agents-run.test.mjs).","nw":1},{"id":"terminal/test/agents-tree.test.mjs","n":"agents-tree.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":65,"b":4005,"w":"the /agents screen: every state of a whole pretend run drawn at the window sizes it meets, each frame exactly the…","c":"The /agents screen (agents-tree.mjs): every state of a whole pretend run drawn at the window sizes it meets, each frame exactly the window, and the parts that must be there.","nw":1},{"id":"terminal/test/agents.test.mjs","n":"agents.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":165,"b":10594,"w":"Helpers (subagents): the Agent tool hands one piece of work to a second agent with a fresh conversation, and only its…","c":"Helpers (subagents): the Agent tool hands one piece of work to a second agent with a fresh conversation, and only its report comes back. On this Mac it runs on the server's side slot; an explore helper only reads; a general one may edit (each change asked about as the mode says); several at once on the Claude API run side by side; esc stops one. Against stand-in servers (fake-server.mjs, fake-anthropic.mjs); the…"},{"id":"terminal/test/app-agents-run.test.mjs","n":"app-agents-run.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":66,"b":4333,"w":"End-to-end, the real app in a pseudo-terminal: /agents demo, the run engine on its pretend driver, in a 112 × 59 window","c":"End-to-end, the real app in a pseudo-terminal (see app.test.mjs): /agents demo, the run engine on its pretend driver (no model), in a 112 × 59 window. The tree takes the window; the interview and the plan's one yes are answered with 1; esc shows the chat with one live line and esc opens the tree again; at GO the window goes back to the chat with the run's summary.","nw":1},{"id":"terminal/test/app-agents.test.mjs","n":"app-agents.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":31,"b":2066,"w":"End-to-end, the real app in a pseudo-terminal (see app.test.mjs): a helper (the Agent tool) when the model decides…","c":"End-to-end, the real app in a pseudo-terminal (see app.test.mjs): a helper (the Agent tool) when the model decides (/effort's Who decides: Model). While it works one line shows its steps as they come; after, one step in the conversation, and ctrl+o shows its steps and its report."},{"id":"terminal/test/app-battle.test.mjs","n":"app-battle.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":81,"b":5459,"w":"End-to-end, the real app in a pseudo-terminal (see app.test.mjs)","c":"End-to-end, the real app in a pseudo-terminal (see app.test.mjs). Here: /arena (and /battle, its name before), and a window beside a battle in the Arena: only one model fits, so a window waits while a battle holds the memory, lets its own model go when one starts, and loads it again by itself when the battle is over; a message waits meanwhile."},{"id":"terminal/test/app-btw-remote.test.mjs","n":"app-btw-remote.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":80,"b":5191,"w":"/btw only on a remote, in the real app in a pseudo-terminal: off and out of the / menu on this Mac's own model; on a…","c":"/btw only on a remote (3 Oct 2026, the owner's picks), in the real app in a pseudo-terminal: off and out of the / menu on this Mac's own model; on a pretend Ollama service the lowest model answers, or, where the service loads no second model, the main one after one short try.","nw":1},{"id":"terminal/test/app-btw.test.mjs","n":"app-btw.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":124,"b":7626,"w":"End-to-end, the real app in a pseudo-terminal (see app.test.mjs)","c":"End-to-end, the real app in a pseudo-terminal (see app.test.mjs). Here: /btw, a side question answered in a panel on the side lane while the main job goes on, like Claude Code's."},{"id":"terminal/test/app-clear.test.mjs","n":"app-clear.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":37,"b":2409,"w":"/clear, end-to-end in a pseudo-terminal: like Claude Code's, it erases the old conversation everywhere — the window…","c":"/clear, end-to-end in a pseudo-terminal: like Claude Code's, it erases the old conversation everywhere — the window, the terminal's scrollback, what the model is sent next — and draws the start page again. Before, the old messages stayed on the screen above a \"new conversation\" line."},{"id":"terminal/test/app-effort.test.mjs","n":"app-effort.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":301,"b":21033,"w":"End-to-end, the real app in a pseudo-terminal (see app.test.mjs)","c":"End-to-end, the real app in a pseudo-terminal (see app.test.mjs). Here: /effort, the panel with the Effort row, the search's rows and the limits that move up and down, kept in settings.json. (/increase was folded into it on 29 Sep 2026; the Search rows came the same day.)"},{"id":"terminal/test/app-hangup.test.mjs","n":"app-hangup.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":28,"b":1654,"w":"the app ends when its terminal goes away: its window closed, the host that held its pseudo-terminal ended, a harness…","c":"The app ends when its terminal goes away (cli.jsx: SIGHUP, or stdin's end): its window closed, the host that held its pseudo-terminal ended, a harness done with it. Until 10 Oct 2026 nothing bounded its closing, so an app whose terminal had gone could stay on for ever.","nw":1},{"id":"terminal/test/app-helpers.test.mjs","n":"app-helpers.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":125,"b":9125,"w":"/helpers: the four context helpers, numbered and by codename (Scout, Medic, Oracle, Sentry), on or off, kept in…","c":"/helpers: the four context helpers, numbered and by codename (Scout, Medic, Oracle, Sentry), on or off, kept in settings.json; AGENTIC_HELPERS decides when it is set. The words first, then the real app in a pseudo-terminal (see app.test.mjs)."},{"id":"terminal/test/app-hooks.test.mjs","n":"app-hooks.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":42,"b":3231,"w":"End-to-end, the real app in a pseudo-terminal: /hooks' form adds a hook of your own, Test runs it once, Save keeps…","c":"End-to-end, the real app in a pseudo-terminal: /hooks' form adds a hook of your own (When, For, Command), Test runs it once, Save keeps it in hooks.json, and the next Bash the model sends is stopped by it with its words (agent/user-hooks.mjs; the owner's pick, 3 Oct 2026).","nw":1},{"id":"terminal/test/app-hub.test.mjs","n":"app-hub.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":194,"b":14659,"w":"End-to-end, the real app in a pseudo-terminal (see app.test.mjs)","c":"End-to-end, the real app in a pseudo-terminal (see app.test.mjs). Here: the hub pages opened from the window, and the edited weights."},{"id":"terminal/test/app-jobs.test.mjs","n":"app-jobs.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":35,"b":2394,"w":"End-to-end, the real app in a pseudo-terminal: a command the model runs in the background ends after its reply, and…","c":"End-to-end, the real app in a pseudo-terminal: a command the model runs in the background (tools/jobs.mjs) ends after its reply, and the model is told and carries on by itself (the owner's pick, 3 Oct 2026, as Claude Code does); /jobs lists the background commands.","nw":1},{"id":"terminal/test/app-jump-box.test.mjs","n":"app-jump-box.test.mjs","k":"f","p":"t","g
