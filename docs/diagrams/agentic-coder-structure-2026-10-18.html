<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic Coder folder structure</title>
<meta name="description" content="Agentic Coder's folders and files: the two parts, every file with what it does, what lives only on this Mac, and what changed since 1 Oct 2026.">
<style>
:root {
  --bg:#f9f9f7; --surface:#fdfdfc; --panel:#f3f3f0; --line:#e1e0d9; --ink:#0b0b0b; --dim:#4f4d48; --faint:#6f6d67;
  --t:#2a78d6; --t-text:#1f5fae; --t-soft:rgba(42,120,214,.07); --t-door:rgba(42,120,214,.15); --t-bar:#2a78d6;
  --m:#e2612d; --m-text:#ad4119; --m-soft:rgba(235,104,52,.07); --m-door:rgba(235,104,52,.17); --m-bar:#eb6834;
  --r-soft:rgba(11,11,11,.035); --r-bar:#9b9890;
  --sel:rgba(42,120,214,.12); --hover:rgba(11,11,11,.045); --chip:#efece4;
  --ok:#24734a; --ok-soft:rgba(36,115,74,.11); --warn:#a2470f; --warn-soft:rgba(226,97,45,.12);
  --info:#1f5fae; --info-soft:rgba(42,120,214,.10); --grey:#5f5d58; --grey-soft:rgba(11,11,11,.06);
  --mono: ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#121211; --surface:#1a1a19; --panel:#222221; --line:#34342f; --ink:#f4f4f2; --dim:#c9c7c1; --faint:#a3a19b;
    --t:#4b93ea; --t-text:#8bbcf5; --t-soft:rgba(75,147,234,.09); --t-door:rgba(75,147,234,.20); --t-bar:#4b93ea;
    --m:#f07a4a; --m-text:#f7a582; --m-soft:rgba(240,122,74,.09); --m-door:rgba(240,122,74,.22); --m-bar:#f07a4a;
    --r-soft:rgba(255,255,255,.04); --r-bar:#7c7a74;
    --sel:rgba(75,147,234,.20); --hover:rgba(255,255,255,.05); --chip:#2c2c2a;
    --ok:#6fcf97; --ok-soft:rgba(111,207,151,.13); --warn:#f7a582; --warn-soft:rgba(240,122,74,.15);
    --info:#8bbcf5; --info-soft:rgba(75,147,234,.15); --grey:#b5b3ad; --grey-soft:rgba(255,255,255,.07);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#121211; --surface:#1a1a19; --panel:#222221; --line:#34342f; --ink:#f4f4f2; --dim:#c9c7c1; --faint:#a3a19b;
  --t:#4b93ea; --t-text:#8bbcf5; --t-soft:rgba(75,147,234,.09); --t-door:rgba(75,147,234,.20); --t-bar:#4b93ea;
  --m:#f07a4a; --m-text:#f7a582; --m-soft:rgba(240,122,74,.09); --m-door:rgba(240,122,74,.22); --m-bar:#f07a4a;
  --r-soft:rgba(255,255,255,.04); --r-bar:#7c7a74;
  --sel:rgba(75,147,234,.20); --hover:rgba(255,255,255,.05); --chip:#2c2c2a;
  --ok:#6fcf97; --ok-soft:rgba(111,207,151,.13); --warn:#f7a582; --warn-soft:rgba(240,122,74,.15);
  --info:#8bbcf5; --info-soft:rgba(75,147,234,.15); --grey:#b5b3ad; --grey-soft:rgba(255,255,255,.07);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.4 var(--sans); display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); font-size: .93em; }
svg.ic { width: 16px; height: 16px; flex: none; display: block; }
.col-head svg.ic { width: 18px; height: 18px; align-self: center; }
.col.t .col-head svg.ic { color: var(--t); }
.col.m .col-head svg.ic { color: var(--m); }
header { padding: 14px 24px 8px; }
.top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 21px; letter-spacing: -.01em; font-weight: 650; }
.dateline { color: var(--faint); font-size: 12.5px; }
.bar2 { display: flex; align-items: center; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
.tabs { display: flex; gap: 6px; }
.tab-btn { border: 1px solid var(--line); background: var(--surface); padding: 5px 13px; border-radius: 999px; cursor: pointer; font-size: 13px; white-space: nowrap; }
.tab-btn:hover { background: var(--hover); }
.tab-btn[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab-btn:focus-visible, .row:focus-visible, .tree-row:focus-visible, .step:focus-visible { outline: 2px solid var(--t); outline-offset: 2px; }
.legend { margin-left: auto; display: flex; gap: 14px; color: var(--faint); font-size: 12px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 18px; height: 11px; border-radius: 3px; border: 1.5px solid; display: inline-block; }
.sw.t { border-color: var(--t); background: var(--t-soft); }
.sw.m { border-color: var(--m); background: var(--m-soft); }
.sw.d { border-color: var(--t); background: linear-gradient(90deg, var(--t-door) 50%, var(--m-door) 50%); }
.sw.x { border-style: dashed; border-color: var(--faint); }
.lede { margin: 8px 0 0; color: var(--dim); font-size: 13px; }
main { flex: 1; min-height: 0; padding: 4px 24px 14px; }
.tab { height: 100%; display: none; }
.tab.on { display: flex; flex-direction: column; min-height: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.faint { color: var(--faint); }
.new { display: inline-block; font-size: 10px; font-weight: 650; letter-spacing: .04em; color: var(--ok); background: var(--ok-soft); border-radius: 4px; padding: 0 5px; line-height: 16px; vertical-align: 1px; text-transform: uppercase; }
.door-tag { display: inline-block; font-size: 10px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; border-radius: 4px; padding: 0 5px; line-height: 16px; vertical-align: 1px; color: var(--dim); background: var(--chip); }

/* 1 · the folder map */
.repo-card { display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 16px; padding: 10px 16px; margin-bottom: 10px; }
.repo-card .nm { font: 650 17px var(--mono); }
.repo-card .tot { font-size: 14px; }
.stack { display: flex; height: 12px; border-radius: 3px; overflow: hidden; background: var(--panel); }
.stack div { height: 100%; }
.stack-key { display: flex; gap: 10px; font-size: 11.5px; color: var(--faint); margin-top: 4px; flex-wrap: wrap; }
.stack-key b { font-weight: 600; }
.cols { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 46fr) minmax(170px, 14fr) minmax(0, 40fr); gap: 0; }
.col { border-radius: 10px; padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 4px; min-height: 0; border: 1.5px solid; position: relative; z-index: 1; }
.col.t { border-color: var(--t); background: var(--t-soft); }
.col.m { border-color: var(--m); background: var(--m-soft); align-self: start; }
.col-head { display: flex; align-items: baseline; gap: 8px; padding: 2px 4px 4px; white-space: nowrap; min-width: 0; }
.col-head .faint { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.col-head .nm { font: 650 16px var(--mono); }
.col-head .meta { margin-left: auto; color: var(--faint); font-size: 12px; white-space: nowrap; }
.group { border: 1px solid var(--line); border-radius: 8px; padding: 3px 5px 5px; background: var(--surface); display: flex; flex-direction: column; gap: 3px; }
.group > .ghead { display: flex; align-items: baseline; gap: 8px; padding: 2px 4px 1px; font-size: 12.5px; }
.group > .ghead .nm { font: 650 13px var(--mono); }
.group > .ghead .meta { margin-left: auto; color: var(--faint); font-size: 11.5px; white-space: nowrap; }
.row { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 4px 8px 6px; border-radius: 7px; background: var(--surface); border: 1px solid var(--line); cursor: pointer; position: relative; min-height: 32px; }
.group .row { border-color: transparent; background: transparent; }
.row:hover { background: var(--hover); }
.row .ic { width: 16px; height: 16px; color: var(--faint); }
.col.t .row .ic { color: var(--t); }
.col.m .row .ic { color: var(--m); }
.row .txt { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .txt .nm { font: 650 13px var(--mono); margin-right: 7px; }
.row .txt .w { color: var(--dim); }
.row .meta { color: var(--faint); font-size: 11.5px; white-space: nowrap; text-align: right; min-width: 118px; }
.row .bar { position: absolute; left: 34px; right: 8px; bottom: 2px; height: 2.5px; border-radius: 2px; background: transparent; }
.row .bar i { display: block; height: 100%; border-radius: 2px; }
.col.t .row .bar i { background: var(--t-bar); }
.col.m .row .bar i { background: var(--m-bar); }
.row.door { border: 1.5px solid; }
.col.t .row.door { border-color: var(--t); background: var(--t-door); }
.col.m .row.door { border-color: var(--m); background: var(--m-door); }
.row.lit { box-shadow: 0 0 0 2.5px var(--ink); }
.chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 3px; }
.chip { font: 500 11.5px var(--mono); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; background: var(--surface); white-space: nowrap; }
.chip b { font: 650 9.5px var(--sans); letter-spacing: .05em; text-transform: uppercase; color: var(--faint); margin-right: 5px; }
.chip.on { border-color: var(--m); }
.chip.on b { color: var(--m-text); }
.row.tall { align-items: start; }
.route { position: relative; z-index: 2; display: flex; flex-direction: column; padding: 6px 8px 0; min-height: 0; }
.steps { position: relative; display: flex; flex-direction: column; gap: 0; margin: 4px 0 8px; }
.steps::before { content: ""; position: absolute; left: 50%; top: 14px; bottom: 14px; width: 1.5px; background: var(--line); transform: translateX(-50%); }
.step { position: relative; display: flex; flex-direction: column; align-items: center; background: none; border: 0; cursor: pointer; padding: 3px 0; }
.step .num { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 650 12.5px var(--sans); background: var(--surface); border: 1.5px solid var(--line); color: var(--dim); position: relative; z-index: 1; }
.step.t .num { border-color: var(--t); color: var(--t-text); }
.step.m .num { border-color: var(--m); color: var(--m-text); }
.step .lab { font-size: 11.5px; color: var(--dim); margin-top: 1px; text-align: center; line-height: 1.2; background: var(--bg); padding: 0 3px; position: relative; z-index: 1; }
.step.on .num { color: #fff; }
.step.on.t .num { background: var(--t); border-color: var(--t); }
.step.on.m .num { background: var(--m); border-color: var(--m); color: #111; }
.step.on .lab { color: var(--ink); font-weight: 600; }
.stepcard { margin-top: auto; padding: 10px 12px; }
.stepcard .k { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.stepcard h3 { margin: 2px 0 4px; font-size: 14px; }
.stepcard p { margin: 0 0 8px; color: var(--dim); font-size: 12.5px; }
.stepcard .foot { display: flex; align-items: center; gap: 6px; }
.stepcard .file { margin: 0 0 8px; }
.stepcard .file code { background: var(--chip); border-radius: 4px; padding: 1px 6px; font-size: 11px; display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
.stepcard .foot { justify-content: flex-end; }
.ctl { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; width: 28px; height: 24px; cursor: pointer; display: grid; place-items: center; padding: 0; }
.ctl:hover { background: var(--hover); }
svg.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; overflow: visible; }
svg.links path { fill: none; stroke-width: 1.4; opacity: .28; }
svg.links path.t { stroke: var(--t); }
svg.links path.m { stroke: var(--m); }
svg.links path.on { opacity: 1; stroke-width: 2.2; }
svg.links circle { opacity: 0; }
svg.links circle.on { opacity: 1; }
.scale-note { text-align: center; color: var(--faint); font-size: 11.5px; padding-top: 6px; }

/* 2 · find a file */
.find { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 12px; }
.pane { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.search { display: flex; gap: 8px; padding: 10px 10px 4px; }
.search input { flex: 1; font: inherit; font-size: 13.5px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); }
.search input:focus { outline: 2px solid var(--t); outline-offset: -1px; }
.search button { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 0 10px; cursor: pointer; font-size: 12.5px; }
.hint { color: var(--faint); font-size: 11.5px; padding: 2px 12px 6px; }
.tree { flex: 1; min-height: 0; overflow: auto; padding: 0 6px 8px; }
.tree-row { display: grid; grid-template-columns: auto 16px minmax(0, 1fr) auto; align-items: center; gap: 6px; padding: 2px 6px; border-radius: 5px; cursor: pointer; white-space: nowrap; min-height: 22px; }
.tree-row:hover { background: var(--hover); }
.tree-row.sel { background: var(--sel); }
.tree-row .car { width: 12px; color: var(--faint); font-size: 10px; text-align: center; transition: transform .12s; }
.tree-row .car.open { transform: rotate(90deg); }
.tree-row .ic { width: 15px; height: 15px; }
.ic-d.t { color: var(--t); } .ic-d.m { color: var(--m); } .ic-d.r { color: var(--faint); }
.ic-f { color: var(--faint); }
.tree-row .tx { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.tree-row .tx .nm { font-family: var(--mono); font-size: 12.5px; margin-right: 7px; }
.tree-row.d .tx .nm { font-weight: 650; }
.tree-row .tx .w { color: var(--dim); font-size: 12.5px; }
.tree-row .tx .path { color: var(--faint); font-family: var(--mono); font-size: 11.5px; margin-right: 6px; }
.tree-row .mt { color: var(--faint); font-size: 11.5px; padding-left: 8px; }
.tree mark { background: rgba(226,97,45,.22); color: inherit; border-radius: 2px; }
.detail { padding: 14px 16px; overflow: auto; }
.crumbs { font: 11.5px var(--mono); color: var(--faint); margin-bottom: 4px; word-break: break-all; }
.crumbs a { color: inherit; cursor: pointer; text-decoration: none; }
.crumbs a:hover { color: var(--ink); text-decoration: underline; }
.dname { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dname h2 { margin: 0; font: 650 19px var(--mono); word-break: break-all; }
.pchip { font-size: 11px; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
.pchip.t { border-color: var(--t); color: var(--t-text); }
.pchip.m { border-color: var(--m); color: var(--m-text); }
.pchip.n { border-color: var(--ok); color: var(--ok); }
.dw { font-size: 14.5px; margin: 8px 0 4px; }
.dc { color: var(--dim); margin: 0 0 10px; font-size: 13px; }
.tiles { display: flex; gap: 8px; margin: 8px 0 12px; flex-wrap: wrap; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; background: var(--panel); min-width: 92px; }
.tile .k { font-size: 11px; color: var(--faint); }
.tile .v { font-size: 17px; font-weight: 650; }
.inside-h { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin: 6px 0 4px; }
.inside .tree-row { padding-left: 4px; }

/* 3 · on this mac */
.mac { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); gap: 12px; }
.mac .pane { padding: 12px 14px 8px; }
.mac h3 { margin: 0; font-size: 14.5px; }
.mac .sub { color: var(--faint); font-size: 12px; margin: 2px 0 8px; }
.sum { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.rows { flex: 1; min-height: 0; overflow: auto; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) 62px; gap: 2px 10px; padding: 6px 4px 7px; border-top: 1px solid var(--line); align-items: start; }
.mrow:first-child { border-top: 0; }
.mrow .nm { font: 600 12.5px var(--mono); word-break: break-all; }
.mrow .w { color: var(--dim); font-size: 12.5px; }
.mrow .sz { text-align: right; font-weight: 600; font-size: 12.5px; white-space: nowrap; }
.mrow .sz small { display: block; font-weight: 400; color: var(--faint); font-size: 11px; }
.mrow .back { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--faint); }
.mrow .mb { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: var(--panel); overflow: hidden; }
.mrow .mb i { display: block; height: 100%; background: var(--r-bar); }
.tag { font-size: 10.5px; font-weight: 600; border-radius: 4px; padding: 0 6px; line-height: 17px; white-space: nowrap; }
.tag.yours { color: var(--warn); background: var(--warn-soft); }
.tag.auto { color: var(--ok); background: var(--ok-soft); }
.tag.cmd, .tag.fetch, .tag.github { color: var(--info); background: var(--info-soft); }
.tag.log { color: var(--grey); background: var(--grey-soft); }

/* 4 · since 1 oct */
.since { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 12px; }
.since .tiles2 { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.big { padding: 10px 14px; }
.big .k { color: var(--faint); font-size: 12px; }
.big .v { font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
.big .v .arr { color: var(--faint); font-weight: 400; font-size: 17px; margin: 0 4px; }
.big .d { font-size: 12px; color: var(--ok); }
.since .pane { padding: 12px 14px; }
.since h3 { margin: 0 0 2px; font-size: 14.5px; }
.since .sub { color: var(--faint); font-size: 12px; margin: 0 0 8px; }
.list { flex: 1; min-height: 0; overflow: auto; }
.add { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 10px; padding: 6px 2px; border-top: 1px solid var(--line); cursor: pointer; }
.add:first-child { border-top: 0; }
.add:hover { background: var(--hover); }
.add .nm { font: 600 12.5px var(--mono); }
.add .w { grid-column: 1 / -1; color: var(--dim); font-size: 12.5px; }
.add .mt { color: var(--faint); font-size: 11.5px; white-space: nowrap; }
.grow { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 4px 0; }
.grow .nm { font: 600 12px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.grow .gb { position: relative; height: 14px; border-radius: 3px; background: var(--panel); overflow: hidden; }
.grow .gb i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.grow .gb i.o { background: var(--r-bar); opacity: .55; }
.grow .gb i.n.t { background: var(--t-bar); }
.grow .gb i.n.m { background: var(--m-bar); }
.grow .mt { font-size: 11.5px; color: var(--faint); white-space: nowrap; min-width: 136px; text-align: right; }
.gone { padding: 6px 0; border-top: 1px solid var(--line); }
.gone .nm { font: 600 12.5px var(--mono); text-decoration: line-through; color: var(--faint); }
.gone .w { color: var(--dim); font-size: 12.5px; }
.split { display: flex; flex-direction: column; min-height: 0; gap: 12px; }
.split > .pane { flex: 1; }
.split > .pane.short { flex: 0 0 auto; }

/* narrow windows and phones */
@media (max-width: 1100px) {
  .legend { display: none; }
  .cols { grid-template-columns: minmax(0, 1fr) minmax(150px, 170px) minmax(0, 1fr); }
  .row .meta { min-width: 0; }
}
@media (max-width: 760px) {
  body { overflow: auto; height: auto; display: block; }
  html { height: auto; }
  header { padding: 12px 16px 6px; }
  h1 { font-size: 18px; }
  .tabs { overflow-x: auto; max-width: 100%; padding-bottom: 2px; }
  main { padding: 4px 16px 20px; }
  .tab.on { height: auto; }
  .repo-card { grid-template-columns: 1fr; gap: 6px; }
  .cols { display: flex; flex-direction: column; gap: 12px; }
  svg.links { display: none; }
  .route { order: -1; }
  .steps { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 6px 10px; }
  .steps::before { display: none; }
  .row .w { display: none; }
  .col { min-width: 0; }
  .col-head { white-space: normal; flex-wrap: wrap; row-gap: 0; }
  .col-head .meta { margin-left: 0; width: 100%; }
  .group > .ghead { flex-wrap: wrap; }
  .group > .ghead .meta { margin-left: 0; }
  .row .meta { font-size: 11px; }
  .find, .mac, .since { display: flex; flex-direction: column; }
  .tree { max-height: 60vh; }

e's own pixels, so it is the bot in the terminal."},{"id":"terminal/src/app/flow-hub.mjs","n":"flow-hub.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":437,"b":44765,"w":"the hub’s Flow page: how a request moves, drawn for every model","c":"The hub's Flow tab: how Agentic Coder works, as eight drawings, with every model in /model drawn into them. Nothing on it is typed in by hand any more: each time the tab opens it reads what the Harness tab reads (the model list and each settings card, the limits in use, the newest test the models have in common) and, from that test, which path each task took and one task's real steps on each model. A model added to…"},{"id":"terminal/src/app/flow.html","n":"flow.html","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":0,"b":11383,"w":"the Flow tab: how it works as a diagram (drawn by scripts/flow-page.mjs)"},{"id":"terminal/src/app/folder-page.jsx","n":"folder-page.jsx","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":136,"b":7955,"w":"where should it work?","c":"Where should it work? The page coding shows when typed in the home folder, before anything in a folder is read (start-folder.mjs, cli.jsx pickStartFolder). The owner's pick of three designs drawn by the real code, \"2 · Doors\" (9 Oct 2026; the round is private: docs/private/design rounds/agentic-coder-where-should-it-work- 3-designs-2026-10-09.html).","nw":1},{"id":"terminal/src/app/gguf-edit.mjs","n":"gguf-edit.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":148,"b":10564,"w":"writes weight edits into a copy of the model file, never the original","c":"Writing weight edits into a COPY of the model file (never the original). This is the save-and-restart route's writer: it clones the model (free on APFS), changes whole rows in the copy, checks every changed byte, and only then puts the copy in place. The file format is decoded by the same Core the Weights tab uses (the <script id=\"core\"> in weights.html), so the writer and the viewer can never disagree abo "p":"t","git":1,"ch":[],"files":0,"lines":256,"b":16418,"w":"the home screen","c":"The home screen (8 Oct 2026, the owner's ask: \"redesign the home screen entirely\"; of two rounds of three live designs they picked \"2 · Menu\": \"build design 2\"). One box in the middle of the window: the conversations to pick up, then what you can do, each row with its own key on the right, so the page teaches them; above it the model and the folder.","nw":1},{"id":"terminal/src/app/home-nav.mjs","n":"home-nav.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":59,"b":3164,"w":"the home screen's choices as plain values: the two looks, moving between the page's items, and the conversations it…","c":"The home screen's choices as plain values (home-looks.jsx and start.jsx draw them; the app's keys and slash commands use them): the two looks, moving between the page's items, and the conversations it lists. No React, no Ink, so the app's logic and its tests load them without the screen.","nw":1},{"id":"terminal/src/app/hooks-form.mjs","n":"hooks-form.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":163,"b":10293,"w":"/hooks: your own hooks and the app's checks in one picker, on the pieces of /mcp's form","c":"/hooks: your own hooks and the app's checks in one picker (3 Oct 2026, the owner's pick: \"a form in /hooks\"), on the pieces of /mcp's form (rows, ◀ ▶ choices, a text row edited in place with remote-form.mjs editField, • for a change not saved yet).","nw":1},{"id":"terminal/src/app/hub.html","n":"hub.html","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":0,"b":26424,"w":"the hub page: Weights · Harness · Structure · Flow · Tests · Memory · All docs · Help"},{"id":"terminal/src/app/instructions-hub.mjs","n":"instructions-hub.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":278,"b":20182,"w":"the hub’s Instructions tab: what the model receives besides the system prompt","c":"Shared instruction editor. Project files and permission enforcement stay separate."},{"id":"terminal/src/app/instructions.html","n":"instructions.html","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":0,"b":67261,"w":"the Instructions page"},{"id":"terminal/src/app/jump-box.mjs","n":"jump-box.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":85,"b":5824,"w":"/jumptomac alone: \"Jump to a Mac\", a small box","c":"/jumptomac alone: \"Jump to a Mac\", a small box (Design 2 of docs/design rounds/ agentic-coder-jumptomac-saved-macs-2-designs-2026-10-03.html, the owner's pick, 3 Oct 2026). Your saved Macs first (the one gone to last on top, so /jumptomac enter enter jumps there), then the Macs Tailscale sees that are not saved, then \"+ Add a Mac\" (its name typed in the box). Each says whether Tailscale has it online.","nw":1},{"id":"terminal/src/app/keys-pickers.mjs","n":"keys-pickers.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":272,"b":18391,"w":"onKey's panel keys: the permission prompt, /btw, /model, /remote and /web, /effort, a choice menu and /rewind, each…","c":"onKey's panel keys (app-keys.mjs): the permission prompt, /btw, /model, /remote and /web, /effort, a choice menu and /rewind, each moved word for word out of onKey, which calls it and returns.","nw":1},{"id":"terminal/src/app/limits.mjs","n":"limits.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":441,"b":25842,"w":"/effort: the effort, and the limits you can move","c":"/effort (one panel): the effort and Who decides (agent/way.mjs), then the search's three rows (Embedder, Retriever, Reranker: agent/search.mjs), then the limits you can move up and down, in one place. Each row has the steps it moves through (numbers, or named choices for the search's rows), its default, how it reads, and what a value costs (said next to it in the panel). Saved as \"limits\" in settings.json; only the…"},{"id":"terminal/src/app/live.mjs","n":"live.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":14,"b":762,"w":"the token count on the \"Musing…\" line","c":"The token count on the \"Musing…\" line. The chat's own stream adds one per token; the focused paths (tests and drafts written in tries) report a running count per try instead, so only what is new since that try's last report is added. Tries may run side by side (tests and drafts on two slots), so each label#try keeps its own count; a try starts at 0."},{"id":"terminal/src/app/loop-files.mjs","n":"loop-files.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":199,"b":12804,"w":"Loops kept to load again","c":"Loops kept to load again (9 Oct 2026, the owner: \"can we make pre made loops? that we can load? … can we also add a ui to create fresh loops from scratch? all in the loop command?\").","nw":1},{"id":"terminal/src/app/loop-run.mjs","n":"loop-run.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":148,"b":11641,"w":"one run of a loop, from the run's side","c":"One run of a loop (/loop, app/loops.mjs), from the run's side. The window that owns the loop starts coding -p --loop-events for each run; this is how the two talk: the run writes one JSON line per thing that happens to its stdout: { t: 'tool', label, arg, error, given, test, failed }   a step (test: it ran the tests; failed: they failed, when known) { t: 'note', text }                             a line from the app…","nw":1},{"id":"terminal/src/app/loops-board.mjs","n":"loops-board.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":657,"b":39559,"w":"the loop board: the loops of one coding window, drawn as the Cards. /loop shows it in the coding window itself;…","c":"The loop board: the loops of one coding window, drawn as the Cards (loops-draw.mjs). /loop shows it in the coding window itself (App.jsx, loops-view.jsx); coding loops shows it in another terminal, where it reads what that window wrote (loops.mjs: <home>/loops/<pid>/) five times a second and sends its keys back as small files, so closing it changes nothing: the loops belong to their window and go on.","nw":1},{"id":"terminal/src/app/loops-draw.mjs","n":"loops-draw.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":866,"b":63892,"w":"the loop board's screen: the Cards, the owner's pick of 4 Oct 2026","c":"The loop board's screen (/loop in the coding window, coding loops in another terminal): the Cards, the owner's pick of 4 Oct 2026 (design round: docs/design rounds/ agentic-coder-loops-4-designs-2026-10-04.html).","nw":1},{"id":"terminal/src/app/loops-library.mjs","n":"loops-library.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":382,"b":26000,"w":"Loops kept to load again, on the loop board","c":"Loops kept to load again, on the loop board (9 Oct 2026; loop-files.mjs keeps them). What it adds to the board and the setup wizard (loops-draw.mjs, loops-board.mjs): · loading one: every step filled in from it, the wizard at its last step to check, with a row for each blank it asks ({page}, {url}: its ready answer, typed over) and its own three step names · Save as on the wizard's last step (a name, and for you or…","nw":1},{"id":"terminal/src/app/loops-view.jsx","n":"loops-view.jsx","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":32,"b":1440,"w":"the loop board as the coding window's own screen: the rows loops-draw.mjs draws, each piece in its colour","c":"The loop board as the coding window's own screen (/loops, 4 Oct 2026, the owner's pick: \"open it in the same window\"): the rows loops-draw.mjs draws, each piece in its colour. It takes the whole window while it is open (screen.jsx), as /agents' tree does, and leaves the last line free for the cursor. LoopsLine: the line above the prompt box that keeps the loops in sight while you are in the chat.","nw":1},{"id":"terminal/src/app/loops-words.mjs","n":"loops-words.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":350,"b":28032,"w":"what a loop's words say: /loop as typed, a task asked about first, a loop in a sentence, a loop's own rules as the…","c":"What a loop's words say (loops.mjs, moved here on 13 Oct 2026 so each file can be read whole): /loop as typed (parseLoop), a task asked about first (unclearOf), a loop in a sentence (readSentence), a loop's own rules as the form types them (rulesOf, fieldsOf, limitWhy), what each run is told (loopNote), a fixing loop that is stuck (stuckWhy) and how a run ended, in a line for the board (summaryOf).","nw":1},{"id":"terminal/src/app/loops.mjs","n":"loops.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":665,"b":42743,"w":"Loops: a message Agentic Coder sends again by itself, every so often or until its job is done","c":"Loops (/loop, 3 Oct 2026, the owner's ask): a message Agentic Coder sends again by itself, every so often or until its job is done.","nw":1},{"id":"terminal/src/app/mac-memory.mjs","n":"mac-memory.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":13,"b":704,"w":"the Mac’s memory, live in the footer","c":"The Mac's memory, live in the footer: \"● Mac 14.6/16 GB\", the dot in Activity Monitor's pressure colours. Units are Activity Monitor's (GB = 2^30 bytes), so a 16 GB Mac says 16. (A panel beside the welcome box, drawn once as the window opened, was taken out on 28 Sep: it went stale.)"},{"id":"terminal/src/app/markdown.jsx","n":"markdown.jsx","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":55,"b":2477,"w":"just enough Markdown for the model’s replies","c":"Just enough Markdown for model replies: headings, lists, code blocks, `inline code`, **bold** and *italic*."},{"id":"terminal/src/app/mcp-auth.mjs","n":"mcp-auth.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":125,"b":7923,"w":"Signing in to an MCP server at an address: a browser page opens once, you sign in there, and the server's tokens are…","c":"Signing in to an MCP server at an address (OAuth, 3 Oct 2026): a browser page opens once, you sign in there, and the server's tokens are kept in the Keychain (mcp-<server>-signin: the app's registration with that server, and its tokens) and refreshed by themselves after that.","nw":1},{"id":"terminal/src/app/mcp-form.mjs","n":"mcp-form.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":224,"b":15736,"w":"/mcp: your MCP servers in one picker, on the pieces of /web's and /remote's form","c":"/mcp: your MCP servers in one picker, on the pieces of /web's and /remote's form (web-form.mjs, remote-form.mjs: rows, ◀ ▶ choices, a text row edited in place, • for a change not saved yet).","nw":1},{"id":"terminal/src/app/mcp-start.mjs","n":"mcp-start.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":31,"b":1967,"w":"the MCP hub for a session: the servers of mcp.json connected through tools/mcp.mjs, with what the store keeps for…","c":"The MCP hub for a session (3 Oct 2026): the servers of mcp.json (yours, and a project's you said yes to) connected through tools/mcp.mjs, with what the store keeps for them (mcp-store.mjs): each one's key, the era it spoke last time, its log, and the fingerprint each \"always allow\" was given for. The app and coding -p both start here; the practice runs and the tests pass no hub, so they measure the same as before.","nw":1},{"id":"terminal/src/app/mcp-store.mjs","n":"mcp-store.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":188,"b":14013,"w":"where your MCP servers are kept, and what you said about them. ~/.agentic-coder/mcp.json your servers, for every…","c":"Where your MCP servers are kept (3 Oct 2026), and what you said about them. ~/.agentic-coder/mcp.json            your servers, for every folder (the /mcp form saves it) <project>/.agentic/mcp.json          a project's own servers: never started before you said yes to them, and asked about again when the file changes ~/.agentic-coder/mcp-state.json      your answers and marks, in the app's own folder so a project…","nw":1},{"id":"terminal/src/app/memory-hub.mjs","n":"memory-hub.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":58,"b":4695,"w":"the hub’s Memory tab: what it remembers, read live","c":"The hub's Memory tab: what Agentic Coder remembers, read live from the two memory folders (src/agent/facts.mjs), and the few changes you can make there by hand. Every change goes through the store, so it is in the log and can be undone. GET /memory.json both memories: facts, retired facts, the last changes POST /memory/edit { where, id, text } POST /memory/pin { where, id, pinned } POST /memory/retire { where, id }…"},{"id":"terminal/src/app/memory.html","n":"memory.html","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":0,"b":30486,"w":"the Memory tab"},{"id":"terminal/src/app/mouse.mjs","n":"mouse.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":41,"b":2439,"w":"the mouse in the prompt box (/mouse on): drag to select","c":"The mouse in the prompt box (/mouse on). Terminal keeps the mouse for itself until an app asks for it; asked, it sends every press, drag and release as text on the keyboard's line, with the cell the pointer is on. Plain data and pure functions here; App.jsx turns them into a cursor and a selection."},{"id":"terminal/src/app/panels-effort.mjs","n":"panels-effort.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":177,"b":15809,"w":"the window's panels, /effort and its limits, /model's own menu, thinking","c":"The window's panels, /effort and its limits, /model's own menu, thinking (app-panels.mjs puts the parts together). Moved from app-panels.mjs word for word; a name from another part is read through own.","nw":1},{"id":"terminal/src/app/panels-helpers.mjs","n":"panels-helpers.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":40,"b":3161,"w":"the window's panels, The helpers: /subagents jobs, the profiles, what the service offers","c":"The window's panels, The helpers: /subagents jobs, the profiles, what the service offers (app-panels.mjs puts the parts together). Moved from app-panels.mjs word for word; a name from another part is read through own.","nw":1},{"id":"terminal/src/app/panels-hooks.mjs","n":"panels-hooks.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":109,"b":8536,"w":"the window's panels, /hooks: your own hooks and the app's checks","c":"The window's panels, /hooks: your own hooks and the app's checks (app-panels.mjs puts the parts together). Moved from app-panels.mjs word for word; a name from another part is read through own.","nw":1},{"id":"terminal/src/app/panels-machine.mjs","n":"panels-machine.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":57,"b":3350,"w":"the window's panels, the machine: memory, the service's models, saving the session","c":"The window's panels, the machine: memory, the service's models, saving the session (app-panels.mjs puts the parts together). Moved from app-panels.mjs word for word; a name from another part is read through own.","nw":1},{"id":"terminal/src/app/panels-mcp.mjs","n":"panels-mcp.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":203,"b":16723,"w":"the window's panels, /mcp: the servers, their keys, and their news","c":"The window's panels, /mcp: the servers, their keys, and their news (app-panels.mjs puts the parts together). Moved from app-panels.mjs word for word; a name from another part is read through own.","nw":1},{"id":"terminal/src/app/panels-permissions.mjs","n":"panels-permissions.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":25,"b":2014,"w":"the window's panels, /permissions","c":"The window's panels, /permissions (app-panels.mjs puts the parts together). Moved from app-panels.mjs word for word; a name from another part is read through own.","nw":1},{"id":"terminal/src/app/panels-pictures.mjs","n":"panels-pictures.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":36,"b":2850,"w":"the window's panels, pictures: the model's vision add-on","c":"The window's panels, pictures: the model's vision add-on (app-panels.mjs puts the parts together). Moved from app-panels.mjs word for word; a name from another part is read through own.","nw":1},{"id":"terminal/src/app/panels-rewind.mjs","n":"panels-rewind.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":57,"b":3774,"w":"the window's panels, /rewind and esc twice on an empty prompt","c":"The window's panels, /rewind and esc twice on an empty prompt (app-panels.mjs puts the parts together). Moved from app-panels.mjs word for word; a name from another part is read through own.","nw":1},{"id":"terminal/src/app/panels-settings.mjs","n":"panels-settings.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":177,"b":11996,"w":"the window's panels, /settings, and the choices its rows save","c":"The window's panels, /settings, and the choices its rows save (app-panels.mjs puts the parts together). Moved from app-panels.mjs word for word; a name from another part is read through own.","nw":1},{"id":"terminal/src/app/panels-web.mjs","n":"panels-web.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":31,"b":2340,"w":"the window's panels, /web: what the model may do on the web","c":"The window's panels, /web: what the model may do on the web (app-panels.mjs puts the parts together). Moved from app-panels.mjs word for word; a name from another part is read through own.","nw":1},{"id":"terminal/src/app/perm-store.mjs","n":"perm-store.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":139,"b":7177,"w":"the rules you save with /permissions, kept outside the project","c":"The rules you save with /permissions, kept in ~/.agentic-coder/permissions.json: in the app's own folder, not in the project, so a project you download can not arrive with \"allow\" rules of its own. { \"everywhere\": { allow, never, protect, mode }, \"folders\": { \"<real path>\": { allow, never, protect, mode } } } allow: commands that run without asking · never: commands that never run · protect: files that always ask…"},{"id":"terminal/src/app/permission-options.mjs","n":"permission-options.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":39,"b":3906,"w":"the choices a permission question offers, as plain values: no React, no Ink, so the app's logic and its tests load…","c":"The choices a permission question offers (screen.jsx draws them, app-panels.mjs answers them), as plain values: no React, no Ink, so the app's logic and its tests load them without the screen.","nw":1},{"id":"terminal/src/app/perms.mjs","n":"perms.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":202,"b":12685,"w":"/permissions: what runs without asking, what never runs","c":"/permissions: what runs without asking, what never runs, which files always ask, and the mode Agentic Coder starts in. This file is the command's words and panels; the rules themselves are judged in agent/permissions.mjs and kept by perm-store.mjs. Every function answers plain data for App.jsx: { text, tone } a line to print { panel } { title, pad, rows } as /helpers prints them { open: 'panel' | 'mode' } the picker…"},{"id":"terminal/src/app/pick.mjs","n":"pick.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":75,"b":4075,"w":"a small pick-one menu, before the screen is up","c":"A small menu for the plain terminal, before the Ink screen is up (the safety check at start, questions under coding -p). It looks like the dialogs inside the app: ❯ marks the row, up/down move it, enter picks it. Typing a number picks that row at once, as in the app. Esc or ctrl+c gives null. Answers the index of the row picked."},{"id":"terminal/src/app/profile-router.mjs","n":"profile-router.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":186,"b":10895,"w":"which server and model each request goes to, by profile","c":"Which server and model each request goes to, by profile (profiles.mjs; 8 Oct 2026, the owner's pick of the full build). The file is read again whenever it changed, at each request, so a change made in /profiles, /model, the hub or another window reaches the next request of every window. Nothing here runs until a profiles.json exists: before that the window works as it always did.","nw":1},{"id":"terminal/src/app/profiles-hub.mjs","n":"profiles-hub.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":71,"b":4732,"w":"the hub's Profiles tab: the same profiles as /profiles, read from and saved to the same file, so a change here…","c":"The hub's Profiles tab (8 Oct 2026, the owner's pick of the full build): the same profiles as /profiles, read from and saved to the same file, so a change here reaches every window's next request. The hub runs apart from the windows, so it never makes the first profiles: those come from a window's /subagents helpers (profiles.mjs seedProfiles); until a window has saved them the tab only says so.","nw":1},{"id":"terminal/src/app/profiles-view.jsx","n":"profiles-view.jsx","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":192,"b":11843,"w":"/profiles and /model's step 2 on the screen","c":"/profiles and /model's step 2 on the screen (profiles.mjs has the rows, app-profiles.mjs the keys). ProfileStep    /model · 2 of 3: which profile uses the model picked ProfilesPanel  /profiles: the profiles (◀ model ▶ and today's meters), then one group's rows, each with ◀ profile ▶ (8 Oct 2026, the owner's pick of two designs: 1 · Rows)","nw":1},{"id":"terminal/src/app/profiles.html","n":"profiles.html","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":0,"b":9359,"w":"Agentic Coder Profiles","nw":1},{"id":"terminal/src/app/profiles.mjs","n":"profiles.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":255,"b":16822,"w":"Profiles: a profile is a server, a model and that model's settings, under a name","c":"Profiles (8 Oct 2026, the owner's ask and picks): a profile is a server, a model and that model's settings, under a name (Main, Fast, Review…).","nw":1},{"id":"terminal/src/app/prompt-files-hub.mjs","n":"prompt-files-hub.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":203,"b":12360,"w":"the hub’s Prompt files: read and save AGENTS.md, TOOLS.md and SKILLS.md","c":"The hub's Prompt files (Instructions → 06 AGENTS.md · 07 TOOLS.md · 08 SKILLS.md, 30 Sep 2026): read and save the three files the model is given. AGENTS.md the chosen folder's own rules file (the page's Folder menu) TOOLS.md terminal/rules/TOOLS.md: the \"Tool use\" part of the instructions SKILLS.md terminal/rules/SKILLS.md: steps a request's words bring A save never overwrites a newer change made elsewhere (another…"},{"id":"terminal/src/app/rail.jsx","n":"rail.jsx","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":642,"b":42934,"w":"the conversation drawn as a rail: one thin line per turn","c":"The conversation as a rail (design 2 of 29 Sep 2026, the user's pick): your message on a grey strip, then every step of the turn hung on one thin line, each with a mark for its kind, and the turn closed with ╰─ and how it ended. ◇ thinking ● a reply ✎ a file made or changed ○ a read, a list, a search ❯ a command ◎ the layout check ⊘ not allowed / you said no ✗ an error · a note A step prints the rail line above…"},{"id":"terminal/src/app/remote-footer.mjs","n":"remote-footer.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":130,"b":7205,"w":"the footer on a remote model: design 2 of docs/design rounds/remote-footer-2-designs-2026-10-02.html","c":"The footer on a remote model: design 2 of docs/design rounds/remote-footer-2-designs-2026-10-02.html (the owner's pick, 2 Oct 2026: \"build 2\"). The Mac's memory leaves the footer, since the Mac holds no model then, and the cost meter moves to /meters.","nw":1},{"id":"terminal/src/app/remote-form.mjs","n":"remote-form.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":493,"b":31912,"w":"/remote: the form for a model on another machine","c":"/remote: one form for where the model runs. Its first row, Run on, picks This Mac · Claude API · My other computer · Another service, and only that one's rows show (the ones seldom changed behind More). Each service keeps its own set-up and its own key, so flipping Run on loses nothing. Connect checks the rows as they are (the tunnel, the address, the key, one word back) and only when that works saves them and…"},{"id":"terminal/src/app/remote-hub.mjs","n":"remote-hub.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":252,"b":18360,"w":"the hub's Remote tab: the models on the services saved with /remote, one card each, and everything the service says…","c":"The hub's Remote tab: the models on the services saved with /remote, one card each, and everything the service says about the one you pick. The hub runs apart from the app's windows, so it reads the services from settings.json (\"remotes\", and \"remote\" for the one in use) and each key from the Keychain; a key never reaches the page.","nw":1},{"id":"terminal/src/app/remote-models.mjs","n":"remote-models.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":165,"b":10691,"w":"/model on an Ollama service: the service's own models, with what each can do","c":"/model on an Ollama service (the design picked on 1 Oct 2026, \"the service's list\"): the service's own models, with what each can do. The loaded ones come first (they answer at once), then the ones that can run the agent (they call tools), each group a coder first, then the newest.","nw":1},{"id":"terminal/src/app/remote-specialties.mjs","n":"remote-specialties.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":105,"b":8030,"w":"what a model on a service is good at, for the hub's Remote tab","c":"What a model on a service is good at, for the hub's Remote tab. A service says what a model CAN do (tools, thinking, pictures, its size and context), not what it is good at, so this is two parts, each marked where it comes from: worked out  from what the service said (abilities, size, a name like \"coder\") a note      a line kept here for the families we know; a new family has none Works with no internet.","nw":1},{"id":"terminal/src/app/remote-suggested.mjs","n":"remote-suggested.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":37,"b":3437,"w":"the values /model's menu suggests for a model on an Ollama service","c":"The values /model's menu suggests for a model on an Ollama service (2 Oct 2026, the user's pick: \"use this to help you\", Grok's \"Local model ranks\" page, its Effort and Limits tabs). They are published lab figures and the model makers' own advice, not measured here, so they are only suggested: the menu shows them beside each row, and s fills them in.","nw":1},{"id":"terminal/src/app/remote.html","n":"remote.html","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":0,"b":41230,"w":"Agentic Coder Remote","nw":1},{"id":"terminal/src/app/review.mjs","n":"review.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":161,"b":10352,"w":"`coding memory-review`: the night pass over the day’s conversations","c":"The memory's review at night: `coding memory-review`. While the Mac is idle it reads the day's conversations again, saves what the quick saves after each task missed, and tidies both memories. It is careful about when it runs: - only between 1 and 6 in the morning, on power, after 30 minutes with no key or mouse (it never wakes the Mac: a sleeping Mac runs nothing); - not while an Agentic Coder window is open or a…"},{"id":"terminal/src/app/rewind.mjs","n":"rewind.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":578,"b":28276,"w":"/rewind: files and the conversation back to before one of your messages","c":"/rewind: put files, and the conversation, back to how they were before one of your messages. Before each message and when its work ends, the project is copied into a private store: a bare git folder in Agentic Coder's home, never the project's own git, so its staging, stashes and branches are not touched. Comparing the two copies says which files the message changed. Which of those were the model's comes from two…"},{"id":"terminal/src/app/rules.mjs","n":"rules.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":81,"b":4506,"w":"/rules: what the model reads at the start, and how to change it","c":"/rules: what the model reads at the start of every conversation, numbered, and short commands to change it (design 1 of the 28 Sep design round, docs/design rounds/rules-command-2-designs-2026-09-28.html). Always facts marked \"always\": read in full at every start Other notes one line each at the start, the whole fact when a request fits Off switched off with /rules off: kept in retired/, /rules on brings one back…"},{"id":"terminal/src/app/saved-services.mjs","n":"saved-services.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":132,"b":8272,"w":"Your services stay saved","c":"Your services stay saved (12 Oct 2026, the owner: \"i want to ensure my data is saved. i keep having to add the other service address and the claude api in every time we fix or change something\").","nw":1},{"id":"terminal/src/app/screen-ask.jsx","n":"screen-ask.jsx","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":318,"b":21872,"w":"what asks you something: the permission prompt, the model's question box with its tabs, and the / menu","c":"What asks you something (screen.jsx): the permission prompt, the model's question box with its tabs, and the / menu. Moved from screen.jsx word for word.","nw":1},{"id":"terminal/src/app/screen-btw.jsx","n":"screen-btw.jsx","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":104,"b":5855,"w":"/btw's side panel: the answer as rows a panel can scroll, and where the panel sits","c":"/btw's side panel (screen.jsx): the answer as rows a panel can scroll, and where the panel sits. Moved from screen.jsx word for word.","nw":1},{"id":"terminal/src/app/screen-copy.mjs","n":"screen-copy.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":77,"b":4617,"w":"Text copied off this app's own screen and pasted back, put together as it was written","c":"Text copied off this app's own screen and pasted back, put together as it was written (1 Oct 2026). Terminal copies what is drawn: the screen's own line breaks, the indent under a message's first line, the grey strip's padding spaces, the prompt box's │ edges. A paste that carries those marks loses them; any other paste stays exactly as it came.","nw":1},{"id":"terminal/src/app/screen-footer.jsx","n":"screen-footer.jsx","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":255,"b":15677,"w":"the bottom of the window: the shortcuts, the footer and its status rows, and the prompt box","c":"The bottom of the window (screen.jsx): the shortcuts, the footer and its status rows, and the prompt box. Moved from screen.jsx word for word.","nw":1},{"id":"terminal/src/app/screen-forms.jsx","n":"screen-forms.jsx","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":600,"b":39552,"w":"the forms and model lists: /remote and /web, /hooks, /mcp, a service's catalog and models, /help's popup, /model and…","c":"The forms and model lists (screen.jsx): /remote and /web, /hooks, /mcp, a service's catalog and models, /help's popup, /model and the service picker. Moved from screen.jsx word for word.","nw":1},{"id":"terminal/src/app/screen-items.jsx","n":"screen-items.jsx","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":361,"b":23696,"w":"the conversation's finished lines: a tool's call and result, /context, /rules, the memory panel, Item, which picks…","c":"The conversation's finished lines (screen.jsx): a tool's call and result, /context, /rules, the memory panel, Item, which picks the view for each kind of line, and the frame around it, with the steps of a task row. Moved from screen.jsx word for word.","nw":1},{"id":"terminal/src/app/screen-live.jsx","n":"screen-live.jsx","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":207,"b":12572,"w":"the live area under the finished lines: the spinner, the meters, the memory warning and the live rail of the step…","c":"The live area under the finished lines (screen.jsx): the spinner, the meters, the memory warning and the live rail of the step running now. Moved from screen.jsx word for word.","nw":1},{"id":"terminal/src/app/screen-pickers.jsx","n":"screen-pickers.jsx","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":347,"b":20950,"w":"the pickers: mode, a choice, /jump, /rewind, /settings and /effort with its limits","c":"The pickers (screen.jsx): mode, a choice, /jump, /rewind, /settings and /effort with its limits. Moved from screen.jsx word for word.","nw":1},{"id":"terminal/src/app/screen-switches.mjs","n":"screen-switches.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":8,"b":640,"w":"two of the screen's switches as plain values: no React, no Ink, so the app's logic and its tests load them without…","c":"Two of the screen's switches as plain values (rail.jsx and bot-layer.jsx draw what they pick; App.jsx and the slash commands set them): no React, no Ink, so the app's logic and its tests load them without the screen.","nw":1},{"id":"terminal/src/app/screen.jsx","n":"screen.jsx","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":276,"b":17293,"w":"what the screen shows: thinking line, spinner, tool lines, footer","c":"What the terminal shows, laid out like Claude Code: thinking folded to one line, one spinner with the time and tokens, a line with the time left behind when a turn ends, nothing under the prompt but the footer (/meters on adds the status bar). Finished lines go in <Static> (printed once, so the terminal's own scrollback keeps working); the live area below them is redrawn."},{"id":"terminal/src/app/sessions.mjs","n":"sessions.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":731,"b":40209,"w":"Background sessions, like Claude Code's claude --bg and claude attach","c":"Background sessions, like Claude Code's claude --bg and claude attach. A coding window does not run the app itself. It starts a keeper (the session host, coding session-host): a process with no window that runs the app in a pretend terminal (Bun's built-in PTY). The window only shows what the app draws and sends it your keys.","nw":1},{"id":"terminal/src/app/slash-design.mjs","n":"slash-design.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":154,"b":12312,"w":"the slash commands of what the model makes: /math and /design","c":"The slash commands of what the model makes: /math and /design (app-slash.mjs sends each its own). Moved rt-times.mjs","n":"start-times.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":54,"b":3123,"w":"how long the model takes to start here, for the start page’s time left","c":"How long the model takes to start on this Mac, kept to say how long the next start will take (the start page's \"about 12 s left\", 1 Oct 2026). A start has two timed parts: loading the model (only when a new server starts, not when one is already loaded), then reading its instructions (the first time) or restoring them from disk (later starts). The last five of each part are kept per model, with the kind the last…"},{"id":"terminal/src/app/start.jsx","n":"start.jsx","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":554,"b":36120,"w":"the start page: greeting, model, folder, recent activity","c":"The start page (29 Sep 2026, the user's pick: \"like Claude\", open; upgraded 1 Oct, \"1 · Studio\"). No box: a titled line, then two columns. Left, centred: a greeting, the Visor bot, the model and its state (off, the start's steps, ready). Right: Recent activity with each one's prompts, This folder as labelled rows, a Try row of keys. Until your first message the page stays live (Screen holds it back from the…"},{"id":"terminal/src/app/steps.mjs","n":"steps.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":30,"b":2857,"w":"the steps a request takes: one list the Flow and Harness tabs both draw","c":"The steps a request takes: one list for the whole hub. The Flow tab draws all of them; the Harness tab tells the same story as five stages, each made of one or two of these steps. Both pages are drawn from this file, so the two tabs cannot say different things (test/hub-steps.test.mjs). who u = you, h = the harness, m = the model model the step can call the model (the amber dot on the Flow tab) {The model} in a…"},{"id":"terminal/src/app/store.mjs","n":"store.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":262,"b":13581,"w":"settings, saved conversations and prompt history","c":"Settings, reads a folder's notes into the model or runs anything there, the user says once that they trust it. A yes covers the folder and everything inside it, and is kept in ~/.agentic-coder/trust.json. Saying yes to \"Work in <project>?\" mid-session counts too (src/app/App.jsx)."},{"id":"terminal/src/app/tryouts.mjs","n":"tryouts.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":27,"b":1753,"w":"Try-outs: a model on a service gets one short real task the first time it is picked, and the result is kept here, so…","c":"Try-outs (2 Oct 2026, the user's pick: \"the first time I pick it\"): a model on a service gets one short real task the first time it is picked (read a file, fix one line, run a command), and the result is kept here, so the /remote list and /model show ✔ or ✗ and its speed from then on. A service lists \"tools\" for a model whose chat template can take them; only a try-out says it really works with the agent.","nw":1},{"id":"terminal/src/app/update.mjs","n":"update.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":235,"b":14728,"w":"\"Update available\": watches the repo for new commits (/update)","c":"\"Update available\" in the lower right, as in Claude Code: while Agentic Coder runs, it looks at its own repo every 20 s. When a commit lands on main (or is pushed to GitHub's main from this Mac) that changes Agentic Coder's code, a restart would run something new, and the badge says so. /update restarts Agentic Coder on it through the launcher (which builds the new version first) and picks the conversation back up.…"},{"id":"terminal/src/app/usage-bar.mjs","n":"usage-bar.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":193,"b":14422,"w":"the Claude API's usage drawn: the footer's words and the /usage card","c":"The Claude API's usage drawn (8 Oct 2026, the owner's pick \"1 · Fuel line\": \"use design 1 and ensure proper spacing and uniformity\"; 9 Oct 2026, \"3 · One row\": the line under the footer is gone and \"$61.68 left\" sits in the footer's right side, usageChip): the footer's words and the /usage card. Pure: screen.jsx draws the rows this returns, and the tests read them. The numbers are claude-usage.mjs usageNow()'s.","nw":1},{"id":"terminal/src/app/web-form.mjs","n":"web-form.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":111,"b":6653,"w":"/web: what the model may do on the web, and the search service’s key","c":"/web: one form, like /remote's, for what the model may do on the web. Rows: Search (Off · Brave Search · Tavily), API key (the search service's, kept in the Keychain), Read pages (On · Off), then Test and Save. Editing a text row works as in /remote (remote-form.mjs: startEdit, editField, pasteField, commitEdit). On the Claude API neither setting is used: Claude searches and reads with Anthropic's own web tools…"},{"id":"terminal/src/app/weights-core.mjs","n":"weights-core.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":12,"b":924,"w":"the Weights tab’s model-file reader, shared with the edit writer and its check","c":"The Weights tab's file reader (the <script id=\"core\"> in weights.html), outside the page: the one place that builds it from the page's text, so the page and everything that reads a model file the same way (the edit writer, gguf-edit.mjs; the weights reader check, models/evals/tools/reader-check.mjs) can never disagree. coreFrom(html) from the page's text (gguf-edit.mjs imports the page as text, which works inside…"},{"id":"terminal/src/app/weights.html","n":"weights.html","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":0,"b":168704,"w":"the Weights tab: look inside the model file, edit a copy"},{"id":"terminal/src/app/weights.mjs","n":"weights.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":237,"b":19109,"w":"the hub: one small local server behind /weights, /docs, /tests, /memory","c":"The Agentic Coder hub: `/weights`, `/docs`, `coding weights` and `coding docs` all start this one small local server (127.0.0.1 only). It hands out / the hub page (hub.html, built in): tabs Weights · Harness · Structure (its two pages: Structure and Flow) · Arena · Memory · Instructions · All docs · Help /weights the weights viewer (weights.html, built in): every model in /model, one alone or side by side…"},{"id":"terminal/src/app/window.mjs","n":"window.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":76,"b":3150,"w":"the terminal window’s size; redraws on resize","c":"The terminal window as the app sees it. Resizing redraws everything, like Claude Code: while you drag the window edge nothing is drawn; once the size has held still for a moment the window is cleared and the whole conversation is printed again at the new size, with the prompt box on the last lines. (Ink on its own only redraws the live part, and on a narrower window leaves copies of it behind, because Terminal…"}],"files":138,"lines":25476,"b":2224950,"w":"the screen, the keys, the slash commands and the hub","m":"App.jsx starts the model, runs the agent and draws the screen (Ink). The nine .html files are the hub’s pages; weights.mjs serves them on 127.0.0.1 (port 8757 when free) for `/weights`, `/docs` and `coding docs`."},{"id":"terminal/src/agent","n":"agent/","k":"d","p":"t","git":1,"ch":[{"id":"terminal/src/agent/agent-answer.mjs","n":"agent-answer.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":429,"b":33566,"w":"the answer's checks: what the app looks at when the model answers with no tool call, before the answer stands: the…","c":"The answer's checks (agent.mjs): what the app looks at when the model answers with no tool call, before the answer stands: the cases have tests, the page was checked, Look first, files that exist, the second opinion, the second look, your Stop hooks and the rest. Moved out of agent-work.mjs's work() on 13 Oct 2026 so each file can be read whole.","nw":1},{"id":"terminal/src/agent/agent-checks.mjs","n":"agent-checks.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":536,"b":39097,"w":"the Agent's checks and questions: the reminders of the plan and the request, the cases, Look first, Stays on task,…","c":"The Agent's checks and questions (agent.mjs): the reminders of the plan and the request, the cases, Look first, Stays on task, the second look, the check-ins, the stuck question and asking the user. Its methods are put on Agent.prototype by agent.mjs, so this is the Agent: every this.x() is the agent's own.","nw":1},{"id":"terminal/src/agent/agent-mcp.mjs","n":"agent-mcp.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":216,"b":17352,"w":"the Agent's MCP side: the servers' tools taken for a conversation, shown by name or through the Mcp tool, and a call…","c":"The Agent's MCP side (agent.mjs): the servers' tools taken for a conversation, shown by name or through the Mcp tool, and a call to one run, with a server's own questions. Its methods are put on Agent.prototype by agent.mjs, so this is the Agent: every this.x() is the agent's own.","nw":1},{"id":"terminal/src/agent/agent-memory.mjs","n":"agent-memory.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":386,"b":26941,"w":"the Agent's memory: facts brought back and saved, the opening read, the maps, Claude's notes, a folder's notes and…","c":"The Agent's memory (agent.mjs): facts brought back and saved, the opening read, the maps, Claude's notes, a folder's notes and the Remember hint. Its methods are put on Agent.prototype by agent.mjs, so this is the Agent: every this.x() is the agent's own.","nw":1},{"id":"terminal/src/agent/agent-model.mjs","n":"agent-model.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":358,"b":26717,"w":"the Agent's talk with the model: one reply streamed, a plain chat, the last word, and how much it thinks","c":"The Agent's talk with the model (agent.mjs): one reply streamed, a plain chat, the last word, and how much it thinks (the step-down and the cap). Its methods are put on Agent.prototype by agent.mjs, so this is the Agent: every this.x() is the agent's own.","nw":1},{"id":"terminal/src/agent/agent-notes.mjs","n":"agent-notes.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":143,"b":12441,"w":"the notes a request brings before the Agent's loop: an MCP server it names, your standing rules, look first, the bug…","c":"The notes a request brings before the Agent's loop (agent-work.mjs): an MCP server it names, your standing rules, look first, the bug steps, a skill, a web address, bypass, the math notes and the design cards. Its methods are put on Agent.prototype by agent.mjs, so this is the Agent: every this.x() is the agent's own. Moved from work() word for word; it gives back the look-first floor, which the loop keeps to.","nw":1},{"id":"terminal/src/agent/agent-pages.mjs","n":"agent-pages.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":499,"b":33872,"w":"the Agent's pages: the design studio and the layout check, the page question, pages opened and read back, and what…","c":"The Agent's pages (agent.mjs): the design studio and the layout check, the page question, pages opened and read back, and what goes on the Desktop. Its methods are put on Agent.prototype by agent.mjs, so this is the Agent: every this.x() is the agent's own.","nw":1},{"id":"terminal/src/agent/agent-read.mjs","n":"agent-read.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":346,"b":22237,"w":"the Agent's reading ahead: the files named or ranked before the first step, the code search, the helpers' findings…","c":"The Agent's reading ahead (agent.mjs): the files named or ranked before the first step, the code search, the helpers' findings and the tests run first. Its methods are put on Agent.prototype by agent.mjs, so this is the Agent: every this.x() is the agent's own.","nw":1},{"id":"terminal/src/agent/agent-room.mjs","n":"agent-room.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":364,"b":25356,"w":"the Agent's room in memory: what the conversation takes, trimming it, dropping older copies, notes when memory…","c":"The Agent's room in memory (agent.mjs): what the conversation takes, trimming it, dropping older copies, notes when memory fills, and starting again from them. Its methods are put on Agent.prototype by agent.mjs, so this is the Agent: every this.x() is the agent's own.","nw":1},{"id":"terminal/src/agent/agent-said.mjs","n":"agent-said.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":610,"b":43820,"w":"what the Agent reads in a reply and its limits: the numbers it works to, and the checks of a reply's text","c":"What the Agent reads in a reply and its limits (agent.mjs): the numbers it works to, and the checks of a reply's text (asks the user, says it is done, a call written as text, thinking that leaked).","nw":1},{"id":"terminal/src/agent/agent-start.mjs","n":"agent-start.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":89,"b":5462,"w":"the Agent's first steps with a message, before its loop: working instructions and prompt files saved since the last…","c":"The Agent's first steps with a message, before its loop (agent-work.mjs work()): working instructions and prompt files saved since the last task, a picture described for a model that cannot see, and the focused paths (rename / fix / change). Its methods are put on Agent.prototype by agent.mjs, so this is the Agent: every this.x() is the agent's own. Moved from work() word for word.","nw":1},{"id":"terminal/src/agent/agent-step.mjs","n":"agent-step.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":769,"b":62914,"w":"one step of the Agent: a tool call checked, asked about, mended and run, and the model's own tools","c":"One step of the Agent (agent.mjs): a tool call checked, asked about, mended and run, and the model's own tools (Map, CodeSearch, Rename, TestFirst, Remember). Its methods are put on Agent.prototype by agent.mjs, so this is the Agent: every this.x() is the agent's own.","nw":1},{"id":"terminal/src/agent/agent-undo.mjs","n":"agent-undo.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":107,"b":5913,"w":"the Agent's safety net: errors kept, files kept as they were, a failed message's changes put back, and a check run aside","c":"The Agent's safety net (agent.mjs): errors kept, files kept as they were, a failed message's changes put back (or kept when it got closer), and a check run aside. Its methods are put on Agent.prototype by agent.mjs, so this is the Agent: every this.x() is the agent's own.","nw":1},{"id":"terminal/src/agent/agent-work.mjs","n":"agent-work.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":496,"b":37613,"w":"the Agent's loop: one message worked through, step after step, until it answers","c":"The Agent's loop (agent.mjs): one message worked through, step after step, until it answers. Its methods are put on Agent.prototype by agent.mjs, so this is the Agent: every this.x() is the agent's own.","nw":1},{"id":"terminal/src/agent/agent.mjs","n":"agent.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":635,"b":46323,"w":"the loop: ask the model, run the tool it picks, repeat (up to 40 steps)","c":"The agent loop: send the conversation to the model, stream what comes back, run the tool it asks for (asking you first when needed), feed the result back, and repeat until it answers without a tool."},{"id":"terminal/src/agent/agents-demo.mjs","n":"agents-demo.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":90,"b":5490,"w":"/agents demo: the real run engine on a pretend driver, so the tree can be seen and tried without a model, and so the…","c":"/agents demo: the real run engine (agents-run.mjs) on a pretend driver, so the tree can be seen and tried without a model, and so the app's tests can drive it.","nw":1},{"id":"terminal/src/agent/agents-driver.mjs","n":"agents-driver.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":102,"b":6573,"w":"/agents' driver on the real agent: the model, the commands and the files of the window's project","c":"/agents' driver on the real agent (agents-run.mjs says what a driver is): the model, the commands and the files of the window's project. A step of work is a message to the agent (agent.send: its tools, its permissions, a /rewind point each); a question that only needs an answer (the interview, the plan, a review) is one focused call with no tools (flows/llm.mjs).","nw":1},{"id":"terminal/src/agent/agents-guards.mjs","n":"agents-guards.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":134,"b":10964,"w":"/agents' stop list: before a step of the model runs, these say whether it must ask first","c":"/agents' stop list (2 Oct 2026, the owner's picks): before a step of the model runs, these say whether it must ask first. The poster's list (auth, payments, deploys, migrations, secrets, deletions), the math guards (a test's expected value or tolerance changed), a new package, and a big diff (over 100 lines or 3 files in one task).","nw":1},{"id":"terminal/src/agent/agents-run.mjs","n":"agents-run.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":634,"b":43345,"w":"/agents: one request taken through six stages, each a ring of four steps the app runs in order, so the tree on the…","c":"/agents (2 Oct 2026, the owner's ask: \"build it all\", after Addy Osmani's agent setup and the agent-tree screen of Claude Code's /advisor): one request taken through six stages, each a ring of four steps the app runs in order, so the tree on the screen (app/agents-tree.mjs) always shows what is really happening.","nw":1},{"id":"terminal/src/agent/auto-check.mjs","n":"auto-check.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":52,"b":3931,"w":"Auto mode: a step the rules cannot settle is checked by the model before it runs, in one short call with nothing…","c":"Auto mode (/mode 1): a step the rules cannot settle (a command no rule covers, a web search or page) is checked by the model before it runs, in one short call with nothing else in it: your request, the folder, the step. It runs when the step clearly serves the request, stays in the project and can be undone; anything else, and no clear answer in time, asks you as Manual would.","nw":1},{"id":"terminal/src/agent/btw.mjs","n":"btw.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":262,"b":16806,"w":"/btw: a quick side question while it works","c":"/btw: a quick side question while Agentic Coder works, like Claude Code's. One question, one answer, no tools, and nothing added to the conversation. The model gets a copy of the whole conversation with long tool output cut (the side lane cannot reuse the main lane's reading: measured 28 Sep, a first side question re-read all 3,751 tokens), and answers on the side lane while the main job goes on in lane 0."},{"id":"terminal/src/agent/busy.mjs","n":"busy.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":109,"b":6382,"w":"a service that says \"too many requests\": the window waits and asks again, up to BUSY_TRIES times in all, instead of…","c":"A service that says \"too many requests\" (/remote): the window waits and asks again, up to BUSY_TRIES times in all, instead of stopping the task. Every window on this Mac waits with it: the time the service gave is written to one small file (BUSY_FILE), and a window about to ask the same service waits it out first, so three windows do not all knock again at once.","nw":1},{"id":"terminal/src/agent/cases.mjs","n":"cases.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":200,"b":16628,"w":"the request's cases, each shown by a test","c":"The request's cases, each shown by a test (4 Oct 2026, the owner's pick after the model shootout: four big models on a service each wrote plainRead, tested the forms it had built, saw its tests pass and said done, while forms the request listed (head -N, tail -N, a pipe, $( ), two files) were never tried: 4, 3, 2 and 0 parts of 6).","nw":1},{"id":"terminal/src/agent/claude-notes.mjs","n":"claude-notes.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":387,"b":24346,"w":"Claude’s notes, as a second place the memory looks","c":"Claude's notes: what Claude Code has written down about your work over many conversations (its memory folder), as a second place Agentic Coder's memory looks. There are hundreds of them, far more than the model can hold, so they come the way saved facts do (recall.mjs): up to four that fit a request, found by meaning, cut to the part that fits, written into the request itself. read where they are every time, so a…"},{"id":"terminal/src/agent/claude-pack.mjs","n":"claude-pack.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":473,"b":30749,"w":"the pack of Claude's notes: one folder made from every place Claude Code keeps notes, laid out as a ladder, the same…","c":"The pack of Claude's notes (3 Oct 2026, the owner's picks): one folder made from every place Claude Code keeps notes (this Mac's own, and a copy taken on another Mac), laid out as a ladder (ladder.mjs), the same shape as a project's code map: MAP.md            level 0: one line per topic <topic>.md        level 1: every note of the topic, one line each (files under 2,000 tokens) notes/            level 2: the notes.","nw":1},{"id":"terminal/src/agent/claude-rules.mjs","n":"claude-rules.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":24,"b":2003,"w":"how you like things done: a few lines boiled down from Claude’s notes","c":"How the user likes things done: thirteen lines, boiled down (28 Sep 2026) from the 52 notes Claude Code keeps on it, put in Agentic Coder's words and left out where Agentic Coder cannot do the thing at all (it cannot open an app). They hold everywhere and are read in full at every start, beside the two rules the user gave Agentic Coder directly (FIRST_FACTS in facts.mjs). Saved once: a line the user removed…"},{"id":"terminal/src/agent/claude-usage.mjs","n":"claude-usage.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":238,"b":14434,"w":"the Claude API's usage, for /usage and the bar under the footer: what is left of the month's spend cap, today's…","c":"The Claude API's usage, for /usage
