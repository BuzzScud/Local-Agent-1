it":1,"ch":[],"files":0,"lines":68,"b":5108,"w":"/jumptomac alone in the app: the \"Jump to a Mac\" box","c":"/jumptomac alone in the app: the \"Jump to a Mac\" box (Design 2 of docs/design rounds/agentic-coder-jumptomac-saved-macs- 2-designs-2026-10-03.html, the owner's pick, 3 Oct 2026). The window's keeper is a stand-in on the session's socket that notes which Mac each jump asks for (sessions.mjs askJump); Tailscale is a file (AGENTIC_TAILSCALE_STATUS).","nw":1},{"id":"terminal/test/app-k2-pictures.test.mjs","n":"app-k2-pictures.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":73,"b":4291,"w":"End-to-end, the real app in a pseudo-terminal (see app.test.mjs): a picture sent while K2 Horizon (which cannot look at…","c":"End-to-end, the real app in a pseudo-terminal (see app.test.mjs): a picture sent while K2 Horizon (which cannot look at pictures) is the model. You are asked whether a model that can (Qwen here, the one whose add-on is on this Mac) takes this message: it loads in K2's place with its add-on, answers, and K2 comes back. Esc puts the message back in the prompt, unsent."},{"id":"terminal/test/app-keep-loaded.test.mjs","n":"app-keep-loaded.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":57,"b":3995,"w":"Keep loaded \"while open\" on an Ollama service","c":"Keep loaded \"while open\" on an Ollama service (3 Oct 2026, on fake-ollama.mjs). Before, the main model was kept with keep_alive -1 and only a clean quit let it go, so a window that crashed, or went back to this Mac with /remote here, left it loaded there for ever (a 25 GB model was found so).","nw":1},{"id":"terminal/test/app-keeper.test.mjs","n":"app-keeper.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":219,"b":13453,"w":"the app the way a window really runs it since 3 Oct 2026: inside a keeper, the window only showing it and sending…","c":"The app the way a window really runs it since 3 Oct 2026: inside a keeper (sessions.mjs), the window only showing it and sending the keys. The other app tests switch that off (test-env.mjs: AGENTIC_SESSIONS=off), so they drive the app in its own window.","nw":1},{"id":"terminal/test/app-loops.test.mjs","n":"app-loops.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":280,"b":21487,"w":"Loops end to end, with a stand-in model: one run as its window starts it, the half-fix a run may keep, and the app…","c":"Loops end to end (src/app/loops.mjs, loop-run.mjs, loops-board.mjs), with a stand-in model: one run as its window starts it (it asks, takes a note, ends the loop), the half-fix a run may keep, and the app itself in a pseudo-terminal with its board in its own window (and in a second one). What a loop is and when it runs, without the app: loops.test.mjs.","nw":1},{"id":"terminal/test/app-mcp.test.mjs","n":"app-mcp.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":164,"b":14237,"w":"End-to-end, the real app in a pseudo-terminal","c":"End-to-end, the real app in a pseudo-terminal (see app.test.mjs). Here: MCP. /mcp adds a server (the stand-in one, started as a program), Test lists its tools before anything is kept, Save keeps it; a tool is marked as reading; the model's call to a tool asks first, and \"don't ask again\" holds; a project's own servers wait for a yes, and a changed file asks again.","nw":1},{"id":"terminal/test/app-memory-check.test.mjs","n":"app-memory-check.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":113,"b":7014,"w":"End-to-end, the real app in a pseudo-terminal (see app.test.mjs), 28 Sep 2026: the start with another copy of the model…","c":"End-to-end, the real app in a pseudo-terminal (see app.test.mjs), 28 Sep 2026: the start with another copy of the model already loaded (it says who has it and waits, or esc starts anyway), and a copy kept loaded at another size than the one you picked (restarted at yours, with that size checked in /stats)."},{"id":"terminal/test/app-memory.test.mjs","n":"app-memory.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":189,"b":14433,"w":"End-to-end, the real app in a pseudo-terminal (see app.test.mjs)","c":"End-to-end, the real app in a pseudo-terminal (see app.test.mjs). Here: the memory. Facts come back with a request, /memory shows them and takes a save back, and what a task taught is saved after the window closed."},{"id":"terminal/test/app-menus.test.mjs","n":"app-menus.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":262,"b":18867,"w":"End-to-end, the real app in a pseudo-terminal (see app.test.mjs)","c":"End-to-end, the real app in a pseudo-terminal (see app.test.mjs). Here: the menus and the keys of the prompt."},{"id":"terminal/test/app-model-start.test.mjs","n":"app-model-start.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":217,"b":13759,"w":"End-to-end, the real app in a pseudo-terminal (see app.test.mjs), with the stand-in llama-server","c":"End-to-end, the real app in a pseudo-terminal (see app.test.mjs), with the stand-in llama-server. The model is off when a window opens (the user's pick, 30 Sep 2026): a message waits, /start loads the model and sends it, /stop unloads it and gives the memory back, /autostart on loads it as the next window opens, and quitting leaves nothing loaded."},{"id":"terminal/test/app-mouse.test.mjs","n":"app-mouse.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":282,"b":18132,"w":"The mouse in the prompt box (/mouse on): what Terminal sends for a press, a drag and a release, and what the box does…","c":"The mouse in the prompt box (/mouse on): what Terminal sends for a press, a drag and a release, and what the box does with them. The last test is the real app in a pseudo-terminal (see app.test.mjs); it plays Terminal's part by hand: the mouse reports, and the answer to \"where is the cursor?\"."},{"id":"terminal/test/app-page-ask.test.mjs","n":"app-page-ask.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":33,"b":2169,"w":"End-to-end, the real app in a pseudo-terminal: a page saved for a request stops the turn and asks you to look at it…","c":"End-to-end, the real app in a pseudo-terminal: a page saved for a request stops the turn and asks you to look at it first (agent.mjs askPage); \"Looks good\" ends it, and the model is not called again to check its own work.","nw":1},{"id":"terminal/test/app-paste.test.mjs","n":"app-paste.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":66,"b":4672,"w":"End-to-end, the real app in a pseudo-terminal","c":"End-to-end, the real app in a pseudo-terminal (see app.test.mjs). Here: text copied off the app's own screen, the way Terminal copies it (the rows as drawn, padding and all), and pasted back with cmd+v (a bracketed paste) reaches the model as it was written. ctrl+z gives the paste as copied.","nw":1},{"id":"terminal/test/app-permissions.test.mjs","n":"app-permissions.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":117,"b":8390,"w":"/permissions in the real app (a pseudo-terminal, see app.test.mjs) and in `coding -p`: the \"always allow\" choice, a…","c":"/permissions in the real app (a pseudo-terminal, see app.test.mjs) and in `coding -p`: the \"always allow\" choice, a protected file in Auto-edit, the saved start-up mode, a rules file that cannot be read, the picker, and the never-list under --yes. The model is the scripted fake."},{"id":"terminal/test/app-profiles.test.mjs","n":"app-profiles.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":102,"b":7613,"w":"Profiles in the real window on a pretend Ollama service: /profiles in the / menu and /subagents opening it on its…","c":"Profiles in the real window (8 Oct 2026) on a pretend Ollama service (fake-ollama.mjs): /profiles in the / menu and /subagents opening it on its AIs group; then the owner's own case: a task under way, /model's three steps picked while it works (model → which profile uses it → its settings), and the task's next step on the new model, said on screen and in the footer.","nw":1},{"id":"terminal o back to it."},{"id":"terminal/test/app.test.mjs","n":"app.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":168,"b":12599,"w":"End-to-end: the real app in a real pseudo-terminal, driven by keystrokes, read back through a terminal emulator","c":"End-to-end: the real app in a real pseudo-terminal, driven by keystrokes, read back through a terminal emulator. The model is the scripted fake. Here: a turn on the screen, from the request to the finished line. The menus, the start-up and the hub pages have their own files (app-*.test.mjs), so the four run side by side."},{"id":"terminal/test/arena-checks.test.mjs","n":"arena-checks.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":143,"b":10716,"w":"The Arena's Look first check and Tool habits check end to end (models/evals/tools/look-check.mjs, habits-check.mjs)…","c":"The Arena's Look first check and Tool habits check end to end (models/evals/tools/look-check.mjs, habits-check.mjs): each runner through the real `coding -p`, on a scripted stand-in model (--url), without a line in the test record or a page (--no-record). The real-model runs are the owner's, from ▶ Run a test."},{"id":"terminal/test/arena-remote.test.mjs","n":"arena-remote.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":167,"b":11152,"w":"the remote models in the Arena: while /remote is connected, the service's models join the Who list; a test runs on…","c":"The remote models in the Arena (models/evals/battle/remote-entrants.mjs, 3 Oct 2026): while /remote is connected (settings.json \"remote\", its use on), the service's models join the Who list; a test runs on one alone or battles it, takes no memory on this Mac, and a check stays on this Mac's models. A battle waiting in the line keeps its remote model when /remote goes off (never the default pair).","nw":1},{"id":"terminal/test/ask-box.test.mjs","n":"ask-box.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":118,"b":6964,"w":"the question box's keys: the model's e port, never 8757, the real hub's: an open Agentic Coder hub tab in the browser would otherwise be answered by the test's hub, which has no model file, and Weights would say the model is not on this Mac (27 Sep)."},{"id":"terminal/test/test-home.test.mjs","n":"test-home.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":62,"b":4199,"w":"the tests never reach the real home","c":"The tests never reach the real home (3 Oct 2026, the fix plan's Part 5a). Several test files in one bun test share one process, and the models part reads its home once: before, a file that imported it first with no AGENTIC_HOME froze the REAL ~/.agentic-coder, and remote-rules.test.mjs then deleted settings.json there after every test (all of its tests passed, so nothing warned).","nw":1},{"id":"terminal/test/test-tmp.mjs","n":"test-tmp.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":148,"b":9079,"w":"a test process's own temp folder, and the clean-up of what a test run leaves behind","c":"A test process's own temp folder, and the clean-up of what a test run leaves behind (10 Oct 2026). Why: the tests make their throwaway folders with mkdtemp(tmpdir()) in some 650 places and start programs in them (the app in a pseudo-terminal, stand-in model servers, session hosts).","nw":1},{"id":"terminal/test/test-tmp.test.mjs","n":"test-tmp.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":138,"b":8404,"w":"the run folder every test process works in, and the clean-up of what a run leaves","nw":1},{"id":"terminal/test/tests-first.test.mjs","n":"tests-first.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":77,"b":5053,"w":"the tests helper's run before the first step: a folder whose run was cut off skips it for a week, and a loop's run…","c":"The tests helper's run before the first step (agent-read.mjs): a folder whose run was cut off skips it for a week (tests-first.mjs), and a loop's run whose last run ran the tests skips it (testsFirst). The cut-off is 1.5 s here (AGENTIC_TESTS_FIRST_MS), set before the agent loads.","nw":1},{"id":"terminal/test/tests-grid.test.mjs","n":"tests-grid.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":82,"b":5933,"w":"the Tests page's grid: each test a row, in two halves, with its name in full; each model a column","c":"The Tests page's grid (terminal/src/app/tests.html): each test a row, in two halves, with its name in full; each model a column. Before 3 Oct 2026 it was the other way round, and at 25 tests across a test's name was one letter and \"never run\" was cut to \"nev\". The page is built from a record of its own and read back from a real browser.","nw":1},{"id":"terminal/test/theme.test.mjs","n":"theme.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":49,"b":3539,"w":"the app's hue: sky blue in the theme, the bot, the loop board, the spinners and the usage card, and no green left…","c":"The app's hue (8 Oct 2026, the owner's pick \"1 · Ocean\": \"i want to change the green to something else\"): sky blue in the theme, the bot (and so the hub's icon), the loop board, the spinners and the usage card, and no green left anywhere the app draws by number.","nw":1},{"id":"terminal/test/timing.test.mjs","n":"timing.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":106,"b":7689,"w":"where a request's time goes: each model reply with what the service says it spent reading and writing, each side…","c":"Where a request's time goes (agent/timing.mjs, 5 Oct 2026): each model reply with what the service says it spent reading and writing, each side call, each tool run; the sums and the bench's line.","nw":1},{"id":"terminal/test/tiny-gguf.mjs","n":"tiny-gguf.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":59,"b":3530,"w":"a tiny model file laid out like the real one","c":"A tiny GGUF laid out like the real model, for tests (not a test itself). Used by gguf-edit.test.mjs and the edits-endpoint test in weights.test.mjs."},{"id":"terminal/test/tools.test.mjs","n":"tools.t the cost meter (the Claude API's dollars only), a figure typed from the Console or Anthropic's bill, against your limit or the tier's cap, the cap's stop said plainly and not tried again, and the card with the prompt box's ends.","nw":1},{"id":"terminal/test/user-hooks.test.mjs","n":"user-hooks.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":243,"b":16125,"w":"Your own hooks: Claude Code's layout read and written, the answers a hook gives, a project's file only after a yes,…","c":"Your own hooks (agent/user-hooks.mjs; /hooks, hooks-form.mjs): Claude Code's layout read and written, the answers a hook gives (exit 0, exit 2, JSON), a project's file only after a yes, and whole conversations on a scripted model with a hook at each moment.","nw":1},{"id":"terminal/test/vision.test.mjs","n":"vision.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":145,"b":11113,"w":"Pictures and PDFs: the macOS helper (media.mjs), a file dragged into the window (images.mjs), which pictures go with a…","c":"Pictures and PDFs: the macOS helper (media.mjs), a file dragged into the window (images.mjs), which pictures go with a request and in what form (llama.cpp and OpenAI-compatible, the Claude API), Read of a picture and of a PDF (tools.mjs), and the model's vision add-on (registry, memory, server). The app: app-vision.test.mjs."},{"id":"terminal/test/way.test.mjs","n":"way.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":398,"b":25211,"w":"Who decides: the app (as before) or the model (agent/way.mjs), on the walkthrough's own example, the tax question, and…","c":"Who decides: the app (as before) or the model (agent/way.mjs), on the walkthrough's own example, the tax question, and the pieces each way changes."},{"id":"terminal/test/web-app.test.mjs","n":"web-app.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":613,"b":47475,"w":"Agentic Coder Web: the calculator's two fixes, the fair line, the accounts, and the server over HTTP with pretend…","c":" test.mjs","n":"window-page.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":152,"b":12803,"w":"the window's page in a real browser: the real page from the real window server, a stand-in app behind it, and a…","c":"The window's page in a real browser (15 Oct 2026, the window audit, docs/private/window-audit-2026-10-15/): the real page (src/window/ui.html) from the real window server (server.mjs), a stand-in app behind it, and a headless Chrome clicked and typed into over the DevTools protocol.","nw":1},{"id":"terminal/test/window.test.mjs","n":"window.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":266,"b":18425,"w":"Agentic Coder in its own window: the pretend terminal's screen, the conversation as the window draws it, when coding…","c":"Agentic Coder in its own window (terminal/src/window/, 12 Oct 2026): the pretend terminal's screen (vt.mjs), the conversation as the window draws it (view.mjs), when coding opens the window, the app's side of the line (bridge.mjs) and the window server end to end with a stand-in app (server.mjs): its key, the state passed on, keys passed back, the app's end; and the pill beside the model (bridge.mjs usageOf,…","nw":1},{"id":"terminal/test/words.test.mjs","n":"words.test.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":9,"b":360,"w":"tests for words"}],"files":232,"lines":40468,"b":2897963,"w":"the terminal’s tests","m":"Unit tests, plus app*.test.mjs, which run the real app in a pseudo-terminal, type keys and read the screen back. fake-server.mjs stands in for llama-server, so nothing here needs a model."},{"id":"terminal/scripts","n":"scripts/","k":"d","p":"t","git":1,"ch":[{"id":"terminal/scripts/demo","n":"demo/","k":"d","p":"t","git":1,"ch":[{"id":"terminal/scripts/demo/run-preview","n":"run-preview/","k":"d","p":"t","git":1,"ch":[{"id":"terminal/scripts/demo/run-preview/build.jsx","n":"build.jsx","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":245,"b":15147,"w":"the countdown-card run of 1 Oct 2026, replayed through the app's real screen twice: Now and New","c":"The countdown-card run of 1 Oct 2026 (Bonsai 2 27B, 16k, thinking cap 4,096), replayed through the app's real screen twice: Now (the main folder's code) and New (this worktree). Times are from the model server's log, the words and steps from the saved session. Writes one page to docs/design rounds. Run: FORCE_COLOR=2 bun terminal/scripts/demo/run-preview/build.jsx","nw":1},{"id":"terminal/scripts/demo/run-preview/page.html","n":"page.html","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":0,"b":16905,"w":"Live Run Preview","nw":1}],"files":2,"lines":245,"b":32052,"nw":1},{"id":"terminal/scripts/demo/build-preview.jsx","n":"build-preview.jsx","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":42,"b":2121,"w":"renders the designs into one preview page","c":"Renders all three designs at every half second of the recorded session with the real Ink components (256 colours, 155 columns = your Terminal window) and writes one self-contained page to the Desktop. Run: FORCE_COLOR=2 bun terminal/scripts/demo/build-preview.jsx"},{"id":"terminal/scripts/demo/live.jsx","n":"live.jsx","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":69,"b":3163,"w":"plays the recorded session in your terminal (`bun run demo`)","c":"Plays the recorded session in your real terminal with one of the designs. bun run demo 1 (or 2, 3) add --speed 1 for real time Keys: enter answers a question · space pauses · shift+tab switches mode · q quits"},{"id":"terminal/scripts/demo/preview.template.html","n":"preview.template.html","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":0,"b":17908,"w":"that page’s template"},{"id":"terminal/scripts/demo/record.mjs","n":"record.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":88,"b":3638,"w":"runs the script’s tool calls for real and writes session.json","c":"Runs the scripted session's tool calls for real on a copy of demo-project/ and writes session.json: every step with its start/end time (seconds, estimated real time on your Mac) and the real tool results."},{"id":"terminal/scripts/demo/script.mjs","n":"script.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":83,"b":4150,"w":"the scripted demo session; the model’s words are written by hand","c":"The scripted demo session. The model's words below are written by hand (no model is downloaded yet); record.mjs runs every tool call for real on a copy of demo-project/ and times each step with the speed estimates below."},{"id":"terminal/scripts/demo/session.json","n":"session.json","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":0,"b":9297,"w":"the recorded session: every step with its times"},{"id":"terminal/scripts/demo/spin.jsx","n":"spin.jsx","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":79,"b":3529,"w":"the working icon in three looks (`bun run spin`)","c":"The working icon in its three looks, side by side in your real terminal: the app's own Spinner line, fed one turn whose timing follows Bonsai 2 27B's measured speeds on this Mac (writes 13.8 tokens/s, reads ~60 tokens/s). bun run spin space pauses · q quits"}],"files":9,"lines":606,"b":75858,"w":"the scripted demo session and design previews"},{"id":"terminal/scripts/shims","n":"shims/","k":"d","p":"t","git":1,"ch":[{"id":"terminal/scripts/shims/react-devtools-core","n":"react-devtools-core/","k":"d","p":"t","git":1,"ch":[{"id":"terminal/scripts/shims/react-devtools-core/index.js","n":"index.js","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":3,"b":165,"w":"the empty stand-in","c":"Ink loads React DevTools only when DEV=true; Agentic Coder never needs it."},{"id":"terminal/scripts/shims/react-devtools-core/package.json","n":"package.json","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":0,"b":203,"w":"its package file"}],"files":2,"lines":3,"b":368,"w":"a stand-in so Ink never loads React DevTools"}],"files":2,"lines":3,"b":368,"w":"stand-ins for packages"},{"id":"terminal/scripts/capture-ui.mjs","n":"capture-ui.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":62,"b":4839,"w":"captures the new screens with the real app and model","c":"Captures the new screens with the real app and the real model (155×43, or COLS/ROWS from the environment): the start-up (restoring the saved warm-up), the \"/\" menu, the /model picker and a first reply. Saves terminal/scripts/capture-ui.json for the report. AGENTIC_BIN=~/.local/bin/coding [COLS=80 ROWS=24] node terminal/scripts/capture-ui.mjs [--out file.json] Each screen is also checked: the box at the bottom, the…"},{"id":"terminal/scripts/codemap.mjs","n":"codemap.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":131,"b":8482,"w":"bun run codemap [<project folder>]: writes the project's code map, docs/map/","c":"bun run codemap [<project folder>]: writes the project's code map, docs/map/ (tools/codemap.mjs). A model writes the lines, one request per folder (the folder and its main files), deepest folders first so a folder's line can use its folders' lines; a line kept from before is used while its file is the same, so after a change only the changed files are sent.","nw":1},{"id":"terminal/scripts/flow-page.mjs","n":"flow-page.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":21,"b":1582,"w":"draws the Flow page: the hub’s Flow tab, and a dated copy","c":"Saves a dated copy of the hub's Flow tab: one self-contained HTML file. bun terminal/scripts/flow-page.mjs writes docs/diagrams/agentic-coder-flow-diagram-<today>.html bun terminal/scripts/flow-page.mjs <file.html> writes that file instead The tab itself is drawn by the app each time it opens (src/app/flow-hub.mjs), from the model list, the settings in use and the newest test the models share. This keeps what it…"},{"id":"terminal/scripts/measured.json","n":"measured.json","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":0,"b":3251,"w":"measured numbers the report reads"},{"id":"terminal/scripts/pack.mjs","n":"pack.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":24,"b":1798,"w":"bun run pack: builds the pack of Claude's notes from Claude Code's memory folders on this Mac and the copies named…","c":"bun run pack: builds the pack of Claude's notes (~/.agentic-coder/claude-pack, claude-pack.mjs) from Claude Code's memory folders on this Mac and the copies named once with --from (a \"Claude memory …\" folder and a \"Claude skills and tools …\" folder copied from another Mac); later runs use the same copies, kept in the pack's pack.json. Claude's own folders and the copies are only read.","nw":1},{"id":"terminal/scripts/report.mjs","n":"report.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":187,"b":13002,"w":"builds the \"what got built\" report page from captured screens","c":"Builds bonsai-code-built.html in the DOCS folder: the real app's screens (captured from real runs), measured numbers, the practice scorecard, keys and limits. node terminal/scripts/report.mjs"},{"id":"terminal/scripts/ui-walk.mjs","n":"ui-walk.mjs","k":"f","p":"t","git":1,"ch":[],"files":0,"lines":229,"b":14936,"w":"walks every screen at one window size, with resizes","c":"A walk through every screen of the app, at one window size, with resizes along the way: the real app in a resizable terminal, the model scripted. Each screen is captured (as HTML with Terminal's colours) and checked. node terminal/scripts/ui-walk.mjs [--cols 155 --rows 43] [--out file.json] [--only tour,flows]"}],"files":18,"lines":1263,"b":124116,"w":"captures, page builders, design previews","m":"capture*.mjs run the real app and save its screens; report.mjs, report-ui.mjs and ui-report.mjs build report pages; demo/ holds the scripted demo session and design previews; flow-page.mjs draws the Flow page; shims/ stands in for React DevTools."},{"id":"terminal/app","n":"app/","k":"d","p":"t","git":1,"ch":[{"id":"terminal/app/window","n":"window/","k":"d","p":"t","git":1,"ch":[{"id":"terminal/app/window/src","n":"src/","k":"d","p":"t","git":1,"ch":[{"id":"terminal/app/window/src/main.rs","n":"main.rs","k":"f"," s/evals/bench/tasks/26-bigproject-change/project/src/app/App.jsx","n":"App.jsx","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":597,"b":31381,"w":"Bonsai Code's terminal app: starts the model, runs the agent, and turns its events into the screen; handles the…","c":"Bonsai Code's terminal app: starts the model, runs the agent, and turns its events into the screen; handles the prompt box, permission prompts, slash commands, layouts, sessions and keys."},{"id":"models/evals/bench/tasks/26-bigproject-change/project/src/app/commands.mjs","n":"commands.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":22,"b":1276,"w":"Slash commands shown in the menu when you type \"/\""},{"id":"models/evals/bench/tasks/26-bigproject-change/project/src/app/edit-input.mjs","n":"edit-input.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":41,"b":2577,"w":"Text editing for the prompt box, as a pure function so it can be tested: → new state. state = { value, cursor }","c":"Text editing for the prompt box, as a pure function so it can be tested: (state, typed input, key) → new state. state = { value, cursor }."},{"id":"models/evals/bench/tasks/26-bigproject-change/project/src/app/markdown.jsx","n":"markdown.jsx","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":50,"b":2197,"w":"Just enough Markdown for model replies: headings, lists, code blocks, inline code, **bold** and *italic*"},{"id":"models/evals/bench/tasks/26-bigproject-change/project/src/app/screen.jsx","n":"screen.jsx","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":471,"b":23705,"w":"what the terminal shows, in either layout: classic — Claude Code as it is: thinking folded to one line, one spinner.…","c":"What the terminal shows, in either layout: classic — Claude Code as it is: thinking folded to one line, one spinner. live    — you watch it work: thinking streams in a 4-line window, tool calls show how much is written, a meter line shows speed, context and memory. Finished lines go in <Static> (printed once, so the terminal's own scrollback keeps working); the live area below them is redrawn."},{"id":"models/evals/bench/tasks/26-bigproject-change/project/src/app/store.mjs","n":"store.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":54,"b":2348,"w":"Settings, saved sessions and prompt history, all under ~/.bonsai-code"}],"files":6,"lines":1235,"b":63484},{"id":"models/evals/bench/tasks/26-bigproject-change/project/src/flows","n":"flows/","k":"d","p":"m","git":1,"ch":[{"id":"models/evals/bench/tasks/26-bigproject-change/project/src/flows/apply.mjs","n":"apply.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":25,"b":1439,"w":"Applying a finished change to your real files: show the diff and ask, unless edits are on auto-accept","c":"Applying a finished change to your real files: show the diff and ask (as in the tool loop: yes / yes for this session / no), unless edits are on auto-accept."},{"id":"models/evals/bench/tasks/26-bigproject-change/project/src/flows/change.mjs","n":"change.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":249,"b":18331,"w":"Add or change code, test first: find the file, have the model write a test that defines \"done\", let you approve it,…","c":"Add or change code, test first: find the file, have the model write a test that defines \"done\" (it must fail on today's code), let you approve it, then try versions in the scratch copy until every test passes. A project without tests gets a throwaway check instead, kept out of your project."},{"id":"models/evals/bench/tasks/26-bigproject-change/project/src/flows/fix.mjs","n":"fix.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":109,"b":7323,"w":"Fix: run the tests, find the code the failure points at, try corrected versions in the scratch copy until the tests…","c":"Fix: run the tests, find the code the failure points at, try corrected versions in the scratch copy until the tests pass, then show the diff."},{"id":"models/evals/bench/tasks/26-bigproject-change/project/src/flows/index.mjs","n":"index.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":142,"b":9838,"w":"Sorting a request into a type and running the path built for it: rename → the built-in rename fix → tries against…","c":"Sorting a request into a type and running the path built for it: rename  → the built-in rename (no model) fix     → tries against the failing tests change  → test first, then tries question / other → the step-by-step tool loop"},{"id":"models/evals/bench/tasks/26-bigproject-change/project/src/flows/llm.mjs","n":"llm.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":39,"b":2248,"w":"one focused model call: a short system prompt, one user message, no tools","c":"One focused model call: a short system prompt, one user message, no tools. Optionally forced into a JSON shape (the server constrains the output). thinking: think first, at the chat's level (Medium/High); used for writing code and tests. Sorting and choosing (JSON answers) never think."},{"id":"models/evals/bench/tasks/26-bigproject-change/project/src/flows/localize.mjs","n":"localize.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":104,"b":4909,"w":"Finding the code a request is about: files named in it, files a failing test run points at, and, when neither says,…","c":"Finding the code a request is about: files named in it, files a failing test run points at (stack frames, the failing tests' imports), and, when neither says, the model choosing from the project's own file list."},{"id":"models/evals/bench/tasks/26-bigproject-change/project/src/flows/rename.mjs","n":"rename.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":181,"b":8149,"w":"Built-in rename: every use of a name in the project's code, shown as one diff and applied in one go","c":"Built-in rename: every use of a name in the project's code, shown as one diff and applied in one go. No model needed. Only code changes: a word inside quotes or a comment is text, not the name (\"rename test to check\" once turned 'node:test' into 'node:check'). A name imported from a package keeps its real name and gets an alias (import { test as check } from 'node:test'). Text files (README, JSON, …) are left alone."},{"id":"models/evals/bench/tasks/26-bigproject-change/project/src/flows/results.mjs","n":"results.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":34,"b":2331,"w":"Reads test-runner output: how many passed and failed, and which failed","c":"Reads test-runner output: how many passed and failed, and which failed. Knows node:test, Jest, Vitest, Mocha, pytest and unittest; otherwise the exit code decides."},{"id":"models/evals/bench/tasks/26-bigproject-change/project/src/flows/scratch.mjs","n":"scratch.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":53,"b":2529,"w":"a scratch copy of the project where tries are written and tested, so your real files change only after you approve","c":"A scratch copy of the project where tries are written and tested, so your real files change only after you approve. Uses APFS clones (instant, no extra disk); heavy folders such as node_modules are linked, not copied."},{"id":"models/evals/bench/tasks/26-bigproject-change/project/src/flows/testfile.mjs","n":"testfile.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":80,"b":3974,"w":"Adding a model-written test to a test file: its import lines are merged with the file's own, the rest goes at the end"},{"id":"models/evals/bench/tasks/26-bigproject-change/project/src/flows/tries.mjs","n":"tries.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":62,"b":3343,"w":"Tries until one passes: ask the model for a new version, put it in the scratch copy, check it, keep the first that…","c":"Tries until one passes: ask the model for a new version, put it in the scratch copy, check it, keep the first that passes (at most max). The screen shows each try as it happens: ✗ ✗ ✓."},{"id":"models/evals/bench/tasks/26-bigproject-change/project/src/flows/units.mjs","n":"units.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":75,"b":3731,"w":"the piece of a file a try rewrites","c":"The piece of a file a try rewrites. Small files are rewritten whole; in a bigger file, one function (JavaScript or Python) is cut out, rewritten and put back. Bonsai 2 27B writes about 10 tokens a second, so rewriting a whole 150-line file took ~4 minutes a try; one function takes under one."}],"files":12,"lines":1153,"b":68145},{"id":"models/evals/bench/tasks/26-bigproject-change/project/src/tools","n":"tools/","k":"d","p":"m","git":1,"ch":[{"id":"models/evals/bench/tasks/26-bigproject-change/project/src/tools/edit.mjs","n":"edit.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":49,"b":2375,"w":"Edit tool: exact find-and-replace","c":"Edit tool: exact find-and-replace. The text to find must appear exactly once, so a small model can never change the wrong spot. planEdit() makes the diff for the permission prompt; applyEdit() writes it."},{"id":"models/evals/bench/tasks/26-bigproject-change/project/src/tools/fs.mjs","n":"fs.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":109,"b":4863,"w":"List and Search: walk the project folder without node_modules, .git and other bulky folders; git grep when the…","c":"List and Search: walk the project folder without node_modules, .git and other bulky folders; git grep when the folder is a git repo (much faster)."},{"id":"models/evals/bench/tasks/26-bigproject-change/project/src/tools/outline.mjs","n":"outline.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":82,"b":4393,"w":"a long file's parts with their line ranges, so the model reads only the part it needs instead of the whole file","c":"A long file's parts with their line ranges, so the model reads only the part it needs instead of the whole file (reading is the slow part: ~60 tokens a second, so a 600-line file costs ~2½ minutes every time). JavaScript/TypeScript: functions, classes and their methods, const arrow functions, exported values. Python: def and class. Anything else: blocks of 60 lines."},{"id":"models/evals/bench/tasks/26-bigproject-change/project/src/tools/read.mjs","n":"read.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":11,"b":536,"w":"Read tool: returns a file's text with line numbers, the way the model sees it"},{"id":"models/evals/bench/tasks/26-bigproject-change/project/src/tools/run.mjs","n":"run.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":59,"b":2858,"w":"Run tool: one shell command in the project folder, output capped so it cannot flood a small context window","c":"Run tool: one shell command in the project folder, output capped so it cannot flood a small context window. Commands run inside the macOS sandbox (sandbox.mjs): they cannot read your home folder or write outside cwd. Pass sandbox: false for a command you typed yourself (! in the app), or sandbox: { readOnly: [...] } for more folders it may read."},{"id":"models/evals/bench/tasks/26-bigproject-change/project/src/tools/sandbox.mjs","n":"sandbox.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":110,"b":6415,"w":"the folder fence for commands, enforced by macOS itself: however a command is spelled, it cannot read your home…","c":"The folder fence for commands, enforced by macOS itself (sandbox-exec): however a command is spelled, it cannot read your home folder or write outside the project. Checking the words of a command (permissions.mjs) catches the plain cases with a clear message; this catches the rest (\"$HOME\"/Desktop, ~user, $(dirname $PWD), a script that lists ~)."}],"files":6,"lines":420,"b":21440},{"id":"models/evals/bench/tasks/26-bigproject-change/project/src/server","n":"server/","k":"d","p":"m","git":1,"ch":[{"id":"models/evals/bench/tasks/26-bigproject-change/project/src/server/memory.mjs","n":"memory.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":33,"b":1905,"w":"how much memory the Mac can give the model right now, and which context size fits: 32k by default, 16k when memory…","c":"How much memory the Mac can give the model right :1,"ch":[],"files":0,"lines":41,"b":2577,"w":"Text editing for the prompt box, as a pure function so it can be tested: → new state. state = { value, cursor }","c":"Text editing for the prompt box, as a pure function so it can be tested: (state, typed input, key) → new state. state = { value, cursor }."},{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/app/markdown.jsx","n":"markdown.jsx","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":50,"b":2197,"w":"Just enough Markdown for model replies: headings, lists, code blocks, inline code, **bold** and *italic*"},{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/app/screen.jsx","n":"screen.jsx","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":471,"b":23705,"w":"what the terminal shows, in either layout: classic — Claude Code as it is: thinking folded to one line, one spinner.…","c":"What the terminal shows, in either layout: classic — Claude Code as it is: thinking folded to one line, one spinner. live    — you watch it work: thinking streams in a 4-line window, tool calls show how much is written, a meter line shows speed, context and memory. Finished lines go in <Static> (printed once, so the terminal's own scrollback keeps working); the live area below them is redrawn."},{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/app/store.mjs","n":"store.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":54,"b":2348,"w":"Settings, saved sessions and prompt history, all under ~/.bonsai-code"}],"files":6,"lines":1235,"b":63484},{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/flows","n":"flows/","k":"d","p":"m","git":1,"ch":[{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/flows/apply.mjs","n":"apply.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":25,"b":1439,"w":"Applying a finished change to your real files: show the diff and ask, unless edits are on auto-accept","c":"Applying a finished change to your real files: show the diff and ask (as in the tool loop: yes / yes for this session / no), unless edits are on auto-accept."},{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/flows/change.mjs","n":"change.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":249,"b":18331,"w":"Add or change code, test first: find the file, have the model write a test that defines \"done\", let you approve it,…","c":"Add or change code, test first: find the file, have the model write a test that defines \"done\" (it must fail on today's code), let you approve it, then try versions in the scratch copy until every test passes. A project without tests gets a throwaway check instead, kept out of your project."},{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/flows/fix.mjs","n":"fix.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":109,"b":7323,"w":"Fix: run the tests, find the code the failure points at, try corrected versions in the scratch copy until the tests…","c":"Fix: run the tests, find the code the failure points at, try corrected versions in the scratch copy until the tests pass, then show the diff."},{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/flows/index.mjs","n":"index.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":142,"b":9838,"w":"Sorting a request into a type and running the path built for it: rename → the built-in rename fix → tries against…","c":"Sorting a request into a type and running the path built for it: rename  → the built-in rename (no model) fix     → tries against the failing tests change  → test first, then tries question / other → the step-by-step tool loop"},{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/flows/llm.mjs","n":"llm.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":39,"b":2248,"w":"one focused model call: a short system prompt, one user message, no tools","c":"One focused model call: a short system prompt, one user message, no tools. Optionally forced into a JSON shape (the server constrains the output). thinking: think first, at the chat's level (Medium/High); used for writing code and tests. Sorting and choosing (JSON answers) never think."},{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/flows/localize.mjs","n":"localize.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":104,"b":4909,"w":"Finding the code a request is about: files named in it, files a failing test run points at, and, when neither says,…","c":"Finding the code a request is about: files named in it, files a failing test run points at (stack frames, the failing tests' imports), and, when neither says, the model choosing from the project's own file list."},{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/flows/rename.mjs","n":"rename.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":181,"b":8149,"w":"Built-in rename: every use of a name in the project's code, shown as one diff and applied in one go","c":"Built-in rename: every use of a name in the project's code, shown as one diff and applied in one go. No model needed. Only code changes: a word inside quotes or a comment is text, not the name (\"rename test to check\" once turned 'node:test' into 'node:check'). A name imported from a package keeps its real name and gets an alias (import { test as check } from 'node:test'). Text files (README, JSON, …) are left alone."},{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/flows/results.mjs","n":"results.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":34,"b":2331,"w":"Reads test-runner output: how many passed and failed, and which failed","c":"Reads test-runner output: how many passed and failed, and which failed. Knows node:test, Jest, Vitest, Mocha, pytest and unittest; otherwise the exit code decides."},{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/flows/scratch.mjs","n":"scratch.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":53,"b":2529,"w":"a scratch copy of the project where tries are written and tested, so your real files change only after you approve","c":"A scratch copy of the project where tries are written and tested, so your real files change only after you approve. Uses APFS clones (instant, no extra disk); heavy folders such as node_modules are linked, not copied."},{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/flows/testfile.mjs","n":"testfile.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":80,"b":3974,"w":"Adding a model-written test to a test file: its import lines are merged with the file's own, the rest goes at the end"},{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/flows/tries.mjs","n":"tries.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":62,"b":3343,"w":"Tries until one passes: ask the model for a new version, put it in the scratch copy, check it, keep the first that…","c":"Tries until one passes: ask the model for a new version, put it in the scratch copy, check it, keep the first that passes (at most max). The screen shows each try as it happens: ✗ ✗ ✓."},{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/flows/units.mjs","n":"units.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":75,"b":3731,"w":"the piece of a file a try rewrites","c":"The piece of a file a try rewrites. Small files are rewritten whole; in a bigger file, one function (JavaScript or Python) is cut out, rewritten and put back. Bonsai 2 27B writes about 10 tokens a second, so rewriting a whole 150-line file took ~4 minutes a try; one function takes under one."}],"files":12,"lines":1153,"b":68145},{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/tools","n":"tools/","k":"d","p":"m","git":1,"ch":[{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/tools/edit.mjs","n":"edit.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":49,"b":2375,"w":"Edit tool: exact find-and-replace","c":"Edit tool: exact find-and-replace. The text to find must appear exactly once, so a small model can never change the wrong spot. planEdit() makes the diff for the permission prompt; applyEdit() writes it."},{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/tools/fs.mjs","n":"fs.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":109,"b":4863,"w":"List and Search: walk the project folder without node_modules, .git and other bulky folders; git grep when the…","c":"List and Search: walk the project folder without node_modules, .git and other bulky folders; git grep when the folder is a git repo (much faster)."},{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/tools/outline.mjs","n":"outline.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":82,"b":4393,"w":"a long file's parts with their line ranges, so the model reads only the part it needs instead of the whole file","c":"A long file's parts with their line ranges, so the model reads only the part it needs instead of the whole file (reading is the slow part: ~60 tokens a second, so a 600-line file costs ~2½ minutes every time). JavaScript/TypeScript: functions, classes and their methods, const arrow functions, exported values. Python: def and class. Anything else: blocks of 60 lines."},{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/tools/read.mjs","n":"read.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":11,"b":536,"w":"Read tool: returns a file's text with line numbers, the way the model sees it"},{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/tools/run.mjs","n":"run.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":59,"b":2858,"w":"Run tool: one shell command in the project folder, output capped so it cannot flood a small context window","c":"Run tool: one shell command in the project folder, output capped so it cannot flood a small context window. Commands run inside the macOS sandbox (sandbox.mjs): they cannot read your home folder or write outside cwd. Pass sandbox: false for a command you typed yourself (! in the app), or sandbox: { readOnly: [...] } for more folders it may read."},{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/tools/sandbox.mjs","n":"sandbox.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":110,"b":6415,"w":"the folder fence for commands, enforced by macOS itself: however a command is spelled, it cannot read your home…","c":"The folder fence for commands, enforced by macOS itself (sandbox-exec): however a command is spelled, it cannot read your home folder or write outside the project. Checking the words of a command (permissions.mjs) catches the plain cases with a clear message; this catches the rest (\"$HOME\"/Desktop, ~user, $(dirname $PWD), a script that lists ~)."}],"files":6,"lines":420,"b":21440},{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/server","n":"server/","k":"d","p":"m","git":1,"ch":[{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/server/memory.mjs","n":"memory.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":33,"b":1905,"w":"how much memory the Mac can give the model right now, and which context size fits: 32k by default, 16k when memory…","c":"How much memory the Mac can give the model right now, and which context size fits: 32k by default, 16k when memory is short (and we say why)."},{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/server/models.mjs","n":"models.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":76,"b":4083,"w":"the models Bonsai Code can run, and where everything lives on disk"},{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/server/server.mjs","n":"server.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":165,"b":7046,"w":"Starts and looks after Prism's llama-server for one model: picks a free port, waits until it is healthy, restarts it…","c":"Starts and looks after Prism's llama-server for one model: picks a free port, waits until it is healthy, restarts it once if it crashes, and stops it when Bonsai Code exits."},{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/server/warmup.mjs","n":"warmup.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":72,"b":4010,"w":"Warming up the model before the first message","c":"Warming up the model before the first message. The model has to read its instructions and the tool list (~1,500 tokens, ~26 s on the 27B) before it can answer. That part is the same in every project and on every day (systemPrompt puts this session's details last, after SESSION_MARK), so after the first read the server saves its state to disk and later starts restore it in a fraction of a second."}],"files":4,"lines":346,"b":17044},{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/headless.mjs","n":"headless.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":34,"b":1895,"w":"Runs one prompt start to finish without the terminal UI: used by the practice-task runner and by bonsai -p \"…\""},{"id":"models/evals/bench/tasks/25-bigproject-question/project/src/setup.mjs","n":"setup.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":65,"b":2943,"w":"bonsai setup: downloads what Bonsai Code needs into ~/.bonsai-code — Prism ML's llama.cpp build and the model — and…","c":"bonsai setup: downloads what Bonsai Code needs into ~/.bonsai-code — Prism ML's llama.cpp build (pinned) and the model — and checks the model's SHA-256. Safe to run again: finished files are skipped."}],"files":36,"lines":4642,"b":254080},{"id":"models/evals/bench/tasks/25-bigproject-question/project/test","n":"test/","k":"d","p":"m","git":1,"ch":[{"id":"models/evals/bench/tasks/25-bigproject-question/project/test/fs.test.mjs","n":"fs.test.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":21,"b":809},{"id":"models/evals/bench/tasks/25-bigproject-question/project/test/outline.test.mjs","n":"outline.test.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":10,"b":406}],"files":2,"lines":31,"b":1215},{"id":"models/eva l patch, at the engine's commit, as static llama-server and llama-bench in ~/.agentic-coder/engine/<tag>/. Needs git, cmake and Apple's command line tools; about 3 minutes on the M4. `coding setup` calls it; by hand: node models/runtime/engine/build-now.mjs [official|prism]…"},{"id":"models/runtime/engine/make-patch.mjs","n":"make-patch.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":13,"b":822,"w":"regenerates patch.mjs from the patch","c":"Regenerates patch.mjs from pq2-multicol.patch (run after changing the patch): node models/runtime/engine/make-patch.mjs The patch itself comes from `git diff` in a checkout of Prism's llama.cpp at ENGINE.commit."},{"id":"models/runtime/engine/patch.mjs","n":"patch.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":206,"b":9876,"w":"our Metal patch as text, so the one-file app carries it","c":"The Metal patch as text, so the one-file `agentic-coder` binary carries it: the same bytes as pq2-multicol.patch (a test checks). Made by make-patch.mjs; do not edit by hand."},{"id":"models/runtime/engine/pq2-multicol.patch","n":"pq2-multicol.patch","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":0,"b":9670,"w":"the patch itself"}],"files":6,"lines":290,"b":27111,"w":"how llama.cpp is built","m":"Two engines: the official llama.cpp release, and Prism ML’s fork with our Metal patch (the default)."},{"id":"models/runtime/claude.mjs","n":"claude.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":126,"b":8229,"w":"the Claude API as a /remote: the client, its models, the connect check","c":"The Claude API as a /remote (Run on: Claude API): Anthropic's Messages API through its official SDK (@anthropic-ai/sdk), loaded only when a Claude remote is used. Here: the client, what each model takes, and the check the form's Connect and connecting run. The chat itself is terminal/src/agent/claude.mjs."},{"id":"models/runtime/edited.mjs","n":"edited.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":87,"b":3970,"w":"the one edited copy of a model, made from the Weights tab","c":"The edited copy of a model: ONE slot per model, next to the original in ~/.agentic-coder/models, described by edited-<model>.json there. Each save rebuilds the copy from a fresh clone of the original plus the full edit list, so the manifest always says exactly what is in the file. The original and `coding setup`'s fingerprint check are never involved."},{"id":"models/runtime/embed.mjs","n":"embed.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":78,"b":3827,"w":"runs the meaning-matcher (bge-m3) beside the main model","c":"The embedder: a small model that turns texts into numbers, so that meanings can be compared (models/bge-m3). It runs in the same llama-server as the 27B, in its embedding mode, as a server of its own: started at the first use, shared between windows and kept loaded like the 27B's (server.mjs)."},{"id":"models/runtime/memory.mjs","n":"memory.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":162,"b":10249,"w":"how much memory the Mac can give, and which context size fits","c":"How much memory the Mac can give the model right now, and which context size fits: 32k by default, 16k when memory is short (and we say why)."},{"id":"models/runtime/ollama.mjs","n":"ollama.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":220,"b":12796,"w":"an Ollama service: what each of its models is and can do","c":"An Ollama service (/remote, Another service): what each of its models is and can do. Its OpenAI-style /v1/models gives names only, so Ollama's own API is read too: /api/version says it is Ollama; /api/tags lists the models (size, family, parameters, quantization); /api/ps the ones loaded now and the context each runs at; /api/show each one's abilities (tools, thinking, vision, completion, embedding) and its longest…","nw":1},{"id":"models/runtime/remote.mjs","n":"remote.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":623,"b":41058,"w":"a model on another machine: its address, its key, the SSH tunnel, a check that it answers","c":"A model on another machine (/remote): its address, its API key, the SSH tunnel when it is reached that way, and a check that it answers. The terminal keeps the remote in use in settings.json (\"remote\"), one saved set-up per service (\"remotes\": claude, machine, openai), and each one's key in the macOS Keychain under its own name (keyIdOf); every call to a model server asks endpointOf(url) for the key and the kind of…"},{"id":"models/runtime/rerank.mjs","n":"rerank.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":76,"b":3944,"w":"the reranker: a small model that puts the best search finds first","c":"The reranker: a small model that reads a request together with each piece the search found and says how well each answers it (models/qwen3-reranker-0.6b). It runs in the same llama-server as the other models, in its reranking mode, as a server of its own: started at its first use, shared between windows and kept loaded like the embedder (embed.mjs). /effort's Reranker row turns it on; off, nothing here runs."},{"id":"models/runtime/serve.mjs","n":"serve.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":95,"b":5597,"w":"`coding serve`: this Mac’s model for another machine’s /remote, behind a key","c":"`coding serve`: this machine's model for another machine's /remote. It starts llama-server open to the network (or to this machine only, for an SSH tunnel: --local) behind an API key, and prints what to type into /remote over there. It runs until ctrl+c; the model stops with it."},{"id":"models/runtime/server.mjs","n":"server.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":422,"b":25025,"w":"starts, shares and stops llama-server","c":"Starts and looks after llama-server for one model (on the model's engine): picks a free port, waits until it is healthy, restarts it once if it crashes, and stops it when Agentic Coder exits."},{"id":"models/runtime/setup.mjs","n":"setup.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":135,"b":8674,"w":"`coding setup`: builds the engine, downloads the models, checks them","c":"`coding setup`: gets what Agentic Coder needs into ~/.agentic-coder — the model server (llama.cpp built from source on the model's engine, see models/runtime/engine), the model, its guessing helper and the memory's matcher — and checks the files' SHA-256. Safe to run again: finished parts are skipped."},{"id":"models/runtime/warmup.mjs","n":"warmup.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":115,"b":6626,"w":"saves the model’s read-in instructions so the next start is fast","c":"Warming up the model before the first message. The model has to read its instructions and the tool list (~1,500 tokens, ~26 s on the 27B) before it can answer. That part is the same in every project and on every day (the caller's system prompt puts this session's details last, after sessionMark), so after the first read the server saves its state to disk and later starts restore it in a fraction of a second. Then…"}],"files":18,"lines":3000,"b":188500,"w":"what runs a model: server, memory fit, warm-up, setup","m":"server.mjs starts, shares and stops llama-server (a free port, one restart after a crash); memory.mjs picks a 32k context, or 16k when memory is short; warmup.mjs saves the model’s read-in instructions so the next start is fast; setup.mjs is `coding setup`."},{"id":"models/qwen3.5-9b","n":"qwen3.5-9b/","k":"d","p":"m","git":1,"ch":[{"id":"models/qwen3.5-9b/model.mjs","n":"model.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":93,"b":5410,"w":"its settings","c":"Qwen3.5 9B (Alibaba's Qwen team, Feb 2026; Apache 2.0), Unsloth's UD-Q5_K_XL: a second model to try beside Gemma, added 29 Sep 2026 (their pick of file: the Q5, a bit smarter than Q4 and about Gemma's size). Since the speed test the same day it is Unsloth's MTP build of that file: the same weights plus Qwen's own MTP layer, its speed helper (see draft below). Same family as the Bonsai 27B's base: mostly Gated…"}],"files":1,"lines":93,"b":5410,"w":"Qwen3.5 9B: the default model","m":"Alibaba’s Qwen3.5 9B (Unsloth’s Q5 build), the default since 30 Sep 2026. Its speed layer (MTP) is inside the model file. Only one model fits in 16 GB at a time.","flag":"default"},{"id":"models/k2-horizon-7b","n":"k2-horizon-7b/","k":"d","p":"m","git":1,"ch":[{"id":"models/k2-horizon-7b/model.mjs","n":"model.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":73,"b":4157,"w":"its settings, tool-call format and thinking tags","c":"K2 Horizon 7B (MBZUAI's Institute of Foundation Models, 3 Sep 2026; Apache 2.0, fully open: weights, data and training code), IFM's own Q5_K_M: a third model to try beside Gemma and Qwen, added 30 Sep 2026. \"7B\" is its core; its own file counts 9.0B with the word table. Artificial Analysis Intelligence Index v4.3.2: 21, against Qwen3.5 9B's 11 and Gemma 4 12B's 14. Text only: it cannot look at pictures (a picture…"}],"files":1,"lines":73,"b":4157,"w":"K2 Horizon 7B: the third model in /model","m":"MBZUAI IFM’s K2 Horizon 7B (Q5_K_M), in /model since 30 Sep 2026. It runs only on IFM’s own llama.cpp (the third engine) and cannot look at pictures. model.mjs holds its settings, its tool-call format and its thinking tags.","flag":"third"},{"id":"models/bge-m3","n":"bge-m3/","k":"d","p":"m","git":1,"ch":[{"id":"models/bge-m3/README.md","n":"README.md","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":0,"b":1592,"w":"what it is and what it does"},{"id":"models/bge-m3/model.mjs","n":"model.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":31,"b":1518,"w":"its settings","c":"BGE-M3 (BAAI, MIT): the small model that finds the saved facts of Agentic Coder's memory that fit a request. It writes nothing: it turns a text into 1,024 numbers, and two texts that mean the same get numbers that are close, so \"run the suite\" lands next to \"the tests\". It runs in the same engine as the 27B, in its embedding mode, beside it. Measured 2026-09-26 on the M4 with a 27B loaded (20 facts, 30 requests, see…"}],"files":2,"lines":31,"b":3110,"w":"BGE-M3: the small model that compares meanings","m":"It writes nothing; it turns a text into numbers so meanings can be compared. That finds the saved facts that fit a request, and ranks files and code parts. runtime/embed.mjs runs it beside the main model.","flag":"helper"},{"id":"models/qwen3-reranker-0.6b","n":"qwen3-reranker-0.6b/","k":"d","p":"m","git":1,"ch":[{"id":"models/qwen3-reranker-0.6b/README.md","n":"README.md","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":0,"b":4106,"w":"why this reranker: the bake-off and the pick"},{"id":"models/qwen3-reranker-0.6b/model.mjs","n":"model.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":31,"b":1694,"w":"its settings","c":"Qwen3-Reranker 0.6B (Qwen, Apache 2.0): the model /effort's Reranker row turns on. It writes nothing: it reads the request together with each piece the search found (a function, a file's card, a saved fact, a note) and says how well that piece answers it, so the best ones can go first. The embedder (BGE-M3) reads the two apart, which is why it is fast and why it can be fooled by a piece that only shares the…"}],"files":2,"lines":31,"b":5800,"w":"Qwen3-Reranker 0.6B: puts the best search finds first","flag":"helper"},{"id":"models/registry.mjs","n":"registry.mjs","k":"f","p":"m","git":1,"ch":[],"files":0,"lines":124,"b":8019,"w":"the list of models, where their files live, and the engines","c":"The models Agentic Coder can run (one folder each), and where their files live on this Mac (~/.agentic-coder)."}],"files":987,"lines":37752,"b":2878106,"w":"part 2 · the models we use and test","m":"The models, what runs them (llama-server, memory, warm-up, setup), and the test bench that measures the agent with a model. The terminal talks to this part through one file, index.mjs; the bench runs the terminal’s agent through terminal/index.mjs."},{"id":"docs","n":"docs/","k":"d","p":"r","git":1,"ch":[{"id":"docs/README.md","n":"README.md"   const acTotal = acRows.reduce((a, r) => a + r.sz, 0);
  const maxIn = Math.max(...D.inRepo.map((r) => r.sz), 1);
  const maxOut = Math.max(...D.outside.map((r) => r.sz), 1);
  $('#mac-repo').innerHTML = `<h3>In the repo folder, not in git</h3><div class="sub">~/Desktop/PROJECTS/agentic-coder · ignored by .gitignore</div>
    <div class="sum"><div class="tile"><div class="k">Not in git</div><div class="v">${size(inTotal)}</div></div><div class="tile"><div class="k">In git</div><div class="v">${size(root.b)}</div></div></div>
    <div class="rows">${macRows(D.inRepo, maxIn)}</div>`;
  $('#mac-out').innerHTML = `<h3>Outside the repo</h3><div class="sub">~/.agentic-coder holds what it builds, downloads and remembers; a few more pieces live elsewhere. Largest first.</div>
    <div class="sum"><div class="tile"><div class="k">~/.agentic-coder</div><div class="v">${size(acTotal)}</div></div>${[['Rust, for the window', '~/.rustup/'], ['the coding command', '~/.local/bin/coding']].map(([k, pre]) => { const r = D.outside.find((x) => x.name.startsWith(pre)); return r ? `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${size(r.sz)}</div></div>` : ''; }).join('')}</div>
    <div class="rows">${macRows(D.outside, maxOut)}</div>`;

  // ---- 4 · since 1 oct -------------------------------------------------------------------------------------------
  const S = D.since;
  const pct = (a, b) => (a ? `+${Math.round(((b - a) / a) * 100)}%` : '');
  const bigTile = (k, a, b, d) => `<div class="card big"><div class="k">${k}</div><div class="v">${a == null ? int(b) : `${kfmt(a)}<span class="arr">→</span>${kfmt(b)}`}</div><div class="d">${d}</div></div>`;
  const maxGrow = Math.max(...S.grew.map((g) => g.new[1]), 1);
  $('#since').innerHTML = `<div class="tiles2">
      ${bigTile('Commits since then', null, S.commits, `from ${S.oldHead} to ${D.head}`)}
      ${bigTile('Files in git', S.repo[0], S.repo[2], `${plural(S.newFiles, 'file')} added · ${int(S.goneFiles)} gone`)}
      ${bigTile('Lines of code', S.repo[1], S.repo[3], `${pct(S.repo[1], S.repo[3])}, most of it in terminal/`)}
      ${bigTile('terminal/ lines', S.parts.terminal[1], S.parts.terminal[3], `${pct(S.parts.terminal[1], S.parts.terminal[3])} · models/ ${pct(S.parts.models[1], S.parts.models[3])}`)}
      ${bigTile('Pages and files in docs/', S.pages[0], S.pages[1], `${S.newTasks ? plural(S.newTasks, 'new test task') + ' too' : ''}`)}
    </div>
    <div class="card pane"><h3>New parts</h3><div class="sub">Folders that did not exist on ${esc(S.oldDate)}; click one to open it.</div>
      <div class="list">${S.added.filter((a) => !S.added.some((b) => a.id.startsWith(b.id + '/'))).sort((a, b) => b.lines - a.lines || b.files - a.files).map((a) => `<div class="add" data-open="${esc(a.id)}"><span class="nm">${esc(a.id)}/</span><span class="mt">${plural(a.files, 'file')}${a.lines ? ' · ' + int(a.lines) + ' lines' : ''}</span><span class="w">${tick(a.w || '')}</span></div>`).join('')}</div></div>
    <div class="split">
      <div class="card pane"><h3>Grew the most</h3><div class="sub">Lines of code then (grey) and now.</div>
        <div class="list">${S.grew.map((g) => `<div class="grow"><span class="nm" data-open="${esc(g.id)}" title="${esc(g.w)}">${esc(g.id)}/</span><div class="gb"><i class="n ${partOf(g.id)}" style="width:${(g.new[1] / maxGrow) * 100}%"></i><i class="o" style="width:${(g.old[1] / maxGrow) * 100}%"></i></div><span class="mt">${int(g.old[1])} → ${int(g.new[1])} (${pct(g.old[1], g.new[1])})</span></div>`).join('')}</div></div>
      <div class="card pane short"><h3>Gone</h3><div class="sub">In git on ${esc(S.oldDate)}, not now.</div>
        ${S.gone.map((g) => `<div class="gone"><span class="nm">${esc(g.id)}/</span> <span class="faint">${plural(g.files, 'file')}</span><div class="w">${esc(g.w)}${g.why ? ` · <b>${esc(g.why)}</b>` : ''}</div></div>`).join('')}</div>
    </div>`;
  $('#since').addEventListener('click', (e) => { const a = e.target.closest('[data-open]'); if (a) openIn(a.dataset.open); });

  // ---- tabs ------------------------------------------------------------------------------------------------------
  const TABS = ['map', 'find', 'mac', 'since'];
  let active = null;
  function go(t) {
    if (!TABS.includes(t)) t = 'map';
    active = t;
    TABS.forEach((x) => {
      $(`#tab-${x}`).classList.toggle('on', x === t);
      const b = $(`.tab-btn[data-tab="${x}"]`); b.setAttribute('aria-selected', String(x === t)); b.tabIndex = x === t ? 0 : -1;
    });
    $('#lede').textContent = LEDE[t];
    if (location.hash.slice(1) !== t) history.replaceState(null, '', `#${t}`);
    if (t === 'map') requestAnimationFrame(drawLinks);
  }
  document.querySelector('.tabs').addEventListener('click', (e) => { const b = e.target.closest('.tab-btn'); if (b) go(b.dataset.tab); });
  addEventListener('hashchange', () => go(location.hash.slice(1)));
  addEventListener('keydown', (e) => {
    const typing = e.target.closest('input, textarea');
    const inTree = e.target.closest('#tree');
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^[1-4]$/.test(e.key)) { go(TABS[+e.key - 1]); return; }
    if (e.key === '/' && active === 'find') { e.preventDefault(); $('#q').focus(); return; }
    if (inTree) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const i = TABS.indexOf(active); go(TABS[(i + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length]); }
    else if (e.key === ' ' && active === 'map' && !e.target.closest('button')) { e.preventDefault(); playing ? stop() : start(); }
  });

  go(location.hash.slice(1) || 'map');
  choose('');
  showStep(0);
  if (playing) start();
})();
</script>
</body>
</html>
