<title>Battle header, 4 simple designs</title>
<style>
:root { --bg:#f9f9f7; --fg:#0b0b0b; --mut:#6b6a64; --line:#e3e2dc; --card:#fff; --pill:#f0efea; --acc:#2a78d6; }
@media (prefers-color-scheme: dark) { :root { --bg:#0d0d0d; --fg:#f3f3ee; --mut:#a3a29a; --line:#34342f; --card:#1a1a19; --pill:#232322; --acc:#4d95ea; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; overflow: hidden; }
main { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); padding: 16px 22px 12px; gap: 12px; }
header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
h1 { font-size: 20px; margin: 0; font-weight: 680; letter-spacing: -.01em; }
.dateline { color: var(--mut); font-size: 12.5px; }
.fill { flex: 1; }
nav { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
nav button, .seg button { font: inherit; font-size: 13.5px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
nav button[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.seg { display: inline-flex; gap: 0; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--card); }
.seg span { font-size: 12px; color: var(--mut); padding: 5px 4px 5px 12px; }
.seg button { border: 0; border-radius: 0; padding: 5px 11px; font-size: 12.5px; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
section[hidden] { display: none !important; }
section { min-width: 0; min-height: 0; display: grid; align-content: start; gap: 14px; }
.lead { color: var(--mut); font-size: 13.5px; margin: 0; max-width: 1200px; }
.lead b { color: var(--fg); }
.row { min-width: 0; }
.lab { display: flex; align-items: baseline; gap: 10px; margin: 0 0 5px; }
.lab b { font-size: 14px; }
.tag { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--pill); color: var(--mut); white-space: nowrap; }
.ex { font-size: 11px; font-weight: 700; color: #1a1a18; background: #f0c060; padding: 1px 9px; border-radius: 999px; white-space: nowrap; }
.frame { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); min-width: 0; }
.frame iframe { border: 0; display: block; transform-origin: 0 0; }
.steps { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
ul.what { margin: 6px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px 26px; }
ul.what li { font-size: 12.5px; color: var(--mut); padding-left: 14px; position: relative; }
ul.what li::before { content: '•'; position: absolute; left: 2px; color: var(--acc); }
ul.what li b { color: var(--fg); font-weight: 600; }
</style>
</head>

<main>
  <header>
    <h1>Battle header · 4 simple designs</h1>
    <span class="dateline">29 Sep 2026 · load one test or a set, then Battle · the Battle tab's own stylesheet, your 28 real tests · everything here is clickable, nothing runs</span>
    <span class="fill"></span>
    <div class="seg" id="width"><span>Width</span><button data-v="1803" aria-pressed="true">1803</button><button data-v="1440" aria-pressed="false">1440</button><button data-v="1280" aria-pressed="false">1280</button></div>
    <div class="seg" id="theme"><span>Theme</span><button data-v="dark" aria-pressed="true">Dark</button><button data-v="light" aria-pressed="false">Light</button></div>
  </header>
  <nav id="tabs"><button data-t="all" aria-selected="true">1 · All 4 side by side</button><button data-t="A" aria-selected="false">2 · A · Load + Battle</button><button data-t="B" aria-selected="false">3 · B · Two steps</button><button data-t="C" aria-selected="false">4 · C · Search bar</button><button data-t="D" aria-selected="false">5 · D · Set buttons</button></nav>
  <div id="view"></div>
</main>

 }\n.sw.A { background: var(--a); } .sw.B { background: var(--b); }\n.who { display: inline-flex; align-items: center; gap: 7px; font-weight: 650; white-space: nowrap; min-width: 0; }\n.who .real { font-weight: 500; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; }\n.btn { border: 1px solid var(--line2); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; font-size: 13px; line-height: 1.3; }\n.btn:hover { background: var(--panel); }\n.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }\n.btn.pri:hover { filter: brightness(1.07); }\n.btn.stop { color: var(--bad); }\n.btn:disabled { background: var(--panel); color: var(--ink3); border-color: var(--line2); cursor: default; filter: none; }\n.live { display: inline-flex; align-items: center; gap: 6px; }\n.live::before { content: \"\"; width: 8px; height: 8px; border-radius: 50%; background: var(--b); animation: pulse 1.2s infinite; flex: none; }\n@keyframes pulse { 50% { opacity: .3; } }\n.none { color: var(--ink3); font-size: 13px; border: 1px dashed var(--line2); border-radius: 8px; padding: 8px 10px; }\n.note { font-size: 12.5px; color: var(--ink2); background: var(--panel); border-radius: 8px; padding: 7px 10px; margin-bottom: 10px; line-height: 1.45; }\n\n/* The top band: score, every test as a cell, the actions. */\n.band { display: flex; align-items: center; gap: 22px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--surface); min-width: 0; }\n.tally { display: flex; align-items: center; gap: 10px; flex: none; }\n.tally .side { display: flex; flex-direction: column; align-items: center; line-height: 1.1; }\n.tally .n { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }\n.tally .m { font-size: 11.5px; color: var(--ink2); }\n.tally .dash { color: var(--ink3); font-size: 18px; }\n.tally .sub { font-size: 11px; color: var(--i ight: 700; display: inline-grid; place-items: center; cursor: help; flex: none; }\n@media (max-width: 1700px) { .cellb, .addcell { width: 17px; } .cellb { padding: 2px 2px; } }\n@media (max-width: 1440px) { .cellb, .addcell { width: 14px; } .cells { gap: 2px; } .tally .sub { display: none; } .band { gap: 16px; } .strips { gap: 10px; } }\n\n/* The test's title row. */\n.titlerow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 12px 18px 10px; align-items: center; }\n.titlerow h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; min-width: 0; }\n.titlerow h2 span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.titlerow .acts { display: flex; gap: 6px; }\n.titlerow .line2 { grid-column: 1 / -1; display: flex; gap: 14px; align-items: center; min-width: 0; }\n.titlerow .prompt { flex: 1; min-width: 0; color: var(--ink2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.titlerow .prompt.open { white-space: normal; }\n.titlerow .more { color: var(--accent); font-size: 12.5px; cursor: pointer; background: none; border: none; padding: 0; white-space: nowrap; }\n.rules { display: flex; gap: 6px; flex: none; max-width: 55%; overflow: hidden; }\n.rules .chip { overflow: hidden; text-overflow: ellipsis; max-width: 360px; display: inline-block; }\n.rules .chip::before { content: \"✓ \"; color: var(--ok); font-weight: 700; }\n\n/* The timeline: both runs on one clock, zoomed to the runs; each stretch = the time it took to reach that step. */\n.tl { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px 8px; box-shadow: var(--shadow); }\n.tl .cap { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--ink3); flex-wrap: wrap; }\n.tl .cap b { color: var(--ink); font-weight: 650; }\n.tl .cap .delta { color: var(--ink2); font-weight: 600; }\n.tlsvg { display: block function mount(box, id, design, state) {

  const view = document.getElementById('view');
  if (G.tab === 'all') {
    view.innerHTML = `<section><p class="lead"><b>One idea in all four: load a test or a set, then press Battle.</b> The row of 28 boxes is gone from the header; the score is just the score; + New test, Edit tests and Clear move out of the way. Click Load, a set or Battle in any of them.</p><div class="steps">${Object.entries(DESIGNS).map(([k, d]) => `<div class="row"><div class="lab"><b>${d.name}</b><span class="tag">${d.tag}</span><span class="tag">ready: your arena now</span></div><div class="frame" id="box-${k}"></div><ul class="what">${d.what.map((w) => `<li>${w}</li>`).join('')}</ul></div>`).join('')}</div></section>`;
    for (const k of Object.keys(DESIGNS)) mount(document.getElementById(`box-${k}`), `f-${k}`, k, stepState('ready'));
  } else {
    const d = DESIGNS[G.tab];
    view.innerHTML = `<section><div class="steps">${STEPS.map(([s, name, what]) => `<div class="row"><div class="lab"><b>${name}</b><span class="tag">${what}</span>${s === 'battling' || s === 'done' ? '<span class="ex">example state, not your results</span>' : ''}</div><div class="frame" id="box-${s}"></div></div>`).join('')}</div></section>`;
    for (const [s] of STEPS) mount(document.getElementById(`box-${s}`), `f-${G.tab}-${s}`, G.tab, stepState(s));
  }
  try { localStorage.setItem('battle-simple-preview', JSON.stringify(G)); } catch {}
}
document.getElementById('tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { G.tab = b.dataset.t; draw(); } });
for (const k of ['width', 'theme']) document.getElementById(k).addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { G[k] = k === 'width' ? Number(b.dataset.v) : b.dataset.v; draw(); } });
addEventListener('keydown', (e) => { if (e.target.tagName === 'INPUT') return; const tabs = ['all', 'A', 'B', 'C', 'D']; const n = Number(e.key); if (n >= 1 && n <= 5) { G.tab = tabs[n - 1]; draw(); } if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const i = tabs.indexOf(G.tab); G.tab = tabs[Math.max(0, Math.min(4, i + (e.key === 'ArrowRight' ? 1 : -1)))]; draw(); } });
addEventListener('resize', () => draw());
draw();
</script>
</body>
