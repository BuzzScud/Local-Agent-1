    const Y = (v) => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">`;
    for (let v = y0; v <= y1 + 1e-9; v += step) { s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 8}" y="${Y(v) + 3.5}" text-anchor="end">${Math.round(v).toLocaleString()}</text>`; }
    s += `<line class="axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>`;
    const every = Math.ceil(pts.length / 7);
    pts.forEach((p, i) => { if (i % every === 0 || i === pts.length - 1) { const a = i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle'; s += `<text x="${X(i)}" y="${H - B + 15}" text-anchor="${a}">${day(p.at)}</text><text x="${X(i)}" y="${H - B + 28}" text-anchor="${a}" style="font-size:10px">${clock(p.at)}</text>`; } });
    s += `<polyline fill="none" stroke="var(--c-before)" stroke-width="2" stroke-linejoin="round" points="${pts.map((p, i) => `${X(i)},${Y(get(p))}`).join(' ')}"/>`;
    pts.forEach((p, i) => {
      s += `<g><circle cx="${X(i)}" cy="${Y(get(p))}" r="4.5" fill="var(--c-before)" stroke="var(--card)" stroke-width="2"/><circle cx="${X(i)}" cy="${Y(get(p))}" r="13" fill="transparent"><title>${esc(p.name)} · ${day(p.at)} ${clock(p.at)} · ${esc(fmt(get(p)))}${p.code ? ` · code ${esc(p.code)}` : ''}</title></circle></g>`;
      if (i === 0 || i === pts.length - 1) s += `<text class="lbl" x="${X(i)}" y="${Y(get(p)) - 10}" text-anchor="${i === 0 ? 'start' : 'end'}">${esc(fmt(get(p)))}</text>`;
    });
    return `<figure><h3>${esc(title)}</h3><div class="scroll">${s}</svg></div><figcaption>${cap}</figcaption></figure>`;
  }
  function trend() {
    const pts = rows.filter((r) => r.kind === 'tasks' && r.total === 28 && !r.part && r.result !== 'stopped' && (!r.effort || /^(off|low)$/i.test(r.effort))).reverse();
    if (pts.length < 2 || (shown !== 'all' && shown !== 'tasks')) { $('trend').innerHTML = ''; return; }
    $('trend').innerHTML = `<h2>The 28-task check over time</h2><p class="sub">Each full run of the 28 practice tasks at the default effort, oldest on the left. Point at a dot for the run behind it; every run is in the table below.</p><div class="charts">${
      line({ title: 'Tasks passed, of 28', pts, get: (p) => p.passed, fmt: (v) => `${v} of 28`, floor: Math.min(20, ...pts.map((p) => p.passed)), top: 28, cap: 'Higher is better; 28 is every task.' })}${
      line({ title: 'Seconds for all 28', pts, get: (p) => p.secs, fmt: (v) => `${v.toLocaleString()} s`, cap: 'Lower is better. One run each, so a few percent either way is run-to-run noise.' })}</div>`;
  }

  const KEEP = 30; // unit test runs shown; the rest stay in the record
  function tables() {
    $('tables').innerHTML = order.filter((k) => shown === 'all' || shown === k).map((k) => {
      const all = rows.filter((r) => r.kind === k), list = k === 'suite' ? all.slice(0, KEEP) : all;
      return `<h2>${esc(KINDS[k][0])}</h2><p class="sub">${esc(KINDS[k][1][0].toUpperCase() + KINDS[k][1].slice(1))}. ${all.length} run${all.length === 1 ? '' : 's'}${all.length > list.length ? `, the newest ${list.length} shown` : ''}.</p>
<div class="wrap"><table><thead><tr><th>When</th><th>Test</th><th>Code</th><th>Settings</th><th>Result</th><th>Time</th><th>Results page</th></tr></thead><tbody>${list.map((r) => `<tr>
<td>${day(r.at)}<span class="q">${clock(r.at)}</span></td>
<td class="t"><b>${esc(r.name)}</b>${r.note ? `<span>${esc(r.note)}</span>` : ''}${r.raw ? `<code>${esc(r.raw)}</code>` : ''}</td>
<td>${r.code ? `<code>${esc(r.code)}</code>` : '—'}</td>
<td>${esc(settings(r))}</td>
<td class="r">${result(r)}</td>
<td>${secs(r.secs)}${mins(r.secs) ? `<span class="q">${mins(r.secs)}</span>` : ''}</td>
<td class="p">${r.page ? `<a href="${href(r.page)}"${live ? ' target="_top"' : ''}>open the page</a>` : '—'}</td></tr>`).join('')}</tbody></table></div>`;
    }).join('');
  }
  function draw() { filters(); cards(); trend(); tables(); }
  draw();
  $('foot').innerHTML = `<h3 style="color:var(--ink)">How this record is kept</h3><ul>
<li>The record is one file on this Mac, <code>${esc(data.file ?? '')}</code>, one line per run. The 28-task check, the real requests, a real-bug run and the unit tests each add their line when they finish; any other check adds one with <code>recordTest()</code> from <code>models/evals/record.mjs</code>.</li>
<li>${live ? 'This tab reads the file each time it opens, so it is always current. A saved copy of this page is kept in the DOCS folder under tests.' : `This is the saved copy, written ${day(data.made)} at ${clock(data.made)}. In Bonsai, <code>/docs</code> and then the Tests tab shows the record as it is now.`}</li>
<li>Raw results stay on this Mac under <code>models/&lt;model&gt;/results/</code>; a results page, where one was made, is in the DOCS folder.</li></ul>
<p>Nothing on this page loads from the internet.</p>`;
})();
</script>
</body>
</html>
