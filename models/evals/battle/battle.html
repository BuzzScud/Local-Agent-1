<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle</title>
<!-- The Battle arena (Gemma vs Qwen), served by models/evals/battle/runner.mjs and shown in the hub's
     Battle tab. Design 3 · Scoreboard, picked 29 Sep 2026. Nothing loads from the internet. -->
<style>
/* The hub's own tokens (terminal/src/app/hub.html), plus the Battle colours. */
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --panel: #f3f3f0; --line: #e3e2dc; --line2: #d4d3cb;
  --ink: #0b0b0b; --ink2: #52514e; --ink3: #8a887f; --accent: #2a78d6; --accent-ink: #fff;
  --a: #2a78d6; --a-soft: #e8f1fc; --b: #c2571a; --b-soft: #fcefe7;
  --ok: #1d7a46; --ok-soft: #e3f3e9; --bad: #b3261e; --bad-soft: #fbe7e5; --warn: #8a5a00; --warn-soft: #fbf1dc;
  --k-read: #b4b2a8; --k-edit: #8b63e0; --k-bash: #14928f; --k-ask: #d19b00; --k-tries: #5d5c57; --k-error: #d0392f; --k-answer: #d9d7ce;
  --t-read: #1a1a18; --t-plan: #1a1a18; --t-edit: #fff; --t-bash: #fff; --t-ask: #1a1a18; --t-tries: #fff; --t-error: #fff;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --pv: #1f1f1d; --pv-ink: #f3f3ee; --pv-ink2: #b7b5aa; --pv-on: #fff; --pv-line: #3a3a36;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page: #0d0d0d; --surface: #1a1a19; --panel: #232322; --line: #34342f; --line2: #45453f; --ink: #fff; --ink2: #c3c2b7; --ink3: #8f8e86; --accent: #3987e5;
    --a: #4d95ea; --a-soft: #172636; --b: #e8834b; --b-soft: #36241a; --ok: #5fd08f; --ok-soft: #173424; --bad: #ff8a80; --bad-soft: #3d1a17; --warn: #f0c060; --warn-soft: #3a2e12;
    --k-read: #6d6b64; --k-edit: #a88af0; --k-bash: #3cc1c1; --k-ask: #f0c060; --k-tries: #b5b3a9; --k-error: #ff7a6e; --k-answer: #3b3a36; --pv: #2b2b28; --pv-line: #474742; --shadow: none; --t-read: #fff; --t-plan: #fff; --t-edit: #16141f; --t-bash: #0c1c1c; --t-ask: #1f1a08; --t-tries: #151514; --t-error: #200c0a; }
}
:root[data-theme="dark"] { --page: #0d0d0d; --surface: #1a1a19; --panel: #232322; --line: #34342f; --line2: #45453f; --ink: #fff; --ink2: #c3c2b7; --ink3: #8f8e86; --accent: #3987e5;
  --a: #4d95ea; --a-soft: #172636; --b: #e8834b; --b-soft: #36241a; --ok: #5fd08f; --ok-soft: #173424; --bad: #ff8a80; --bad-soft: #3d1a17; --warn: #f0c060; --warn-soft: #3a2e12;
  --k-read: #6d6b64; --k-edit: #a88af0; --k-bash: #3cc1c1; --k-ask: #f0c060; --k-tries: #b5b3a9; --k-error: #ff7a6e; --k-answer: #3b3a36; --pv: #2b2b28; --pv-line: #474742; --shadow: none; --t-read: #fff; --t-plan: #fff; --t-edit: #16141f; --t-bash: #0c1c1c; --t-ask: #1f1a08; --t-tries: #151514; --t-error: #200c0a; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
code { font: 12px var(--mono); }
/* Scroll without a scroll bar; a soft fade says there is more. */
.scroll { overflow: auto; scrollbar-width: none; overscroll-behavior: contain; }
.scroll::-webkit-scrollbar { display: none; }
.scroll.more { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 36px), transparent); }

/* ---------- Parts both designs share ---------- */
.view { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--panel); color: var(--ink2); white-space: nowrap; }
.res { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12.5px; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
.res.ok { color: var(--ok); background: var(--ok-soft); } .res.bad { color: var(--bad); background: var(--bad-soft); } .res.warn { color: var(--warn); background: var(--warn-soft); } .res.wait { color: var(--ink2); background: var(--panel); }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
.sw.A { background: var(--a); } .sw.B { background: var(--b); }
.who { display: inline-flex; align-items: center; gap: 7px; font-weight: 650; white-space: nowrap; min-width: 0; }
.who .real { font-weight: 500; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; }
.btn { border: 1px solid var(--line2); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; font-size: 13px; line-height: 1.3; }
.btn:hover { background: var(--panel); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.pri:hover { filter: brightness(1.07); }
.btn.stop { color: var(--bad); }
.btn:disabled { background: var(--panel); color: var(--ink3); border-color: var(--line2); cursor: default; filter: none; }
.live { display: inline-flex; align-items: center; gap: 6px; }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--b); animation: pulse 1.2s infinite; flex: none; }
@keyframes pulse { 50% { opacity: .3; } }
.none { color: var(--ink3); font-size: 13px; border: 1px dashed var(--line2); border-radius: 8px; padding: 8px 10px; }
.note { font-size: 12.5px; color: var(--ink2); background: var(--panel); border-radius: 8px; padding: 7px 10px; margin-bottom: 10px; line-height: 1.45; }

/* The top band (design A · Load + Battle, picked 29 Sep 2026): load one test or a set, press
   Battle, the score. What was a row of cells is the Load list now: each test with its result. */
.band { display: flex; align-items: center; gap: 12px; padding: 11px 18px; border-bottom: 1px solid var(--line); background: var(--surface); min-width: 0; min-height: 60px; }
.band .pick, .band .more { position: relative; flex: none; }
.band .fill { flex: 1; min-width: 0; }
.band .status { font-size: 12.5px; color: var(--ink2); }
.loadb { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--line2); background: var(--surface); color: var(--ink); border-radius: 9px; padding: 7px 12px; cursor: pointer; min-width: 260px; max-width: 440px; }
.loadb:hover, .loadb[aria-expanded="true"] { background: var(--panel); }
.loadb .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink3); font-weight: 700; }
.loadb b { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.loadb .c { margin-left: auto; color: var(--ink2); font-size: 13px; }
.btn.battle { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 8px 18px; font-size: 14px; border-radius: 9px; flex: none; }
.btn.battle:hover { filter: brightness(1.07); }
.btn.stopb { color: var(--bad); font-weight: 650; padding: 8px 16px; font-size: 14px; border-radius: 9px; flex: none; }
.btn.dots { padding: 6px 10px; letter-spacing: .08em; }
.prog { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 13px; color: var(--ink2); white-space: nowrap; overflow: hidden; }
.prog .live { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.prog .bar { width: 140px; height: 6px; border-radius: 3px; background: var(--panel); overflow: hidden; flex: none; }
.prog .bar i { display: block; height: 100%; background: var(--accent); }
.prog .muted { color: var(--ink3); }
.prog .okd { color: var(--ok); font-weight: 650; }
.score { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; flex: none; }
.score .nm { font-size: 13px; color: var(--ink2); font-weight: 650; }
.score b { font-size: 22px; font-weight: 800; line-height: 1; }
.score .sep { color: var(--ink3); }
.score .lbl { font-size: 11px; color: var(--ink3); margin-left: 2px; }
/* The Load list: the sets, then every test with its result (click one: it is loaded and shown below). */
.lm { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; width: 580px; background: var(--surface); border: 1px solid var(--line2); border-radius: 12px; padding: 6px; box-shadow: 0 12px 34px rgba(0,0,0,.28); display: grid; gap: 2px; }
.lm-h { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink3); font-weight: 700; padding: 6px 10px 3px; }
.lm-i { display: grid; grid-template-columns: auto auto minmax(0, 1fr); align-items: baseline; gap: 10px; text-align: left; border: 0; background: none; color: var(--ink); padding: 5px 10px; border-radius: 7px; cursor: pointer; }
.lm-i:hover, .lm-i.on { background: var(--panel); }
.lm-i.on b::after { content: " ✓"; color: var(--accent); }
.lm-i.sel { box-shadow: inset 2px 0 0 var(--accent); }
.lm-i b { font-size: 13.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lm-n { font-size: 12px; color: var(--accent); font-weight: 650; white-space: nowrap; }
.lm-d { font-size: 12px; color: var(--ink3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lm-tests { max-height: min(44vh, 330px); display: grid; gap: 1px; align-content: start; }
.lm-i.t { grid-template-columns: 24px minmax(0, 1fr) auto; }
.lm-i.t b { font-weight: 550; }
.lm-num { font-size: 11.5px; color: var(--ink3); font-variant-numeric: tabular-nums; text-align: right; }
.lm-g { position: sticky; top: 0; z-index: 1; background: var(--surface); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink3); font-weight: 700; padding: 5px 10px 2px 44px; }
.lm-res { display: flex; gap: 7px; align-items: baseline; font-size: 11.5px; white-space: nowrap; color: var(--ink3); }
.lm-res .run { color: var(--b); font-weight: 650; }
.rs { font-weight: 700; } .rs.ok { color: var(--ok); } .rs.bad { color: var(--bad); } .rs.warn { color: var(--warn); } .rs.done { color: var(--ink2); }
.vt { color: var(--ink2); } .vt.todo { color: var(--accent); font-weight: 650; }
.lm-f { display: flex; gap: 6px; align-items: center; border-top: 1px solid var(--line); margin-top: 2px; padding: 6px 4px 1px; }
.lm-key { margin-left: auto; font-size: 11px; color: var(--ink3); }
@media (max-width: 1350px) { .score .lbl { display: none; } .prog .bar { display: none; } .loadb { min-width: 200px; } }

/* The test's title row. */
.titlerow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 12px 18px 10px; align-items: center; }
.titlerow h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; min-width: 0; }
.titlerow h2 span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.titlerow .acts { display: flex; gap: 6px; }
.titlerow .line2 { grid-column: 1 / -1; display: flex; gap: 14px; align-items: center; min-width: 0; }
.titlerow .prompt { flex: 1; min-width: 0; color: var(--ink2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.titlerow .prompt.open { white-space: normal; }
.titlerow .more { color: var(--accent); font-size: 12.5px; cursor: pointer; background: none; border: none; padding: 0; white-space: nowrap; }
.rules { display: flex; gap: 6px; flex: none; max-width: 55%; overflow: hidden; }
.rules .chip { overflow: hidden; text-overflow: ellipsis; max-width: 360px; display: inline-block; }
.rules .chip::before { content: "✓ "; color: var(--ok); font-weight: 700; }

/* The timeline: both runs on one clock, zoomed to the runs; each stretch = the time it took to reach that step. */
.tl { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px 8px; box-shadow: var(--shadow); }
.tl .cap { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--ink3); flex-wrap: wrap; }
.tl .cap b { color: var(--ink); font-weight: 650; }
.tl .cap .delta { color: var(--ink2); font-weight: 600; }
.tlsvg { display: block; width: 100%; overflow: visible; }
.tlsvg text { font-size: 11px; fill: var(--ink3); font-family: inherit; }
.tlsvg .seg { cursor: pointer; }
.tlsvg .seg:hover { filter: brightness(1.12); stroke: var(--ink); stroke-width: 1.5; }
.key { display: flex; gap: 12px; font-size: 11.5px; color: var(--ink3); flex-wrap: wrap; }
.key span { display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; } .key i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.k-read { background: var(--k-read); } .k-plan { background: var(--k-read); } .k-edit { background: var(--k-edit); } .k-bash { background: var(--k-bash); } .k-ask { background: var(--k-ask); } .k-tries { background: var(--k-tries); } .k-error { background: var(--k-error); } .k-answer { background: var(--k-answer); }
#tip { position: fixed; z-index: 40; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12px; line-height: 1.4; padding: 6px 9px; border-radius: 7px; max-width: 360px; display: none; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
#tip b { font-weight: 650; } #tip .tm { opacity: .7; font-variant-numeric: tabular-nums; margin-right: 6px; } #tip .er { color: #ffb3ab; display: block; }
:root[data-theme="dark"] #tip, :root:not([data-theme="light"]) #tip { }

/* Tabs: What it did · Answer · Changes (or Page), each with Model A and Model B side by side. */
.tabs { min-height: 240px; display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.tabbar { display: flex; align-items: center; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line); }
.tabbar button { border: none; background: none; padding: 7px 12px 8px; border-radius: 8px 8px 0 0; color: var(--ink2); cursor: pointer; font-size: 13px; display: inline-flex; gap: 7px; align-items: center; }
.tabbar button:hover { color: var(--ink); background: var(--panel); }
.tabbar button[aria-selected="true"] { color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
.tabbar .ct { font-size: 11px; font-weight: 500; color: var(--ink3); font-variant-numeric: tabular-nums; }
.tabbar .fill { flex: 1; }
.tabbar .hint { font-size: 11.5px; color: var(--ink3); padding-right: 6px; }
.tcols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); min-height: 0; }
.tcol { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; min-width: 0; }
.tcol + .tcol { border-left: 1px solid var(--line); }
.tch { display: flex; align-items: center; gap: 10px; padding: 8px 14px; font-size: 12px; color: var(--ink3); border-bottom: 1px solid var(--line); min-width: 0; }
.tch .how { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbody { padding: 10px 14px 14px; min-height: 0; }
.tbody.page { padding: 8px; }
.steps { font: 12px/1.6 var(--mono); margin: 0; padding: 0; list-style: none; }
.steps li { display: grid; grid-template-columns: 40px 10px minmax(0, 1fr); gap: 8px; align-items: baseline; border-radius: 6px; padding: 0 4px; }
.steps li.hl { background: var(--warn-soft); }
.steps .tm { color: var(--ink3); text-align: right; font-variant-numeric: tabular-nums; }
.steps .dot { width: 8px; height: 8px; border-radius: 2px; align-self: center; }
.steps .lb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steps .lb i { font-style: normal; color: var(--ink3); }
.steps .er { grid-column: 3; color: var(--bad); white-space: normal; font-size: 11.5px; }
.steps li.new { animation: fadein .35s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
.approx { font-size: 11.5px; color: var(--ink3); margin-top: 8px; }
.answer { font-size: 13.5px; line-height: 1.55; overflow-wrap: anywhere; }
.answer code { background: var(--panel); padding: 1px 4px; border-radius: 4px; }
.diff { font: 11.5px/1.55 var(--mono); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
.diff .fh { padding: 4px 10px; background: var(--panel); color: var(--ink2); border-bottom: 1px solid var(--line); }
.diff .ln { padding: 0 10px; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
.diff .ln.add { background: var(--ok-soft); } .diff .ln.del { background: var(--bad-soft); } .diff .ln.ctx { color: var(--ink3); }
.pageframe { width: 100%; height: 100%; border: 1px solid var(--line); border-radius: 8px; background: #fff; display: block; }

/* The vote. */
.vbtn { border: 1.5px solid var(--line2); background: var(--surface); border-radius: 10px; padding: 6px 14px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 13px; }
.vbtn:hover:not(:disabled) { background: var(--panel); }
.vbtn.A:hover:not(:disabled), .vbtn.A.on { border-color: var(--a); background: var(--a-soft); } .vbtn.B:hover:not(:disabled), .vbtn.B.on { border-color: var(--b); background: var(--b-soft); } .vbtn.T.on { border-color: var(--ink2); background: var(--panel); }
.vbtn:disabled { color: var(--ink3); background: var(--panel); cursor: default; }
.picked { font-size: 13px; color: var(--ink2); }
.picked b { color: var(--ink); }

/* ---------- Design 3 · Scoreboard ---------- */
.d3.body { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; gap: 10px; padding: 0 18px 0; min-height: 0; }
.duels { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.duel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px 9px; min-width: 0; box-shadow: var(--shadow); display: grid; gap: 5px; }
.duel .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink3); font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.duel .k .w { text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--ok); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.duel .vals { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 8px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.duel .vals b { font-size: 17px; font-weight: 700; white-space: nowrap; }
.duel .vals b small { font-size: 11.5px; font-weight: 500; color: var(--ink3); }
.duel .vals .x { color: var(--ink3); font-size: 11px; }
.duel .vals .won { color: var(--ok); }
.tug { display: flex; height: 6px; border-radius: 3px; overflow: hidden; gap: 2px; background: var(--panel); }
.tug .ta { background: var(--a); } .tug .tb { background: var(--b); }
.tug.flat { background: none; } .tug.flat span { background: var(--line2); }
.duel .rv { display: flex; justify-content: space-between; gap: 6px; }
.d3 .vote { display: flex; align-items: center; gap: 10px; padding: 9px 0 11px; }
.d3 .vote .q { font-weight: 650; }
.d3 .vote .fill { flex: 1; }

/* ---------- The new test: three steps on one screen ---------- */
.steps3 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .9fr) minmax(0, 1fr); gap: 14px; min-height: 0; }
.stp { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; min-height: 0; min-width: 0; box-shadow: var(--shadow); }
.stp .sh { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 14.5px; }
.stp .sh .no { width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--surface); display: grid; place-items: center; font-size: 12.5px; font-weight: 700; flex: none; }
.stp .sh .opt { font-weight: 400; color: var(--ink3); font-size: 12.5px; }
.stp .sb { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.stp textarea, .stp input[type=text] { font: inherit; font-size: 14px; color: var(--ink); background: var(--page); border: 1px solid var(--line2); border-radius: 10px; padding: 10px 12px; width: 100%; line-height: 1.5; }
.stp textarea { flex: 1; min-height: 110px; resize: none; }
.stp textarea::placeholder, .stp input::placeholder { color: var(--ink3); opacity: .75; }
.stp textarea:focus, .stp input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 0; border-color: var(--accent); }
.guess { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--ink3); }
.pill { border: 1px solid var(--line2); background: var(--surface); color: var(--ink2); border-radius: 999px; padding: 3px 11px; cursor: pointer; font-size: 12.5px; }

.check.on .bx { background: var(--ok); border-color: var(--ok); color: #fff; }
.check .ct { font-size: 13.5px; } .check .cd { grid-column: 2; font-size: 12px; color: var(--ink3); }

/* Short windows (under 860 px tall): everything tightens so it still fits. */

/* Narrow windows: one column; the page scrolls there (a phone can't fit it all). */

  .lhead > div:not(.axis) { display: none; }

}

/* The Battle page inside the hub's tab: the page itself, a floor below which it scrolls (no bar). */
#app { flex: 1; min-height: 0; position: relative; background: var(--page); overflow-y: auto; scrollbar-width: none; }
#app::-webkit-scrollbar { display: none; }

.live.A::before { background: var(--a); }
.chip.plain::before { content: none; }
.rv.small { font-size: 11.5px; color: var(--ink3); }
.rv.small span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 49%; }
.clist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.clist li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; padding: 8px 10px; border-radius: 8px; background: var(--page); border: 1px solid var(--line); }
.clist li.ok .cm { color: var(--ok); font-weight: 800; } .clist li.bad .cm { color: var(--bad); font-weight: 800; }
.clist .why { display: block; color: var(--ink2); font-size: 12.5px; margin-top: 2px; overflow-wrap: anywhere; }

.kv > span:nth-child(odd) { color: var(--ink3); }
.panelmsg { max-width: 980px; }
.rmfiles { display: flex; gap: 6px; align-items: center; justify-content: center; margin-top: 8px; font-size: 12.5px; color: var(--ink2); }
/* The ⋯ menu: clear the line or every result, and what the marks mean. */
.ckey { border-top: 1px solid var(--line); margin-top: 4px; padding: 8px 10px 4px; font-size: 11.5px; color: var(--ink2); line-height: 1.5; }
.cmenu { position: absolute; top: calc(100% + 4px); right: 0; z-index: 30; width: 340px; background: var(--surface); border: 1px solid var(--line2); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.22); padding: 6px; display: grid; gap: 2px; }

.cmenu button span { font-size: 12px; color: var(--ink2); line-height: 1.35; }
.cmenu button:disabled { cursor: default; color: var(--ink3); background: var(--page); }
.cmenu button:disabled span { color: var(--ink3); }
/* Starter files: each with a × to take it out. */
.files { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { gap: 4px; padding-right: 3px; }
.fx { border: none; background: none; color: var(--ink3); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 4px; border-radius: 999px; }
.fx:hover { color: var(--bad); background: var(--bad-soft); }
.rmline { font-size: 12.5px; color: var(--ink2); }
.link { border: none; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 12.5px; }
.stp .sb.scroll { overflow: auto; }
/* Edit tests and New test: windows over the page. New test is a smaller one, the three steps in it. */
.modal.newm { inset: auto; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(1220px, 96vw); height: min(800px, 94vh); }
.mform1 { display: grid; min-height: 0; padding: 14px 18px; }
.mform1 .steps3 { min-height: 0; }
#modal { display: none; }
#modal.on { display: block; }
.mback { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; }
.modal { position: fixed; inset: 2.5vh 2vw; z-index: 41; background: var(--page); border: 1px solid var(--line2); border-radius: 16px; box-shadow: 0 24px 64px rgba(0,0,0,.35); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; }
.mhead { display: flex; align-items: baseline; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--surface); }
.mhead b { font-size: 16px; }
.mhead .sub { font-size: 12.5px; color: var(--ink3); }
.mhead .fill, .mfoot .fill, .mtitle .fill { flex: 1; }
.mx { border: none; background: none; color: var(--ink2); font-size: 16px; cursor: pointer; border-radius: 8px; padding: 2px 8px; align-self: center; }
.mx:hover { background: var(--panel); color: var(--ink); }
.mbody { display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: 0; }
.mlist { border-right: 1px solid var(--line); padding: 8px; background: var(--surface); min-height: 0; }
.mgroup { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink3); font-weight: 700; padding: 10px 8px 4px; }
.mrow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 6px; align-items: center; width: 100%; text-align: left; border: none; background: none; border-radius: 8px; padding: 5px 8px; cursor: pointer; color: var(--ink); font-size: 13px; }
.mrow:hover { background: var(--panel); }
.mrow.sel { background: color-mix(in srgb, var(--accent) 16%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent); }
.mrow .no { font-size: 11px; color: var(--ink3); text-align: right; font-variant-numeric: tabular-nums; }
.mrow .ti { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .tag { font-size: 10.5px; color: var(--accent); }
.mnone { font-size: 12.5px; color: var(--ink3); padding: 4px 8px; }
.mform { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; padding: 14px 18px; min-height: 0; min-width: 0; }
.mtitle { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
.mtitle h3 { margin: 0; font-size: 18px; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }
.chip.unsaved { background: var(--warn-soft); color: var(--warn); }
.mfoot { display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-top: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
.mfoot .help { font-size: 12.5px; color: var(--ink3); margin-left: 6px; }
@media (max-width: 900px) { .mbody { grid-template-columns: 1fr; grid-template-rows: 160px minmax(0, 1fr); } .mlist { border-right: none; border-bottom: 1px solid var(--line); } .modal, .modal.newm { inset: 8px; transform: none; width: auto; height: auto; } .mform .steps3, .mform1 .steps3 { grid-template-columns: 1fr; overflow: auto; } }
#toast { position: fixed; left: 50%; bottom: 16px; translate: -50% 0; z-index: 60; background: var(--ink); color: var(--surface); padding: 9px 14px; border-radius: 10px; font-size: 13px; max-width: min(480px, calc(100vw - 32px)); box-shadow: 0 8px 24px rgba(0,0,0,.25); opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; pointer-events: none; }
#toast.on { opacity: 1; transform: none; }
#toast.bad { background: var(--bad); color: #fff; }
</style>

<body>
<main id="app"><div class="view"><div id="band"></div><div id="main" class="mainarea"><div class="panelmsg"><div class="none">Reading the arena…</div></div></div></div></main>
<div id="tip"></div>
<div id="modal"></div>
<div id="toast" role="status"></div>
<script>
(function () {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const app = $('#app'), bandEl = $('#band'), mainEl = $('#main'), tip = $('#tip'), toastEl = $('#toast');
  const whole = (s) => Math.round(s);
  const mmss = (s) => { const r = Math.max(0, whole(s)); return `${Math.floor(r / 60)}:${String(r % 60).padStart(2, '0')}`; };
  const human = (s) => { const r = Math.max(0, whole(s)); return r < 60 ? `${r} s` : `${Math.floor(r / 60)} min ${String(r % 60).padStart(2, '0')} s`; };
  const md = (t) => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
  const kindName = { code: 'Code change', question: 'Question', page: 'Page', writing: 'Writing' };
  // The sets that come with the arena, then yours. A copy of a Practice 28 test has a letter (18b).
  const OWN = ['new28', 'work28', 'practice'];
  const SUITE_NAME = { new28: 'New 28', work28: 'Work 28', practice: 'Practice 28', mine: 'My tests' };
  const suiteOf = (t) => (OWN.includes(t?.suite) ? t.suite : 'mine');
  const numOf = (t) => (t?.n ? `${t.n}${t.variant ?? ''}` : '');
  const KINDS = [['read', 'read / look'], ['edit', 'change a file'], ['bash', 'run a command'], ['ask', 'asked you'], ['tries', 'tries (tests, drafts)'], ['error', 'a step that failed'], ['answer', 'writing its answer']];
  const SHORT = { gemma: 'Gemma', qwen: 'Qwen' };
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch { /* no storage */ } } };
  const S = { modal: false, clearOpen: false, st: null, sel: store.get('battle-sel'), det: null, view: 'test', tab: {}, openPrompt: false, hl: null, full: null, mainKey: '', bandKey: '', editId: null };

  async function api(path, body) {
    const r = await fetch(path, body === undefined ? { cache: 'no-store' } : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
    return j;
  }
  let toastTimer = null;
  function toast(text, bad) { toastEl.textContent = text; toastEl.className = `on${bad ? ' bad' : ''}`; clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.className = ''; }, 5000); }
  const nameOf = (id) => SHORT[id] ?? S.st?.models.find((m) => m.id === id)?.name ?? id;
  const fullName = (id) => S.st?.models.find((m) => m.id === id)?.name ?? id;
  const tests = () => S.st?.tests ?? [];
  const testById = (id) => tests().find((t) => t.id === id);

  // ---------- A run, in the shape the drawing wants ----------
  function runOf(det, side) {
    const r = det?.runs?.[side];
    const live = det?.live;
    if (live && live.side === side) {
      const ev = live.events ?? [];
      const loadedT = ev.find((e) => e.type === 'note' && e.text === 'loaded')?.t;
      const steps = ev.filter((e) => e.type === 'step').map((e) => ({ t: Math.max(0, e.t - (loadedT ?? 0)), label: e.label, arg: e.arg, kind: e.kind, err: e.err }));
      const clock = loadedT == null ? 0 : Math.max(0, (Date.now() - live.startedAt) / 1000 - loadedT);
      return { running: true, loading: loadedT == null, clock, steps, stepCount: steps.length, errors: steps.filter((s) => s.kind === 'error').length, answer: '', diffs: [], pages: [], checks: [] };
    }
    if (!r) return { pending: true, steps: [], stepCount: 0, errors: 0, secs: 0, diffs: [], pages: [], checks: [] };
    if (r.skipped) return { skipped: true, steps: [], stepCount: 0, errors: 0, secs: 0, diffs: [], pages: [], checks: [] };
    return { ...r, steps: r.steps ?? [], diffs: r.diffs ?? [], pages: r.pages ?? [], checks: r.checks ?? [] };
  }
  function verdict(r) {
    if (!r || r.pending) return { cls: 'wait', text: 'Waits its turn', mk: 'todo', sym: '' };
    if (r.running) return { cls: 'wait', text: r.loading ? 'Loading the model' : 'Running', mk: 'run', sym: '' };
    if (r.skipped) return { cls: 'wait', text: 'Not run (stopped)', mk: 'todo', sym: '' };
    if (r.error) return { cls: 'bad', text: 'Did not finish', mk: 'bad', sym: '!' };
    if (r.stopped) return { cls: 'warn', text: 'Stopped by you', mk: 'warn', sym: '■' };
    if (r.overLimit) return { cls: 'warn', text: 'Out of time', mk: 'warn', sym: '⏱' };
    if (r.pass == null) return { cls: 'wait', text: 'Finished', mk: 'done', sym: '•' };
    return r.pass ? { cls: 'ok', text: '✓ Pass', mk: 'ok', sym: '✓' } : { cls: 'bad', text: '✗ Fail', mk: 'bad', sym: '✗' };
  }
  function checkLine(r) {
    if (r.pending) return 'runs after the other one';
    if (r.running) return r.loading ? 'the 10 minutes start once it is loaded' : 'still working';
    if (r.skipped) return 'the battle was stopped first';
    if (r.error) return r.error;
    const cs = r.checks ?? [];
    if (!cs.length) return 'no checks: your vote decides';
    const bad = cs.find((c) => !c.pass);
    const lead = r.stopped || r.overLimit ? 'what it left: ' : '';
    return bad ? `${lead}${bad.label}${bad.why ? ` — ${bad.why}` : ''}` : `${lead}all ${cs.length} check${cs.length > 1 ? 's' : ''} held`;
  }
  const clean = (r) => r && !r.running && !r.pending && !r.skipped && !r.stopped && !r.overLimit && !r.error;
  const done = (r) => r && !r.running && !r.pending;
  const fin = (r) => (r.running ? r.clock : r.pending || r.skipped ? 0 : r.secs ?? 0);
  const stepsOf = (r) => (r.running ? r.steps.length : r.stepCount ?? r.steps.length);
  const errsOf = (r) => (r.running ? r.steps.filter((s) => s.kind === 'error').length : r.errors ?? 0);
  const who = (side, order) => `<span class="who"><span class="sw ${side}"></span>Model ${side}${order ? `<span class="real">· ${esc(fullName(order[side]))}</span>` : ''}</span>`;

  // ---------- The band: Load, Battle, the score ----------
  const isDone = (t) => Boolean(t?.latest && t.latest.status === 'done');
  const loadedNow = () => S.st.loaded ?? { kind: 'set', id: 'new28' };
  // What is loaded: its name, its tests, how many are not done yet.
  function loadInfo() {
    const L = loadedNow();
    if (L.kind === 'test') { const t = testById(L.id); return t ? { name: `${t.n ? `${OWN.includes(t.suite) ? `${SUITE_NAME[t.suite]} · ` : ''}${numOf(t)}. ` : ''}${t.title}`, ids: [t.id], left: isDone(t) ? 0 : 1 } : null; }
    const s = (S.st.sets ?? []).find((x) => x.id === L.id);
    return s ? { name: s.name, ids: s.ids, left: s.ids.filter((id) => !isDone(testById(id))).length } : null;
  }
  // The button says what it will do.
  function battleLabel(li) {
    const n = li.ids.length;
    if (!li.left) return `▶ Battle again${n > 1 ? ` · ${n} tests` : ''}`;
    if (li.left < n) return `▶ Battle · ${li.left} left`;
    return `▶ Battle · ${n} test${n > 1 ? 's' : ''}`;
  }
  function band() {
    const st = S.st; if (!st) return '';
    const [m1, m2] = st.models;
    const sc = st.score;
    const q = st.queue ?? [];
    const li = loadInfo() ?? { name: 'nothing loaded', ids: [], left: 0 };
    const act = st.running ? '<button class="btn stopb" data-act="stop">■ Stop</button>' : `<button class="btn battle" data-act="battle"${li.ids.length ? '' : ' disabled'}>${battleLabel(li)}</button>`;
    // Beside the button: what is happening now.
    const batch = st.batch ?? [];
    let prog = '';
    if (st.running?.waiting) prog = `<span class="live">${esc(st.waiting ?? 'Waiting for memory')}</span>`;
    else if (st.running) {
      const t = testById(st.running.test); const inB = batch.length > 1 && batch.includes(st.running.test);
      const i = batch.length - batch.filter((id) => q.includes(id)).length;
      prog = `<span class="live ${st.running.side}">${inB ? `Test ${i} of ${batch.length} · ` : ''}Model ${st.running.side} on “${esc(t?.title ?? '')}” · <span data-since="${st.running.startedAt}">${mmss((Date.now() - st.running.startedAt) / 1000)}</span></span>${inB ? `<span class="bar"><i style="width:${Math.round(((i - 1) / batch.length) * 100)}%"></i></span>` : ''}${q.length && !inB ? `<span class="muted">${q.length} more in line</span>` : ''}`;
    } else if (q.length) prog = `<span class="muted">${st.paused ? 'Paused' : 'Starting the next'} · ${q.length} in line</span>`;
    else if (batch.length && batch.every((id) => testById(id)?.latest)) {
      const toVote = batch.filter((id) => { const l = testById(id).latest; return l.status === 'done' && !l.vote; }).length;

  const verdictBrief = (r) => (!r ? { mk: 'todo', text: 'not run' } : r.skipped ? { mk: 'todo', text: 'not run' } : r.error ? { mk: 'bad', text: 'did not finish' } : r.stopped ? { mk: 'warn', text: 'stopped' } : r.overLimit ? { mk: 'warn', text: 'out of time' } : r.pass == null ? { mk: 'done', text: 'finished (no checks)' } : r.pass ? { mk: 'ok', text: 'pass' } : { mk: 'bad', text: 'fail' });

  // ---------- Tabs ----------

    const sameTest = mainEl.dataset.test === S.sel;
    mainEl.dataset.test = S.sel ?? '';
    mainEl.innerHTML = t ? testView(t) : '<div class="panelmsg"><h2>No tests yet</h2><div class="none">Add one with + New test.</div></div>';
    if (sameTest) [...mainEl.querySelectorAll('.tbody')].forEach((b, i) => { b.scrollTop = keep[i] ?? 0; });
    if (S.det?.live) { const b = mainEl.querySelector(`.tbody[data-body="${S.det.live.side}"]`); if (b) b.scrollTop = b.scrollHeight; }
    redrawTimeline(); fillFrames(); fades();
  }
  function redrawTimeline() { if (S.det && testById(S.sel)?.latest && S.det.test === S.sel) drawTimeline(runOf(S.det, 'A'), runOf(S.det, 'B')); }
  function tickClocks() {
    for (const el of document.querySelectorAll('[data-since]')) el.textContent = mmss((Date.now() - Number(el.dataset.since)) / 1000);
    if (S.det?.live && S.view === 'test') { const r = runOf(S.det, S.det.live.side); for (const el of mainEl.querySelectorAll('[data-clock]')) el.textContent = mmss(r.clock); redrawTimeline(); }
  }
  function drawBand() {
    const html = band();
    if (html === S.bandKey) { tickClocks(); return; }
    const top = bandEl.querySelector('.lm-tests')?.scrollTop; // the Load list keeps its place when a poll redraws it
    S.bandKey = html; bandEl.innerHTML = html;
    if (top) { const l = bandEl.querySelector('.lm-tests'); if (l) l.scrollTop = top; }
  }

  // ---------- Reading the runner ----------
  let polling = false;
  async function poll(force) {
    if (polling && !force) return; polling = true;
    try {
      S.st = await api('/api/state');
      if (!S.sel || !testById(S.sel)) S.sel = S.st.running?.test ?? tests().filter((t) => t.latest).sort((a, b) => String(b.latest.at).localeCompare(String(a.latest.at)))[0]?.id ?? tests()[0]?.id ?? null;
      const t = testById(S.sel);
      if (t?.latest) { try { S.det = await api(`/api/battle?id=${encodeURIComponent(t.latest.id)}`); } catch { S.det = null; } } else S.det = null;
      drawBand();
      if (S.view === 'test') drawMain(force === true);
    } catch (e) {
      bandEl.innerHTML = `<div class="band"><span class="status">The arena's runner is not answering (${esc(e.message)}). Open the Battle tab again to start it.</span></div>`;
    } finally { polling = false; }
    clearTimeout(poll.t); poll.t = setTimeout(poll, S.st?.running || S.st?.queue?.length ? 1000 : 2500);
  }

  // ---------- Clicks ----------
  document.addEventListener('mousemove', (e) => {
    const seg = e.target.closest?.('[data-steptip]'); const el = seg || e.target.closest?.('[data-tip]');
    if (!el) { tip.style.display = 'none'; return; }
    if (seg) { const [tm, what, err, took] = seg.dataset.steptip.split('|'); tip.innerHTML = `<span class="tm">${esc(tm)}</span><b>${esc(what)}</b>${err ? `<span class="er">${esc(err)}</span>` : ''}<div style="opacity:.7">${esc(took)}</div>`; }
    else tip.textContent = el.dataset.tip;
    tip.style.display = 'block';
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = `${Math.min(innerWidth - w - 8, e.clientX + 14)}px`;
    tip.style.top = `${e.clientY + 18 + h > innerHeight ? e.clientY - h - 12 : e.clientY + 18}px`;
  });
  document.addEventListener('click', async (e) => {
    if (S.clearOpen && !e.target.closest('.cmenu, [data-act="clearmenu"]')) { S.clearOpen = false; drawBand(); }
    if (S.loadOpen && !e.target.closest('.lm, [data-act="loadmenu"]')) { S.loadOpen = false; drawBand(); }
    const seg = e.target.closest('.seg');
    if (seg && Number(seg.dataset.step) >= 0) { S.tab[S.sel] = 'did'; S.hl = { side: seg.dataset.side, i: Number(seg.dataset.step) }; drawMain(true); const row = mainEl.querySelector(`[data-row="${S.hl.side}${S.hl.i}"]`); if (row) { const box = row.closest('.tbody'); box.scrollTop = row.offsetTop - box.clientHeight / 3; fades(); } return; }
    const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    const act = el.dataset.act;
    try {
      if (act === 'loadmenu') { S.loadOpen = !S.loadOpen; S.clearOpen = false; drawBand(); }
      // Load a set, or one test (which also shows its results below).
      if (act === 'load') {
        const one = el.dataset.kind === 'test';
        await api('/api/load', { kind: el.dataset.kind, id: el.dataset.id });
        S.loadOpen = false;
        if (one) { S.view = 'test'; F = null; S.sel = el.dataset.id; store.set('battle-sel', S.sel); S.hl = null; S.full = null; S.openPrompt = false; }
        await poll(true);
      }
      // Battle: what is loaded goes in line, in place of whatever waited there.
      // The results below follow the battle that starts.
      if (act === 'battle') { const r = await api('/api/start', {}); toast(r.queued > 1 ? `${r.queued} tests in line, one battle at a time.` : 'In line. It starts when the memory is free.'); S.view = 'test'; F = null; S.sel = null; S.hl = null; S.full = null; await poll(true); if (S.sel) store.set('battle-sel', S.sel); }
      // A window opens over the page: the Load list and the ⋯ menu close first.
      if (act === 'new') { S.loadOpen = false; S.clearOpen = false; drawBand(); openForm(); }
      if (act === 'edit' || act === 'edittests') { S.loadOpen = false; S.clearOpen = false; drawBand(); openModal(S.sel); }
      if (act === 'run') { await api('/api/run', { id: S.sel }); toast('In line. It starts when the memory is free.'); await poll(true); }
      if (act === 'unqueue') { await api('/api/unqueue', { id: S.sel }); await poll(true); }
      if (act === 'stop') { if (confirm('Stop the battle that is running? The line of tests waiting is paused too.')) { await api('/api/stop', {}); await poll(true); } }
      if (act === 'clearmenu') { S.clearOpen = !S.clearOpen; S.loadOpen = false; drawBand(); }
      if (act === 'clearline') { S.clearOpen = false; await api('/api/clearqueue', {}); toast('The line is clear: nothing waits to run.'); await poll(true); }
      if (act === 'clearresults') { S.clearOpen = false; drawBand(); if (confirm('Clear all results? Every battle and your votes move to the arena\'s trash folder (~/.agentic-coder/battle/trash); the score goes back to 0–0. Your tests stay.')) { const r = await api('/api/clearresults', {}); S.det = null; toast(`Cleared: ${r.moved} result${r.moved === 1 ? '' : 's'} moved to the trash folder.`); await poll(true); } }
      if (act === 'vote') { const r = await api('/api/vote', { id: S.det.id, v: el.dataset.v }); toast(r.order ? `Model A was ${nameOf(r.order.A)}, Model B was ${nameOf(r.order.B)}.` : 'Saved.'); await poll(true); }
      if (act === 'tab') { S.tab[S.sel] = el.dataset.tab; S.hl = null; drawMain(true); }
      if (act === 'prompt') { S.openPrompt = !S.openPrompt; drawMain(true); }
      if (act === 'full') { S.full = el.dataset.side; drawMain(true); }
      if (act === 'closefull') { S.full = null; drawMain(true); }
      // The form (in the page, or in the Edit tests window)
      if (act === 'kind') { keepForm(); F.kind = el.dataset.v; drawForm(); }
      if (act === 'example') { const [, p] = EXAMPLES[Number(el.dataset.i)]; F.prompt = p; F.kind = null; F.nameTouched = false; F.rows = null; drawForm(); const ta = $('#f-prompt'); ta.focus(); ta.setSelectionRange(p.length, p.length); }
      if (act === 'check' && !e.target.closest('input')) { keepForm(); const r = rowsNow()[Number(el.dataset.i)]; r.on = !r.on; drawForm(); }
      if (act === 'script') { keepForm(); F.useScript = !F.useScript; drawForm(); }
      if (act === 'rmfile') { keepForm(); F.removed.push(el.dataset.path); drawForm(); }
      if (act === 'rmnew') { keepForm(); F.files = F.files.filter((f) => f.path !== el.dataset.path); drawForm(); }
      if (act === 'undorm') { keepForm(); F.removed = []; drawForm(); }
      if (act === 'save' || act === 'saverun') await saveForm(act === 'saverun');
      if (act === 'delete') {
        if (!confirm('Delete this test? It moves to the arena\'s trash folder; its results are kept.')) return;
        const list = listOrder(); const i = list.findIndex((t) => t.id === F.id); const next = list[i + 1] ?? list[i - 1];
        await api('/api/tests/delete', { id: F.id }); toast('Deleted (kept in ~/.agentic-coder/battle/trash).');
        if (S.sel === F.id) S.sel = null;
        await poll(true);
        if (S.modal && next) { loadForm(testById(next.id)); drawModal(); } else { S.modal = false; F = null; drawModal(); S.view = 'test'; drawMain(true); }
      }
      // The New test and Edit tests windows
      if (act === 'mclose') closeModal();
      if (act === 'mpick') modalGo(el.dataset.id);
      if (act === 'mprev' || act === 'mnext') { const list = listOrder(); const i = list.findIndex((t) => t.id === F.id); modalGo(list[i + (act === 'mnext' ? 1 : -1)]?.id); }
      if (act === 'mreset') { if (confirm('Put back the original test? Your edited copy moves to the arena\'s trash folder.')) { await api('/api/tests/reset', { id: F.id }); await poll(true); loadForm(testById(F.id)); drawModal(); toast('The original is back.'); } }
    } catch (err) { toast(err.message, true); }
  });
  const confirmLeave = () => !F || (!F.prompt.trim() && !F.files.length) || confirm('Leave this test without saving it?');
  document.addEventListener('input', (e) => {
    if (!F || !e.target.closest('#main, #modal')) return;
    const root = S.modal ? modalEl : mainEl;
    if (e.target.id === 'f-prompt') { F.prompt = e.target.value; const n = $('#f-name', root); if (n && !F.nameTouched) n.value = nameFrom(F.prompt); if (!F.kind) { const g = guessKind(F.prompt); for (const p of root.querySelectorAll('.pill[data-act="kind"]')) p.setAttribute('aria-pressed', String(p.dataset.v === g)); if (F.rowsKind !== g) { const pos = e.target.selectionStart; drawForm(); const ta = $('#f-prompt', root); ta.focus(); ta.setSelectionRange(pos, pos); } } }
    if (e.target.id === 'f-name') { F.name = e.target.value; F.nameTouched = Boolean(e.target.value.trim()); }
    if (e.target.id === 'f-ask') F.ask = e.target.value;
    if (e.target.dataset.val != null) rowsNow()[Number(e.target.dataset.val)].val = e.target.value;
    // The window's title and "not saved yet" follow what you type.
    if (S.modal) { const h = $('.mtitle h3', modalEl); if (h) h.textContent = (F.nameTouched ? F.name : nameFrom(F.prompt)) || 'Untitled test'; const u = $('.mtitle .unsaved', modalEl); if (dirty() && !u) $('.mtitle h3', modalEl).insertAdjacentHTML('afterend', '<span class="chip unsaved">not saved yet</span>'); if (!dirty() && u) u.remove(); }
  });
  document.addEventListener('change', (e) => { const i = e.target.closest('input[data-pick]'); if (!i || !F) return; keepForm(); addFiles([...i.files].map((f) => ({ path: i.dataset.pick === 'dir' ? f.webkitRelativePath || f.name : f.name, file: f }))); drawForm(); });
  document.addEventListener('dragover', (e) => { const d = e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
  document.addEventListener('dragleave', (e) => { const d = e.target.closest('#drop'); if (d) d.classList.remove('over'); });
  document.addEventListener('drop', async (e) => {
    const d = e.target.closest('#drop'); if (!d || !F) return; e.preventDefault(); d.classList.remove('over'); keepForm();
    const out = [];
    const items = [...(e.dataTransfer.items ?? [])].map((it) => it.webkitGetAsEntry?.()).filter(Boolean);
    if (items.length) for (const en of items) await walkEntry(en, '', out); else for (const f of e.dataTransfer.files) out.push({ path: f.name, file: f });
    addFiles(out); drawForm();
  });
  document.addEventListener('scroll', (e) => { if (e.target.classList?.contains('scroll')) fades(); }, true);
  document.addEventListener('keydown', (e) => {
    if (S.modal && (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveForm(false); return; }
    if (e.key === 'Escape' && (S.clearOpen || S.loadOpen)) { S.clearOpen = false; S.loadOpen = false; drawBand(); return; }
    if (e.key === 'Escape' && S.modal) { closeModal(); return; }
    if (e.key === 'Escape' && S.full) { S.full = null; drawMain(true); }
  });
  const setCompact = () => { const c = innerHeight < 780; if (c !== document.body.classList.contains('compact')) { document.body.classList.toggle('compact', c); if (S.view === 'test') drawMain(true); } };
  window.addEventListener('resize', () => { setCompact(); redrawTimeline(); fades(); });
  setCompact();
  setInterval(tickClocks, 1000);
  poll(true);
})();
</script>
</body>
