<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena</title>
<!-- The Arena: run a test on one model, or battle any two (Gemma vs Qwen by default). Served by
     models/evals/battle/runner.mjs and shown in the hub's Arena tab. Four steps, one at a time (the
     wizard, picked 1 Oct 2026, Design 1 · Steps across the top): 1 Model & settings (the panel),
     2 Tests (the list: One test, or a Group), 3 Run (the group's timeline on top, a terminal of
     everything it does), 4 Results (that group's, and every earlier one). The step chips and Back /
     Next move freely; a run going keeps going on every step. It took the place of the Workbench
     (30 Sep), which had taken the place of the hub's Tests and Battle tabs. Nothing loads from the
     internet. -->
<style>
/* The hub's own tokens (terminal/src/app/hub.html), plus the two models' colours. */
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --panel: #f3f3f0; --line: #e3e2dc; --line2: #d4d3cb;
  --ink: #0b0b0b; --ink2: #52514e; --ink3: #8a887f; --accent: #2a78d6; --accent-ink: #fff;
  --a: #2a78d6; --a-soft: #e8f1fc; --b: #c2571a; --b-soft: #fcefe7;
  --ok: #1d7a46; --ok-soft: #e3f3e9; --bad: #b3261e; --bad-soft: #fbe7e5; --warn: #8a5a00; --warn-soft: #fbf1dc;
  --k-read: #b4b2a8; --k-edit: #8b63e0; --k-bash: #14928f; --k-ask: #d19b00; --k-tries: #5d5c57; --k-error: #d0392f; --k-answer: #d9d7ce;
  --t-read: #1a1a18; --t-plan: #1a1a18; --t-edit: #fff; --t-bash: #fff; --t-ask: #1a1a18; --t-tries: #fff; --t-error: #fff;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --pv: #1f1f1d; --pv-ink: #f3f3ee; --pv-ink2: #b7b5aa; --pv-on: #fff; --pv-line: #3a3a36;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page: #0d0d0d; --surface: #1a1a19; --panel: #232322; --line: #34342f; --line2: #45453f; --ink: #fff; --ink2: #c3c2b7; --ink3: #8f8e86; --accent: #3987e5;
    --a: #4d95ea; --a-soft: #172636; --b: #e8834b; --b-soft: #36241a; --ok: #5fd08f; --ok-soft: #173424; --bad: #ff8a80; --bad-soft: #3d1a17; --warn: #f0c060; --warn-soft: #3a2e12;
    --k-read: #6d6b64; --k-edit: #a88af0; --k-bash: #3cc1c1; --k-ask: #f0c060; --k-tries: #b5b3a9; --k-error: #ff7a6e; --k-answer: #3b3a36; --pv: #2b2b28; --pv-line: #474742; --shadow: none; --t-read: #fff; --t-plan: #fff; --t-edit: #16141f; --t-bash: #0c1c1c; --t-ask: #1f1a08; --t-tries: #151514; --t-error: #200c0a; }
}
:root[data-theme="dark"] { --page: #0d0d0d; --surface: #1a1a19; --panel: #232322; --line: #34342f; --line2: #45453f; --ink: #fff; --ink2: #c3c2b7; --ink3: #8f8e86; --accent: #3987e5;
  --a: #4d95ea; --a-soft: #172636; --b: #e8834b; --b-soft: #36241a; --ok: #5fd08f; --ok-soft: #173424; --bad: #ff8a80; --bad-soft: #3d1a17; --warn: #f0c060; --warn-soft: #3a2e12;
  --k-read: #6d6b64; --k-edit: #a88af0; --k-bash: #3cc1c1; --k-ask: #f0c060; --k-tries: #b5b3a9; --k-error: #ff7a6e; --k-answer: #3b3a36; --pv: #2b2b28; --pv-line: #474742; --shadow: none; --t-read: #fff; --t-plan: #fff; --t-edit: #16141f; --t-bash: #0c1c1c; --t-ask: #1f1a08; --t-tries: #151514; --t-error: #200c0a; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
code { font: 12px var(--mono); }
/* Scroll without a scroll bar; a soft fade says there is more. */
.scroll { overflow: auto; scrollbar-width: none; overscroll-behavior: contain; }
.scroll::-webkit-scrollbar { display: none; }
.scroll.more { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 36px), transparent); }

/* ---------- Parts both designs share ---------- */
.view { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--panel); color: var(--ink2); white-space: nowrap; }
.res { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12.5px; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
.res.ok { color: var(--ok); background: var(--ok-soft); } .res.bad { color: var(--bad); background: var(--bad-soft); } .res.warn { color: var(--warn); background: var(--warn-soft); } .res.wait { color: var(--ink2); background: var(--panel); }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
.sw.A { background: var(--a); } .sw.B { background: var(--b); }
.who { display: inline-flex; align-items: center; gap: 7px; font-weight: 650; white-space: nowrap; min-width: 0; }
.who .real { font-weight: 500; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; }
.btn { border: 1px solid var(--line2); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; font-size: 13px; line-height: 1.3; }
.btn:hover { background: var(--panel); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.pri:hover { filter: brightness(1.07); }
.btn.stop { color: var(--bad); }
.btn:disabled { background: var(--panel); color: var(--ink3); border-color: var(--line2); cursor: default; filter: none; }
.live { display: inline-flex; align-items: center; gap: 6px; }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--b); animation: pulse 1.2s infinite; flex: none; }
@keyframes pulse { 50% { opacity: .3; } }
.none { color: var(--ink3); font-size: 13px; border: 1px dashed var(--line2); border-radius: 8px; padding: 8px 10px; }
.note { font-size: 12.5px; color: var(--ink2); background: var(--panel); border-radius: 8px; padding: 7px 10px; margin-bottom: 10px; line-height: 1.45; }

/* The top band (design A · Load + Battle, picked 29 Sep 2026): load one test or a set, press
   Battle, the score. What was a row of cells is the Load list now: each test with its result. */
.band { display: flex; align-items: center; gap: 12px; padding: 11px 18px; border-bottom: 1px solid var(--line); background: var(--surface); min-width: 0; min-height: 60px; }
.band .pick, .band .more { position: relative; flex: none; }
.band .fill { flex: 1; min-width: 0; }
.band .status { font-size: 12.5px; color: var(--ink2); }
.loadb { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--line2); background: var(--surface); color: var(--ink); border-radius: 9px; padding: 7px 12px; cursor: pointer; min-width: 260px; max-width: 440px; }
.loadb:hover, .loadb[aria-expanded="true"] { background: var(--panel); }
.loadb .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink3); font-weight: 700; }
.loadb b { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.loadb .c { margin-left: auto; color: var(--ink2); font-size: 13px; }
.btn.battle { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 8px 18px; font-size: 14px; border-radius: 9px; flex: none; }
.btn.battle:hover { filter: brightness(1.07); }
.btn.stopb { color: var(--bad); font-weight: 650; padding: 8px 16px; font-size: 14px; border-radius: 9px; flex: none; }
.btn.dots { padding: 6px 10px; letter-spacing: .08em; }
.prog { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 13px; color: var(--ink2); white-space: nowrap; overflow: hidden; }
.prog .live { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.prog .bar { width: 140px; height: 6px; border-radius: 3px; background: var(--panel); overflow: hidden; flex: none; }
.prog .bar i { display: block; height: 100%; background: var(--accent); }
.prog .muted { color: var(--ink3); }
.prog .okd { color: var(--ok); font-weight: 650; }
.score { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; flex: none; }
.score .nm { font-size: 13px; color: var(--ink2); font-weight: 650; }
.score b { font-size: 22px; font-weight: 800; line-height: 1; }
.score .sep { color: var(--ink3); }
.score .lbl { font-size: 11px; color: var(--ink3); margin-left: 2px; }
/* The Load list: the sets, then every test with its result (click one: it is loaded and shown below). */
.lm { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; width: 580px; background: var(--surface); border: 1px solid var(--line2); border-radius: 12px; padding: 6px; box-shadow: 0 12px 34px rgba(0,0,0,.28); display: grid; gap: 2px; }
.lm-h { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink3); font-weight: 700; padding: 6px 10px 3px; }
.lm-i { display: grid; grid-template-columns: auto auto minmax(0, 1fr); align-items: baseline; gap: 10px; text-align: left; border: 0; background: none; color: var(--ink); padding: 5px 10px; border-radius: 7px; cursor: pointer; }
.lm-i:hover, .lm-i.on { background: var(--panel); }
.lm-i.on b::after { content: " ✓"; color: var(--accent); }
.lm-i.sel { box-shadow: inset 2px 0 0 var(--accent); }
.lm-i b { font-size: 13.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lm-n { font-size: 12px; color: var(--accent); font-weight: 650; white-space: nowrap; }
.lm-d { font-size: 12px; color: var(--ink3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lm-tests { max-height: min(44vh, 330px); display: grid; gap: 1px; align-content: start; }
.lm-i.t { grid-template-columns: 24px minmax(0, 1fr) auto; }
.lm-i.t b { font-weight: 550; }
.lm-num { font-size: 11.5px; color: var(--ink3); font-variant-numeric: tabular-nums; text-align: right; }
.lm-g { position: sticky; top: 0; z-index: 1; background: var(--surface); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink3); font-weight: 700; padding: 5px 10px 2px 44px; }
.lm-res { display: flex; gap: 7px; align-items: baseline; font-size: 11.5px; white-space: nowrap; color: var(--ink3); }
.lm-res .run { color: var(--b); font-weight: 650; }
.rs { font-weight: 700; } .rs.ok { color: var(--ok); } .rs.bad { color: var(--bad); } .rs.warn { color: var(--warn); } .rs.done { color: var(--ink2); }
.vt { color: var(--ink2); } .vt.todo { color: var(--accent); font-weight: 650; }
.lm-f { display: flex; gap: 6px; align-items: center; border-top: 1px solid var(--line); margin-top: 2px; padding: 6px 4px 1px; }
.lm-key { margin-left: auto; font-size: 11px; color: var(--ink3); }
@media (max-width: 1350px) { .score .lbl { display: none; } .prog .bar { display: none; } .loadb { min-width: 200px; } }

/* The test's title row. */
.titlerow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 0 0 2px; align-items: center; position: relative; }
.titlerow h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; min-width: 0; }
.titlerow h2 span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.titlerow .acts { display: flex; gap: 6px; }
.titlerow .line2 { grid-column: 1 / -1; display: flex; gap: 14px; align-items: center; min-width: 0; }
.titlerow .prompt { flex: 1; min-width: 0; color: var(--ink2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.titlerow .prompt.open { white-space: normal; }
.titlerow .more { color: var(--accent); font-size: 12.5px; cursor: pointer; background: none; border: none; padding: 0; white-space: nowrap; }
.rules { display: flex; gap: 6px; flex: none; max-width: 55%; overflow: hidden; }
.rules .chip { overflow: hidden; text-overflow: ellipsis; max-width: 360px; display: inline-block; }
.rules .chip::before { content: "✓ "; color: var(--ok); font-weight: 700; }

/* The timeline: both runs on one clock, zoomed to the runs; each stretch = the time it took to reach that step. */
.tl { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px 8px; box-shadow: var(--shadow); }
.tl .cap { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--ink3); flex-wrap: wrap; }
.tl .cap b { color: var(--ink); font-weight: 650; }
.tl .cap .delta { color: var(--ink2); font-weight: 600; }
.tlsvg { display: block; width: 100%; overflow: visible; }
.tlsvg text { font-size: 11px; fill: var(--ink3); font-family: inherit; }
.tlsvg .seg { cursor: pointer; }
.tlsvg .seg:hover { filter: brightness(1.12); stroke: var(--ink); stroke-width: 1.5; }
.key { display: flex; gap: 12px; font-size: 11.5px; color: var(--ink3); flex-wrap: wrap; }
.key span { display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; } .key i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.k-read { background: var(--k-read); } .k-plan { background: var(--k-read); } .k-edit { background: var(--k-edit); } .k-bash { background: var(--k-bash); } .k-ask { background: var(--k-ask); } .k-tries { background: var(--k-tries); } .k-error { background: var(--k-error); } .k-answer { background: var(--k-answer); }
#tip { position: fixed; z-index: 40; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12px; line-height: 1.4; padding: 6px 9px; border-radius: 7px; max-width: 360px; display: none; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
#tip b { font-weight: 650; } #tip .tm { opacity: .7; font-variant-numeric: tabular-nums; margin-right: 6px; } #tip .er { color: #ffb3ab; display: block; }
:root[data-theme="dark"] #tip, :root:not([data-theme="light"]) #tip { }

/* Tabs: What it did · Answer · Changes (or Page), each with Model A and Model B side by side. */
.tabs { min-height: 240px; display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.tabbar { display: flex; align-items: center; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line); }
.tabbar button { border: none; background: none; padding: 7px 12px 8px; border-radius: 8px 8px 0 0; color: var(--ink2); cursor: pointer; font-size: 13px; display: inline-flex; gap: 7px; align-items: center; }
.tabbar button:hover { color: var(--ink); background: var(--panel); }
.tabbar button[aria-selected="true"] { color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
.tabbar .ct { font-size: 11px; font-weight: 500; color: var(--ink3); font-variant-numeric: tabular-nums; }
.tabbar .fill { flex: 1; }
.tabbar .hint { font-size: 11.5px; color: var(--ink3); padding-right: 6px; }
.tcols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); min-height: 0; }
.tcol { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; min-width: 0; }
.tcol + .tcol { border-left: 1px solid var(--line); }
.tch { display: flex; align-items: center; gap: 10px; padding: 8px 14px; font-size: 12px; color: var(--ink3); border-bottom: 1px solid var(--line); min-width: 0; }
.tch .how { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbody { padding: 10px 14px 14px; min-height: 0; }
.tbody.page { padding: 8px; }
.steps { font: 12px/1.6 var(--mono); margin: 0; padding: 0; list-style: none; }
.steps li { display: grid; grid-template-columns: 40px 10px minmax(0, 1fr); gap: 8px; align-items: baseline; border-radius: 6px; padding: 0 4px; }
.steps li.hl { background: var(--warn-soft); }
.steps .tm { color: var(--ink3); text-align: right; font-variant-numeric: tabular-nums; }
.steps .dot { width: 8px; height: 8px; border-radius: 2px; align-self: center; }
.steps .lb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steps .lb i { font-style: normal; color: var(--ink3); }
.steps .er { grid-column: 3; color: var(--bad); white-space: normal; font-size: 11.5px; }
.steps li.new { animation: fadein .35s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
.approx { font-size: 11.5px; color: var(--ink3); margin-top: 8px; }
.answer { font-size: 13.5px; line-height: 1.55; overflow-wrap: anywhere; }
.answer code { background: var(--panel); padding: 1px 4px; border-radius: 4px; }
.diff { font: 11.5px/1.55 var(--mono); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
.diff .fh { padding: 4px 10px; background: var(--panel); color: var(--ink2); border-bottom: 1px solid var(--line); }
.diff .ln { padding: 0 10px; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
.diff .ln.add { background: var(--ok-soft); } .diff .ln.del { background: var(--bad-soft); } .diff .ln.ctx { color: var(--ink3); }
.pageframe { width: 100%; height: 100%; border: 1px solid var(--line); border-radius: 8px; background: #fff; display: block; }

/* The vote. */
.vbtn { border: 1.5px solid var(--line2); background: var(--surface); border-radius: 10px; padding: 6px 14px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 13px; }
.vbtn:hover:not(:disabled) { background: var(--panel); }
.vbtn.A:hover:not(:disabled), .vbtn.A.on { border-color: var(--a); background: var(--a-soft); } .vbtn.B:hover:not(:disabled), .vbtn.B.on { border-color: var(--b); background: var(--b-soft); } .vbtn.T.on { border-color: var(--ink2); background: var(--panel); }
.vbtn:disabled { color: var(--ink3); background: var(--panel); cursor: default; }
.picked { font-size: 13px; color: var(--ink2); }
.picked b { color: var(--ink); }

/* ---------- Design 3 · Scoreboard ---------- */
.d3.body { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; gap: 10px; padding: 0 18px 0; min-height: 0; }
.duels { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.duel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px 9px; min-width: 0; box-shadow: var(--shadow); display: grid; gap: 5px; }
.duel .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink3); font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.duel .k .w { text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--ok); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.duel .vals { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 8px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.duel .vals b { font-size: 17px; font-weight: 700; white-space: nowrap; }
.duel .vals b small { font-size: 11.5px; font-weight: 500; color: var(--ink3); }
.duel .vals .x { color: var(--ink3); font-size: 11px; }
.duel .vals .won { color: var(--ok); }
.tug { display: flex; height: 6px; border-radius: 3px; overflow: hidden; gap: 2px; background: var(--panel); }
.tug .ta { background: var(--a); } .tug .tb { background: var(--b); }
.tug.flat { background: none; } .tug.flat span { background: var(--line2); }
.duel .rv2 { display: flex; justify-content: space-between; gap: 6px; }
.d3 .vote { display: flex; align-items: center; gap: 10px; padding: 9px 0 11px; }
.d3 .vote .q { font-weight: 650; }
.d3 .vote .fill { flex: 1; }

/* ---------- The new test: three steps on one screen ---------- */
.steps3 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .9fr) minmax(0, 1fr); gap: 14px; min-height: 0; }
.stp { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; min-height: 0; min-width: 0; box-shadow: var(--shadow); }
.stp .sh { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 14.5px; }
.stp .sh .no { width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--surface); display: grid; place-items: center; font-size: 12.5px; font-weight: 700; flex: none; }
.stp .sh .opt { font-weight: 400; color: var(--ink3); font-size: 12.5px; }
.stp .sb { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.stp textarea, .stp input[type=text] { font: inherit; font-size: 14px; color: var(--ink); background: var(--page); border: 1px solid var(--line2); border-radius: 10px; padding: 10px 12px; width: 100%; line-height: 1.5; }
.stp textarea { flex: 1; min-height: 110px; resize: none; }
.stp textarea::placeholder, .stp input::placeholder { color: var(--ink3); opacity: .75; }

/* The Battle page inside the hub's tab: the page itself, a floor below which it scrolls (no bar). */

.clist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }

.panelmsg { max-width: 980px; }

@media (max-width: 900px) { .mbody { grid-template-columns: 1fr; grid-template-rows: 160px minmax(0, 1fr); } .mlist { border-right: none; border-bottom: 1px solid var(--line); } .modal, .modal.newm { inset: 8px; transform: none; width: auto; height: auto; } .mform .steps3, .mform1 .steps3 { grid-template-columns: 1fr; overflow: auto; } }

/* ---------- The wizard: four steps, one at a time (Design 1 · Steps across the top, 1 Oct 2026) ---------- */
.wz { height: 100%; min-height: 560px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; min-height: 0; box-shadow: var(--shadow); }
.sbar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 10px 18px 0; }
.sc1 { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 0 10px; align-items: center; border: 0; background: none; text-align: left; padding: 8px 12px 10px; cursor: pointer; border-bottom: 2px solid var(--line); min-width: 0; color: var(--ink); }
.sc1:hover { background: var(--panel); border-radius: 10px 10px 0 0; }
.sc1 .no { grid-row: 1 / 3; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 750; font-size: 13px; border: 1.5px solid var(--line2); color: var(--ink2); }
.sc1 b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink2); font-weight: 600; }
.sc1 > span:last-child { font-size: 12px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sc1.done .no { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.sc1.on { border-bottom-color: var(--accent); } .sc1.on .no { background: var(--accent); border-color: var(--accent); color: #fff; } .sc1.on b { color: var(--ink); font-weight: 700; }
.sc1.run:not(.on) .no { border-color: var(--b); color: var(--b); }
.wbody { min-height: 0; padding: 12px 18px; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
.foot1 { display: grid; grid-template-columns: 200px minmax(0, 1fr) minmax(200px, 300px); gap: 14px; align-items: center; padding: 10px 18px; border-top: 1px solid var(--line); background: var(--surface); }
.foot1 .sum { text-align: center; font-size: 13px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .foot1 .sum b { color: var(--ink); }
.foot1 .l .btn, .foot1 .r .btn, .foot1 .r .go { width: 100%; }
/* Step 1: the panel, and this run in words. */
.s1 { display: grid; grid-template-columns: minmax(520px, 640px) minmax(0, 1fr); gap: 14px; min-height: 0; }
.s1 .pr { grid-template-columns: 132px 170px minmax(0, 1fr); } .s1 .pr .nt { display: block; }
.words { padding: 16px 18px; display: grid; gap: 12px; align-content: start; overflow: auto; }

.words .k { color: var(--ink3); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.whoc { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.wc { border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 11px; cursor: pointer; display: grid; gap: 1px; background: var(--page); text-align: left; color: var(--ink); min-width: 0; }
.wc:hover { border-color: var(--line2); } .wc.on { border-color: var(--accent); background: var(--a-soft); }
.wc b { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .wc span { font-size: 12px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Step 2: the list (One · Group on top), and what runs. */
.s2 { display: grid; grid-template-columns: minmax(380px, 1fr) minmax(0, 1fr); gap: 14px; min-height: 0; }
.lwrap { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); min-height: 0; }
.modesw { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink3); }
.modesw span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.modeseg { display: inline-flex; border: 1px solid var(--line2); border-radius: 9px; overflow: hidden; }
.modeseg button { border: 0; background: var(--surface); padding: 4px 14px; cursor: pointer; font-size: 13px; color: var(--ink2); }
.modeseg button + button { border-left: 1px solid var(--line2); }
.modeseg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 600; }
.tg.radio { border-radius: 50%; } .tg.radio.on { color: transparent; background: radial-gradient(circle, #fff 0 3px, var(--accent) 3.5px); }
.pick { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); overflow: hidden; }
.pick .phd { padding: 12px 16px 8px; display: grid; gap: 4px; min-width: 0; }
.pick .phd .k { color: var(--ink3); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.pick .phd b { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick .phd .sub { font-size: 12.5px; color: var(--ink3); }
.pick .pfd { padding: 12px 16px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.pick .pfd .row { display: flex; gap: 8px; } .pick .pfd .row .go { flex: 1; padding: 10px 14px; font-size: 15px; }
.pick .pfd .hint { color: var(--ink3); font-size: 12px; text-align: center; }
.pitem { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 6px 16px; border-top: 1px solid var(--line); font-size: 13.5px; }
.pitem span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .pitem small { color: var(--ink3); font-size: 12px; white-space: nowrap; }
.pkids { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px 16px; padding: 4px 16px 10px; font-size: 12.5px; color: var(--ink2); }
.pkids span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .pkids i { font-style: normal; color: var(--ink3); display: inline-block; width: 28px; font-variant-numeric: tabular-nums; }
.preview { padding: 4px 16px 14px; display: grid; gap: 12px; align-content: start; }
.preview .pp { color: var(--ink2); font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.preview .kv { max-width: none; }
.preview .rules { max-width: none; flex-wrap: wrap; }
/* Step 3: the group on top, then the terminal. */
.s3 { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); gap: 10px; min-height: 0; }
.runtop { padding: 10px 14px 8px; display: grid; gap: 6px; }
.rrw { display: grid; grid-template-columns: 70px minmax(0, 1fr) 230px; gap: 12px; align-items: center; min-width: 0; }
.rrw .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink3); font-weight: 700; }
.rrw .rt { font-size: 12.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; text-align: right; }
.rrw .rt b { color: var(--ink); }
.rrw .now { font-size: 12.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; } .rrw .now b { color: var(--ink); }
.cells { display: flex; gap: 3px; height: 22px; min-width: 0; }
.cell { flex: 1 1 0; max-width: 64px; border-radius: 4px; background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff; min-width: 0; overflow: hidden; }
.cell.ok { background: var(--ok); border-color: var(--ok); } .cell.bad { background: var(--bad); border-color: var(--bad); } .cell.warn { background: var(--warn); border-color: var(--warn); } .cell.done { background: var(--ink3); border-color: var(--ink3); }
.cell.run { background: var(--a-soft); border: 1.5px solid var(--a); color: var(--a); animation: pulse 1.4s infinite; }
.cell.left { background: none; border-style: dashed; }
.ckprog { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink2); min-width: 0; }
.ckprog .bar { flex: 1; height: 8px; border-radius: 4px; background: var(--panel); overflow: hidden; } .ckprog .bar i { display: block; height: 100%; background: var(--a); }
.term.scroll { display: block; overflow: auto; }
.term .c { color: #7cc4e8; } .term .p { color: #b9a0f5; } .term .hd { color: #fff; font-weight: 700; } .term .add { color: #7fd092; } .term .del { color: #f08a74; }
.term .cur::after { content: "▍"; color: #e7e5df; animation: pulse 1s infinite; }
.runbar { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--ink2); min-width: 0; }
.runbar .nx { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }

.srow, .shead { display: grid; grid-template-columns: 40px minmax(0, 1.5fr) minmax(90px, .6fr) minmax(90px, .6fr) minmax(0, 1fr); gap: 0 12px; align-items: center; padding: 0 14px; }

<body>
<main id="app"><div class="wz">
  <nav class="sbar" id="sbar" aria-label="The four steps"></nav>
  <div class="wbody" id="wbody"><div class="empty"><div class="none">Reading the arena…</div></div></div>
  <footer class="foot1" id="foot"></footer>
</div></main>
<div id="tip"></div>
<div id="modal"></div>
<div id="over"></div>
<div id="toast" role="status"></div>
<script>
(function () {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const tip = $('#tip'), toastEl = $('#toast'), overEl = $('#over');
  // The full result of a test or a check (Step 4, a row opened): it is drawn here once that step's frame is up.
  let mainEl = document.createElement('div');
  const whole = (s) => Math.round(s);
  const mmss = (s) => { const r = Math.max(0, whole(s)); return `${Math.floor(r / 60)}:${String(r % 60).padStart(2, '0')}`; };
  const human = (s) => { const r = Math.max(0, whole(s)); return r < 60 ? `${r} s` : `${Math.floor(r / 60)} min ${String(r % 60).padStart(2, '0')} s`; };
  const dur = (s) => (s == null ? '?' : s < 90 ? `${Math.max(1, Math.round(s))} s` : s < 3600 ? `${Math.round(s / 60)} min` : `${Math.floor(s / 3600)} h ${String(Math.floor((s % 3600) / 60)).padStart(2, '0')} min`);
  const md = (t) => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
  const when = (iso) => { const d = new Date(iso); return `${d.toLocaleDateString([], { day: 'numeric', month: 'short' })}, ${d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`; };
  const kindName = { code: 'Code change', question: 'Question', page: 'Page', writing: 'Writing' };
  // The sets that come with the arena, then yours. A copy of a Practice 28 test has a letter (18b).
  const OWN = ['new28', 'work28', 'practice'];
  const SUITE_NAME = { new28: 'New 28', work28: 'Work 28', practice: 'Practice 28', mine: 'My tests' };
  const suiteOf = (t) => (OWN.includes(t?.suite) ? t.suite : 'mine');
  // A test of yours has a level (set in the Test builder): its points and its time on one model.
  const LEVEL_NAME = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };
  const numOf = (t) => (t?.n ? `${t.n}${t.variant ?? ''}` : '');
  const KINDS = [['read', 'read / look'], ['edit', 'change a file'], ['bash', 'run a command'], ['ask', 'asked you'], ['tries', 'tries (tests, drafts)'], ['error', 'a step that failed'], ['answer', 'writing its answer']];
  const SHORT = { gemma: 'Gemma', qwen: 'Qwen' };
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch { /* no storage */ } } };
  // What the hub passed along: its own address (for the record), and what /test asked for.
  const ask = new URLSearchParams(location.search);

  async function api(path, body) {

  // ---------- A run, in the shape the drawing wants ----------
  function runOf(det, side) {

  function verdict(r) {

  }
  const clean = (r) => r && !r.running && !r.pending && !r.skipped && !r.stopped && !r.overLimit && !r.error;

  // A result, as one mark in the list: ✓ pass · ✗ fail · ■ stopped or out of time · – never run.
  const markOf = (b) => (!b ? '<span class="mk nil">–</span>' : b.error ? '<span class="mk bad" data-tip="did not finish">!</span>' : b.stopped || b.overLimit ? `<span class="mk warn" data-tip="${b.stopped ? 'stopped' : 'out of time'}">■</span>` : b.pass == null ? '<span class="mk nil" data-tip="finished: no checks">•</span>' : b.pass ? `<span class="mk ok" data-tip="pass · ${mmss(b.secs)}">✓</span>` : `<span class="mk bad" data-tip="fail · ${mmss(b.secs)}">✗</span>`);

  // ---------- This run: who, the effort, every row of /effort ----------
  const PM = () => S.st?.panel?.models ?? {};

  const whoNow = () => { const w = ui.who === 'both' ? defPair() : ui.who; return whoList().includes(w) ? w : defPair() ?? whoList()[0] ?? 'both'; };
  // The two models shown side by side in the list and a set: a battle's two; a model alone beside the default pair's other (or the pair's first).
  const shownPair = () => { const w = whoNow(), d = defPair() ? vsOf(defPair()) : (S.st?.models ?? []).slice(0, 2).map((m) => m.id); const ids = isVs(w) ? vsOf(w) : d.includes(w) ? d : [w, d[0]]; return ids.map((id) => S.st.models.find((m) => m.id === id) ?? { id, name: id }); };
  const pmid = () => { const w = whoNow(); const id = isVs(w) ? vsOf(w)[0] : w; return PM()[id] ? id : Object.keys(PM())[0] ?? null; };

  const levels = () => P()?.levels ?? [{ id: 'low', show: 'Low', note: '' }, { id: 'high', show: 'High', note: '' }];

  const setWords = (s) => (s && Object.keys(s).length ? Object.entries(s).map(([k, v]) => { const r = P()?.rows.find((x) => x.id === k); return `${r?.label ?? k} ${r ? stepOf(r, v).show : v}`; }).join(' · ') : 'the tests’ defaults');
  const whoWords = (w) => (isVs(w) ? vsOf(w).map(nameOf).join(' then ') : fullName(w));
  const panelRows = () => [{ id: '_who' }, { id: '_effort' }, ...P().rows];
  function moveRow(i, dir) {
    const r = panelRows()[i];

    if (r.id === '_effort') { const lv = levels(), k = lv.findIndex((l) => l.id === effort()); ui.effort = lv[Math.max(0, Math.min(lv.length - 1, k + dir))].id; return; }

  // ---------- The run box: what is picked, or what is running ----------

  function estimate(items) {

    let secs = 0, unknown = 0;
    for (const it of items) {
      if (it.check) { for (const m of it.check.model ? ms : ['none']) { const r = it.check.last[m]; const s = r?.secs ?? (it.check.minutes ? it.check.minutes * 60 : null); if (s) secs += s; else unknown += 1; } continue; }
      for (const id of it.tests) for (const m of ms) { const r = testById(id)?.last?.[m]; if (r?.secs) secs += r.secs; else unknown += 1; }
    }
    return secs ? `about ${dur(secs)}${unknown ? ` + ${unknown} not timed yet` : ''}` : 'not timed yet';
  }
  // A battle goes to the runner as who 'both' with its two models (vs).
  const payload = (items) => items.map((it) => ({ kind: it.kind, id: it.id, who: isVs(it.who) ? 'both' : it.who, ...(isVs(it.who) ? { vs: vsOf(it.who) } : {}), think: it.think, settings: it.settings }));
  function goLabel(items, busy) {
    const nt = items.reduce((n, it) => n + (it.tests?.length ?? 0), 0), nc = items.filter((it) => it.check).length, n = nt + nc;
    if (!n) return '▶ Run';
    if (busy) return `+ Add ${n} to the line`;
    const what = nc && !nt ? `check${nc === 1 ? '' : 's'}` : `test${n === 1 ? '' : 's'}`;
    return isVs(whoNow()) ? (nc ? `▶ Run ${n} ${what} on ${vsOf(whoNow()).map(nameOf).join(' and ')}` : `▶ Battle ${n} ${what}`) : `▶ Run ${n} ${what} on ${nameOf(whoNow())}`;
  }
  // ---------- The wizard: four steps, one at a time (picked 1 Oct 2026) ----------
  const STEPS = ['Model & settings', 'Tests', 'Run', 'Results'];
  const stepNow = () => Math.max(1, Math.min(4, Number(ui.step) || 1));
  function go(n) { ui.step = Math.max(1, Math.min(4, n)); S.menu = false; S.hmenu = false; S.runsOpen = false; if (ui.step !== 4) S.open4 = null; save(); draw(); poll(true); }
  // One · Group: One runs the one row you picked; Group runs every tick (sets, tests, checks), one after the other.
  const oneMode = () => ui.mode === 'one';
  const isOne = (k) => Boolean(ui.one) && `${ui.one.kind}:${ui.one.id}` === k;
  const pickedNow = () => (oneMode() ? pickedItems(ui.one ? [`${ui.one.kind}:${ui.one.id}`] : []) : pickedItems());
  const countOf = (items) => items.reduce((n, it) => n + (it.tests?.length ?? 1), 0);
  const groupName = (items) => (items.length === 1 ? items[0].name : `${items[0].name} and ${items.length - 1} more`);
  async function runPicked() {
    const items = pickedNow();
    if (!items.length || S.sending) return;
    if (await addLine(payload(items), groupName(items))) go(3); else draw();
  }
  const shortWho = (w) => (isVs(w) ? vsOf(w).map(nameOf).join(' vs ') : nameOf(w));
  const effWords = () => levels().find((l) => l.id === effort())?.show ?? 'Low';
  const setShort = () => { const n = changed().length; return n ? `${n} row${n === 1 ? '' : 's'} changed` : 'defaults'; };

  // ---------- The groups: each press of ▶ Run ----------
  // Step 3 shows the group running now (else the one you picked, else the newest); Step 4 the one you picked, else the newest.
  const runBatchId = () => S.st?.running?.batch ?? ui.batch ?? S.st?.batch ?? null;
  const resBatchId = () => ui.batch ?? S.st?.batch ?? null;
  const batchWho = (B) => (B.who === 'both' ? (B.vs ?? S.st.pair).map(nameOf).join(' vs ') : B.who ? fullName(B.who) : 'no model');
  const batchHow = (B) => `${batchWho(B)} · ${B.think ? 'High' : 'Low'}${B.settings ? ' · own settings' : ''}`;
  const itemRuns = (it) => Object.entries(it.runs ?? {}).filter(([, r]) => r && !r.skipped);
  const itemSecs = (it) => (it.kind === 'check' ? it.secs ?? 0 : itemRuns(it).reduce((n, [, r]) => n + (r.secs ?? 0), 0));
  // One item of a group as one mark: ✓ every run of it passed · ✗ one failed · ■ stopped or out of time · ! did not finish · • no checks.
  function itemMark(it) {
    if (it.state === 'running') return { cls: 'run', sym: '▶', words: 'running' };
    if (it.state === 'waiting') return { cls: '', sym: '', words: 'waiting' };
    if (it.state === 'left') return { cls: 'left', sym: '', words: 'not run: the line was cleared' };
    if (it.kind === 'check') { const [cls, words] = jobResult(it); return { cls, sym: cls === 'ok' ? '✓' : cls === 'warn' ? '■' : '✗', words }; }
    const rs = itemRuns(it).map(([, r]) => r);
    if (!rs.length) return { cls: 'warn', sym: '■', words: 'not run: it was stopped' };
    if (rs.some((r) => r.error)) return { cls: 'bad', sym: '!', words: 'did not finish' };
    if (rs.some((r) => r.stopped || r.overLimit)) return { cls: 'warn', sym: '■', words: rs.some((r) => r.stopped) ? 'stopped' : 'out of time' };
    if (rs.every((r) => r.pass == null)) return { cls: 'done', sym: '•', words: 'finished: no checks' };
    return rs.every((r) => r.pass) ? { cls: 'ok', sym: '✓', words: 'pass' } : { cls: 'bad', sym: '✗', words: 'fail' };
  }
  const notPassed = (B) => B.items.filter((x) => x.state === 'done' && ['bad', 'warn'].includes(itemMark(x).cls));

  // ---------- The step chips and the footer ----------
  function sbarHtml() {
    const st = stepNow(), r = S.st.running, B = S.bat[runBatchId()], items = pickedNow();
    const R = S.bat[resBatchId()] ?? S.bats.find((b) => b.id === resBatchId());
    const sum = [`${shortWho(whoNow())} · ${effWords()} · ${setShort()}`,
      items.length ? `${oneMode() ? 'One' : 'Group'} · ${items.length === 1 && items[0].kind !== 'set' ? items[0].name : `${countOf(items)} to run`}` : 'nothing picked yet',
      r ? (B && r.batch === B.id ? `running ${Math.min(B.count, B.done + 1)} of ${B.count}` : 'running') : S.st.line.length ? `${S.st.line.length} waiting${S.st.paused ? ' · paused' : ''}` : B ? `done · ${B.passed} of ${B.done} passed` : 'nothing has run yet',
      R ? `${R.name} · ${R.passed} of ${R.done} passed` : 'no results yet'];
    return STEPS.map((t, k) => { const i = k + 1, cls = i === st ? 'on' : i < st ? 'done' : ''; return `<button type="button" class="sc1 ${cls}${i === 3 && r ? ' run' : ''}" data-go="${i}" aria-current="${i === st ? 'step' : 'false'}"><span class="no">${cls === 'done' ? '✓' : i}</span><b>${t}</b><span>${esc(sum[k])}</span></button>`; }).join('');
  }
  function footHtml() {
    const st = stepNow(), r = S.st.running, busy = Boolean(r || S.st.line.length), items = pickedNow();
    const left = `<div class="l"><button type="button" class="btn" data-act="back"${st === 1 ? ' disabled' : ''}>‹ Back</button></div>`;
    const sum = st === 3 && r ? `<span class="live">Running</span> <b>${esc(S.bat[runBatchId()]?.name ?? r.title)}</b> · ${esc(r.who === 'both' ? (r.vs ?? S.st.pair).map(nameOf).join(' vs ') : r.who ? nameOf(r.who) : 'no model')} · ${r.think ? 'High' : 'Low'}`
      : `<b>${esc(shortWho(whoNow()))}</b> · ${esc(effWords())} · ${esc(setShort())} · <b>${esc(items.length ? groupName(items) : 'nothing picked')}</b>`;
    const next = st === 1 ? '<button type="button" class="btn pri" data-act="next">Next: pick tests ›</button>'
      : st === 2 ? `<button type="button" class="go" data-act="go"${items.length && !S.sending ? '' : ' disabled'}>${items.length ? esc(goLabel(items, busy)) : 'Pick a test first'}</button>`
      : st === 3 ? '<button type="button" class="btn pri" data-act="next">Results ›</button>' : '<button type="button" class="btn pri" data-act="next">New run ›</button>';
    return `${left}<div class="sum">${sum}${S.st.fake ? ' · <span style="color:var(--warn)">practice mode: no model runs</span>' : ''}</div><div class="r">${next}</div>`;
  }

  // ---------- Step 1: the panel, and this run in words ----------
  function wordsHtml() {
    const w = whoNow(), lv = levels().find((l) => l.id === effort()), ch = changed();
    const who = isVs(w) ? `<b>a battle of ${esc(vsOf(w).map(fullName).join(' and '))}</b>, one after the other, with the names hidden until you vote` : `<b>${esc(fullName(w))}</b> alone`;
    const quick = [...hereIds(), ...(defPair() ? [defPair()] : [])];
    return `<h3>This run, in words</h3><div class="say">It runs on ${who}, at <b>${esc(lv.show)}</b> effort (${esc(lv.note)}), with ${ch.length ? `<b>${ch.length} row${ch.length > 1 ? 's' : ''} changed</b> (${esc(ch.map((r) => `${r.label} ${stepOf(r).show}`).join(', '))}): its results are kept with those settings` : '<b>every row at the tests’ defaults</b>, so its results compare with every earlier run'}.</div>
      <div class="k">Quick pick · the same as the Who row</div>
      <div class="whoc">${quick.map((q) => `<button type="button" class="wc${q === w ? ' on' : ''}" data-who="${esc(q)}"><b>${esc(isVs(q) ? `${vsOf(q).map(nameOf).join(' vs ')} · a battle` : fullName(q))}</b><span>${esc(isVs(q) ? 'two models, one after the other' : freeWords())}</span></button>`).join('')}</div>
      <div class="note" style="margin:0">Next: pick the tests. You can come back here at any time; a run already going keeps the settings it started with.</div>`;
  }

  // ---------- Step 2: what runs (One: that test or check; Group: everything ticked) ----------
  function pickHtml() {
    const items = pickedNow(), busy = Boolean(S.st.running || S.st.line.length);
    const err = S.err ? `<div class="err">${esc(S.err)}</div>` : '';
    if (oneMode()) {
      const o = ui.one, t = o?.kind === 'test' ? testById(o.id) : null, c = o?.kind === 'check' ? checkById(o.id) : null;
      if (!t && !c) return `<div class="phd"><span class="k">The one that runs</span><b>Nothing picked yet</b><span class="sub">Click a test or a check on the left. Open a set to see its tests.</span></div><div></div><div class="pfd">${err}<div class="row"><button type="button" class="go" disabled>▶ Run</button></div></div>`;
      const [m1, m2] = shownPair();
      if (t) {
        const rules = rulesOf(t), qi = lineAt('test', t.id);
        return `<div class="phd"><span class="k">The one that runs</span><b title="${esc(t.title)}">${esc(t.title)}</b><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="chip">${OWN.includes(t.suite) ? `${SUITE_NAME[t.suite]} · ${numOf(t)}` : 'My tests'}</span><span class="chip">${kindName[t.kind] ?? t.kind}</span>${t.level ? `<span class="chip">${LEVEL_NAME[t.level] ?? t.level}</span>` : ''}${stateTag('test', t.id, t.toVote)}</div></div>
          <div class="preview scroll" data-scroll="pick"><div class="pp">${esc(t.prompt)}</div><div class="rules">${rules.length ? rules.map((x) => `<span class="chip" data-tip="${esc(x)}">${esc(x)}</span>`).join('') : '<span class="chip plain">no checks: your vote decides</span>'}</div>
          <div class="kv"><span>How it runs</span><span>${esc(isVs(whoNow()) ? `a battle: ${whoWords(whoNow())}, names hidden until you vote` : `on ${fullName(whoNow())} alone`)} · ${esc(effWords())} · ${esc(setWords(setNow()))} · stops at ${isVs(whoNow()) ? '10 min' : minsOf(t.limit ?? 600)}</span><span>Starter files</span><span>${t.files?.length ? `${t.files.slice(0, 8).map(esc).join(', ')}${t.files.length > 8 ? ` and ${t.files.length - 8} more` : ''}` : 'none (an empty folder)'}</span><span>Last runs</span><span>${[m1, m2].map((m) => `${esc(nameOf(m.id))} ${markOf(t.last?.[m.id])}`).join(' · ')}</span></div></div>
          <div class="pfd">${err}<div class="row"><button type="button" class="btn" data-act="edit">Edit</button><button type="button" class="go" data-act="go"${S.sending || qi >= 0 ? ' disabled' : ''}>${qi >= 0 ? `In line (#${qi + 1})` : esc(goLabel(items, busy))}</button></div></div>`;
      }
      const cmd = (effort() !== 'low' && c.commandThink ? c.commandThink : c.command)?.[c.model ? pmid() : 'none'] ?? '';
      const mk = (r) => (!r ? '–' : r.result === 'pass' ? '✓' : r.result === 'fail' ? '✗' : '•');
      const lastC = c.model ? [m1, m2].map((m) => `${esc(nameOf(m.id))} ${mk(c.last[m.id])}`).join(' · ') : c.last.none ? `${mk(c.last.none)} · ${esc(when(c.last.none.at))}` : 'never run';
      return `<div class="phd"><span class="k">The one that runs</span><b>${esc(c.name)}</b><div style="display:flex;gap:6px;align-items:center"><span class="chip">a check</span><span class="chip">${c.model ? (c.think ? 'uses the whole panel' : 'uses the panel, never thinks') : 'takes no model'}</span>${stateTag('check', c.id, false)}</div></div>
        <div class="preview scroll" data-scroll="pick"><div class="pp">${esc(c.what)}</div><div class="kv"><span>How it runs</span><span>${c.model ? esc(isVs(whoNow()) ? `on ${whoWords(whoNow())}, one after the other` : `on ${fullName(whoNow())}`) : 'no model'}${c.model ? ` · ${esc(effWords())}` : ''}</span><span>Command</span><span><code>${esc(cmd)}</code></span><span>Last runs</span><span>${lastC}</span><span>Time</span><span>${c.minutes ? `about ${c.minutes} min` : 'not timed yet'}</span></div></div>
        <div class="pfd">${err}<div class="row"><button type="button" class="go" data-act="go"${S.sending || lineAt('check', c.id) >= 0 ? ' disabled' : ''}>${lineAt('check', c.id) >= 0 ? `In line (#${lineAt('check', c.id) + 1})` : esc(goLabel(items, busy))}</button></div></div>`;
    }
    const n = countOf(items);
    const rows = items.map((it) => `<div class="pitem"><span><b>${esc(it.name)}</b></span><small>${it.kind === 'set' ? `${it.tests.length} tests` : it.kind === 'check' ? 'a check' : 'a test'}</small><button type="button" class="fx" data-untick="${esc(`${it.kind}:${it.id}`)}" aria-label="Take ${esc(it.name)} out" data-tip="Take it out">×</button></div>${it.kind === 'set' ? `<div class="pkids">${it.tests.map((id) => testById(id)).filter(Boolean).map((t) => `<span title="${esc(t.title)}"><i>${numOf(t)}</i>${esc(t.title)}</span>`).join('')}</div>` : ''}`).join('');
    return `<div class="phd"><span class="k">The group</span><b>${n ? `${n} to run, one after the other` : 'Nothing picked yet'}</b><span class="sub">${n ? `${esc(isVs(whoNow()) ? `${whoWords(whoNow())}: each test twice` : `on ${fullName(whoNow())}`)} · ${esc(effWords())} · ${esc(setWords(setNow()))} · ${esc(estimate(items))}` : 'Tick sets, tests or checks on the left.'}</span></div>
      <div class="scroll" data-scroll="pick">${rows}</div>
      <div class="pfd">${err}<div class="row"><button type="button" class="btn" data-act="clear"${n ? '' : ' disabled'}>Clear</button><button type="button" class="go" data-act="go"${n && !S.sending ? '' : ' disabled'}>${n ? esc(goLabel(items, busy)) : '▶ Run'}</button></div><div class="hint">▶ starts the group and opens Step 3. While something runs, it goes in the line after it.</div></div>`;
  }

  // ---------- Step 3: the group on top, then a terminal of everything it does ----------
  const pad2 = (n) => String(n).padStart(2, '0');
  const fit = (t, n) => (t.length > n ? `${t.slice(0, n - 1)}…` : t.padEnd(n));
  const vcls = (v) => (v.cls === 'ok' ? 'g' : v.cls === 'bad' ? 'r' : 'y');
  function doneLine(it, i) {
    const m = itemMark(it);
    const res = it.kind === 'check' ? `<span class="${m.cls === 'ok' ? 'g' : m.cls === 'warn' ? 'y' : 'r'}">${esc(m.words)}</span>${it.secs != null ? ` <span class="d">· ${dur(it.secs)}</span>` : ''}`
      : itemRuns(it).map(([side, r]) => { const v = verdict(r); return `${it.mode === 'battle' ? `<span class="${side === 'A' ? 'c' : 'y'}">${side}</span> ` : ''}<span class="${vcls(v)}">${esc(v.text)}</span> ${mmss(r.secs ?? 0)} <span class="d">· ${r.stepCount ?? 0} steps</span>`; }).join('   ') || '<span class="y">not run</span>';
    return `<div><span class="d">${pad2(i + 1)}</span> ${esc(fit(it.title, 46))}  ${res}${it.mode === 'battle' ? (it.vote ? ' <span class="d">· voted</span>' : ' <span class="c">· to vote</span>') : ''}</div>`;
  }
  function stepLines(steps, t0) {
    return steps.map((x) => { const col = x.kind === 'error' ? 'r' : x.kind === 'bash' ? 'c' : x.kind === 'edit' ? 'p' : x.kind === 'ask' ? 'y' : x.kind === 'tries' ? 'w' : '';
      return `<div><span class="d">${mmss(Math.max(0, x.t - t0)).padStart(5)}</span>  <span class="${col}">${esc(String(x.label).padEnd(7))}</span> ${esc(x.arg)}</div>${(x.out ?? []).map((l) => `<div class="${/^\+ /.test(l) ? 'add' : /^- /.test(l) ? 'del' : 'd'}">          ${esc(l)}</div>`).join('')}${x.err ? `<div class="r">          ${esc(x.err)}</div>` : ''}`; }).join('');
  }
  function liveTest(it) {
    const r = S.st.running, det = S.m[r?.match ?? it.match];
    if (!det) return `<div class="y">${esc(r?.waiting ?? 'Getting the memory ready…')}</div>`;
    let out = '';
    for (const side of det.mode === 'solo' ? ['A'] : ['A', 'B']) {
      const name = det.mode === 'solo' ? fullName(det.order?.A ?? r?.who) : `Model ${side}`;
      const live = det.live && det.live.side === side ? det.live : null, done = det.runs?.[side];
      if (!live && !done) { out += `<div class="d">${esc(name)} · waits its turn</div>`; continue; }
      out += `<div class="${side === 'A' ? 'c' : 'y'}">${esc(name)}</div>`;
      if (live) {
        const ev = live.events ?? [], loadedT = ev.find((e) => e.type === 'note' && e.text === 'loaded')?.t ?? null;
        for (const e of ev) {
          if (e.type === 'note') out += `<div class="d">       ${esc(e.text === 'loaded' ? 'loaded: the clock starts' : e.text)}</div>`;
          else if (e.type === 'asked') out += `<div class="y">       asked: ${esc(e.text)}</div><div class="d">          → ${esc(e.reply ?? 'nothing written for this: it decides by itself')}</div>`;
          else if (e.type === 'step') out += stepLines([e], loadedT ?? 0);
        }
        const clock = loadedT == null ? 0 : Math.max(0, (Date.now() - live.startedAt) / 1000 - loadedT);
        out += `<div class="d cur">${loadedT == null ? '       loading the model' : `${mmss(clock).padStart(5)}  working`}</div>`;
      } else if (done.skipped) out += '<div class="y">       not run: it was stopped first</div>';
      else { const v = verdict(done); out += `${stepLines(done.steps ?? [], 0)}<div><span class="d">${mmss(done.secs ?? 0).padStart(5)}</span>  <span class="${vcls(v)}">${esc(v.text)}</span> <span class="d">· ${done.stepCount ?? 0} steps</span></div>`; }
    }
    return out;
  }
  function liveCheck(it) {
    const live = S.jobs[it.test]?.live;
    if (!live || live.status === 'waiting') return `<div class="y">${esc(live?.waiting ?? S.st.running?.waiting ?? 'Getting the memory ready…')}</div>`;
    return `${(live.lines ?? []).slice(-300).map(outLine).join('')}<div class="d cur"></div>`;
  }
  function termHtml(B, cur) {
    const out = [`<div class="hd">── ${esc(B.name)} · ${esc(batchHow(B))} · ${B.count} to run ──</div>`];
    B.items.forEach((it, i) => { if (it.state === 'done') out.push(doneLine(it, i)); else if (it.state === 'left') out.push(`<div class="d">${pad2(i + 1)} ${esc(fit(it.title, 46))}  not run: the line was cleared</div>`); });
    if (cur) out.push('<div> </div>', `<div class="hd">── ${pad2(B.items.indexOf(cur) + 1)} · ${esc(cur.title)} ──</div>`, cur.kind === 'check' ? liveCheck(cur) : liveTest(cur));
    else if (B.status === 'done' || B.status === 'stopped') out.push('<div> </div>', `<div class="hd">── ${B.status === 'stopped' ? 'stopped' : 'done'} · ${B.passed} of ${B.done} passed · ${dur(B.items.reduce((n, it) => n + itemSecs(it), 0) || 1)} ──</div>`);
    else out.push(`<div class="d">${B.status === 'paused' ? 'paused: ▶ Resume goes on with what is left' : 'waiting for its turn…'}</div>`);
    return out.join('');
  }
  function leftWords(B) {
    const ws = B.items.filter((x) => x.state === 'waiting');
    if (!ws.length) return '';
    let secs = 0, unknown = 0;
    for (const it of ws) for (const m of it.who === 'both' ? (it.vs ?? S.st.pair) : [it.who]) { const x = it.kind === 'check' ? checkById(it.test)?.last?.[m ?? 'none']?.secs : testById(it.test)?.last?.[m]?.secs; if (x) secs += x; else unknown += 1; }
    return secs ? `about ${dur(secs)} left${unknown ? ` + ${unknown} not timed` : ''}` : `${ws.length} waiting`;
  }
  function runHtml() {
    const B = S.bat[runBatchId()], r = S.st.running, q = S.st.line;
    lanesShown = null;
    if (!B) return `<div class="empty"><h2>Nothing has run yet</h2><div class="none">Pick a test, or a group of them, in Step 2 and press ▶ Run. What it does shows here, live: every step, every command and what it printed.</div><div><button type="button" class="btn pri" data-go="2">‹ Pick tests</button></div></div>`;
    const cur = B.items.find((x) => x.state === 'running');
    const cells = B.items.map((it, i) => { const m = itemMark(it); return `<span class="cell ${m.cls}" data-tip="${esc(`${i + 1} · ${it.title}: ${m.words}`)}">${m.sym}</span>`; }).join('');
    const bad = notPassed(B).length, spent = B.items.reduce((n, it) => n + itemSecs(it), 0);
    let now;
    if (cur && r && r.batch === B.id) {
      const who = r.kind === 'check' ? (r.who ? nameOf(r.who) : 'no model') : r.who === 'both' ? (r.side ? `Model ${r.side}, run ${r.side === 'A' ? 1 : 2} of 2` : 'a battle') : nameOf(r.who);
      const head = `<div class="rrw"><span class="lbl">Now</span><span class="now">${r.waiting ? `<span class="live">${esc(r.waiting)}</span>` : '<span class="live">Running</span>'} <b>${esc(cur.title)}</b> · ${esc(who)}${r.think ? ' · High' : ''}</span><span class="rt">${esc(leftWords(B))}</span></div>`;
      const det = r.kind === 'test' ? S.m[r.match] : null;
      if (det) { lanesShown = battleLanes(det).ls; now = `${head}<div class="rrw"><span></span><svg class="tlsvg" id="tl3" height="74" role="img" aria-label="The run on one clock"></svg><span class="rt"><span data-since="${r.sideStartedAt ?? r.startedAt}"></span></span></div><div class="rrw"><span></span>${keyHtml()}<span></span></div>`; }

  // ---------- Step 4: the group's results, one opened in full, the earlier groups ----------

      <div class="cards">${cards}</div>
      <div class="main"><div class="box rtab">${head}<div class="scroll" data-scroll="res">${rows}</div></div><div class="box detail">${detailHtml(B)}</div></div>`;
  }
  function back4Html() { const B = S.bat[resBatchId()], it = B?.items.find((x) => x.key === S.open4); return `<button type="button" class="btn" data-act="back4">‹ All results</button><span>${esc(B?.name ?? '')}${it ? ` · ${B.items.indexOf(it) + 1} of ${B.count}` : ''}</span>`; }
  function openFull(key) {

  }
  // Into the line, as one group (its name: what you picked, in words). The runner's answer, or null.
  async function addLine(items, name) {
    S.err = ''; S.sending = true; draw();
    try { const r = await api('/api/line', { items, ...(name ? { name } : {}) }); toast(r.added > 1 ? `${r.added} in the line, one at a time.` : 'In the line. It starts when the memory is free.'); if (r.batch) ui.batch = r.batch; save(); return r; }
    catch (e) { S.err = `${e.message[0].toUpperCase()}${e.message.slice(1)}.`; toast(S.err, true); return null; }

  }

  // ---------- The title row of a test ----------
  const CHECKS = { tests: { label: 'The tests pass' }, 'only-named': { label: 'Nothing else changed' }, 'file-has': { label: 'A file says' }, 'answer-has': { label: 'The answer mentions' }, 'no-change': { label: 'No file was changed' }, saved: { label: 'The file is saved' }, 'scripts-valid': { label: 'Its scripts are valid' }, offline: { label: 'Nothing from the internet' }, 'page-has': { label: 'The page has' } };
  const rulesOf = (t) => [...(t.hasScript && !t.noScript ? t.rules ?? [] : []), ...(t.checks ?? []).map((c) => c.label ?? `${CHECKS[c.type]?.label ?? c.type}${c.value ? `: ${c.value}` : ''}`)];
  // The checks the Test builder adds (a test made there keeps them when it is edited here).
  const MORE_CHECKS = { 'page-made': 'A page was made', count: 'The page has at least', drawn: 'It draws the bar or line', layout: 'The layout is clean' };
  const runWord = () => (isVs(whoNow()) ? 'Battle' : `Run on ${nameOf(whoNow())}`);
  function titleRow(t, extra = '') {
    const qi = lineAt('test', t.id), isRun = runningIs('test', t.id);

  }
  // Every run of this test that may be named, to show or to put beside the one shown.
  const runWords = (r) => `${r.mode === 'battle' ? 'in a battle' : 'alone'} · ${r.think ? 'High' : 'Low'}${r.settings ? ' · own settings' : ''}`;
  function runsMenu(t) {
    const rs = S.runs[t.id] ?? [];
    const row = (r) => `<div class="rrow"><span><b>${esc(nameOf(r.model))}</b> ${markOf(r)} <span class="d">${mmss(r.secs)} · ${when(r.at)} · ${runWords(r)}</span></span><button class="btn" data-act="show" data-match="${esc(r.match)}" data-side="${r.side}">Show</button><button class="btn" data-act="beside" data-match="${esc(r.match)}" data-side="${r.side}">Beside</button></div>`;
    return `<div class="runsm" role="menu"><div class="rh">Every run of this test · Show one, or put one beside it</div><div class="scroll">${t.toVote ? `<div class="rrow"><span><b>A battle</b> <span class="d">waiting for your vote · the names stay hidden</span></span><button class="btn" data-act="showmatch" data-match="${esc(t.toVote)}">Show</button><span></span></div>` : ''}${rs.map(row).join('') || (t.toVote ? '' : '<div class="rrow"><span class="d">No run to name yet.</span></div>')}</div>
      <div class="lm-f"><button class="btn" data-act="latest"${S.view[t.id] || S.cmp[t.id] ? '' : ' disabled'}>Back to the latest run</button><span class="lm-key">a battle’s runs are listed once you voted</span></div></div>`;
  }

  // ---------- The clock: one or two runs on one axis (drawn at the box's real width) ----------
  // Where a run stops: a battle at 10 minutes; a test on one model at its own time (a test of yours: its level's).
  // LIM is the limit of the runs on the clock now (the longest of them), set when they are drawn.
  let LIM = 600;
  const LIMIT = () => LIM;
  const limitOf = (det, run) => det?.limit ?? run?.limitSecs ?? S.st?.limit ?? 600;
  const setLimit = (ls) => { LIM = Math.max(...ls.map((l) => limitOf(l.det, l.run))); };
  const minsOf = (secs) => `${Math.round(secs / 60)} min`;
  const NICE = [15, 20, 30, 45, 60, 90, 120, 150, 180, 240, 300, 360, 420, 480, 540, 600, 660, 720];
  function axisEnd(rs) {
    const mx = Math.max(10, ...rs.map(fin));
    const want = mx >= LIMIT() * 0.75 ? Math.max(LIMIT(), mx) * 1.02 : mx * 1.1;
    return NICE.find((n) => n >= want) ?? Math.ceil(want / 60) * 60;
  }
  const tickStep = (end) => [5, 10, 15, 30, 60, 120].find((s) => end / s <= 10) ?? 120;
  function segments(r) {
    const out = []; let prev = 0;
    r.steps.forEach((s, i) => { out.push({ x0: prev, x1: s.t, kind: s.kind, i, s }); prev = Math.max(prev, s.t); });
    const end = fin(r);
    if (end > prev) out.push({ x0: prev, x1: end, kind: r.running ? 'now' : 'answer', i: -1 });
    return out;
  }
  function bandMarkup(r, slot, end, W, y, h, L, R) {
    const X = (s) => L + (Math.min(s, end) / end) * (W - L - R);
    let g = `<rect x="${L}" y="${y}" width="${W - L - R}" height="${h}" rx="5" style="fill:var(--panel)"/>`;
    if (r.pending || r.skipped || (r.running && r.loading)) return `${g}<text x="${L + 10}" y="${y + h / 2 + 4}" style="fill:var(--ink3);font-size:12px">${r.pending ? 'waits its turn' : r.skipped ? 'not run: it was stopped' : 'loading the model…'}</text>`;
    for (const sg of segments(r)) {
      const x0 = X(sg.x0), w = Math.max(2.5, X(sg.x1) - x0);
      if (sg.kind === 'now') { g += `<rect x="${x0}" y="${y}" width="${w}" height="${h}" rx="3" style="fill:var(--${slot === 'A' ? 'a' : 'b'});opacity:.25"><animate attributeName="opacity" values=".35;.12;.35" dur="1.4s" repeatCount="indefinite"/></rect>`; continue; }
      const last = r.stopped ? 'Still working when you stopped it' : r.overLimit ? `Still working at the ${r.limitSecs ? Math.round(r.limitSecs / 60) : 10} minutes` : 'Writing its answer';
      const tipTxt = sg.i >= 0 ? `${mmss(sg.s.t)}|${sg.s.label} ${sg.s.arg}|${sg.s.err || ''}|${mmss(sg.x1 - sg.x0)} to reach it` : `${mmss(sg.x1)}|${last}||${mmss(sg.x1 - sg.x0)}`;
      g += `<rect class="seg" x="${x0}" y="${y}" width="${w}" height="${h}" rx="3" style="fill:var(--k-${sg.kind})" data-step="${sg.i}" data-slot="${slot}" data-steptip="${esc(tipTxt)}"/>`;
      if (w > 64 && sg.i >= 0) g += `<text x="${x0 + 6}" y="${y + h / 2 + 4}" style="fill:var(--t-${sg.kind});font-size:11px;font-weight:600;pointer-events:none">${esc((w > 150 ? `${sg.s.label} ${sg.s.arg}` : sg.s.label).slice(0, Math.floor(w / 7)))}</text>`;
    }
    const fx = X(fin(r)), v = verdict(r);
    if (!r.running) g += `<circle cx="${fx}" cy="${y + h / 2}" r="10" style="fill:var(--${v.cls === 'ok' ? 'ok' : v.cls === 'bad' ? 'bad' : v.cls === 'warn' ? 'warn' : 'ink3'});stroke:var(--surface);stroke-width:2"/><text x="${fx}" y="${y + h / 2 + 4}" text-anchor="middle" style="fill:#fff;font-size:11px;font-weight:800">${v.sym}</text>`;
    const label = r.running ? `${mmss(r.clock)} …` : human(r.secs ?? 0);
    const right = fx + 16 + label.length * 7 > W;
    g += `<text x="${right ? fx - 16 : fx + 16}" y="${y + h / 2 + 4}" text-anchor="${right ? 'end' : 'start'}" style="fill:var(--ink);font-weight:650;font-size:12px">${label}</text>`;
    return g;
  }
  function axisMarkup(end, W, y0, y1, L, R, labels) {
    const X = (s) => L + (Math.min(s, end) / end) * (W - L - R);
    const stp = tickStep(end); let g = '';
    for (let s = 0; s <= end + 0.01; s += stp) { const x = X(s); g += `<line x1="${x}" x2="${x}" y1="${y0}" y2="${y1}" style="stroke:var(--line)"/><text x="${x}" y="${labels}" text-anchor="${s === 0 ? 'start' : 'middle'}">${mmss(s)}</text>`; }
    if (end >= LIMIT()) { const x = X(LIMIT()); g += `<line x1="${x}" x2="${x}" y1="${y0 - 6}" y2="${y1}" style="stroke:var(--warn);stroke-width:2" stroke-dasharray="4 3"/><text x="${x - 4}" y="${y0 - 8}" text-anchor="end" style="fill:var(--warn);font-weight:650">${mmss(LIMIT())} stop</text>`; }
    return g;
  }
  function deltaLine(ls) {
    if (ls.length < 2) return ls[0].run.running ? 'still running' : '';

    if (A.running || B.running || A.pending || B.pending) return 'still running';
    if (!clean(A) || !clean(B)) return 'one run did not finish, so there is no "faster"';
    const d = Math.abs(A.secs - B.secs);

      // The form (in the New test and Edit tests windows)
      if (act === 'kind') { keepForm(); F.kind = el.dataset.v; drawForm(); }
      if (act === 'example') { const [, p] = EXAMPLES[Number(el.dataset.i)]; F.prompt = p; F.kind = null; F.nameTouched = false; F.rows = null; drawForm(); const ta = $('#f-prompt'); ta.focus(); ta.setSelectionRange(p.length, p.length); }
      if (act === 'check' && !e.target.closest('input')) { keepForm(); const r = rowsNow()[Number(el.dataset.i)]; r.on = !r.on; drawForm(); }
      if (act === 'script') { keepForm(); F.useScript = !F.useScript; drawForm(); }
      if (act === 'rmfile') { keepForm(); F.removed.push(el.dataset.path); drawForm(); }
      if (act === 'rmnew') { keepForm(); F.files = F.files.filter((f) => f.path !== el.dataset.path); drawForm(); }
      if (act === 'undorm') { keepForm(); F.removed = []; drawForm(); }
      if (act === 'save' || act === 'saverun') await saveForm(act === 'saverun');
      if (act === 'delete') {
        if (!confirm('Delete this test? It moves to the arena\'s trash folder; its results are kept.')) return;
        const list = listOrder(); const i = list.findIndex((t) => t.id === F.id); const next = list[i + 1] ?? list[i - 1];
        await api('/api/tests/delete', { id: F.id }); toast('Deleted (kept in ~/.agentic-coder/battle/trash).');
        ui.ticked = ui.ticked.filter((k) => k !== `test:${F.id}`);
        if (sel().kind === 'test' && sel().id === F.id) ui.sel = null;
        save();
        await poll(true);
        if (S.modal && next) { loadForm(testById(next.id)); drawModal(); } else { S.modal = false; F = null; drawModal(); drawMain(true); }
      }
      if (act === 'mclose') closeModal();
      if (act === 'mpick') modalGo(el.dataset.id);
      if (act === 'mprev' || act === 'mnext') { const list = listOrder(); const i = list.findIndex((t) => t.id === F.id); modalGo(list[i + (act === 'mnext' ? 1 : -1)]?.id); }
      if (act === 'mreset') { if (confirm('Put back the original test? Your edited copy moves to the arena\'s trash folder.')) { await api('/api/tests/reset', { id: F.id }); await poll(true); loadForm(testById(F.id)); drawModal(); toast('The original is back.'); } }
    } catch (err) { toast(err.message, true); }
  });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'find') { S.find = e.target.value.trim().toLowerCase(); put($('#list'), listHtml()); fades(); return; }
    if (!F || !e.target.closest('#modal')) return;
    const root = modalEl;
    if (e.target.id === 'f-prompt') { F.prompt = e.target.value; const n = $('#f-name', root); if (n && !F.nameTouched) n.value = nameFrom(F.prompt); if (!F.kind) { const g = guessKind(F.prompt); for (const p of root.querySelectorAll('.pill[data-act="kind"]')) p.setAttribute('aria-pressed', String(p.dataset.v === g)); if (F.rowsKind !== g) { const pos = e.target.selectionStart; drawForm(); const ta = $('#f-prompt', root); ta.focus(); ta.setSelectionRange(pos, pos); } } }
    if (e.target.id === 'f-name') { F.name = e.target.value; F.nameTouched = Boolean(e.target.value.trim()); }
    if (e.target.id === 'f-ask') F.ask = e.target.value;
    if (e.target.dataset.val != null) rowsNow()[Number(e.target.dataset.val)].val = e.target.value;
    // The window's title and "not saved yet" follow what you type.
    if (S.modal) { const h = $('.mtitle h3', modalEl); if (h) h.textContent = (F.nameTouched ? F.name : nameFrom(F.prompt)) || 'Untitled test'; const u = $('.mtitle .unsaved', modalEl); if (dirty() && !u) $('.mtitle h3', modalEl).insertAdjacentHTML('afterend', '<span class="chip unsaved">not saved yet</span>'); if (!dirty() && u) u.remove(); }
  });
  document.addEventListener('change', (e) => { const i = e.target.closest('input[data-pick]'); if (!i || !F) return; keepForm(); addFiles([...i.files].map((f) => ({ path: i.dataset.pick === 'dir' ? f.webkitRelativePath || f.name : f.name, file: f }))); drawForm(); });
  document.addEventListener('dragover', (e) => { const d = e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
  document.addEventListener('dragleave', (e) => { const d = e.target.closest('#drop'); if (d) d.classList.remove('over'); });
  document.addEventListener('drop', async (e) => {
    const d = e.target.closest('#drop'); if (!d || !F) return; e.preventDefault(); d.classList.remove('over'); keepForm();
    const out = [];
    const items = [...(e.dataTransfer.items ?? [])].map((it) => it.webkitGetAsEntry?.()).filter(Boolean);
    if (items.length) for (const en of items) await walkEntry(en, '', out); else for (const f of e.dataTransfer.files) out.push({ path: f.name, file: f });
    addFiles(out); drawForm();
  });
  document.addEventListener('scroll', (e) => { if (e.target.classList?.contains('scroll')) fades(); }, true);
  document.addEventListener('keydown', (e) => {
    if (S.modal && (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveForm(false); return; }
    if (e.key === 'Escape' && (S.menu || S.runsOpen || S.hmenu)) { S.menu = false; S.runsOpen = false; S.hmenu = false; draw(); drawMain(true); return; }
    if (e.key === 'Escape' && S.modal) { closeModal(); return; }
    if (e.key === 'Escape' && S.rec) { S.rec = false; drawOver(); return; }
    if (e.key === 'Escape' && S.full != null) { S.full = null; drawMain(true); return; }
    if (e.key === '/' && !S.modal && !S.rec && !e.target.closest?.('input, textarea, select')) { e.preventDefault(); if (stepNow() !== 2) go(2); $('#find')?.focus(); return; }
    // The panel's keys (Step 1): ↑ ↓ picks a row, ← → changes it.
    if (S.modal || S.rec || !P() || stepNow() !== 1 || e.metaKey || e.ctrlKey || e.altKey || e.target.closest?.('input, textarea, select')) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') ui.row = Math.max(0, Math.min(panelRows().length - 1, ui.row + (e.key === 'ArrowDown' ? 1 : -1)));
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') moveRow(ui.row, e.key === 'ArrowRight' ? 1 : -1);
    else return;
    e.preventDefault(); save(); draw();
    $('#panel .pr[aria-selected="true"]')?.scrollIntoView({ block: 'nearest' });
  });
  // The record page's ▶ (the hub's own page, in the window over this one): that test, picked here.
  // The Test builder window (the hub's) saved or closed: read the tests again, so My tests shows what it holds now.
  addEventListener('message', (e) => {
    if (!HUB || e.origin !== HUB) return;
    if (e.data?.agentic === 'arena-refresh') { poll(true); return; }
    if (e.data?.agentic !== 'arena-pick') return;
    asked = { test: e.data.test, model: e.data.model ?? null, n: e.data.n ?? null, think: null, fresh: false }; S.rec = false; drawOver(); poll(true);
  });
  const setCompact = () => { const c = innerHeight < 780; if (c !== document.body.classList.contains('compact')) { document.body.classList.toggle('compact', c); if (S.st) drawMain(true); } };
  window.addEventListener('resize', () => { setCompact(); drawTimeline(); fades(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(true); });
  setCompact();
  setInterval(tickClocks, 1000);
  poll(true);
})();
</script>
