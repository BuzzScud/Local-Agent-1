<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic Coder</title>
<!-- The window's page (12 Oct 2026, design 2 as picked: the title bar with Chats · New · Remote | Loops | Help, the model
     in the middle, settings, the folder and search on the right; the bot header; the conversation; the live status line;
     the prompt between two lines; one compact row for the mode). It draws what the app sends (bridge.mjs through
     server.mjs) and sends keys and clicks back. What it has no view of its own for, it shows as the app draws it. -->
<style>
:root {
  --win: #161618; --raise: #1f1f22; --raise2: #29292d; --hair: rgba(255,255,255,.07); --hair2: rgba(255,255,255,.12);
  --text: #e8e8ea; --dim: #a0a0a7; --faint: #96969d; --label: #8c8c93;
  --accent: #5fafff; --accent-bg: rgba(95,175,255,.11); --accent-line: rgba(95,175,255,.5);
  --ok: #4fb59a; --bad: #ff6b6b; --sand: #e2c08d; --warn: #ffaf5f;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--win); color: var(--text); font: 13px/1.5 var(--mono); overflow: hidden; }
body { display: flex; flex-direction: column; }
button { font: inherit; color: inherit; }
/* the title bar: the Mac's own lights sit over its left end */
.tb { height: 52px; flex-shrink: 0; display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; padding: 0 14px 0 86px; border-bottom: 1px solid var(--hair); user-select: none; -webkit-user-select: none; }
.tb > div { display: flex; align-items: center; gap: 6px; min-width: 0; }
.tb .r { justify-content: flex-end; }
/* the model's pill stays in the middle; the usage pill sits to its right, so nothing moves when it comes or goes */
.tb .c { position: relative; overflow: visible; }
#uslot { position: absolute; left: 100%; top: 50%; transform: translateY(-50%); margin-left: 6px; display: flex; }
/* a narrow window: the buttons' words go before anything overlaps (fitBar), then the pills get shorter */
.tb.f1 .seg .tx, .tb.f1 .bb .k { display: none; } .tb.f1 .seg button { padding: 0 9px; }
.tb.f2 .l .tx { display: none; } .tb.f2 .l .bb { padding: 0 9px; }
.tb.f3 .upill .of, .tb.f3 .upill .fuel { display: none; }
.tb.f4 #pillname { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bb { height: 28px; border-radius: 8px; border: 1px solid var(--hair2); background: var(--raise); color: var(--dim); padding: 0 11px; display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font: 12.5px var(--sans) !important; white-space: nowrap; }
.bb:hover { color: var(--text); border-color: rgba(255,255,255,.2); }
.bb.on { color: var(--accent); border-color: var(--accent-line); background: var(--accent-bg); }
.bb .k { color: var(--faint); font: 11.5px var(--mono); }
.bb.sq { width: 30px; padding: 0; justify-content: center; }
.seg { display: inline-flex; background: var(--raise); border: 1px solid var(--hair2); border-radius: 8px; padding: 2px; height: 30px; }
.seg button { border: 0; background: transparent; padding: 0 11px; height: 24px; border-radius: 6px; color: var(--dim); font: 12.5px var(--sans); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.seg button:hover { color: var(--text); }
.pill { height: 28px; border-radius: 14px; border: 1px solid var(--accent-line); color: var(--accent); background: var(--accent-bg); padding: 0 12px; display: inline-flex; align-items: center; gap: 7px; font: 500 12.5px var(--sans); cursor: pointer; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; flex-shrink: 0; }
.dot.off { background: #55555c; } .dot.busy { background: var(--sand); }
/* the Claude API's usage, beside the model (12 Oct 2026): what is left of the month, as the terminal's footer said it */
.upill { height: 28px; border-radius: 14px; border: 1px solid var(--hair2); background: var(--raise); color: var(--dim); padding: 0 12px 0 10px; display: inline-flex; align-items: center; gap: 7px; font: 12.5px var(--sans); cursor: pointer; white-space: nowrap; }
.upill:hover, .upill.open { border-color: rgba(255,255,255,.22); color: var(--text); }
.upill b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.upill .of { color: var(--faint); font-variant-numeric: tabular-nums; }
.upill svg { flex-shrink: 0; }
.upill .sepv { width: 1px; height: 14px; background: var(--hair2); }
.upill b.warn { color: var(--warn); } .upill b.bad { color: var(--bad); }
.upill.free.warn, .upill.free.bad { color: var(--dim); }
.upill.warn { color: var(--warn); border-color: rgba(255,175,95,.4); background: rgba(255,175,95,.07); } .upill.warn b { color: var(--warn); }
.upill.bad { color: var(--bad); border-color: rgba(255,107,107,.45); background: rgba(255,107,107,.08); } .upill.bad b { color: var(--bad); }
.upill.warn:hover, .upill.warn.open { border-color: rgba(255,175,95,.7); } .upill.bad:hover, .upill.bad.open { border-color: rgba(255,107,107,.75); }
/* the fuel line: what is left of the cap from the left, then today's spend, then what went before today */
.fuel { position: relative; display: flex; height: 6px; border-radius: 3px; background: #2e2e33; overflow: hidden; flex-shrink: 0; }
.fuel i { display: block; height: 100%; flex-shrink: 0; }
.fuel .left.blue { background: linear-gradient(90deg, #005f87, #0087af 45%, #5fafff 85%, #87d7ff); }
.fuel .left.amber { background: linear-gradient(90deg, #875f00, #d78700 45%, #ffaf00 85%, #ffd75f); }
.fuel .left.red { background: linear-gradient(90deg, #5f0000, #af0000 45%, #ff5f5f 85%, #ff8787); }
.fuel .today { background: #8a6420; }
.fuel.live .left { position: relative; overflow: hidden; }
.fuel.live .left::after { content: ''; position: absolute; top: 0; bottom: 0; width: 40%; left: -40%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); animation: shine 1.6s linear infinite; }
@keyframes shine { to { left: 100%; } }
.ucard { position: absolute; top: 58px; left: 14px; width: min(600px, calc(100% - 28px)); background: #202023; border: 1px solid var(--hair2); border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.5); padding: 14px 16px 12px; z-index: 7; font: 12.5px/1.5 var(--mono); color: var(--dim); }
.ucard .hd { display: flex; align-items: baseline; gap: 8px; font: 600 13px var(--sans); color: var(--text); padding-bottom: 10px; border-bottom: 1px solid var(--hair); margin-bottom: 10px; }
.ucard .hd .m { color: var(--faint); font-weight: 400; } .ucard .hd .r { margin-left: auto; color: var(--faint); font: 12px var(--mono); }
.ucard .ln { display: flex; align-items: baseline; gap: 10px; min-height: 21px; }
.ucard .ln .lbl { width: 108px; flex-shrink: 0; } .ucard .ln .r { margin-left: auto; text-align: right; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.ucard .big { font: 600 20px var(--sans); color: var(--text); font-variant-numeric: tabular-nums; } .ucard .big.warn { color: var(--warn); } .ucard .big.bad { color: var(--bad); }
.ucard .v { color: var(--text); font-variant-numeric: tabular-nums; } .ucard .warn { color: var(--warn); } .ucard .bad { color: var(--bad); } .ucard .ok { color: var(--accent); }
.ucard .sec { margin-top: 12px; }
.ucard .meter { flex: 1; min-width: 60px; height: 4px; border-radius: 2px; background: #2e2e33; overflow: hidden; align-self: center; } .ucard .meter i { display: block; height: 100%; background: linear-gradient(90deg, #005f87, #5fafff); }
.ucard .key { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: 3px; margin-right: 5px; }
.ucard .src { color: var(--faint); font-size: 11.5px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--hair); }
.ucard .acts { display: flex; align-items: center; gap: 10px; margin-top: 10px; } .ucard .acts .k { color: var(--faint); font-size: 11.5px; }
/* the body */
.body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 22px; position: relative; }
.convo-wrap { flex: 1; min-height: 0; position: relative; }
.convo { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 16px 2px 14px; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 18px); scrollbar-width: none; }
.convo::-webkit-scrollbar { display: none; }
.hero { display: flex; align-items: center; gap: 16px; margin: 6px 0 14px; }
.hero .name { font: 700 16px var(--mono); }
.hero .name small { font: 400 13px var(--mono); color: var(--faint); margin-left: 6px; }
.hero .sub { color: var(--dim); }
.bot { image-rendering: pixelated; flex-shrink: 0; }
.you { margin: 16px -22px 10px; padding: 7px 22px; background: #2a2a2e; font: 14px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; display: flex; gap: 10px; }
.you .m { color: var(--dim); }
.you .cards { color: var(--faint); font-size: 12px; margin-top: 3px; }
.reply { font: 13px/1.6 var(--mono); color: #dcdce0; margin: 10px 0 8px 4px; max-width: 1060px; overflow-wrap: anywhere; }
.reply p { margin: 0 0 9px; } .reply ul, .reply ol { margin: 0 0 9px; padding-left: 22px; } .reply li { margin: 2px 0; }
.reply code { background: var(--raise2); border-radius: 4px; padding: 1px 5px; color: #e6e6ea; }
.reply pre { background: var(--raise); border: 1px solid var(--hair); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 0 0 9px; }
.reply b { color: #fff; } .reply h1, .reply h2, .reply h3 { font-size: 13px; margin: 12px 0 6px; color: #fff; }
.reply table { border-collapse: collapse; margin: 0 0 9px; } .reply td, .reply th { border: 1px solid var(--hair2); padding: 3px 8px; text-align: left; }
.writing { color: #cfcfd4; }
.trow { margin: 0 0 0 4px; border-left: 1px solid var(--hair); border-right: 1px solid var(--hair); background: var(--raise); }
.trow.first { border-top: 1px solid var(--hair); border-radius: 10px 10px 0 0; margin-top: 8px; }
.trow.firstonly { border-radius: 10px; border-bottom: 1px solid var(--hair); margin-bottom: 6px; }
.task { display: grid; grid-template-columns: 16px 104px minmax(0,1fr) auto; align-items: center; gap: 8px; padding: 7px 14px; cursor: pointer; }
.trow + .trow:not(.first) .task { border-top: 1px solid var(--hair); }
.task:hover { background: rgba(255,255,255,.025); }
.task .chev { width: 10px; height: 10px; display: inline-block; border-right: 1.6px solid var(--accent); border-bottom: 1.6px solid var(--accent); transform: rotate(-45deg) scale(.6); margin-left: 2px; }
.task .chev.open { transform: rotate(45deg) scale(.6); }
.task .tag { font: 600 11px var(--mono); letter-spacing: .12em; }
.task .w { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #d5d5da; }
.task .w.guess { color: var(--faint); }
.task .end { display: flex; gap: 12px; color: var(--faint); font-size: 12px; white-space: nowrap; }
.end .ok { color: var(--accent); } .end .bad { color: var(--bad); } .end .ed { color: #87d7ff; } .end .ask { color: #d78787; } .end .working { color: var(--accent); font-weight: 600; }
.rows { padding: 0 14px 8px 42px; }
.rowx { padding: 5px 0; border-top: 1px dashed var(--hair); cursor: pointer; display: flex; gap: 10px; }
.rowx:first-child { border-top: 0; }
.rowx .w { flex: 1; min-width: 0; color: #cfcfd4; } .rowx .w.guess { color: var(--faint); }
.rowx .n { color: var(--faint); font-size: 12px; white-space: nowrap; }
.steps { margin: 4px 0 6px 16px; }
.step { display: flex; gap: 8px; color: var(--dim); font-size: 12px; padding: 1px 0; }
.step .k { width: 74px; flex-shrink: 0; color: var(--faint); }
.step .a { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step.err .k, .step.err .e { color: var(--bad); }
.tend { margin: 0 0 6px 4px; border: 1px solid var(--hair); border-top: 1px solid var(--hair); border-radius: 0 0 10px 10px; background: rgba(0,0,0,.18); padding: 7px 14px; color: var(--faint); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
.tend .ok { color: var(--accent); } .tend .bad { color: var(--bad); }
.endline { margin: 4px 0 6px 4px; color: var(--faint); font-size: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.endline .mk { color: var(--accent); }
.made { margin: 6px 0 2px 4px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--faint); }
.made .f { background: var(--raise2); border-radius: 6px; padding: 1px 8px; color: #87d7ff; }
.note { margin: 6px 0 6px 4px; color: var(--faint); font-size: 12px; white-space: pre-wrap; }
.note.warn { color: var(--sand); } .note.error { color: var(--bad); } .note.ok { color: var(--accent); }
.divider { margin: 14px 0 8px; color: var(--faint); font-size: 12px; display: flex; align-items: center; gap: 10px; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--hair); }
.ansi { margin: 6px 0; white-space: pre; font: 12.5px/1.35 var(--mono); overflow-x: auto; }
.ansi div { min-height: 1.35em; }
.thinking { color: var(--faint); font-style: italic; margin: 8px 0 4px 4px; white-space: pre-wrap; }
/* The thinking as it streams (18 Oct 2026, the owner: "fix the thinking too, it moves the whole page"): a box of six
   lines whatever the text's length, its newest lines at the bottom and the older ones fading out at the top, so the
   page under and around it holds still. */
.thinking.live { height: 9em; line-height: 1.5; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; -webkit-mask-image: linear-gradient(to bottom, transparent, #000 2.2em); mask-image: linear-gradient(to bottom, transparent, #000 2.2em); }
.thinking.live > div { flex-shrink: 0; }
/* The thinking in a box (18 Oct 2026, the owner: "put thinking in a box, i can expand and collapse too?"): a header as
   a task row's, open with the newest lines at that fixed height, closed one row with the newest line. */
.trow.think { margin-bottom: 6px; }
.thinkbody { padding: 0 14px 8px 42px; }
.thinkbody .thinking.live { margin: 0; }
.thinking.live.said { font-style: normal; color: #cfcfd4; }
.running { color: var(--dim); margin: 6px 0 4px 4px; }
.back { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); border: 0; border-radius: 16px; padding: 6px 14px; background: var(--accent); color: #0b1a2b; font: 600 12.5px var(--sans); cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
.back[hidden] { display: none; }
#top.fill { min-height: 100%; display: flex; flex-direction: column; } #top.fill .home { flex: 1; }
/* the status line */
.status { display: flex; align-items: center; gap: 14px; padding: 9px 2px; color: var(--dim); font-size: 12.5px; white-space: nowrap; overflow: hidden; min-height: 38px; }
.status .v { color: var(--text); } .status .ac { color: var(--accent); font-weight: 600; } .status .r { margin-left: auto; color: var(--faint); }
.bar10 { display: inline-flex; gap: 2px; } .bar10 i { width: 9px; height: 5px; border-radius: 1px; background: #38383e; display: block; } .bar10 i.on { background: var(--accent); }
/* the prompt between two lines */
.prompt { border-top: 1px solid var(--hair2); border-bottom: 1px solid var(--hair2); display: flex; align-items: flex-start; gap: 12px; padding: 11px 2px; cursor: text; }
.prompt .m { color: var(--accent); font-weight: 700; }
.prompt .t { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; font: 14px/1.5 var(--mono); min-height: 21px; max-height: 40vh; overflow-y: auto; }
.prompt .t .ph { color: #5d5d64; }
.prompt .t .hint { color: var(--faint); }
.caret { display: inline-block; width: 8px; height: 17px; vertical-align: -3px; background: var(--accent); animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.prompt .hk { color: var(--faint); font: 600 11px var(--mono); letter-spacing: .1em; padding-top: 3px; }
.send { border: 1px solid var(--hair2); background: var(--raise2); color: var(--dim); border-radius: 8px; padding: 4px 14px; font: 500 13px var(--sans); cursor: pointer; }
.send.ready { background: var(--accent); border-color: var(--accent); color: #0b1a2b; }
.menu { border: 1px solid var(--hair2); background: #1c1c1f; border-radius: 10px; margin: 0 0 8px; max-height: 42vh; overflow-y: auto; padding: 4px; }
.menu .mi { display: flex; gap: 14px; padding: 4px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.menu .mi .l { color: var(--text); min-width: 160px; } .menu .mi .d { color: var(--faint); overflow: hidden; text-overflow: ellipsis; }
.menu .mi.on { background: var(--accent-bg); } .menu .mi.on .l { color: var(--accent); }
.modes { display: flex; align-items: center; gap: 10px; padding: 9px 2px 12px; font-size: 12.5px; color: var(--faint); white-space: nowrap; overflow: hidden; }
.modes .sep { color: #45454b; } .modes .sp { flex: 1; min-width: 6px; } .modes .bad { color: var(--bad); }
/* a narrow window (fitModes): "shift+tab" goes first, then the model's name ends in … (the loops' words a little
   too); the folder keeps its name (22 letters at most), and the mode and its chips always show whole */
.modes > span, .modes .chips { flex-shrink: 0; }
.modes .mn, .modes .mf, .modes .lb { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.modes .mn { flex-shrink: 6; min-width: 48px; } .modes .mf { max-width: 22ch; } .modes .lb { flex-shrink: 1; } .modes.tight .hk2 { display: none; }
.chips { display: flex; gap: 4px; }
.chip { border: 1px solid transparent; background: var(--raise2); color: var(--dim); border-radius: 7px; padding: 2px 9px; cursor: pointer; font: 12px var(--mono); }
.chip.on { border-color: var(--accent-line); background: var(--accent-bg); color: var(--accent); }
.chip.on.bypass { border-color: rgba(255,107,107,.55); background: rgba(255,107,107,.1); color: var(--bad); }
/* a question: a card in the prompt's place */
.perm { border: 1px solid var(--accent-line); border-radius: 12px; background: #1b1d22; padding: 14px 16px; margin: 8px 0 10px; }
.perm .h { font: 600 13px var(--sans); color: #afafff; margin-bottom: 8px; }
.perm .what { font: 13px var(--mono); white-space: pre-wrap; word-break: break-word; margin-bottom: 8px; color: var(--text); }
.perm .q { font: 14px/1.5 var(--sans); white-space: pre-wrap; word-break: break-word; margin-bottom: 10px; color: var(--text); }
.perm .diff { font: 12px/1.45 var(--mono); background: var(--win); border: 1px solid var(--hair); border-radius: 8px; padding: 6px 0; max-height: 34vh; overflow: auto; margin-bottom: 10px; }
.perm .diff div { padding: 0 10px; white-space: pre; } .perm .diff .add { background: rgba(0,95,135,.35); } .perm .diff .del { background: rgba(95,0,0,.45); } .perm .diff .n { color: var(--faint); display: inline-block; width: 42px; }
.perm .opt { display: flex; gap: 8px; padding: 5px 8px; border-radius: 7px; cursor: pointer; } .perm .opt:hover { background: rgba(255,255,255,.04); }
.perm .opt.on { background: var(--accent-bg); color: var(--accent); }
.perm .foot { color: var(--faint); font-size: 12px; margin-top: 8px; }
.panel { border: 1px solid var(--hair2); border-radius: 12px; background: #19191c; padding: 8px 10px; margin: 8px 0 10px; max-height: 62vh; overflow: auto; }
/* a choice in a list the app draws (/model, /remote, /settings…): a click picks it, a click on the picked one opens it */
.panel .pi { cursor: pointer; border-radius: 4px; }
.panel .pi:hover { background: rgba(255,255,255,.06); }
.full { position: absolute; inset: 0; background: var(--win); overflow: auto; padding: 12px 22px; z-index: 3; }
/* home: a new conversation */
.home { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 100%; text-align: center; padding: 20px 0; }
.home .ttl { font: 600 20px var(--sans); } .home .sub { color: var(--dim); }
.lbl { font: 600 11px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--label); }
.pick { display: grid; grid-template-columns: repeat(3, minmax(0, 250px)); gap: 10px; margin-top: 10px; }
.card { background: var(--raise); border: 1px solid var(--hair); border-radius: 10px; padding: 11px 14px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.card:hover { border-color: var(--accent-line); }
.card .val { font: 13px/1.4 var(--sans); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* side bar, drop-downs, toasts */
.side { position: absolute; top: 52px; bottom: 0; left: 0; width: 330px; background: #202023; border-right: 1px solid var(--hair2); box-shadow: 18px 0 40px rgba(0,0,0,.35); transform: translateX(-104%); transition: transform .18s ease; display: flex; flex-direction: column; z-index: 6; }
.side.open { transform: none; }
.side .in { flex: 1; overflow-y: auto; padding: 16px; }
.sect { display: flex; align-items: baseline; gap: 10px; padding: 14px 2px 8px; border-bottom: 1px solid var(--hair); margin-bottom: 4px; }
.sect:first-child { padding-top: 0; } .sect .r { margin-left: auto; color: var(--faint); font-size: 12px; }
.row { display: flex; gap: 10px; padding: 6px 8px; border-radius: 8px; cursor: pointer; align-items: baseline; }
.row:hover { background: var(--raise2); }
.row.static { cursor: default; } .row.static:hover { background: transparent; }

  const r = p.getBoundingClientRect(), w = c.offsetWidth;
  c.style.left = Math.max(14, Math.min(innerWidth - 14 - w, r.left + r.width / 2 - w / 2)) + 'px';
}

// Drawing in parts (15 Oct 2026, the window audit: each state rebuilt the whole conversation, 17 ms a redraw on 1,050
// items while an answer streamed, and a selection in an earlier answer was lost at every word). Now each item keeps its
// own element while it is the same, and each other part (the answer under way, the status line, the prompt, the mode
// row) is written only when its own text changed. frame: which body is up ('main', 'screen' before the app draws as
// data, 'gone' once it quit); parts: the text last written into each part; drawn: each item's element and what made it.
let frame = null;
const parts = {};
const drawn = new Map();
let rowsVer = 0; // a step row opened or closed (openRows): the task rows are drawn again
function put(id, html) {
  if (parts[id] === html) return false;
  parts[id] = html;
  const el = document.getElementById(id);
  if (el) el.innerHTML = html;
  return true;
}
function frameOf(kind, html) {
  if (frame === kind && kind !== 'main') { if (put('frame', html)) body.innerHTML = html; return; }
  frame = kind;
  for (const k of Object.keys(parts)) delete parts[k];
  drawn.clear();
  if (kind !== 'main') { parts.frame = html; body.innerHTML = html; return; }
  body.innerHTML = '<div class="convo-wrap"><div class="convo" id="convo"><div id="top"></div><div id="items"></div><div id="live"></div></div>'
    + '<button class="back" id="back" data-act="latest" hidden>Jump to the latest</button></div>'
    + '<div class="status" id="status"></div><div id="bottom"></div><div id="modes"></div><div id="full"></div>';
  document.getElementById('convo').addEventListener('scroll', backButton, { passive: true });
}
// The items in order, each element made again only when its item (or what sits beside it, which decides a task row's
// corners) changed; the ones kept are left alone, so what you selected in them stays selected.
function itemsInto(list, box) {
  const seen = new Set();
  let at = box.firstChild;
  list.forEach((v, i) => {
    const prev = list[i - 1], next = list[i + 1];
    const ctx = (prev?.t ?? '') + '|' + (next?.t ?? '') + '|' + (v.t === 'taskrun' ? rowsVer : '');
    let d = drawn.get(v.key);
    if (!d || d.v !== v || d.ctx !== ctx) {
      const html = itemHtml(v, prev, next);
      if (!d || d.html !== html) {
        const tpl = document.createElement('template');
        tpl.innerHTML = html;
        const el = tpl.content.firstElementChild ?? document.createElement('span');
        if (d?.el === at) at = at.nextSibling;
        d?.el.remove();
        d = { el };
      }
      Object.assign(d, { v, ctx, html });
      drawn.set(v.key, d);
    }
    seen.add(v.key);
    if (d.el === at) at = at.nextSibling; else box.insertBefore(d.el, at);
  });
  while (at) { const n = at.nextSibling; at.remove(); at = n; }
  for (const k of drawn.keys()) if (!seen.has(k)) drawn.delete(k);
}
const atEnd = (c) => !c || c.scrollHeight - c.scrollTop - c.clientHeight < 40;
// Scrolled up from the newest: a button back to it (the conversation stops following then).
function backButton() { const b = document.getElementById('back'); if (b) b.hidden = atEnd(document.getElementById('convo')); }
function render() {
  if (S.gone) return frameOf('gone', '<div class="gone">Agentic Coder has quit. Close this window, or run coding again.</div>');
  const st = S.last;
  const pn = document.getElementById('pillname'), name = st?.modelName || 'Agentic Coder';
  if (pn.textContent !== name) { pn.textContent = name; pn.parentElement.title = name; fitBar(); }
  const dot = modelNow(st).dot;
  document.getElementById('pilldot').className = 'dot' + (dot ? ' ' + dot : '');
  document.getElementById('folderbtn').title = S.folder;
  renderUsage(st);
  if (S.usageCard || S.find) renderDrops();
  if (S.side) renderSide();
  // Before the app draws as data (the folder question, the safety check): its own screen, as drawn.
  if (!st) return frameOf('screen', '<div class="screen">' + (S.screen ? runsHtml(S.screen.rows) : '<span style="color:var(--faint)">Starting Agentic Coder…</span>') + '</div>');
  if (frame !== 'main') frameOf('main');
  const c = document.getElementById('convo');
  const follow = atEnd(c);
  const all = S.order.map((k) => S.items[k]).filter(Boolean);
  const home = st.hold && !all.some((v) => v.t === 'user');
  const top = document.getElementById('top');
  top.className = home ? 'fill' : '';
  put('top', home ? homeHtml(st) : '<div class="hero">' + bot(st.live?.phase === 'working' ? 'work' : 'ready', 56) + '<div><div class="name">Agentic Coder<small>v0.1</small></div><div class="sub">' + esc(st.modelName) + ' · ' + esc(st.mode === 'bypass' ? 'bypass permissions' : st.mode) + '</div><div class="sub">' + esc(st.cwdShort) + '</div></div></div>');
  itemsInto(home ? [] : all, document.getElementById('items'));
  put('live', !home && st.live?.phase === 'working' ? liveHtml(st.live, st.held) : '');
  put('status', statusHtml(st.live || {}));
  const bottomChanged = put('bottom', st.perm ? permHtml(st.perm) : st.panel ? panelHtml(st.panel.rows) : menuHtml(st.menu) + promptHtml(st));
  if (put('modes', modesHtml(st))) fitModes();
  put('full', st.full ? '<div class="full ansi">' + runsHtml(st.full.rows) + '</div>' : '');
  if (follow) c.scrollTop = c.scrollHeight;
  backButton();
  if (bottomChanged) document.getElementById('menu')?.querySelector('.on')?.scrollIntoView({ block: 'nearest' });
}
setInterval(() => { if (S.last?.live?.phase === 'working' && frame === 'main') put('status', statusHtml(S.last.live)); }, 250);

// A search box drawn again keeps its caret (15 Oct 2026, the window audit: the box was made anew at each letter with its
// caret at the start, so "tax" came out "xat" and found nothing). focus: put the caret in it even if it was elsewhere.
function keepField(id, draw, focus) {
  const old = document.getElementById(id);
  const had = old && document.activeElement === old ? [old.selectionStart, old.selectionEnd] : null;
  draw();
  const el = document.getElementById(id);
  if (!el || !(had || focus)) return;
  el.focus();
  const end = el.value.length;
  el.setSelectionRange(had ? had[0] : end, had ? had[1] : end);
}
// The side bar and the drop-downs follow the app while they are open (its files and to-dos), drawn only when changed.
let sideHtml = '', dropsHtml = '';
function renderSide() {
  // Closed, it is out of reach of Tab too (inert), not only out of sight.
  side.inert = !S.side;
  if (!S.side) { side.classList.remove('open'); sideHtml = ''; return; }
  side.classList.add('open');
  const q = S.q.trim().toLowerCase();
  const chats = (S.sessions ?? []).filter((c) => !q || String(c.title).toLowerCase().includes(q));
  const files = S.last?.files ?? [], todos = S.last?.todos ?? [];
  const done = todos.filter((t) => t.status === 'done' || t.status === 'completed').length;
  // Only a conversation opens on a click; the files and to-dos are lists to read (row static: no hand, no hover).
  const h = '<div class="in"><div class="search">' + I.search + '<input id="sq" placeholder="Search conversations" value="' + esc(S.q) + '"></div>'
    + '<div class="sect"><span class="lbl">Conversations</span><span class="r">' + chats.length + '</span></div>' + (chats.length ? chats.map((c) => '<div class="row" tabindex="0" role="button" data-resume="' + esc(c.id) + '"><span class="t">' + esc(c.title) + '</span><span class="a">' + esc(ago(c.updated)) + '</span></div>').join('') : '<div class="row static"><span class="t" style="color:var(--faint)">' + (S.sessions == null ? 'Loading…' : q ? 'None match “' + esc(S.q.trim()) + '”' : 'None saved in this folder yet') + '</span></div>')
    + '<div class="sect"><span class="lbl">Files changed</span><span class="r">' + files.length + '</span></div>' + (files.length ? files.map((f) => '<div class="row static"><span class="t">✎ ' + esc(f.name) + '</span><span class="a"><span style="color:var(--accent)">+' + f.add + '</span> <span style="color:var(--bad)">−' + f.del + '</span></span></div>').join('') : '<div class="row static"><span class="t" style="color:var(--faint)">None in this conversation yet</span></div>')
    + '<div class="sect"><span class="lbl">To-do</span><span class="r">' + done + '/' + todos.length + '</span></div>' + (todos.length ? todos.map((t) => { const ok = t.status === 'done' || t.status === 'completed'; return '<div class="row static"><span class="a" style="color:' + (ok ? 'var(--accent)' : 'var(--faint)') + '">' + (ok ? '✓' : t.status === 'in_progress' ? '◐' : '○') + '</span><span class="t">' + esc(t.text) + '</span></div>'; }).join('') : '<div class="row static"><span class="t" style="color:var(--faint)">No to-do list yet</span></div>') + '</div>';
  if (h === sideHtml) return;
  sideHtml = h;
  keepField('sq', () => { side.innerHTML = h; }, false);
}
function renderDrops() {
  let h = '';
  if (S.find) {
    const q = S.q.trim().toLowerCase();
    const chats = (S.sessions ?? []).filter((c) => !q || String(c.title).toLowerCase().includes(q)).slice(0, q ? 12 : 6);
    const files = (S.last?.files ?? []).filter((f) => !q || f.name.toLowerCase().includes(q)).slice(0, 6);
    h += '<div class="drop"><div class="search">' + I.search + '<input id="fq" placeholder="Search conversations, files…" value="' + esc(S.q) + '"><span style="color:var(--faint);font-size:11px">esc</span></div><div class="list">'
      + '<div class="lbl" style="padding:10px 8px 4px">' + (q ? 'Conversations' : 'Recent conversations') + '</div>' + (chats.length ? chats.map((c) => '<div class="row" tabindex="0" role="button" data-resume="' + esc(c.id) + '"><span class="t">' + esc(c.title) + '</span><span class="a">' + esc(ago(c.updated)) + '</span></div>').join('') : '<div class="row static"><span class="t" style="color:var(--faint)">' + (S.sessions == null ? 'Loading…' : q ? 'None match “' + esc(S.q.trim()) + '”' : 'None saved in this folder yet') + '</span></div>')
      + (files.length ? '<div class="lbl" style="padding:10px 8px 4px">Files changed</div>' + files.map((f) => '<div class="row static"><span class="t">✎ ' + esc(f.name) + '</span></div>').join('') : '') + '</div></div>';
  }
  if (S.folderMenu) h += '<div class="drop" style="width:360px"><div class="lbl" style="padding:4px 8px 6px">This window works in</div><div class="row static"><span class="t" style="font-family:var(--mono)">' + esc(S.folder) + '</span></div><div class="row" tabindex="0" role="button" data-act="reveal"><span class="t">Show in Finder</span></div><div class="row" tabindex="0" role="button" data-act="other"><span class="t">Open another folder…</span><span class="a">a new window</span></div></div>';
  if (S.usageCard && S.last?.usage) h += usageCardHtml(S.last.usage, S.last.live?.phase === 'working');
  else if (S.usageCard && S.last?.meter) h += meterCardHtml(S.last.meter);
  if (S.toast) h += '<div class="toast">' + esc(S.toast) + '</div>';
  if (h !== dropsHtml) {
    dropsHtml = h;
    const opening = S.find && !document.getElementById('fq');
    keepField('fq', () => { drops.innerHTML = h; }, opening);
  }
  placeCard();
}
async function loadSessions() { try { S.sessions = await (await fetch('/sessions?t=' + T)).json(); } catch { S.sessions = []; } }

// ---- keys and clicks ----------------------------------------------------------------------------------
const ARROW = { ArrowUp: 'A', ArrowDown: 'B', ArrowRight: 'C', ArrowLeft: 'D' };
function keyBytes(e) {
  const mod = (e.shiftKey ? 1 : 0) + (e.altKey ? 2 : 0) + (e.ctrlKey ? 4 : 0);
  if (ARROW[e.key]) { if (e.altKey && !e.shiftKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return e.key === 'ArrowLeft' ? '\x1bb' : '\x1bf'; return mod ? '\x1b[1;' + (mod + 1) + ARROW[e.key] : '\x1b[' + ARROW[e.key]; }
  switch (e.key) {
    case 'Enter': return e.shiftKey || e.altKey ? '\\\r' : '\r';
    case 'Backspace': return e.altKey ? '\x1b\x7f' : '\x7f';
    case 'Delete': return '\x1b[3~';
    case 'Tab': return e.shiftKey ? '\x1b[Z' : '\t';
    case 'Escape': return '\x1b';
    case 'Home': return '\x1b[H'; case 'End': return '\x1b[F';
    case 'PageUp': return '\x1b[5~'; case 'PageDown': return '\x1b[6~';
  }
  if (e.ctrlKey && !e.metaKey && e.key.length === 1) { const c = e.key.toLowerCase().charCodeAt(0); if (c >= 97 && c <= 122) return String.fromCharCode(c - 96); if (e.key === ' ') return '\x00'; }
  if (e.altKey && !e.metaKey && e.code?.startsWith('Key')) return '\x1b' + e.code.slice(3).toLowerCase();
  if (!e.metaKey && !e.ctrlKey && e.key.length === 1) return e.key;
  return null;
}
addEventListener('keydown', (e) => {
  if (e.isComposing) return;
  const inField = document.activeElement?.tagName === 'INPUT';
  if (e.metaKey && e.key.toLowerCase() === 'b') { e.preventDefault(); S.side = !S.side; if (S.side) loadSessions().then(renderSide); renderSide(); return; }
  if (e.metaKey && e.key.toLowerCase() === 'k') { e.preventDefault(); S.find = !S.find; S.folderMenu = false; if (S.find) loadSessions().then(renderDrops); renderDrops(); return; }
  if (e.key === 'Escape' && (S.find || S.folderMenu || S.side || S.usageCard)) { e.preventDefault(); S.find = false; S.folderMenu = false; S.side = false; S.usageCard = false; S.q = ''; renderUsage(S.last); renderDrops(); renderSide(); return; }
  // In the search drop-down and the side bar, keys work the page's own way: Tab moves between the rows, Enter (or
  // space) opens the one you are on, and Enter in the box opens the first match. Everywhere else Tab still goes to the
  // app (shift-Tab picks the mode).
  const here = document.activeElement, panel = here?.closest?.('.side, .drop');
  if (panel && !e.metaKey && (e.key === 'Enter' || (e.key === ' ' && !inField))) {
    const row = inField ? panel.querySelector('[role="button"]') : here.matches('[role="button"]') ? here : null;
    if (row) { e.preventDefault(); row.click(); return; }
  }
  if (inField || panel) return;
  if (e.metaKey) return; // ⌘C copies, ⌘V pastes (the paste event), ⌘Q quits: the Mac's own
  const b = keyBytes(e);
  if (b != null) { e.preventDefault(); keys(b); }
});
addEventListener('paste', (e) => {
  if (document.activeElement?.tagName === 'INPUT') return;
  const text = e.clipboardData?.getData('text/plain');
  if (text) { e.preventDefault(); send({ t: 'paste', text }); }
});
// Files dragged onto the window (a screenshot, say): the window (main.rs) hands their paths here, and they go to the
// app as Terminal types a drop (server.mjs dropText), so each becomes [Image #n] with its card over the box.
window.agenticDropped = (paths) => {
  if (!Array.isArray(paths) || !paths.length) return;
  if (!S.last) return toast('Agentic Coder is still starting');
  send({ t: 'drop', paths });
};
document.addEventListener('input', (e) => {
  // Both keep the box's caret where it was (keepField).
  if (e.target.id === 'fq' || e.target.id === 'sq') { S.q = e.target.value; if (e.target.id === 'fq') renderDrops(); else renderSide(); }
});
document.addEventListener('click', (e) => {
  const t = e.target;
  const runBtn = t.closest('[data-run]'); if (runBtn) { if (S.usageCard) { S.usageCard = false; renderUsage(S.last); renderDrops(); } return run(runBtn.dataset.run); }
  const act = t.closest('[data-act]')?.dataset.act;
  if (act === 'side') { S.side = !S.side; if (S.side) loadSessions().then(renderSide); renderSide(); return; }
  if (act === 'find') { S.find = !S.find; S.folderMenu = false; if (S.find) loadSessions().then(renderDrops); renderDrops(); return; }
  if (act === 'folder') { S.folderMenu = !S.folderMenu; S.find = false; S.usageCard = false; renderUsage(S.last); renderDrops(); return; }
  if (act === 'usage') { S.usageCard = !S.usageCard; S.find = false; S.folderMenu = false; renderUsage(S.last); renderDrops(); return; }
  if (act === 'reveal') { fetch('/reveal?t=' + T); S.folderMenu = false; renderDrops(); return; }
  if (act === 'other') { S.folderMenu = false; renderDrops(); fetch('/other-folder?t=' + T).then((r) => r.json()).then((r) => { if (r.ok) toast('Opening ' + r.folder + ' in a new window'); }); return; }
  if (act === 'send') { if (S.last?.input?.value) keys('\r'); return; }
  const res = t.closest('[data-resume]'); if (res) { send({ t: 'act', do: 'resume', id: res.dataset.resume }); S.find = false; S.side = false; S.q = ''; renderDrops(); renderSide(); return; }
  const md_ = t.closest('[data-mode]'); if (md_) { send({ t: 'act', do: 'mode', mode: md_.dataset.mode }); return; }
  if (t.closest('[data-think]')) { thinkOpen = !thinkOpen; try { localStorage.setItem('think-open', thinkOpen ? '1' : '0'); } catch {} render(); return; }
  const lv = t.closest('[data-live]'); if (lv) { const k = lv.dataset.live; if (liveOpen.size > 40) liveOpen.clear(); liveOpen.set(k, !(liveOpen.get(k) ?? k.endsWith(':now'))); render(); return; }
  const task = t.closest('[data-task]'); if (task) { send({ t: 'act', do: 'toggle', id: task.dataset.task }); return; }
  const row = t.closest('[data-row]'); if (row) { const k = row.dataset.row; openRows.has(k) ? openRows.delete(k) : openRows.add(k); rowsVer++; render(); return; }
  if (act === 'latest') { const c = document.getElementById('convo'); if (c) c.scrollTop = c.scrollHeight; backButton(); return; }
  const opt = t.closest('[data-opt]'); if (opt && S.last?.perm) { moveThen(Number(opt.dataset.opt) - S.last.perm.selected, '\r'); return; }
  const pr = t.closest('[data-prow]'); if (pr && S.last?.panel) { const ch = panelChoices(S.last.panel.rows), to = ch ? ch.rows.indexOf(Number(pr.dataset.prow)) : -1; if (to < 0) return; const d = to - ch.rows.indexOf(ch.at); if (d === 0) keys('\r'); else moveThen(d, ''); return; }
  const mi = t.closest('[data-menu]'); if (mi && S.last?.menu) { moveThen(Number(mi.dataset.menu) - S.last.menu.index, '\t'); return; }
  if ((S.find || S.folderMenu || S.usageCard) && !t.closest('.drop') && !t.closest('.ucard')) { S.find = false; S.folderMenu = false; S.usageCard = false; renderUsage(S.last); renderDrops(); }
});
// The pretend terminal is as wide as the conversation, so what the app draws itself fits the window.
let fitTimer = null;
function fit() { clearTimeout(fitTimer); fitTimer = setTimeout(() => { const probe = document.createElement('span'); probe.style.cssText = 'position:absolute;visibility:hidden;font:13px var(--mono)'; probe.textContent = 'M'.repeat(100); document.body.append(probe); const cw = probe.getBoundingClientRect().width / 100; probe.remove(); send({ t: 'resize', cols: Math.floor((innerWidth - 60) / cw), rows: Math.floor((innerHeight - 52) / 18) }); }, 150); }
addEventListener('resize', () => { fit(); fitBar(); fitModes(); placeCard(); });
connect();
</script>
