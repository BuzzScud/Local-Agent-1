<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic Coder</title>
<!-- The window's page (12 Oct 2026, design 2 as picked: the title bar with Chats · New · Remote | Loops | Help, the model
     in the middle, settings, the folder and search on the right; the bot header; the conversation; the live status line;
     the prompt between two lines; one compact row for the mode). It draws what the app sends (bridge.mjs through
     server.mjs) and sends keys and clicks back. What it has no view of its own for, it shows as the app draws it. -->
<style>
:root {
  --win: #161618; --raise: #1f1f22; --raise2: #29292d; --hair: rgba(255,255,255,.07); --hair2: rgba(255,255,255,.12);
  --text: #e8e8ea; --dim: #a0a0a7; --faint: #6e6e76; --label: #8c8c93;
  --accent: #5fafff; --accent-bg: rgba(95,175,255,.11); --accent-line: rgba(95,175,255,.5);
  --ok: #4fb59a; --bad: #ff6b6b; --sand: #e2c08d;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--win); color: var(--text); font: 13px/1.5 var(--mono); overflow: hidden; }
body { display: flex; flex-direction: column; }
button { font: inherit; color: inherit; }
/* the title bar: the Mac's own lights sit over its left end */
.tb { height: 52px; flex-shrink: 0; display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; padding: 0 14px 0 86px; border-bottom: 1px solid var(--hair); user-select: none; -webkit-user-select: none; }
.tb > div { display: flex; align-items: center; gap: 6px; min-width: 0; }
.tb .r { justify-content: flex-end; }
.bb { height: 28px; border-radius: 8px; border: 1px solid var(--hair2); background: var(--raise); color: var(--dim); padding: 0 11px; display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font: 12.5px var(--sans) !important; white-space: nowrap; }
.bb:hover { color: var(--text); border-color: rgba(255,255,255,.2); }
.bb.on { color: var(--accent); border-color: var(--accent-line); background: var(--accent-bg); }
.bb .k { color: var(--faint); font: 11.5px var(--mono); }
.bb.sq { width: 30px; padding: 0; justify-content: center; }
.seg { display: inline-flex; background: var(--raise); border: 1px solid var(--hair2); border-radius: 8px; padding: 2px; height: 30px; }
.seg button { border: 0; background: transparent; padding: 0 11px; height: 24px; border-radius: 6px; color: var(--dim); font: 12.5px var(--sans); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.seg button:hover { color: var(--text); }
.pill { height: 28px; border-radius: 14px; border: 1px solid var(--accent-line); color: var(--accent); background: var(--accent-bg); padding: 0 12px; display: inline-flex; align-items: center; gap: 7px; font: 500 12.5px var(--sans); cursor: pointer; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; flex-shrink: 0; }
.dot.off { background: #55555c; } .dot.busy { background: var(--sand); }
/* the body */
.body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 22px; position: relative; }
.convo-wrap { flex: 1; min-height: 0; position: relative; }
.convo { position: absolute; inset: 0; overflow-y: auto; padding: 16px 2px 14px; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 18px); scrollbar-width: thin; }
.convo::-webkit-scrollbar { width: 8px; } .convo::-webkit-scrollbar-thumb { background: #3a3a40; border-radius: 4px; }
.hero { display: flex; align-items: center; gap: 16px; margin: 6px 0 14px; }
.hero .name { font: 700 16px var(--mono); }
.hero .name small { font: 400 13px var(--mono); color: var(--faint); margin-left: 6px; }
.hero .sub { color: var(--dim); }
.bot { image-rendering: pixelated; flex-shrink: 0; }
.you { margin: 16px -22px 10px; padding: 7px 22px; background: #2a2a2e; font: 14px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; display: flex; gap: 10px; }
.you .m { color: var(--dim); }
.you .cards { color: var(--faint); font-size: 12px; margin-top: 3px; }
.reply { font: 13px/1.6 var(--mono); color: #dcdce0; margin: 10px 0 8px 4px; max-width: 1060px; overflow-wrap: anywhere; }
.reply p { margin: 0 0 9px; } .reply ul, .reply ol { margin: 0 0 9px; padding-left: 22px; } .reply li { margin: 2px 0; }
.reply code { background: var(--raise2); border-radius: 4px; padding: 1px 5px; color: #e6e6ea; }
.reply pre { background: var(--raise); border: 1px solid var(--hair); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 0 0 9px; }
.reply b { color: #fff; } .reply h1, .reply h2, .reply h3 { font-size: 13px; margin: 12px 0 6px; color: #fff; }
.reply table { border-collapse: collapse; margin: 0 0 9px; } .reply td, .reply th { border: 1px solid var(--hair2); padding: 3px 8px; text-align: left; }
.writing { color: #cfcfd4; }
.trow { margin: 0 0 0 4px; border-left: 1px solid var(--hair); border-right: 1px solid var(--hair); background: var(--raise); }
.trow.first { border-top: 1px solid var(--hair); border-radius: 10px 10px 0 0; margin-top: 8px; }
.trow.firstonly { border-radius: 10px; border-bottom: 1px solid var(--hair); margin-bottom: 6px; }
.task { display: grid; grid-template-columns: 16px 104px minmax(0,1fr) auto; align-items: center; gap: 8px; padding: 7px 14px; cursor: pointer; }
.trow + .trow:not(.first) .task { border-top: 1px solid var(--hair); }
.task:hover { background: rgba(255,255,255,.025); }
.task .chev { width: 10px; height: 10px; display: inline-block; border-right: 1.6px solid var(--accent); border-bottom: 1.6px solid var(--accent); transform: rotate(-45deg) scale(.6); margin-left: 2px; }
.task .chev.open { transform: rotate(45deg) scale(.6); }
.task .tag { font: 600 11px var(--mono); letter-spacing: .12em; }
.task .w { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #d5d5da; }
.task .w.guess { color: var(--faint); }
.task .end { display: flex; gap: 12px; color: var(--faint); font-size: 12px; white-space: nowrap; }
.end .ok { color: var(--accent); } .end .bad { color: var(--bad); } .end .ed { color: #87d7ff; } .end .ask { color: #d78787; } .end .working { color: var(--accent); font-weight: 600; }
.rows { padding: 0 14px 8px 42px; }
.rowx { padding: 5px 0; border-top: 1px dashed var(--hair); cursor: pointer; display: flex; gap: 10px; }
.rowx:first-child { border-top: 0; }
.rowx .w { flex: 1; min-width: 0; color: #cfcfd4; } .rowx .w.guess { color: var(--faint); }
.rowx .n { color: var(--faint); font-size: 12px; white-space: nowrap; }
.steps { margin: 4px 0 6px 16px; }
.step { display: flex; gap: 8px; color: var(--dim); font-size: 12px; padding: 1px 0; }
.step .k { width: 74px; flex-shrink: 0; color: var(--faint); }
.step .a { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step.err .k, .step.err .e { color: var(--bad); }
.tend { margin: 0 0 6px 4px; border: 1px solid var(--hair); border-top: 1px solid var(--hair); border-radius: 0 0 10px 10px; background: rgba(0,0,0,.18); padding: 7px 14px; color: var(--faint); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
.tend .ok { color: var(--accent); } .tend .bad { color: var(--bad); }
.endline { margin: 4px 0 6px 4px; color: var(--faint); font-size: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.endline .mk { color: var(--accent); }
.made { margin: 6px 0 2px 4px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--faint); }
.made .f { background: var(--raise2); border-radius: 6px; padding: 1px 8px; color: #87d7ff; }
.note { margin: 6px 0 6px 4px; color: var(--faint); font-size: 12px; white-space: pre-wrap; }
.note.warn { color: var(--sand); } .note.error { color: var(--bad); } .note.ok { color: var(--accent); }
.divider { margin: 14px 0 8px; color: var(--faint); font-size: 12px; display: flex; align-items: center; gap: 10px; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--hair); }
.ansi { margin: 6px 0; white-space: pre; font: 12.5px/1.35 var(--mono); overflow-x: auto; }
.ansi div { min-height: 1.35em; }
.thinking { color: var(--faint); font-style: italic; margin: 8px 0 4px 4px; white-space: pre-wrap; }
.running { color: var(--dim); margin: 6px 0 4px 4px; }
.back { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); border: 0; border-radius: 16px; padding: 6px 14px; background: var(--accent); color: #0b1a2b; font: 600 12.5px var(--sans); cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
/* the status line */
.status { display: flex; align-items: center; gap: 14px; padding: 9px 2px; color: var(--dim); font-size: 12.5px; white-space: nowrap; overflow: hidden; min-height: 38px; }
.status .v { color: var(--text); } .status .ac { color: var(--accent); font-weight: 600; } .status .r { margin-left: auto; color: var(--faint); }
.bar10 { display: inline-flex; gap: 2px; } .bar10 i { width: 9px; height: 5px; border-radius: 1px; background: #38383e; display: block; } .bar10 i.on { background: var(--accent); }
/* the prompt between two lines */
.prompt { border-top: 1px solid var(--hair2); border-bottom: 1px solid var(--hair2); display: flex; align-items: flex-start; gap: 12px; padding: 11px 2px; cursor: text; }
.prompt .m { color: var(--accent); font-weight: 700; }
.prompt .t { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; font: 14px/1.5 var(--mono); min-height: 21px; max-height: 40vh; overflow-y: auto; }
.prompt .t .ph { color: #5d5d64; }
.prompt .t .hint { color: var(--faint); }
.caret { display: inline-block; width: 8px; height: 17px; vertical-align: -3px; background: var(--accent); animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.prompt .hk { color: var(--faint); font: 600 11px var(--mono); letter-spacing: .1em; padding-top: 3px; }
.send { border: 1px solid var(--hair2); background: var(--raise2); color: var(--dim); border-radius: 8px; padding: 4px 14px; font: 500 13px var(--sans); cursor: pointer; }
.send.ready { background: var(--accent); border-color: var(--accent); color: #0b1a2b; }
.menu { border: 1px solid var(--hair2); background: #1c1c1f; border-radius: 10px; margin: 0 0 8px; max-height: 42vh; overflow-y: auto; padding: 4px; }
.menu .mi { display: flex; gap: 14px; padding: 4px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.menu .mi .l { color: var(--text); min-width: 160px; } .menu .mi .d { color: var(--faint); overflow: hidden; text-overflow: ellipsis; }
.menu .mi.on { background: var(--accent-bg); } .menu .mi.on .l { color: var(--accent); }
.modes { display: flex; align-items: center; gap: 10px; padding: 9px 2px 12px; font-size: 12.5px; color: var(--faint); white-space: nowrap; overflow: hidden; }
.modes .sep { color: #45454b; } .modes .sp { flex: 1; } .modes .bad { color: var(--bad); }
.chips { display: flex; gap: 4px; }
.chip { border: 1px solid transparent; background: var(--raise2); color: var(--dim); border-radius: 7px; padding: 2px 9px; cursor: pointer; font: 12px var(--mono); }
.chip.on { border-color: var(--accent-line); background: var(--accent-bg); color: var(--accent); }
.chip.on.bypass { border-color: rgba(255,107,107,.55); background: rgba(255,107,107,.1); color: var(--bad); }
/* a question: a card in the prompt's place */
.perm { border: 1px solid var(--accent-line); border-radius: 12px; background: #1b1d22; padding: 14px 16px; margin: 8px 0 10px; }
.perm .h { font: 600 13px var(--sans); color: #afafff; margin-bottom: 8px; }
.perm .what { font: 13px var(--mono); white-space: pre-wrap; word-break: break-word; margin-bottom: 8px; color: var(--text); }
.perm .diff { font: 12px/1.45 var(--mono); background: var(--win); border: 1px solid var(--hair); border-radius: 8px; padding: 6px 0; max-height: 34vh; overflow: auto; margin-bottom: 10px; }
.perm .diff div { padding: 0 10px; white-space: pre; } .perm .diff .add { background: rgba(0,95,135,.35); } .perm .diff .del { background: rgba(95,0,0,.45); } .perm .diff .n { color: var(--faint); display: inline-block; width: 42px; }
.perm .opt { display: flex; gap: 8px; padding: 5px 8px; border-radius: 7px; cursor: pointer; } .perm .opt:hover { background: rgba(255,255,255,.04); }
.perm .opt.on { background: var(--accent-bg); color: var(--accent); }
.perm .foot { color: var(--faint); font-size: 12px; margin-top: 8px; }
.panel { border: 1px solid var(--hair2); border-radius: 12px; background: #19191c; padding: 8px 10px; margin: 8px 0 10px; max-height: 62vh; overflow: auto; }
.full { position: absolute; inset: 0; background: var(--win); overflow: auto; padding: 12px 22px; z-index: 3; }
/* home: a new conversation */
.home { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 100%; text-align: center; padding: 20px 0; }
.home .ttl { font: 600 20px var(--sans); } .home .sub { color: var(--dim); }
.lbl { font: 600 11px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--label); }
.pick { display: grid; grid-template-columns: repeat(3, minmax(0, 250px)); gap: 10px; margin-top: 10px; }
.card { background: var(--raise); border: 1px solid var(--hair); border-radius: 10px; padding: 11px 14px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.card:hover { border-color: var(--accent-line); }
.card .val { font: 13px/1.4 var(--sans); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* side bar, drop-downs, toasts */
.side { position: absolute; top: 52px; bottom: 0; left: 0; width: 330px; background: #202023; border-right: 1px solid var(--hair2); box-shadow: 18px 0 40px rgba(0,0,0,.35); transform: translateX(-104%); transition: transform .18s ease; display: flex; flex-direction: column; z-index: 6; }
.side.open { transform: none; }
.side .in { flex: 1; overflow-y: auto; padding: 16px; }
.sect { display: flex; align-items: baseline; gap: 10px; padding: 14px 2px 8px; border-bottom: 1px solid var(--hair); margin-bottom: 4px; }
.sect:first-child { padding-top: 0; } .sect .r { margin-left: auto; color: var(--faint); font-size: 12px; }
.row { display: flex; gap: 10px; padding: 6px 8px; border-radius: 8px; cursor: pointer; align-items: baseline; }
.row:hover { background: var(--raise2); }
.row .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: 13px var(--sans); color: #dcdce0; }
.row .a { color: var(--faint); font-size: 11.5px; white-space: nowrap; }
.drop { position: absolute; top: 58px; right: 14px; width: min(440px, calc(100% - 28px)); background: #202023; border: 1px solid var(--hair2); border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.5); padding: 10px; z-index: 7; }
.drop.left { right: auto; }
.search { height: 34px; border-radius: 8px; background: var(--raise); border: 1px solid var(--hair2); display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--faint); }
.search input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--text); font: 13px var(--sans); }
.list { max-height: 420px; overflow-y: auto; margin-top: 6px; }
.toast { position: absolute; left: 50%; top: 62px; transform: translateX(-50%); background: #2d2d31; border: 1px solid var(--hair2); color: var(--text); border-radius: 9px; padding: 7px 14px; font: 13px var(--sans); box-shadow: 0 10px 30px rgba(0,0,0,.45); z-index: 9; }
.screen { white-space: pre; font: 12.5px/1.35 var(--mono); padding: 14px 22px; overflow: auto; flex: 1; }
.screen div { min-height: 1.35em; }
.gone { flex: 1; display: grid; place-items: center; color: var(--dim); font: 14px var(--sans); }
</style></head>
<body>
<div class="tb" id="tb" data-tauri-drag-region>
  <div class="l" data-tauri-drag-region>
    <button class="bb" data-act="side">ICON_SIDE Chats <span class="k">⌘B</span></button>
    <button class="bb" data-run="/clear">ICON_PLUS New</button>
    <div class="seg"><button data-run="/remote">ICON_REMOTE Remote</button><button data-run="/loop">ICON_LOOP Loops</button><button data-run="/help">ICON_HELP Help</button></div>
  </div>
  <div class="c" data-tauri-drag-region><span class="pill" id="pill" data-run="/model"><span class="dot" id="pilldot"></span><span id="pillname">Agentic Coder</span></span></div>
  <div class="r" data-tauri-drag-region>
    <button class="bb sq" data-run="/settings" title="Settings">ICON_GEAR</button>
    <button class="bb sq" data-act="folder" id="folderbtn" title="">ICON_FOLDER</button>
    <button class="bb sq" data-act="find" title="Search ⌘K">ICON_SEARCH</button>
  </div>
</div>
<div class="body" id="body"></div>
<aside class="side" id="side"></aside>
<div id="drops"></div>
<script>
const T = new URLSearchParams(location.search).get('t');
const S = { items: {}, order: [], last: null, screen: null, bot: null, folder: '', side: false, find: false, folderMenu: false, q: '', toast: null, follow: true, sessions: null, gone: false, tps: [], skew: 0 };
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const svg = (d, s = 15) => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
const I = {
  side: svg('<rect x="2.5" y="3" width="11" height="10" rx="2"/><path d="M6.5 3v10"/>'), plus: svg('<path d="M8 3.5v9M3.5 8h9"/>'),
  remote: svg('<path d="M3 6h9.5l-2.5-2.5M13 10H3.5L6 12.5"/>', 14), loop: svg('<path d="M12.5 7A4.5 4.5 0 0 0 4 5.2M3.5 9A4.5 4.5 0 0 0 12 10.8"/><path d="M4 2.8v2.6h2.6M12 13.2v-2.6H9.4"/>', 14),
  help: svg('<circle cx="8" cy="8" r="5.5"/><path d="M6.6 6.4a1.5 1.5 0 1 1 2.1 1.4c-.5.2-.7.6-.7 1.1M8 11.2v.1"/>', 14), gear: svg('<circle cx="8" cy="8" r="2.2"/><path d="M8 2v2M8 12v2M2 8h2M12 8h2M3.8 3.8l1.4 1.4M10.8 10.8l1.4 1.4M3.8 12.2l1.4-1.4M10.8 5.2l1.4-1.4"/>'),
  folder: svg('<path d="M2.5 4.5h4l1.2 1.5h5.8v6.5h-11z"/>'), search: svg('<circle cx="7" cy="7" r="4"/><path d="M10 10l3 3"/>', 14),
};
const tb = document.getElementById('tb');
tb.innerHTML = tb.innerHTML.replace('ICON_SIDE', I.side).replace('ICON_PLUS', I.plus).replace('ICON_REMOTE', I.remote).replace('ICON_LOOP', I.loop).replace('ICON_HELP', I.help).replace('ICON_GEAR', I.gear).replace('ICON_FOLDER', I.folder).replace('ICON_SEARCH', I.search);
const body = document.getElementById('body'), side = document.getElementById('side'), drops = document.getElementById('drops');

// ---- the line to the app -----------------------------------------------------------------------------
let ws = null;
function connect() {
  ws = new WebSocket('ws://' + location.host + '/ws?t=' + T);
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === 'hello') { S.items = m.state?.items ?? {}; S.order = m.state?.order ?? []; S.last = m.state; S.bot = m.bot; S.folder = m.folder; wantScreen(); render(); fit(); }
    else if (m.t === 'state') { Object.assign(S.items, m.items); if (m.order) { S.order = m.order; const keep = new Set(m.order); for (const k of Object.keys(S.items)) if (!keep.has(k)) delete S.items[k]; } S.last = m; S.skew = Date.now() - m.now; if (m.live?.tps) S.tps = [...S.tps.slice(-40), m.live.tps]; wantScreen(); render(); }
    else if (m.t === 'reset') { S.items = {}; S.order = []; S.last = null; wantScreen(); render(); }
    else if (m.t === 'screen') { S.screen = m; if (!S.last) render(); }
    else if (m.t === 'exit') { S.gone = true; render(); }
    else if (m.t === 'error') console.error('bridge:', m.text);
  };
  ws.onclose = () => { if (!S.gone) setTimeout(connect, 500); };
}
const send = (m) => { if (ws?.readyState === 1) ws.send(JSON.stringify(m)); };
let screenWanted = null;
function wantScreen() { const w = !S.last; if (w !== screenWanted) { screenWanted = w; send({ t: 'screen', on: w }); } }
const keys = (data) => send({ t: 'keys', data });
// A command run as if typed: only with an empty prompt (what you typed is never lost).
function run(cmd) {
  if (S.last?.input?.value) return toast('Your prompt has text: send it or clear it first');
  if (!S.last) return toast('Agentic Coder is still starting');
  keys(cmd + '\r');
}
let toastTimer = null;
function toast(t) { S.toast = t; renderDrops(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; renderDrops(); }, 2400); }

// ---- drawing --------------------------------------------------------------------------------------------
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const money = (n) => '$' + Number(n || 0).toFixed(2);
const fmtSecs = (s) => (s < 60 ? Math.max(0, Math.round(s)) + 's' : Math.floor(s / 60) + 'm ' + String(Math.round(s % 60)).padStart(2, '0') + 's');
const clock = (ms) => (ms ? new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '');
const ago = (iso) => { const m = (Date.now() - Date.parse(iso)) / 60000; return !isFinite(m) ? '' : m < 60 ? Math.max(1, Math.round(m)) + 'm' : m < 1440 ? Math.round(m / 60) + 'h' : Math.round(m / 1440) + 'd'; };
