<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic Coder Hub</title>
<style>
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --panel: #f3f3f0; --line: #e3e2dc;
  --ink: #0b0b0b; --ink2: #52514e; --ink3: #8a887f; --accent: #2a78d6; --accent-ink: #fff;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page: #0d0d0d; --surface: #1a1a19; --panel: #232322; --line: #34342f; --ink: #fff; --ink2: #c3c2b7; --ink3: #8f8e86; --accent: #3987e5; }
}
:root[data-theme="dark"] { --page: #0d0d0d; --surface: #1a1a19; --panel: #232322; --line: #34342f; --ink: #fff; --ink2: #c3c2b7; --ink3: #8f8e86; --accent: #3987e5; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; }
header { display: flex; align-items: center; gap: 6px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--surface); height: 44px; flex: none; }
header h1 { font-size: 15px; margin: 0 14px 0 4px; font-weight: 600; white-space: nowrap; }
header button { font: inherit; color: var(--ink2); background: none; border: none; border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
header button:hover { color: var(--ink); background: var(--panel); }
header button.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); border-radius: 8px 8px 0 0; }
header .spacer { flex: 1; }
header .now { color: var(--ink3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; min-width: 0; }
header button, header h1, header a { flex: none; }
header a { color: var(--accent); font-size: 12px; text-decoration: none; white-space: nowrap; padding: 6px 8px; border-radius: 8px; }
header a:hover { background: var(--panel); }
/* The Structure tab holds two pages, Structure and Flow: its caret opens a small menu that picks one */
header button .caret { display: inline-block; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid currentColor; margin-left: 7px; vertical-align: 2px; opacity: .65; }
.menu { position: fixed; z-index: 10; width: 356px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px; box-shadow: 0 12px 32px rgba(0, 0, 0, .28); }
.menu[hidden] { display: none; }
.menu button { font: inherit; width: 100%; display: grid; grid-template-columns: 22px minmax(0, 1fr) 16px; gap: 10px; align-items: center; text-align: left; padding: 8px 10px; border: none; border-radius: 8px; background: none; color: var(--ink); cursor: pointer; }
.menu button:hover, .menu button:focus-visible { background: var(--panel); outline: none; }
.menu button svg { width: 20px; height: 20px; stroke: var(--ink2); fill: none; stroke-width: 1.5; stroke-linejoin: round; }
.menu b { display: block; font-weight: 600; font-size: 13.5px; }
.menu small { display: block; color: var(--ink3); font-size: 12px; line-height: 1.35; }
.menu .tick { font-style: normal; color: var(--accent); visibility: hidden; font-size: 13px; }
.menu button[aria-checked="true"] .tick { visibility: visible; }
.menu .hint { color: var(--ink3); font-size: 11px; padding: 6px 10px 3px; border-top: 1px solid var(--line); margin-top: 4px; }
main { flex: 1; min-height: 0; position: relative; }
iframe { width: 100%; height: 100%; border: none; background: var(--surface); display: block; }
#list { position: absolute; inset: 0; overflow: auto; padding: 20px 24px; display: none; }
#list.on { display: block; } iframe.off { display: none; }
#list h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink3); margin: 18px 0 8px; font-weight: 600; }
#list h2:first-child { margin-top: 0; }
.row { display: grid; grid-template-columns: 1fr auto auto; gap: 16px; align-items: baseline; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.row:hover { background: var(--panel); }
.row .t { font-weight: 500; } .row .f { font-family: var(--mono); font-size: 12px; color: var(--ink3); margin-left: 8px; }
.row .m { color: var(--ink3); font-size: 12px; font-family: var(--mono); white-space: nowrap; }
.row .k { color: var(--ink3); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
#list .note { color: var(--ink2); max-width: 560px; }
#list .note code { font-family: var(--mono); font-size: 12px; }
/* The Test builder: a window over the whole hub, opened from the Arena (its Test builder button, + New, Edit on a test of yours). */
#bm { position: fixed; inset: 0; z-index: 50; display: none; }
#bm.on { display: block; }
#bm .back { position: absolute; inset: 0; background: rgba(0, 0, 0, .45); }
#bm .win { position: absolute; inset: 2.5vh 2vw; background: var(--page); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 24px 64px rgba(0, 0, 0, .35); display: flex; flex-direction: column; overflow: hidden; }
#bm .win iframe { flex: 1; min-height: 0; height: auto; }
#bm .bh { flex: none; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 18px; border-bottom: 1px solid var(--line); background: var(--surface); min-width: 0; }
#bm .bh b { font-size: 15px; font-weight: 600; white-space: nowrap; }
#bm .bh span { color: var(--ink3); font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#bm .bh a { color: var(--accent); font-size: 12px; text-decoration: none; white-space: nowrap; padding: 6px 8px; border-radius: 8px; }
#bm .bh a:hover { background: var(--panel); }
#bm .bh button { font: inherit; font-size: 15px; line-height: 1; color: var(--ink2); background: none; border: 0; border-radius: 8px; padding: 7px 10px; cursor: pointer; }
#bm .bh button:hover { color: var(--ink); background: var(--panel); }
#bm .bh a:focus-visible, #bm .bh button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
@media (max-width: 720px) { #bm .win { inset: 6px; } #bm .bh span, #bm .bh a { display: none; } #bm .bh b { flex: 1; } }
@media (max-width: 720px) { header { overflow-x: auto; scrollbar-width: none; } header::-webkit-scrollbar { display: none; } header button { padding: 7px 9px; } header h1 { display: none; } header .now { display: none; } .row { grid-template-columns: 1fr auto; } .row .k { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Agentic Coder hub</h1>
  <button data-tab="weights">Weights</button>
  <button data-tab="harness">Harness</button>
  <button data-tab="structure" aria-haspopup="menu" aria-expanded="false" title="Structure and Flow: click again for the menu">Structure<i class="caret" aria-hidden="true"></i></button>
  <button data-tab="arena">Arena</button>
  <button data-tab="memory">Memory</button>
  <button data-tab="instructions">Instructions</button>
  <button data-tab="docs">All docs</button>
  <button data-tab="help">Help</button>
  <span class="spacer"></span>
  <span class="now" id="now"></span>
  <a id="own" href="/weights" target="_blank" rel="noopener">open in its own tab ↗</a>
</header>
<div class="menu" id="menu" role="menu" aria-label="Page of the Structure tab" hidden><button type="button" role="menuitemradio" data-view="structure" aria-checked="true"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3" width="6" height="4" rx="1.2"/><rect x="11.5" y="8" width="6" height="4" rx="1.2"/><rect x="11.5" y="14" width="6" height="4" rx="1.2"/><path d="M5.5 7v9h6M5.5 10h6"/></svg><span><b>Structure</b><small>where every part of Agentic Coder lives</small></span><i class="tick">✓</i></button><button type="button" role="menuitemradio" data-view="flow" aria-checked="false"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3.5" width="6" height="4.5" rx="1.2"/><rect x="12" y="3.5" width="6" height="4.5" rx="1.2"/><rect x="7" y="12.5" width="6" height="4.5" rx="1.2"/><path d="M8 5.75h4M15 8v2.5h-5v2M5 8v2.5h5"/></svg><span><b>Flow</b><small>how a request moves through it, both models</small></span><i class="tick">✓</i></button><p class="hint">The tab opens on Structure · 1 or 2 picks · Esc closes</p></div>
<main>
  <iframe id="frame" title="page"></iframe>
  <div id="list"></div>
</main>
<div id="bm" role="dialog" aria-modal="true" aria-label="Test builder"><div class="back"></div><div class="win">
  <div class="bh"><b>Test builder</b><span>make your own tests: easy, medium, hard · they go in My tests</span><a href="/builder" target="_blank" rel="noopener">open in its own tab ↗</a><button type="button" id="bm-x" aria-label="Close the Test builder" title="Close (esc)">✕</button></div>
  <iframe id="bframe" title="Test builder"></iframe>
</div></div>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const frame = $('#frame'), list = $('#list'), now = $('#now'), own = $('#own'), menu = $('#menu'), stab = document.querySelector('header > button[data-tab="structure"]'), bm = $('#bm'), bframe = $('#bframe');
  let docs = null; // { dir, missing, pinned: { harness, structure }, pages: [{ file, title, kind, size, saved }] }
  // The Arena is the Tests tab and the Battle tab as one (30 Sep 2026): an address that names either opens it.
  // The Test builder was a tab until 30 Sep 2026 and is a window over the Arena now: ?tab=builder opens that.
  const ALIAS = { tests: 'arena', battle: 'arena', builder: 'arena' };
  // ?tab=builder (coding hub builder; &new=1 on a new test), ?new=1 on the Arena (+ New), or ?builder=… (the
  // window was open when the page reloaded): the Arena with the Test builder over it. Taken once, and read
  // before runAsk below, which would take new=1 for the Arena's own New test window.
  let builderAsk = (() => {
    const q = new URL(location.href), tab = q.searchParams.get('tab'), b = q.searchParams.get('builder'), fresh = q.searchParams.has('new');
    if (tab !== 'builder' && !b && !(fresh && (ALIAS[tab] ?? tab) === 'arena')) return null;
    const r = fresh || b === 'new' ? { fresh: true } : { test: b && b !== '1' ? b : null };
    q.searchParams.delete('new'); q.searchParams.delete('builder'); if (tab === 'builder') q.searchParams.set('tab', 'arena'); history.replaceState(null, '', q);
    return r;
  })();
  // /test in Agentic Coder opens ?tab=arena&run=1&model=…&test=…&n=…(&think=on): the Arena with those picked;
  // /tests adds record=1 (the test record, over it); ?new=1 opens its New test window. Taken once, then
  // dropped from the address (the Arena button opens it as you left it).
  let runAsk = (() => {
    const q = new URL(location.href); if (!['run', 'new', 'record'].some((k) => q.searchParams.has(k))) return null;
    const a = new URLSearchParams(); for (const k of ['model', 'test', 'n', 'think', 'new', 'record']) { const v = q.searchParams.get(k); if (v) a.set(k, v); q.searchParams.delete(k); }
    q.searchParams.delete('run'); history.replaceState(null, '', q); return a;
  })();
  window.addEventListener('message', (e) => {
    // This hub's own pages (the Test builder), or the page in the frame (the Arena is at its runner's address).
    if (e.origin !== location.origin && e.source !== frame.contentWindow) return;
    // + New in the Arena, its Test builder button, or Edit on a test of yours: the Test builder window.
    if (e.data?.agentic === 'new-test') openBuilder({ fresh: true });
    if (e.data?.agentic === 'open-builder') openBuilder({ test: typeof e.data.test === 'string' ? e.data.test : null });
    // From the builder in the window: a test saved (the Arena reads its tests again), or esc.
    if (e.source === bframe.contentWindow && e.data?.agentic === 'tests-changed') arenaSay({ agentic: 'arena-refresh' });
    if (e.source === bframe.contentWindow && e.data?.agentic === 'builder-close') closeBuilder();
    // ▶ Run in the Test builder: the window closes and the Arena has that test (or that level's tests) picked.
    // Nothing starts by itself. The Arena already open is told; one not open yet is opened with it.
    if (e.data?.agentic === 'run-test' && typeof e.data.test === 'string') {
      const test = e.data.test.slice(0, 80), n = e.data.n != null ? String(e.data.n).slice(0, 80) : null;
      if (e.source === bframe.contentWindow) closeBuilder({ ask: false });
      if (arenaSay({ agentic: 'arena-pick', test, ...(n != null ? { n } : {}) })) return;
      runAsk = new URLSearchParams({ test, ...(n != null ? { n } : {}), at: String(Date.now()) }); open('arena');
    }
  });
  // The Arena in the frame, once its page has loaded (it is at its runner's own address, so a message goes to any origin: it
  // carries only a test's name). A message it cannot take yet is not sent.
  let frameReady = false;
  frame.addEventListener('load', () => { frameReady = true; });
  function arenaSay(msg) {
    if (!frameReady || !(frame.getAttribute('src') ?? '').startsWith('/arena')) return false;
    try { frame.contentWindow.postMessage(msg, '*'); return true; } catch { return false; }
  }
  // The Test builder window: the builder page (on this hub, with its tests) over the whole hub. It opens on a new
  // test, one test of yours, or where it was; ✕, esc or the builder's own esc close it, asking first if a test has
  // changes not saved. A click beside it does nothing, so no work is lost by a slip.
  function openBuilder({ test = null, fresh = false } = {}) {
    if (bm.classList.contains('on') && !closeBuilder()) return;
    if (!(frame.getAttribute('src') ?? '').startsWith('/arena')) open('arena');
    const a = new URLSearchParams({ modal: '1' }); if (fresh) a.set('new', '1'); else if (test) a.set('test', test.slice(0, 120));
    bframe.src = `/builder?${a}`; bm.classList.add('on');
    const q = new URL(location.href); q.searchParams.set('builder', fresh ? 'new' : test || '1'); history.replaceState(null, '', q);
    bframe.focus();
  }
  function closeBuilder({ ask = true } = {}) {
    if (!bm.classList.contains('on')) return true;
    const w = bframe.contentWindow;
    if (ask && w?.builderDirty?.() && !confirm('Close the Test builder without saving? What you changed in the test is lost.')) return false;
    if (w) w.builderLeaving = true;
    bm.classList.remove('on'); bframe.src = 'about:blank';
    const q = new URL(location.href); q.searchParams.delete('builder'); history.replaceState(null, '', q);
    arenaSay({ agentic: 'arena-refresh' });
    frame.focus();
    return true;
  }
  $('#bm-x').onclick = () => closeBuilder();
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && bm.classList.contains('on')) { e.preventDefault(); closeBuilder(); } });
  const kb = (b) => b >= 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' KB';

  function setTab(tab) { for (const b of document.querySelectorAll('header > button')) b.classList.toggle('on', b.dataset.tab === tab); const q = new URL(location.href); q.searchParams.set('tab', tab); history.replaceState(null, '', q); }
  // The Structure tab's two pages (30 Sep 2026): Structure, the folder map (the pinned DOCS page), and Flow (/flow). The
  // switch beside the tab shows only there; a click on the tab always opens Structure, and ?view=flow keeps Flow on a reload.
  function setView(view) {
    for (const b of menu.querySelectorAll('button')) b.setAttribute('aria-checked', String(b.dataset.view === (view ?? '')));
    closeMenu();
    const q = new URL(location.href); if (view === 'flow') q.searchParams.set('view', 'flow'); else q.searchParams.delete('view'); history.replaceState(null, '', q);
  }
  function show(url, label) {
    list.classList.remove('on'); frame.classList.remove('off');
    if (frame.getAttribute('src') !== url) { frameReady = false; frame.src = url; }
    now.textContent = label || ''; own.href = url; own.style.display = '';
    const q = new URL(location.href); if (url.startsWith('/docs/')) q.searchParams.set('page', url.slice(6)); else q.searchParams.delete('page'); history.replaceState(null, '', q);
  }
  function showList() {
    frame.classList.add('off'); list.classList.add('on'); now.textContent = ''; own.style.display = 'none';
    const q = new URL(location.href); q.searchParams.delete('page'); history.replaceState(null, '', q);
    if (!docs) { list.innerHTML = '<p class="note">Reading the DOCS folder…</p>'; return; }
    if (docs.missing) { list.innerHTML = `<p class="note">The DOCS folder was not found. Agentic Coder looks for <code>${docs.dir || 'docs'}</code> in the repo. Set <code>AGENTIC_DOCS</code> to point somewhere else.</p>`; return; }
    const row = (p, kind) => `<div class="row" data-file="${p.file}"><span><span class="t">${p.title || p.name}</span>${p.title ? `<span class="f">${p.name}</span>` : ''}</span><span class="k">${kind || p.kind}</span><span class="m">${p.saved} · ${kb(p.size)}</span></div>`;
    const pinned = [docs.pinned.harness, docs.pinned.structure].filter(Boolean);
    const BLURB = { unsorted: 'at the top level, not filed yet', diagrams: 'how Agentic Coder is built and how a request moves through it', reports: 'what got built, day by day', tests: 'measured runs, checks and the chart-bug rounds', 'design rounds': 'looks that were tried and picked', other: 'kept here, not about Agentic Coder itself', 'older versions': 'replaced by a newer page, kept as the record' };
    list.innerHTML = (pinned.length ? '<h2>Pinned</h2>' + pinned.map((p) => row(p, p === docs.pinned.harness ? 'harness' : 'structure')).join('') : '')
      + docs.groups.map((g) => { const ps = docs.pages.filter((p) => p.group === g); return `<h2>${g} · ${ps.length}${BLURB[g] ? ` <span style="text-transform:none;letter-spacing:0;font-weight:400">— ${BLURB[g]}</span>` : ''}</h2>` + ps.map((p) => row(p)).join(''); }).join('')
      + `<p class="note" style="margin-top:18px;font-size:12px">Read live from <code>${docs.dir}</code>: each group is a subfolder there. Save a page into one and it shows here on the next visit; a file at the top level shows as unsorted.</p>`;
  }
  // The menu under the Structure tab: a click on the tab while it is open (or on its caret) shows it; a pick, Esc or a click elsewhere closes it.
  function openMenu() { const r = stab.getBoundingClientRect(); menu.style.left = `${Math.max(8, Math.min(r.left, innerWidth - 364))}px`; menu.style.top = `${r.bottom + 6}px`; menu.hidden = false; stab.setAttribute('aria-expanded', 'true'); (menu.querySelector('[aria-checked="true"]') ?? menu.querySelector('button')).focus(); }
  function closeMenu() { menu.hidden = true; stab.setAttribute('aria-expanded', 'false'); }
  function open(tab, page, view) {
    tab = ALIAS[tab] ?? tab;
    // Flow was a tab of its own until 30 Sep 2026: an old address or `coding hub flow` opens it in Structure.
    if (tab === 'flow') { tab = 'structure'; view = 'flow'; }
    if (frame.getAttribute('src') === '/instructions' && tab !== 'instructions' && frame.contentWindow?.instructionsDirty?.()) {
      if (!confirm('Discard unsaved instruction edits and leave this tab?')) return;
      frame.contentWindow.instructionsLeaving = true;
      frame.src = 'about:blank';
    }
    setTab(tab);
    setView(tab === 'structure' && !page ? (view === 'flow' ? 'flow' : 'structure') : null);
    if (tab === 'weights') return show('/weights', 'each model\'s weights, alone or side by side');
    if (tab === 'help') return show('/help', 'every command, key and setting');
    if (tab === 'instructions') return show('/instructions', 'general behavior and planning');
    if (tab === 'harness' && !page) return show('/harness', 'one harness, every model beside the others');
    if (tab === 'structure' && view === 'flow') return show('/flow', 'how Agentic Coder works, as a flow diagram');
    // The Arena runs on its own address (its runner's): /arena starts it when it is not up and sends the frame there.
    if (tab === 'arena') { const a = runAsk ? runAsk.toString() : ''; runAsk = null; return show(`/arena${a ? `?${a}` : ''}`, 'run a test on one model, or battle two'); }
    if (tab === 'memory' && !page) return show('/memory', 'what Agentic Coder remembers');
    if (tab === 'docs' && !page) return showList();
    if (!docs) { list.classList.add('on'); frame.classList.add('off'); list.innerHTML = '<p class="note">Reading the DOCS folder…</p>'; return; }
    const p = page ? docs.pages.find((x) => x.file === page) : docs.pinned[tab];
    // No folder map in the DOCS folder: the Structure tab says so and keeps its switch, so Flow is still one click away.
    if (!p && tab === 'structure') { frame.classList.add('off'); list.classList.add('on'); now.textContent = ''; own.style.display = 'none'; list.innerHTML = docs.missing ? `<p class="note">The DOCS folder was not found, so the folder map cannot be shown. Agentic Coder looks for <code>${docs.dir || 'docs'}</code> in the repo. Flow, beside it, needs no folder.</p>` : '<p class="note">No structure page in the DOCS folder. Flow, beside it, needs no page.</p>'; return; }
    if (!p) { setTab('docs'); showList(); if (!docs.missing) list.insertAdjacentHTML('afterbegin', `<p class="note">No ${page ? `page called <code>${page}</code>` : `${tab} page`} in the DOCS folder.</p>`); return; }
    show('/docs/' + p.file.split('/').map(encodeURIComponent).join('/'), p.title || p.name);
  }
  for (const b of document.querySelectorAll('header > button')) b.onclick = (e) => {
    if (b === stab && (b.classList.contains('on') || e.target.closest('.caret'))) { if (!b.classList.contains('on')) open('structure'); return menu.hidden ? openMenu() : closeMenu(); }
    open(b.dataset.tab);
  };
  for (const b of menu.querySelectorAll('button')) b.onclick = () => open('structure', null, b.dataset.view);
  document.addEventListener('click', (e) => { if (!menu.hidden && !menu.contains(e.target) && !stab.contains(e.target)) closeMenu(); });
  document.addEventListener('keydown', (e) => {
    if (menu.hidden) return;
    const items = [...menu.querySelectorAll('button')], at = items.indexOf(document.activeElement);
    if (e.key === 'Escape') { closeMenu(); stab.focus(); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); items[(at + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length].focus(); }
    else if (e.key === '1' || e.key === '2') items[Number(e.key) - 1].click();
  });
  // A click inside the page below moves the focus into its frame: the hub's window loses it, and the menu closes.
  window.addEventListener('blur', () => { if (!menu.hidden) closeMenu(); });
  list.onclick = (e) => { const r = e.target.closest('.row'); if (r) open('docs', r.dataset.file); };

  const q = new URL(location.href); const tab = ALIAS[q.searchParams.get('tab')] ?? (q.searchParams.get('tab') || 'weights'); const page = q.searchParams.get('page');
  const view = q.searchParams.get('view');
  // Flow, in the Structure tab, opens before the DOCS folder is read, like the tabs built into the app.
  const builtIn = (t) => t === 'weights' || t === 'help' || t === 'harness' || t === 'flow' || (t === 'structure' && view === 'flow') || t === 'arena' || t === 'memory' || t === 'instructions';
  if (builtIn(tab) && !page) { open(tab, null, view); if (builderAsk) openBuilder(builderAsk); builderAsk = null; } else { setTab(page ? 'docs' : tab); list.classList.add('on'); frame.classList.add('off'); list.innerHTML = '<p class="note">Reading the DOCS folder…</p>'; }
  fetch('/docs.json').then((r) => r.json()).then((d) => { docs = d; if (!builtIn(tab) || page) open(page ? 'docs' : tab, page); }).catch(() => { docs = { missing: true, pinned: {}, pages: [] }; if (!builtIn(tab)) open(tab); });
})();
</script>
</body>
