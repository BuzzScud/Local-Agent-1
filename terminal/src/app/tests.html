<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic Coder test record</title>
<style>
:root{--bg:#f7f6f2;--card:#ffffff;--ink:#1c1b18;--mute:#6b675e;--faint:#a19c90;--line:#e3dfd5;--soft:#efece4;--best:#f3d9cc;--bestInk:#8a3a1c;--up:#1d7a46;--down:#b3261e;--warn:#8a5a00;--c-before:#2a78d6;--c-after:#eb6834}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15161a;--card:#1d1f24;--ink:#ecebe6;--mute:#a4a19a;--faint:#6f6c66;--line:#2e3037;--soft:#24262c;--best:#4a2b1f;--bestInk:#ffb899;--up:#5fd08f;--down:#ff8a80;--warn:#f0c060;--c-before:#3987e5;--c-after:#d95926}}
:root[data-theme="dark"]{--bg:#15161a;--card:#1d1f24;--ink:#ecebe6;--mute:#a4a19a;--faint:#6f6c66;--line:#2e3037;--soft:#24262c;--best:#4a2b1f;--bestInk:#ffb899;--up:#5fd08f;--down:#ff8a80;--warn:#f0c060;--c-before:#3987e5;--c-after:#d95926}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1120px;margin:0 auto;padding:28px 16px 64px;position:relative}
/* The model picker sits in the empty space left of the page (no panel of its own): it follows the scroll there. When the window is too narrow to leave that space, it is a row of buttons under the title instead. */
aside{margin:14px 0 4px}
.side-h{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin:0 0 8px}
.models{display:flex;flex-wrap:wrap;gap:8px}
.models button{font:inherit;display:block;text-align:left;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--mute);cursor:pointer}
.models button:hover{color:var(--ink);border-color:var(--faint)}.models button:focus-visible{outline:2px solid var(--c-before);outline-offset:1px}
.models button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.models .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}.models .top b{font-weight:400}.models button[aria-pressed="true"] .top b{font-weight:600}
.models .top span{color:var(--faint);font-variant-numeric:tabular-nums}.models .s,.models hr{display:none}
.side-note{color:var(--mute);font-size:12px;margin:8px 0 0}
@media (min-width:1580px){
  aside{position:absolute;right:100%;top:0;bottom:0;width:212px;margin:0 8px 0 0}
  .side-in{position:sticky;top:28px}
  .models{flex-direction:column;gap:2px}
  .models button{width:100%;padding:8px 10px;border-color:transparent;border-radius:10px;background:none}
  .models button:hover{background:var(--soft);border-color:transparent}
  .models button[aria-pressed="true"]{background:var(--soft);border-color:var(--faint)}
  .models .top{font-size:14px}.models .top b{font-weight:500}.models button[aria-pressed="true"] .top b{font-weight:700}
  .models .s{display:block;color:var(--mute);font-size:12px;margin-top:1px}
  .models hr{display:block;border:0;border-top:1px solid var(--line);margin:8px 10px}
  .side-note{margin:14px 10px 0}
}
h1{font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:0 0 6px}h2{font-size:20px;letter-spacing:-.01em;margin:40px 0 4px}h3{font-size:16px;margin:0 0 2px}p{margin:0 0 10px}a{color:inherit;text-underline-offset:3px}
.lede{color:var(--mute);max-width:780px}.sub{color:var(--mute);font-size:14px;margin-bottom:12px;max-width:840px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 4px}
.filters button{font:inherit;font-size:13px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--mute);cursor:pointer}
.filters button:hover{color:var(--ink);border-color:var(--faint)}.filters button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink);font-weight:600}
.filters button span{color:var(--faint);font-weight:400;margin-left:5px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.card .k{color:var(--mute);font-size:13px}.card .v{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:2px 0;font-variant-numeric:tabular-nums}
.card .n{font-size:13.5px}.card .m{color:var(--mute);font-size:12.5px;margin-top:4px}
.ok{color:var(--up)}.bad{color:var(--down)}.stop{color:var(--warn)}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{padding:9px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}tr:last-child td{border-bottom:none}
thead th{font-size:13px;color:var(--mute);font-weight:600;background:var(--soft)}
td.t{white-space:normal;min-width:240px}td.t b{display:block;font-weight:600}td.t span{display:block;color:var(--mute);font-size:13px;max-width:520px}
td .q{display:block;color:var(--mute);font-size:12px}td.r{font-weight:600}td.p{font-size:13.5px}td.t code{display:block;margin-top:3px}
code{font:12px ui-monospace,Menlo,monospace;color:var(--mute);overflow-wrap:anywhere}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px;margin-top:12px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px;min-width:0}figcaption{color:var(--mute);font-size:13px;margin-top:8px}
.scroll{overflow-x:auto}.scroll svg{min-width:440px}
svg{display:block;width:100%;max-width:620px;height:auto;overflow:visible;margin:0 auto}svg text{fill:var(--mute);font-size:11px;font-family:inherit}svg .grid{stroke:var(--line);stroke-width:1}svg .axis{stroke:var(--faint);stroke-width:1}svg .lbl{fill:var(--ink);font-weight:600}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:22px;color:var(--mute);margin-top:18px;max-width:780px}
.foot{margin-top:40px;color:var(--mute);font-size:13px;max-width:860px}.foot li{margin:3px 0}
@media (max-width:600px){h1{font-size:24px}th,td{padding:8px 10px}}
</style>
</head>
<body>
<main>
<h1>Agentic Coder test record</h1>
<p class="lede" id="lede">Reading the record…</p>
<aside aria-label="Model"><div class="side-in">
<p class="side-h" id="side-h">Model</p>
<nav class="models" id="models" aria-labelledby="side-h"></nav>
<p class="side-note" id="sidenote"></p>
</div></aside>
<div class="filters" id="filters" role="group" aria-label="Which tests to show"></div>
<div class="cards" id="cards"></div>
<section id="trend"></section>
<div id="tables"></div>
<section class="foot" id="foot"></section>
</main>
<!--DATA-->
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const built = $('data');
  let data;
  try { data = built ? JSON.parse(built.textContent) : await (await fetch('/tests.json', { cache: 'no-store' })).json(); }
  catch { $('lede').textContent = 'The test record could not be read. Open this page from Agentic Coder with /docs, then the Tests tab.'; return; }
  const live = !built;
  const all = data.rows ?? [], KINDS = data.kinds ?? {}, models = data.models ?? [];
  let rows = all, order = [], kind = 'all'; // the rows in view (the model picked, then the kind), the kinds in them, the kind shown
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const day = (iso) => { const d = new Date(iso); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };
  const clock = (iso) => { const d = new Date(iso); const h = d.getHours(); return `${h % 12 || 12}:${String(d.getMinutes()).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };
  const secs = (s) => (s == null ? '—' : `${s.toLocaleString()} s`);
  const mins = (s) => (s == null || s < 90 ? '' : `${Math.floor(s / 60)} min ${String(s % 60).padStart(2, '0')} s`);
  const mark = (r) => (r.result === 'pass' ? ['ok', '✓'] : r.result === 'stopped' ? ['stop', '■'] : ['bad', '✗']);
  const words = (r) => (r.total != null ? `${r.passed} of ${r.total}${r.result === 'stopped' ? ' · stopped' : ''}` : r.result === 'pass' ? 'passed' : r.result === 'stopped' ? 'stopped' : 'failed');
  const result = (r) => { const [c, m] = mark(r); return `<span class="${c}">${m} ${esc(words(r))}</span>`; };
  // In the hub a results page opens in the hub; in the saved copy it is a file beside this one.
  const href = (page) => (live ? `/?tab=docs&page=${encodeURIComponent(page)}` : `../${page.split('/').map(encodeURIComponent).join('/')}`);
  const RETIRED = { bonsai: 'Bonsai 27B' }; // a model whose file is no longer on this Mac: its runs are kept, it has no row in the panel
  const modelName = (id) => models.find((m) => m.id === id)?.name ?? RETIRED[id] ?? id ?? '';
  const settings = (r) => [r.effort ? `effort ${r.effort}` : '', r.ctx ? `${Math.round(r.ctx / 1024)}k memory` : ''].filter(Boolean).join(' · ') || '—';

  let pick = 'all'; // 'all' · a model's id · 'none' (a run of no one model: the unit tests, the checks)
  try { const m = new URL(location.href).searchParams.get('model') ?? localStorage.getItem('agentic-tests-model'); if (m && (m === 'all' || m === 'none' || models.some((x) => x.id === m))) pick = m; } catch { /* no storage */ }
  const inPick = (r) => pick === 'all' || (pick === 'none' ? !r.model : r.model === pick);

  let shown = 'all'; // the kind asked for; `kind` is what it comes to once the model is picked
  try { const s = new URL(location.href).searchParams.get('kind') ?? localStorage.getItem('agentic-tests-kind'); if (s && (s === 'all' || s in KINDS)) shown = s; } catch { /* no storage */ }
  function filters() {
    $('filters').innerHTML = [['all', 'All', rows.length], ...order.map((k) => [k, KINDS[k][0], rows.filter((r) => r.kind === k).length])]
      .map(([k, name, n]) => `<button type="button" data-kind="${k}" aria-pressed="${k === kind}">${esc(name)}<span>${n}</span></button>`).join('');
  }
  $('filters').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; shown = b.dataset.kind; try { localStorage.setItem('agentic-tests-kind', shown); } catch { /* no storage */ } draw(); };

  // The side panel: All models, each model whose file is on this Mac, then the runs that are of no one model.
  function side() {
    const latest = (id) => all.find((r) => r.model === id && r.kind === 'tasks' && r.total === 28 && !r.part && r.result !== 'stopped');
    const item = (id, name, n, sub) => `<button type="button" data-model="${esc(id)}" aria-pressed="${id === pick}"><span class="top"><b>${esc(name)}</b><span>${n}</span></span><span class="s">${esc(sub)}</span></button>`;
    const none = all.filter((r) => !r.model).length, gone = all.filter((r) => r.model && !models.some((m) => m.id === r.model));
    $('models').innerHTML = item('all', 'All models', all.length, 'every run')
      + models.map((m) => { const l = latest(m.id); return item(m.id, m.name, all.filter((r) => r.model === m.id).length, l ? `28 tasks: ${l.passed} of 28 · ${day(l.at)}` : 'no full 28-task run yet'); }).join('')
      + (none ? `<hr>${item('none', 'Not model-specific', none, 'unit tests and checks')}` : '');
    const names = [...new Set(gone.map((r) => modelName(r.model)))];
    $('sidenote').textContent = gone.length ? `${gone.length} run${gone.length === 1 ? '' : 's'} of ${names.join(' and ')}, no longer on this Mac, show under All models only.` : '';
  }
  $('models').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; pick = b.dataset.model; try { localStorage.setItem('agentic-tests-model', pick); } catch { /* no storage */ } draw(); };

  const who = () => (pick === 'all' ? 'Every test run' : pick === 'none' ? 'Every run of no one model (the unit tests and checks)' : `Every run of ${modelName(pick)}`);
  function head() {
    if (!all.length) { $('lede').textContent = 'Every test run on this Mac, newest first.'; return; }
    if (!rows.length) { $('lede').textContent = `${who()} on this Mac, newest first.`; return; }
    $('lede').textContent = `${who()} on this Mac, newest first: ${rows.length} run${rows.length === 1 ? '' : 's'} since ${day(rows[rows.length - 1].at)}. A run adds its own line when it finishes.`;
  }

  function cards() {
    $('cards').innerHTML = order.filter((k) => kind === 'all' || kind === k).map((k) => {
      const mine = rows.filter((x) => x.kind === k);
      const r = mine.find((x) => !x.part && x.result !== 'stopped') ?? mine[0]; const [c] = mark(r);
      return `<div class="card"><div class="k">${esc(KINDS[k][0])} · latest${k === 'bug' ? '' : r.part ? ' run, part of the set' : ' full run'}</div><div class="v ${c}">${esc(mark(r)[1])} ${esc(words(r))}</div><div class="n">${esc(r.name)}</div><div class="m">${day(r.at)} · ${clock(r.at)}${r.secs != null ? ` · ${secs(r.secs)}` : ''}${r.code ? ` · code ${esc(r.code)}` : ''}${pick === 'all' && r.model ? ` · ${esc(modelName(r.model))}` : ''}</div></div>`;
    }).join('');
  }

  // The full 28-task runs at effort Off, oldest first: tasks passed, and seconds in all.
  function line({ title, pts, get, fmt, floor, top, cap }) {
    const W = 560, H = 262, L = 52, R = 22, T = 22, B = 46;
    const vals = pts.map(get), lo = floor ?? Math.min(...vals), hi = Math.max(...vals);
    const raw = (hi - lo || 1) / 4, pow = 10 ** Math.floor(Math.log10(raw)), f = raw / pow, step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * pow;
    const y0 = Math.floor(lo / step) * step, y1 = Math.max(top ?? 0, Math.ceil(hi / step) * step + (top ? 0 : step * 0.5));
    const X = (i) => L + (pts.length === 1 ? 0.5 : i / (pts.length - 1)) * (W - L - R);
    const Y = (v) => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">`;
    for (let v = y0; v <= y1 + 1e-9; v += step) { s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 8}" y="${Y(v) + 3.5}" text-anchor="end">${Math.round(v).toLocaleString()}</text>`; }
    s += `<line class="axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>`;
    const every = Math.ceil(pts.length / 7);
    pts.forEach((p, i) => { if (i % every === 0 || i === pts.length - 1) { const a = i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle'; s += `<text x="${X(i)}" y="${H - B + 15}" text-anchor="${a}">${day(p.at)}</text><text x="${X(i)}" y="${H - B + 28}" text-anchor="${a}" style="font-size:10px">${clock(p.at)}</text>`; } });
    s += `<polyline fill="none" stroke="var(--c-before)" stroke-width="2" stroke-linejoin="round" points="${pts.map((p, i) => `${X(i)},${Y(get(p))}`).join(' ')}"/>`;
    pts.forEach((p, i) => {
      s += `<g><circle cx="${X(i)}" cy="${Y(get(p))}" r="4.5" fill="var(--c-before)" stroke="var(--card)" stroke-width="2"/><circle cx="${X(i)}" cy="${Y(get(p))}" r="13" fill="transparent"><title>${esc(p.name)} · ${day(p.at)} ${clock(p.at)} · ${esc(fmt(get(p)))}${p.code ? ` · code ${esc(p.code)}` : ''}</title></circle></g>`;
      if (i === 0 || i === pts.length - 1) s += `<text class="lbl" x="${X(i)}" y="${Y(get(p)) - 10}" text-anchor="${i === 0 ? 'start' : 'end'}">${esc(fmt(get(p)))}</text>`;
    });
    return `<figure><h3>${esc(title)}</h3><div class="scroll">${s}</svg></div><figcaption>${cap}</figcaption></figure>`;
  }
  function trend() {
    const pts = rows.filter((r) => r.kind === 'tasks' && r.total === 28 && !r.part && r.result !== 'stopped' && (!r.effort || /^(off|low)$/i.test(r.effort))).reverse();
    if (pts.length < 2 || (kind !== 'all' && kind !== 'tasks')) { $('trend').innerHTML = ''; return; }
    $('trend').innerHTML = `<h2>The 28-task check over time</h2><p class="sub">Each full run of the 28 practice tasks at the default effort, oldest on the left. Point at a dot for the run behind it; every run is in the table below.</p><div class="charts">${
      line({ title: 'Tasks passed, of 28', pts, get: (p) => p.passed, fmt: (v) => `${v} of 28`, floor: Math.min(20, ...pts.map((p) => p.passed)), top: 28, cap: 'Higher is better; 28 is every task.' })}${
      line({ title: 'Seconds for all 28', pts, get: (p) => p.secs, fmt: (v) => `${v.toLocaleString()} s`, cap: 'Lower is better. One run each, so a few percent either way is run-to-run noise.' })}</div>`;
  }

  const KEEP = 30; // unit test runs shown; the rest stay in the record
  function tables() {
    $('tables').innerHTML = order.filter((k) => kind === 'all' || kind === k).map((k) => {
      const mine = rows.filter((r) => r.kind === k), list = k === 'suite' ? mine.slice(0, KEEP) : mine;
      return `<h2>${esc(KINDS[k][0])}</h2><p class="sub">${esc(KINDS[k][1][0].toUpperCase() + KINDS[k][1].slice(1))}. ${mine.length} run${mine.length === 1 ? '' : 's'}${mine.length > list.length ? `, the newest ${list.length} shown` : ''}.</p>
<div class="wrap"><table><thead><tr><th>When</th><th>Test</th><th>Code</th><th>Settings</th><th>Result</th><th>Time</th><th>Results page</th></tr></thead><tbody>${list.map((r) => `<tr>
<td>${day(r.at)}<span class="q">${clock(r.at)}</span></td>
<td class="t"><b>${esc(r.name)}</b>${r.note ? `<span>${esc(r.note)}</span>` : ''}${r.raw ? `<code>${esc(r.raw)}</code>` : ''}</td>
<td>${r.code ? `<code>${esc(r.code)}</code>` : '—'}</td>
<td>${esc(settings(r))}${pick === 'all' && r.model ? `<span class="q">${esc(modelName(r.model))}</span>` : ''}</td>
<td class="r">${result(r)}</td>
<td>${secs(r.secs)}${mins(r.secs) ? `<span class="q">${mins(r.secs)}</span>` : ''}</td>
<td class="p">${r.page ? `<a href="${href(r.page)}"${live ? ' target="_top"' : ''}>open the page</a>` : '—'}</td></tr>`).join('')}</tbody></table></div>`;
    }).join('');
  }
  function draw() {
    rows = all.filter(inPick);
    order = Object.keys(KINDS).filter((k) => rows.some((r) => r.kind === k));
    kind = shown === 'all' || order.includes(shown) ? shown : 'all';
    side(); head();
    if (!rows.length) {
      $('filters').innerHTML = ''; $('trend').innerHTML = ''; $('tables').innerHTML = '';
      $('cards').innerHTML = all.length
        ? `<div class="empty">No run of ${esc(modelName(pick))} has been recorded yet. Run the 28-task check on it (<code>bun run eval --model ${esc(pick)}</code>) and its line will appear here.</div>`
        : '<div class="empty">No test has been recorded yet. The 28-task check (<code>bun run eval</code>), the real requests (<code>bun run eval:words</code>) and the unit tests (<code>bun run test</code>) each add a line here when they finish.</div>';
      return;
    }
    filters(); cards(); trend(); tables();
  }
  draw();
  $('foot').innerHTML = `<h3 style="color:var(--ink)">How this record is kept</h3><ul>
<li>The record is one file on this Mac, <code>${esc(data.file ?? '')}</code>, one line per run. The 28-task check, the real requests, a real-bug run and the unit tests each add their line when they finish; any other check adds one with <code>recordTest()</code> from <code>models/evals/record.mjs</code>.</li>
<li>The side panel picks a model. A run is filed under the model it used (the <code>model</code> on its line). A line written before that was added is filed by the model its results folder or its words name; the unit tests and the checks are of no one model, so they sit under Not model-specific.</li>
<li>${live ? 'This tab reads the file each time it opens, so it is always current. A saved copy of this page is kept in the DOCS folder under tests.' : `This is the saved copy, written ${day(data.made)} at ${clock(data.made)}. In Agentic Coder, <code>/docs</code> and then the Tests tab shows the record as it is now.`}</li>
<li>Raw results stay on this Mac under <code>models/&lt;model&gt;/results/</code>; a results page, where one was made, is in the DOCS folder.</li></ul>
<p>Nothing on this page loads from the internet.</p>`;
})();
</script>
</body>
</html>
