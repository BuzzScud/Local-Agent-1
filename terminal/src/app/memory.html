<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic Coder memory</title>
<style>
:root{--bg:#f7f6f2;--card:#ffffff;--ink:#1c1b18;--mute:#6b675e;--faint:#a19c90;--line:#e3dfd5;--soft:#efece4;--up:#1d7a46;--down:#b3261e;--warn:#8a5a00;--accent:#2a78d6;--tint:rgba(42,120,214,.08)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15161a;--card:#1d1f24;--ink:#ecebe6;--mute:#a4a19a;--faint:#6f6c66;--line:#2e3037;--soft:#24262c;--up:#5fd08f;--down:#ff8a80;--warn:#f0c674;--accent:#5a9ceb;--tint:rgba(90,156,235,.12)}}
:root[data-theme="dark"]{--bg:#15161a;--card:#1d1f24;--ink:#ecebe6;--mute:#a4a19a;--faint:#6f6c66;--line:#2e3037;--soft:#24262c;--up:#5fd08f;--down:#ff8a80;--warn:#f0c674;--accent:#5a9ceb;--tint:rgba(90,156,235,.12)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1120px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:0 0 6px}h2{font-size:20px;letter-spacing:-.01em;margin:40px 0 4px}p{margin:0 0 10px}
.lede{color:var(--mute);max-width:780px;overflow-wrap:anywhere}.sub{color:var(--mute);font-size:14px;margin-bottom:12px;max-width:840px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.card .k{color:var(--mute);font-size:13px}.card .v{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:2px 0;font-variant-numeric:tabular-nums}
.card .m{color:var(--mute);font-size:12.5px;margin-top:4px;overflow-wrap:anywhere}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;table-layout:fixed}
/* The same columns in every table, so the two memories line up. */
col.c-kind{width:170px}col.c-trust{width:150px}col.c-used{width:140px}col.c-act{width:222px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:none}
thead th{font-size:13px;color:var(--mute);font-weight:600;background:var(--soft);white-space:nowrap}
td.t .x{display:block;overflow-wrap:anywhere}td.t .q{display:block;color:var(--mute);font-size:12.5px;margin-top:3px}
td.t ol{margin:4px 0 0;padding-left:20px;color:var(--mute);font-size:13.5px}
td.n{white-space:nowrap}td.a{white-space:nowrap;text-align:right}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip.always,.chip.pinned{background:var(--tint);border-color:transparent;color:var(--accent)}
.pos{color:var(--up);font-weight:600}.neg{color:var(--down);font-weight:600}
button{font:inherit;font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--mute);cursor:pointer}
button:hover{color:var(--ink);border-color:var(--faint)}button.go{color:var(--ink);border-color:var(--ink)}
button:disabled{opacity:.5;cursor:default}
textarea{font:inherit;width:100%;min-height:74px;padding:8px 10px;border:1px solid var(--faint);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical}
.row-actions{display:flex;gap:6px;margin-top:8px}
details{margin-top:14px}summary{cursor:pointer;color:var(--mute);font-size:14px}
.log{list-style:none;padding:0;margin:0}.log li{padding:8px 14px;border-bottom:1px solid var(--line);font-size:14px;display:grid;grid-template-columns:150px 1fr;gap:12px}
.log li:last-child{border-bottom:none}.log .w{color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.said{font-size:13.5px;color:var(--mute)}.said.bad{color:var(--down)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:22px;color:var(--mute);margin-top:18px;max-width:780px}
.foot{margin-top:40px;color:var(--mute);font-size:13px;max-width:860px}.foot li{margin:3px 0}
code{font:12px ui-monospace,Menlo,monospace;color:var(--mute);overflow-wrap:anywhere}
/* Narrow windows: each fact is a block of its own, so nothing scrolls sideways. */
@media (max-width:900px){
  thead,colgroup{display:none}table,tbody,tr,td{display:block}
  tr{padding:12px 14px;border-bottom:1px solid var(--line)}tr:last-child{border-bottom:none}
  td{padding:0;border:none}td.t{min-width:0}
  td.n{display:inline-block;margin:8px 14px 0 0;vertical-align:top}td.n:empty{display:none}
  td.n .q{display:inline !important;margin-left:6px}
  td.a{text-align:left;margin-top:10px;white-space:normal}
  td.n:nth-of-type(3)::before{content:"trust ";color:var(--mute);font-weight:400}
  td.n:nth-of-type(4)::before{content:"used ";color:var(--mute)}
}
@media (max-width:600px){h1{font-size:24px}.log li{grid-template-columns:1fr;gap:2px}.card .v{font-size:20px}}
</style>
</head>
<body>
<main>
<h1>Agentic Coder memory</h1>
<p class="lede" id="lede">Reading the memory…</p>
<div class="cards" id="cards"></div>
<div id="parts"></div>
<section id="changes"></section>
<section class="foot" id="foot"></section>
</main>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const KIND = { you: 'about you', project: 'project', worked: 'worked', failed: 'failed', mistake: 'mistake', recipe: 'recipe' };
  const TITLE = { you: 'About you', project: 'This project' };
  const WHAT = { add: 'saved', replace: 'replaced', retire: 'taken out of use', restore: 'brought back', edit: 'edited by you', undo: 'a save taken back', trust: 'trust changed', pin: 'pinned', unpin: 'unpinned' };
  let data; let editing = null; let said = '';
  const when = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); };
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

  async function load() {
    try { data = await (await fetch('/memory.json', { cache: 'no-store' })).json(); } catch { $('lede').textContent = 'The memory could not be read. Open this page from Agentic Coder with /memory open.'; return; }
    draw();
  }
  async function send(path, body) {
    said = '';
    try {
      const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body ?? {}) });
      const j = await r.json();
      if (!r.ok) { said = j.error || 'that did not work'; draw(true); return false; }
      data = j.data; editing = null; draw();
      return true;
    } catch { said = 'Agentic Coder is not answering. Is its window still open?'; draw(true); return false; }
  }

  function factRow(where, f, retired) {
    const key = `${where}/${f.id}`;
    const trust = f.always ? '' : `<span class="${f.trust > 0 ? 'pos' : f.trust < 0 ? 'neg' : ''}">${f.trust > 0 ? '+' : ''}${f.trust}</span><span class="q" style="display:block;color:var(--mute);font-size:12.5px">${f.passed} passed · ${f.failed} failed</span>`;
    const chips = `<span class="chip${f.always ? ' always' : ''}">${f.always ? 'always' : KIND[f.kind] || esc(f.kind)}</span>${f.pinned ? ' <span class="chip pinned">pinned</span>' : ''}`;
    const body = editing === key
      ? `<textarea id="edit" aria-label="The fact">${esc(f.text)}</textarea><div class="row-actions"><button class="go" data-do="save" data-k="${esc(key)}">Save</button><button data-do="cancel">Cancel</button></div>`
      : `<span class="x">${esc(f.text)}</span>${f.steps?.length ? `<ol>${f.steps.map((s) => `<li>${esc(s)}</li>`).join('')}</ol>` : ''}<span class="q">${retired ? esc(f.retired || 'taken out of use') : `${f.from ? `from ${esc(f.from)} · ` : ''}saved ${esc(f.saved || '')}`}</span>`;
    const acts = retired
      ? `<button data-do="restore" data-k="${esc(key)}">Bring back</button>`
      : `<button data-do="pin" data-k="${esc(key)}" data-on="${f.pinned ? 0 : 1}">${f.pinned ? 'Unpin' : 'Pin'}</button> <button data-do="edit" data-k="${esc(key)}">Edit</button> <button data-do="retire" data-k="${esc(key)}">Take out</button>`;
    return `<tr><td class="t">${body}</td><td class="n">${chips}</td><td class="n">${trust}</td><td class="n">${f.always ? 'every start' : `${f.used}${f.last ? `<span class="q" style="display:block;color:var(--mute);font-size:12.5px">last ${esc(f.last)}</span>` : ''}`}</td><td class="a">${acts}</td></tr>`;
  }
  const worth = (a, b) => Number(b.always) - Number(a.always) || Number(b.pinned) - Number(a.pinned) || b.trust - a.trust || b.used - a.used;

  function draw(keepScroll) {
    const y = window.scrollY;
    const all = data.parts.flatMap((p) => p.facts);
    const gone = data.parts.flatMap((p) => p.retired);
    const top = [...all].filter((f) => !f.always && f.trust > 0).sort((a, b) => b.trust - a.trust || b.used - a.used)[0];
    const textOf = new Map(data.parts.flatMap((p) => [...p.facts, ...p.retired].map((f) => [`${p.where}/${f.id}`, f.text])));
    const last = data.log.find((l) => l.what !== 'trust');
    $('lede').textContent = all.length
      ? `${plural(all.length, 'fact')} in use for ${data.cwd}. A fact comes back when a request fits it; the rules marked "always" are read at every start.`
      : `Nothing saved yet for ${data.cwd}. Agentic Coder saves what it learns after a task and when you quit.`;
    $('cards').innerHTML = data.parts.map((p) => `<div class="card"><div class="k">${TITLE[p.where]}</div><div class="v">${plural(p.facts.length, 'fact')}</div><div class="m">${esc(p.dir || '')}</div></div>`).join('')
      + `<div class="card"><div class="k">Most trusted</div><div class="v">${top ? `${top.trust > 0 ? '+' : ''}${top.trust}` : '–'}</div><div class="m">${top ? esc(top.text.length > 90 ? `${top.text.slice(0, 89)}…` : top.text) : 'no fact has passed a check yet'}</div></div>`
      + `<div class="card"><div class="k">Taken out of use</div><div class="v">${gone.length}</div><div class="m">kept, and can be brought back</div></div>`;
    $('parts').innerHTML = data.parts.map((p) => {
      const head = '<colgroup><col><col class="c-kind"><col class="c-trust"><col class="c-used"><col class="c-act"></colgroup><thead><tr><th>Fact</th><th>Kind</th><th>Trust</th><th>Used</th><th></th></tr></thead>';
      const rows = [...p.facts].sort(worth).map((f) => factRow(p.where, f, false)).join('');
      const old = p.retired.map((f) => factRow(p.where, f, true)).join('');
      return `<h2>${TITLE[p.where]}</h2><p class="sub">${p.where === 'you' ? 'How you like to work. It follows you into every project.' : 'Where things are here, what worked, what failed, and mistakes to avoid.'}</p>`
        + (rows ? `<div class="wrap"><table>${head}<tbody>${rows}</tbody></table></div>` : '<div class="empty">Nothing here yet.</div>')
        + (old ? `<details${p.retired.some((f) => editing === `${p.where}/${f.id}`) ? ' open' : ''}><summary>${plural(p.retired.length, 'fact')} taken out of use</summary><div class="wrap" style="margin-top:10px"><table>${head}<tbody>${old}</tbody></table></div></details>` : '');
    }).join('');
    const changes = data.log.filter((l) => l.what !== 'trust').slice(0, 12);
    $('changes').innerHTML = `<h2>Last changes</h2><div class="bar"><button id="undo"${changes.some((l) => ['add', 'replace', 'retire', 'restore', 'edit'].includes(l.what)) ? '' : ' disabled'}>Take back the last save</button><span class="said${said ? ' bad' : ''}" role="status">${esc(said)}</span></div>`
      + (changes.length ? `<div class="wrap"><ul class="log">${changes.map((l) => `<li><span class="w">${esc(when(l.at))}</span><span>${WHAT[l.what] || esc(l.what)} · ${TITLE[l.where]}${textOf.get(`${l.where}/${l.id}`) ? `: ${esc(textOf.get(`${l.where}/${l.id}`))}` : l.id ? `: <code>${esc(l.id)}</code>` : ''}${l.reason ? ` <span style="color:var(--mute)">(${esc(l.reason)})</span>` : ''}</span></li>`).join('')}</ul></div>` : '<div class="empty">No change yet.</div>');
    $('foot').innerHTML = `<ul><li>Trust goes up by 1 when the task passed its check after a fact was used, down by 1 when it failed or Agentic Coder got stuck, and down by 2 when you corrected or stopped Agentic Coder. At ${data.retireAt} a fact is taken out of use, unless it is pinned.</li><li>A fact not used in ${data.unusedDays} days, or about a file that is gone, is taken out of use when the memory is tidied.</li><li>The facts are plain files in the folders named above: they can be edited or deleted by hand as well.</li></ul>`;
    if (keepScroll || editing) window.scrollTo(0, y);
    const ta = $('edit'); if (ta) ta.focus();
  }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'undo') return void send('/memory/undo');
    const act = b.dataset.do; if (!act) return;
    const [where, id] = (b.dataset.k || '/').split('/');
    if (act === 'edit') { editing = b.dataset.k; said = ''; draw(true); }
    else if (act === 'cancel') { editing = null; draw(true); }
    else if (act === 'save') send('/memory/edit', { where, id, text: $('edit').value });
    else if (act === 'pin') send('/memory/pin', { where, id, pinned: b.dataset.on === '1' });
    else if (act === 'retire') send('/memory/retire', { where, id });
    else if (act === 'restore') send('/memory/restore', { where, id });
  });
  await load();
})();
</script>
</body>
</html>
