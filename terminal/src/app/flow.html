<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic Coder flow diagram</title>
<style>
/* The hub's own tokens (hub.html), the model's colour of the Harness tab, and the two part colours of the drawings. */
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --panel: #f3f3f0; --line: #e3e2dc; --line2: #c9c6bd;
  --ink: #0b0b0b; --ink2: #52514e; --ink3: #8a887f; --accent: #2a78d6;
  --model: #b45309; --modelbg: #fbf0e2; --ok: #1c8558; --bad: #b3261e; --badbg: #fdeceb;
  --t1: #2f5fd0; --t1bg: #eaf0fd; --t2: #1c8558; --t2bg: #e4f5ec;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page: #0d0d0d; --surface: #1a1a19; --panel: #232322; --line: #34342f; --line2: #4a4a44; --ink: #fff; --ink2: #c3c2b7; --ink3: #8f8e86; --accent: #3987e5; --model: #f4a35c; --modelbg: #2a2017; --ok: #4fc38d; --bad: #ff8b82; --badbg: #3a1e1c; --t1: #7fa3ff; --t1bg: #1b2440; --t2: #4fc38d; --t2bg: #13332a; }
}
:root[data-theme="dark"] { --page: #0d0d0d; --surface: #1a1a19; --panel: #232322; --line: #34342f; --line2: #4a4a44; --ink: #fff; --ink2: #c3c2b7; --ink3: #8f8e86; --accent: #3987e5; --model: #f4a35c; --modelbg: #2a2017; --ok: #4fc38d; --bad: #ff8b82; --badbg: #3a1e1c; --t1: #7fa3ff; --t1bg: #1b2440; --t2: #4fc38d; --t2bg: #13332a; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color-scheme: light dark; }
[hidden] { display: none !important; }
code { font-family: var(--mono); font-size: .9em; background: var(--panel); padding: 1px 5px; border-radius: 5px; }
h1, h2, h3, p { margin: 0; }
/* one tab fills the window: the drawing takes the room the words leave */
main { max-width: 1640px; height: 100%; margin: 0 auto; padding: 12px 24px; display: flex; flex-direction: column; min-height: 0; }
h1 { font-size: 21px; font-weight: 680; letter-spacing: -.01em; white-space: nowrap; }
h2 { font-size: 18px; font-weight: 650; }
h3 { font-size: 14.5px; font-weight: 650; }
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; flex: none; }
.dateline { color: var(--ink3); font-size: 13px; } .grow { flex: 1; }
nav { display: flex; gap: 6px; flex-wrap: wrap; margin: 9px 0 10px; flex: none; }
nav button { font: inherit; font-size: 14px; padding: 6px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
nav button[aria-selected="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.lead { color: var(--ink2); margin: 2px 0 8px; max-width: 1240px; flex: none; }
.lead b { color: var(--ink); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }

/* the model chips and tags: the same as on the Harness tab. With more than one model the names
   are buttons: a click draws the flow with that model alone */
.chips { display: inline-flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; white-space: nowrap; }
.chip .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; flex: none; background: var(--model); }
.tag { font-size: 11px; color: var(--ink3); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; margin-left: 7px; line-height: 17px; white-space: nowrap; }
.tag.live { color: var(--ok); border-color: currentColor; }
button.chip { font: inherit; font-size: 12.5px; color: var(--ink); cursor: pointer; }
button.chip:hover { border-color: var(--ink3); }
button.chip[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
button.chip[aria-pressed="true"] .tag { color: inherit; border-color: currentColor; opacity: .8; }

/* the drawings */
figure { margin: 0; flex: 1; min-height: 0; display: flex; }
svg { display: block; width: 100%; height: 100%; }
.legend { display: flex; gap: 22px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink2); margin: 6px 0 0; flex: none; align-items: center; }
.legend span { display: inline-flex; align-items: center; white-space: nowrap; }
.legend i { display: inline-block; margin-right: 6px; flex: none; }
.legend i.dotm { width: 9px; height: 9px; border-radius: 50%; background: var(--model); }
.legend i.ln { width: 26px; height: 0; border-top: 2px solid var(--ink3); }
.legend i.ln.m { border-top-color: var(--model); } .legend i.ln.dash { border-top-style: dashed; }
.legend i.twk { width: 22px; height: 11px; border-radius: 4px; background: var(--modelbg); border: 1px solid var(--model); }
.cap { margin: 4px 0 0; color: var(--ink2); font-size: 13px; max-width: 1300px; flex: none; }
svg text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
.node rect { fill: var(--surface); stroke: var(--line2); stroke-width: 1.3; }
.node.t1 rect { fill: var(--t1bg); stroke: var(--t1); }
.node.t2 rect { fill: var(--t2bg); stroke: var(--t2); }
.node.you rect { stroke: var(--ink); stroke-width: 1.6; }
.node.ghost rect { fill: transparent; stroke-dasharray: 5 4; stroke: var(--ink3); }
.node.bad rect { fill: var(--badbg); stroke: var(--bad); }
.node.mdl rect { fill: var(--modelbg); stroke: var(--model); }
.node.mdl.live rect { stroke-width: 2.2; }
text.h { font-size: 13.5px; font-weight: 650; fill: var(--ink); }
text.s { font-size: 11.5px; fill: var(--ink2); }
text.s.live { fill: var(--ok); font-weight: 600; } text.s.dim { fill: var(--ink3); } text.s.hi { fill: var(--ink); }
text.m, text.h.m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
tspan.cn { font-weight: 400; fill: var(--ink3); font-size: 11.5px; }
text.gl { font-size: 12px; font-weight: 700; letter-spacing: .08em; fill: var(--ink3); }
text.gq { font-size: 12.5px; fill: var(--ink); }
text.lab { font-size: 11.5px; fill: var(--ink); paint-order: stroke; stroke: var(--page); stroke-width: 4px; stroke-linejoin: round; }
text.lab.am { fill: var(--model); }
.grp rect { fill: none; stroke: var(--line2); stroke-width: 1.3; }
.grp.t1 rect { stroke: var(--t1); opacity: .7; } .grp.t1 text { fill: var(--t1); }
.grp.t2 rect { stroke: var(--t2); opacity: .7; } .grp.t2 text { fill: var(--t2); }
.grp text { font-size: 12px; font-weight: 700; letter-spacing: .06em; fill: var(--ink3); }
.ar { fill: none; stroke: var(--ink3); stroke-width: 1.6; }
.ar.d { stroke-dasharray: 5 4; } .ar.m { stroke: var(--model); }
.mk { fill: var(--ink3); } .mk.m { fill: var(--model); }
circle.dotm { fill: var(--model); }
/* the stages over the steps: the Harness tab's five, each over the steps it is made of */
.stage path { fill: none; stroke: var(--ink3); stroke-width: 1.2; }
.stage text { font-size: 11.5px; fill: var(--ink2); font-weight: 600; }
/* a number for each model: the same small row for every model */
.tw rect { fill: var(--modelbg); stroke: var(--model); stroke-width: .9; }
.tw text { font-size: 11px; }
.tw .twn { font-weight: 650; fill: var(--ink); } .tw .twv { fill: var(--ink2); font-variant-numeric: tabular-nums; }
.tw.best .twv { fill: var(--ink); font-weight: 650; }
.tw.sm text { font-size: 9.5px; } /* four models or more: smaller rows */
/* where it lives */
.cols { display: grid; grid-template-columns: 1.25fr 1fr; gap: 16px; }
.cols .card h3 { margin: 0 0 8px; }
.cols pre { margin: 0; font: 12.5px/1.55 var(--mono); white-space: pre; overflow-x: auto; }
.cols pre em { font-style: normal; color: var(--model); }
.note { color: var(--ink2); font-size: 13px; margin: 10px 0 0; }

/* a narrow window: the page scrolls down, a drawing scrolls inside its own frame, never the page sideways */
@media (max-width: 1100px) {
  html, body, main { height: auto; }
  .cols { grid-template-columns: minmax(0, 1fr); }
  figure { overflow-x: auto; } svg { min-width: 900px; height: auto; }
}
@media (max-width: 640px) { main { padding-left: 16px; padding-right: 16px; } .chip { white-space: normal; } h1 { white-space: normal; } }
</style>
</head>
<body>
<main>
<!--flow-->
</main>
<script>
// The tabs: a click, the keys 1-8 and ← → open one. The models' names at the top: a click draws
// the flow with that model alone (its box, its numbers, its name in the words), and the first
// button brings every model back. Both are kept in the address (#paths/qwen), and the model is
// remembered for the next visit.
(function () {
  const $$ = (s) => [...document.querySelectorAll(s)];
  const tabs = $$('[role="tab"]'), views = $$('.view'), chips = $$('.chip[data-pick]');
  let picked = '';
  const place = () => { const t = tabs.find((x) => x.getAttribute('aria-selected') === 'true'); try { history.replaceState(null, '', '#' + t.dataset.v + (picked ? '/' + picked : '')); } catch {} };
  const show = (v, keep) => {
    if (!tabs.some((t) => t.dataset.v === v)) v = tabs[0].dataset.v;
    tabs.forEach((t) => t.setAttribute('aria-selected', String(t.dataset.v === v)));
    views.forEach((s) => { s.hidden = s.dataset.v !== v; });
    if (keep) place();
  };
  const pick = (id, keep) => {
    const chip = chips.find((c) => c.dataset.pick && c.dataset.pick === id);
    picked = chip ? id : '';
    chips.forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.pick === picked)));
    // Parts of a drawing are hidden by the attribute: an svg part has no `hidden` of its own.
    $$('[data-only]').forEach((el) => el.toggleAttribute('hidden', el.dataset.only !== picked));
    $$('.when-all').forEach((el) => el.toggleAttribute('hidden', Boolean(picked)));
    $$('.sw').forEach((el) => { el.textContent = chip ? el.dataset.one.replaceAll('{short}', chip.dataset.short).replaceAll('{name}', chip.dataset.name) : el.dataset.both; });
    if (keep) { try { if (picked) localStorage.setItem('flow-model', picked); else localStorage.removeItem('flow-model'); } catch {} place(); }
  };
  tabs.forEach((t) => t.addEventListener('click', () => show(t.dataset.v, true)));
  chips.forEach((c) => c.addEventListener('click', () => pick(c.dataset.pick, true)));
  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const at = tabs.findIndex((t) => t.getAttribute('aria-selected') === 'true');
    const to = /^[1-9]$/.test(e.key) ? Number(e.key) - 1 : e.key === 'ArrowRight' ? at + 1 : e.key === 'ArrowLeft' ? at - 1 : -1;
    if (to >= 0 && to < tabs.length) { e.preventDefault(); show(tabs[to].dataset.v, true); }
  });
  // The address names a tab and, after a /, a model: at the start, and when it is changed by hand afterwards.
  const fromAddress = (first) => {
    const [v, m] = location.hash.slice(1).split('/');
    if (v) show(v);
    let saved = null; try { saved = localStorage.getItem('flow-model'); } catch {}
    if (m !== undefined) pick(m); else if (first && saved) pick(saved);
  };
  fromAddress(true);
  window.addEventListener('hashchange', () => fromAddress(false));
})();
</script>
</body>
</html>
