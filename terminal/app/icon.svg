  <g fill="none" stroke="#4f4f4f" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 700 C 500 640, 440 610, 452 548 C 462 496, 540 470, 548 410 C 553 372, 540 350, 530 330" stroke-width="58"/>
    <path d="M458 560 C 420 540, 390 520, 360 500" stroke-width="34"/>
    <path d="M536 450 C 590 470, 640 490, 690 520" stroke-width="34"/>
  </g>
  <!-- foliage pads -->
  <g fill="#ffffff">
