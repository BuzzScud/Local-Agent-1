    <circle cx="470" cy="276" r="70"/><circle cx="560" cy="250" r="78"/><circle cx="640" cy="290" r="60"/>
    <ellipse cx="344" cy="484" rx="132" ry="54"/>
    <circle cx="300" cy="470" r="52"/><circle cx="372" cy="452" r="58"/>
    <ellipse cx="700" cy="516" rx="124" ry="52"/>
    <circle cx="668" cy="492" r="54"/><circle cx="740" cy="504" r="46"/>
  </g>
  <!-- pot -->
